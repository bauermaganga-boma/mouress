<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Modèle fictif de fiche individuelle d'évaluation : période, objectifs, note, appréciation motivée, observations de l'agent, signatures, classement au dossier.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Fiche individuelle d’évaluation (modèle fictif)</text>
<rect x="24" y="62" width="220" height="34" rx="0" class="nv"/>
<text x="134" y="84" class="c w">Rubrique</text>
<rect x="244" y="62" width="510" height="34" rx="0" class="nv"/>
<text x="499" y="84" class="c w">Contenu attendu</text>
<rect x="24" y="96" width="220" height="32" rx="0" class="bl"/>
<text x="32" y="119" class="b">Identité et période</text>
<rect x="244" y="96" width="510" height="32" rx="0" class="bl"/>
<text x="499" y="119" class="c">Agent, service, emploi, période évaluée (exemple fictif)</text>
<rect x="24" y="128" width="220" height="32" rx="0" class="wh"/>
<text x="32" y="151" class="b">Objectifs</text>
<rect x="244" y="128" width="510" height="32" rx="0" class="wh"/>
<text x="499" y="151" class="c">Fixés en début de période, observables</text>
<rect x="24" y="160" width="220" height="32" rx="0" class="bl"/>
<text x="32" y="183" class="b">Note</text>
<rect x="244" y="160" width="510" height="32" rx="0" class="bl"/>
<text x="499" y="183" class="c">Chiffrée ; barème fixé par les textes (à confirmer)</text>
<rect x="24" y="192" width="220" height="32" rx="0" class="wh"/>
<text x="32" y="215" class="b">Appréciation générale</text>
<rect x="244" y="192" width="510" height="32" rx="0" class="wh"/>
<text x="499" y="215" class="c">Motivée par écrit, à partir de faits (art. 76)</text>
<rect x="24" y="224" width="220" height="32" rx="0" class="bl"/>
<text x="32" y="247" class="b">Observations de l’agent</text>
<rect x="244" y="224" width="510" height="32" rx="0" class="bl"/>
<text x="499" y="247" class="c">Recueillies après communication de la fiche (art. 57)</text>
<rect x="24" y="256" width="220" height="32" rx="0" class="wh"/>
<text x="32" y="279" class="b">Signatures</text>
<rect x="244" y="256" width="510" height="32" rx="0" class="wh"/>
<text x="499" y="279" class="c">Évaluateur, puis agent avec la date de communication</text>
<rect x="24" y="288" width="220" height="32" rx="0" class="bl"/>
<text x="32" y="311" class="b">Classement</text>
<rect x="244" y="288" width="510" height="32" rx="0" class="bl"/>
<text x="499" y="311" class="c">Fiche versée au dossier individuel de l’agent</text>
<text x="400" y="354" class="c">Trois années consécutives sous la moyenne : risque de licenciement pour insuffisance professionnelle (art. 128).</text>
</svg>
