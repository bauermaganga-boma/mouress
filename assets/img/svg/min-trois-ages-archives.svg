<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les trois âges des archives : archives courantes, intermédiaires et définitives, avec le sort final après la durée d'utilité administrative : élimination ou versement</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Les trois âges des archives</text>
<rect x="25" y="55" width="210" height="265" rx="8" class="bl"/>
<rect x="295" y="55" width="210" height="265" rx="8" class="gr"/>
<rect x="565" y="55" width="210" height="265" rx="8" class="wh"/>
<text x="130" y="80" class="c o">1er âge</text>
<text x="130" y="100" class="c b">Archives courantes</text>
<text x="130" y="138" class="c">Affaire en cours</text>
<text x="130" y="162" class="c">Lieu : bureau du service</text>
<text x="130" y="186" class="c">producteur</text>
<text x="130" y="210" class="c">Usage quotidien</text>
<text x="130" y="234" class="c">DUA : court tant que</text>
<text x="130" y="258" class="c">l'affaire n'est pas close</text>
<text x="400" y="80" class="c o">2e âge</text>
<text x="400" y="100" class="c b">Archives intermédiaires</text>
<text x="400" y="138" class="c">Affaire terminée</text>
<text x="400" y="162" class="c">Lieu : local de</text>
<text x="400" y="186" class="c">pré-archivage</text>
<text x="400" y="210" class="c">Consultation occasionnelle</text>
<text x="400" y="234" class="c">Gardé pour preuve, audit</text>
<text x="400" y="258" class="c">ou contentieux</text>
<text x="670" y="80" class="c o">3e âge</text>
<text x="670" y="100" class="c b">Archives définitives</text>
<text x="670" y="126" class="c">Sort final après la DUA</text>
<rect x="577" y="142" width="186" height="80" rx="8" class="or"/>
<text x="670" y="168" class="c b">Élimination</text>
<text x="670" y="187" class="c">Destruction contrôlée,</text>
<text x="670" y="206" class="c">bordereau conservé</text>
<rect x="577" y="232" width="186" height="80" rx="8" class="or"/>
<text x="670" y="258" class="c b">Versement</text>
<text x="670" y="277" class="c">Conservation définitive</text>
<text x="670" y="296" class="c">(valeur historique)</text>
<path d="M238,187H292" class="nv" marker-end="url(#ar)"/>
<path d="M508,187H562" class="nv" marker-end="url(#ar)"/>
<text x="265" y="168" class="c n">Affaire</text>
<text x="265" y="215" class="c n">close</text>
<text x="535" y="168" class="c n">Fin de</text>
<text x="535" y="215" class="c n">la DUA</text>
<text x="400" y="345" class="c b">Les trois valeurs d'un document (elles fixent la durée de conservation)</text>
<rect x="25" y="358" width="240" height="64" rx="8" class="bl"/>
<text x="145" y="386" class="c b">Administrative</text>
<text x="145" y="405" class="c">utile au service</text>
<rect x="280" y="358" width="240" height="64" rx="8" class="bl"/>
<text x="400" y="386" class="c b">Juridique ou financière</text>
<text x="400" y="405" class="c">preuve de droits, de dépenses</text>
<rect x="535" y="358" width="240" height="64" rx="8" class="bl"/>
<text x="655" y="386" class="c b">Historique</text>
<text x="655" y="405" class="c">mémoire de l'institution</text>
<text x="400" y="455" class="c n">DUA : durée d'utilité administrative. Durées exactes : tableau de gestion du ministère (à confirmer).</text>

</svg>
