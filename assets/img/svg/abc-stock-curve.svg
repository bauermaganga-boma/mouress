<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Courbe ABC (Pareto) : pourcentage cumulé de la valeur en fonction du pourcentage cumulé des articles. Zone A : 20 % des articles, 80 % de la valeur. Zone B : 30 % des articles, 15 % de la valeur. Zone C : 50 % des articles, 5 % de la valeur.</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.gl{stroke:#C9CED6;stroke-width:1.2}
.z{font-size:34px;font-weight:700;text-anchor:middle}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Courbe ABC (loi de Pareto, 80/20)</text>

<!-- zones -->
<rect x="80" y="90" width="108" height="310" fill="#FFE2BF"/>
<rect x="188" y="90" width="162" height="310" fill="#DCE6F5"/>
<rect x="350" y="90" width="270" height="310" fill="#E8EAEE"/>
<!-- grille -->
<line class="gl" x1="80" y1="338" x2="620" y2="338"/><line class="gl" x1="80" y1="276" x2="620" y2="276"/><line class="gl" x1="80" y1="214" x2="620" y2="214"/><line class="gl" x1="80" y1="152" x2="620" y2="152"/><line class="gl" x1="80" y1="90" x2="620" y2="90"/>
<!-- repères pointillés -->
<line x1="80" y1="152" x2="188" y2="152" stroke="#061F44" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="188" y1="152" x2="188" y2="400" stroke="#061F44" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="350" y1="105.5" x2="350" y2="400" stroke="#061F44" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="80" y1="105.5" x2="350" y2="105.5" stroke="#061F44" stroke-width="1.5" stroke-dasharray="5 4"/>
<!-- axes -->
<line x1="80" y1="400" x2="620" y2="400" stroke="#061F44" stroke-width="3"/><line x1="80" y1="90" x2="80" y2="400" stroke="#061F44" stroke-width="3"/>
<!-- courbe -->
<path d="M80,400 C90,300 115,230 134,208 S168,165 188,152 S240,128 269,121 S325,109 350,105.5 S440,97 485,94.7 S580,91 620,90" fill="none" stroke="#061F44" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="188" cy="152" r="6" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<circle cx="350" cy="105.5" r="6" fill="#F28C28" stroke="#061F44" stroke-width="2"/>

<!-- graduations -->
<text class="e" x="72" y="405">0</text><text class="e" x="72" y="343">20 %</text><text class="e" x="72" y="281">40 %</text><text class="e" x="72" y="219">60 %</text><text class="e" x="72" y="157">80 %</text><text class="e" x="72" y="95">100 %</text>
<text class="m" x="80" y="420">0</text><text class="m" x="188" y="420">20 %</text><text class="m" x="296" y="420">40 %</text><text class="m" x="404" y="420">60 %</text><text class="m" x="512" y="420">80 %</text><text class="m" x="620" y="420">100 %</text>
<text class="m" x="350" y="440" style="font-size:14px;fill:#D9741A;font-weight:700">50 %</text>
<text class="m b" x="350" y="464">Articles classés par valeur décroissante (% cumulé)</text>
<text class="m b" transform="translate(24,245) rotate(-90)">Valeur cumulée (%)</text>

<text class="z" x="134" y="370" style="fill:#D9741A">A</text>
<text class="z" x="269" y="370">B</text>
<text class="z" x="485" y="370">C</text>
<text x="200" y="210" class="b">20 % → 80 %</text>
<text x="360" y="140" class="b">50 % → 95 %</text>

<!-- légende -->
<rect x="640" y="108" width="16" height="16" fill="#FFE2BF" stroke="#061F44" stroke-width="1.5"/><text class="b" x="664" y="121">Zone A</text>
<text x="640" y="144">20 % des articles</text><text x="640" y="162">80 % de la valeur</text>
<rect x="640" y="198" width="16" height="16" fill="#DCE6F5" stroke="#061F44" stroke-width="1.5"/><text class="b" x="664" y="211">Zone B</text>
<text x="640" y="234">30 % des articles</text><text x="640" y="252">15 % de la valeur</text>
<rect x="640" y="288" width="16" height="16" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/><text class="b" x="664" y="301">Zone C</text>
<text x="640" y="324">50 % des articles</text><text x="640" y="342">5 % de la valeur</text>
<text x="640" y="380">A : suivi strict</text><text x="640" y="398">C : gestion simple</text>
</svg>
