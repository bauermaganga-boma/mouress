<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Gestion des effectifs (exemple fictif) : 50 emplois budgétés, 44 agents en poste dont 2 départs prévus, soit 8 emplois vacants après les départs.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Emplois budgétés, agents en poste, départs</text>
<text x="24" y="108" class="b">Emplois budgétés</text>
<rect x="200" y="88" width="400" height="34" rx="3" class="bl"/>
<text x="400" y="111" class="c b">50</text>
<text x="24" y="188" class="b">Agents en poste</text>
<rect x="200" y="168" width="336" height="34" rx="3" class="wh"/>
<rect x="536" y="168" width="16" height="34" rx="3" class="or"/>
<text x="368" y="191" class="c">42 restent</text>
<text x="544" y="160" class="c o">départs : 2</text>
<text x="24" y="268" class="b">Après les départs</text>
<rect x="200" y="248" width="336" height="34" rx="3" class="wh"/>
<rect x="536" y="248" width="64" height="34" rx="3" class="or"/>
<text x="368" y="271" class="c">42 agents</text>
<text x="568" y="271" class="c b">8</text>
<text x="568" y="300" class="c o">vacants</text>
<rect x="24" y="330" width="752" height="78" rx="8" class="wh"/>
<text x="400" y="358" class="c b">Emplois vacants après départs = emplois budgétés − (agents en poste − départs)</text>
<text x="400" y="384" class="c">Exemple fictif : 50 − (44 − 2) = 8. Ces vacances alimentent le plan de recrutement (art. 112).</text>
<text x="400" y="440" class="c">Trois chiffres à rapprocher en permanence : emplois budgétés, agents en poste, départs prévus.</text>
</svg>
