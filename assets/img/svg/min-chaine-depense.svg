<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne de la dépense publique en quatre phases : 1 engagement avec visa préalable du contrôleur budgétaire ; 2 liquidation après service fait, sur pièces justificatives ; 3 ordonnancement par mandat adressé au comptable ; 4 paiement par le comptable public. Les trois premières phases relèvent de l'ordonnateur, la dernière du comptable. Exemple fictif : 15 millions de FCFA de matériel informatique</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.t{font-size:15px;font-weight:bold}.n{font-size:13px}.b{font-weight:bold}.c{text-anchor:middle}
.p{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}.v{fill:#FFE2BF;stroke:#061F44;stroke-width:2.5}.x{fill:#E8EAEE;stroke:#061F44;stroke-width:2}
.a{fill:none;stroke:#061F44;stroke-width:3.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">La chaîne de la dépense</text>
<rect x="25" y="60" width="165" height="140" rx="8" class="p"/>
<text x="37" y="86" class="t">1. Engagement</text>
<text x="37" y="108" class="n">Crée l'obligation de</text><text x="37" y="126" class="n">dépenser ; visa préalable</text><text x="37" y="144" class="n">du contrôleur budgétaire ;</text><text x="37" y="162" class="n">crédit disponible</text>
<rect x="225" y="60" width="165" height="140" rx="8" class="p"/>
<text x="237" y="86" class="t">2. Liquidation</text>
<text x="237" y="108" class="n">Vérifie le service fait</text><text x="237" y="126" class="n">et arrête le montant à</text><text x="237" y="144" class="n">partir des pièces</text><text x="237" y="162" class="n">justificatives</text>
<rect x="425" y="60" width="165" height="140" rx="8" class="p"/>
<text x="437" y="86" class="t">3. Ordonnancement</text>
<text x="437" y="108" class="n">Ordre de payer donné au</text><text x="437" y="126" class="n">comptable : mandat signé</text><text x="437" y="144" class="n">par l'ordonnateur ou</text><text x="437" y="162" class="n">son délégué</text>
<rect x="625" y="60" width="165" height="140" rx="8" class="v"/>
<text x="637" y="86" class="t">4. Paiement</text>
<text x="637" y="108" class="n">Contrôle : habilitation,</text><text x="637" y="126" class="n">imputation et crédits,</text><text x="637" y="144" class="n">validité de la créance,</text><text x="637" y="162" class="n">effet libératoire</text>
<path d="M191,130H222" class="a" marker-end="url(#ar)"/><path d="M391,130H422" class="a" marker-end="url(#ar)"/><path d="M591,130H622" class="a" marker-end="url(#ar)"/>
<rect x="25" y="214" width="565" height="34" rx="6" class="p"/>
<text x="307" y="237" class="t c">ORDONNATEUR : décide, engage, liquide, ordonnance</text>
<rect x="625" y="214" width="165" height="34" rx="6" class="v"/>
<text x="707" y="237" class="t c">COMPTABLE PUBLIC</text>
<text x="25" y="286" class="b">Exemple fictif : matériel informatique de 15 millions de FCFA</text>
<rect x="25" y="300" width="165" height="86" rx="6" class="x"/>
<text x="37" y="324" class="n">Bon de commande</text><text x="37" y="342" class="n">visé par le contrôleur</text><text x="37" y="360" class="n">budgétaire</text>
<rect x="225" y="300" width="165" height="86" rx="6" class="x"/>
<text x="237" y="324" class="n">Livraison et réception ;</text><text x="237" y="342" class="n">facture certifiée</text>
<rect x="425" y="300" width="165" height="86" rx="6" class="x"/>
<text x="437" y="324" class="n">Mandat de 15 millions</text><text x="437" y="342" class="n">transmis au comptable</text>
<rect x="625" y="300" width="165" height="86" rx="6" class="x"/>
<text x="637" y="324" class="n">Virement au</text><text x="637" y="342" class="n">fournisseur</text>
<text x="25" y="434" class="n">Facture reçue avant la livraison : pas de service fait, donc pas de liquidation.</text>
<text x="25" y="454" class="n">Le comptable peut suspendre ou refuser le paiement en cas d'irrégularité.</text>
</svg>
