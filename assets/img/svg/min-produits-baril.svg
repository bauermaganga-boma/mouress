<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Produits obtenus à partir de 100 barils de brut, rendements indicatifs donnés à titre d'exemple : GPL et gaz 3, essences 28, kérosène 8, gazole 30, fioul lourd et résidus 28, autoconsommation et pertes 3</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Produits de 100 barils de brut (exemple)</text>
<text x="400" y="54" class="c o">EXEMPLE : rendements fictifs, à titre indicatif</text>
<text x="250" y="114" class="e">GPL et gaz</text>
<rect x="260" y="90" width="42" height="34" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="312" y="114" class="b">3 barils</text>
<text x="250" y="172" class="e">Essences</text>
<rect x="260" y="148" width="392" height="34" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="662" y="172" class="b">28 barils</text>
<text x="250" y="230" class="e">Kérosène</text>
<rect x="260" y="206" width="112" height="34" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="382" y="230" class="b">8 barils</text>
<text x="250" y="288" class="e">Gazole</text>
<rect x="260" y="264" width="420" height="34" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="690" y="288" class="b">30 barils</text>
<text x="250" y="346" class="e">Fioul lourd et résidus</text>
<rect x="260" y="322" width="392" height="34" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="662" y="346" class="b">28 barils</text>
<text x="250" y="404" class="e">Autoconsommation et pertes</text>
<rect x="260" y="380" width="42" height="34" fill="#F28C28" stroke="#061F44" stroke-width="2.5"/>
<text x="312" y="404" class="b">3 barils</text>
<path d="M260,80V440" class="ld"/>
<text x="400" y="475" class="c n">Total : 100 barils de brut. Les rendements réels dépendent du brut et des unités de la raffinerie.</text>
</svg>
