<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Étapes d'une élimination régulière : liste des dossiers échus, vérification de l'absence de gel, bordereau, validation, destruction sécurisée, conservation du bordereau.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Les étapes d’une élimination régulière</text>
<rect x="24" y="58" width="221" height="131" rx="8" class="bl"/>
<text x="134.5" y="82" class="c b">1. Liste des dossiers</text>
<text x="134.5" y="101" class="c b">échus</text>
<text x="134.5" y="123" class="c">Selon le tableau de gestion</text>
<text x="134.5" y="141" class="c">: durée de conservation</text>
<text x="134.5" y="159" class="c">terminée</text>
<rect x="289" y="58" width="221" height="131" rx="8" class="or"/>
<text x="399.5" y="82" class="c b">2. Vérifier l’absence de</text>
<text x="399.5" y="101" class="c b">gel</text>
<text x="399.5" y="123" class="c">Litige, audit ou enquête en</text>
<text x="399.5" y="141" class="c">cours : on conserve</text>
<rect x="554" y="58" width="221" height="131" rx="8" class="bl"/>
<text x="664.5" y="82" class="c b">3. Établir le bordereau</text>
<text x="664.5" y="104" class="c">Liste, cotes, dates</text>
<text x="664.5" y="122" class="c">extrêmes, volume, motif</text>
<rect x="24" y="237" width="221" height="112" rx="8" class="wh"/>
<text x="134.5" y="261" class="c b">4. Faire valider</text>
<text x="134.5" y="283" class="c">Autorité du service et</text>
<text x="134.5" y="301" class="c">service d’archives</text>
<text x="134.5" y="319" class="c">compétent</text>
<rect x="289" y="237" width="221" height="112" rx="8" class="bl"/>
<text x="399.5" y="261" class="c b">5. Détruire de façon sûre</text>
<text x="399.5" y="283" class="c">Broyage ou incinération ;</text>
<text x="399.5" y="301" class="c">procès-verbal de</text>
<text x="399.5" y="319" class="c">destruction</text>
<rect x="554" y="237" width="221" height="112" rx="8" class="or"/>
<text x="664.5" y="261" class="c b">6. Conserver le bordereau</text>
<text x="664.5" y="283" class="c">Preuve définitive d’une</text>
<text x="664.5" y="301" class="c">élimination régulière</text>
<path d="M247,123.5H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,123.5H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,191V213H134.5V234" class="ln" marker-end="url(#ar)"/>
<path d="M247,293H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,293H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="440" class="c">Sans bordereau signé, une destruction est irrégulière et ne peut pas être prouvée.</text>
<text x="400" y="460" class="c">Les données personnelles imposent une destruction sécurisée.</text>
</svg>
