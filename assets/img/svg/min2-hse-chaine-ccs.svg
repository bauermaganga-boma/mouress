<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne du captage et stockage du carbone en trois étapes : captage du CO₂ à la source (gaz traité facile, fumées de turbine plus difficiles, torche très difficile), transport par canalisation ou navire, puis injection en profondeur dans un aquifère salin sous une roche couverture imperméable, avec un gisement épuisé dont les puits anciens sont une voie de fuite possible ; exemple fictif de bilan : 1 000 000 tonnes captées, 200 000 émises par l'énergie, 800 000 stockées net</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<pattern id="hc" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E8EAEE"/><path d="M0,0V8" stroke="#8A93A6" stroke-width="2"/></pattern>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Captage et stockage du carbone : les trois étapes</text>

<!-- étape 1 -->
<rect x="20" y="46" width="210" height="34" class="bl"/>
<text x="125" y="69" class="c b">1  Captage à la source</text>
<rect x="20" y="80" width="210" height="226" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="32" y="106" class="b">Gaz naturel traité</text>
<text x="32" y="124">CO₂ déjà concentré :</text>
<text x="32" y="142" class="o">cas le plus simple</text>
<text x="32" y="172" class="b">Fumées de turbine</text>
<text x="32" y="190">CO₂ dilué :</text>
<text x="32" y="208" class="o">plus difficile</text>
<text x="32" y="238" class="b">Torche</text>
<text x="32" y="256">intermittente, diffuse :</text>
<text x="32" y="274" class="o">le plus difficile</text>
<text x="32" y="298" style="font-size:13px">Captage : consomme de l'énergie</text>

<path d="M232,190H262" class="nv" marker-end="url(#ar)"/>

<!-- étape 2 -->
<rect x="266" y="46" width="130" height="34" class="bl"/>
<text x="331" y="69" class="c b">2  Transport</text>
<rect x="266" y="80" width="130" height="226" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="331" y="108" class="c">Canalisation</text>
<path d="M282,122H380" stroke="#061F44" stroke-width="9" stroke-linecap="round"/>
<path d="M282,122H380" stroke="#F28C28" stroke-width="3.5" stroke-linecap="round"/>
<text x="331" y="176" class="c">ou navire</text>
<path d="M286,206H376L364,232H298Z" class="gr"/>
<path d="M331,206V184H350V206" fill="none" stroke="#061F44" stroke-width="2.5"/>
<path d="M276,240q14,-8 28,0t28,0t28,0t28,0" fill="none" stroke="#061F44" stroke-width="2.5"/>
<text x="331" y="282" class="c" style="font-size:13px">compression et énergie</text>
<text x="331" y="298" class="c" style="font-size:13px">consommées</text>

<path d="M398,190H428" class="nv" marker-end="url(#ar)"/>

<!-- étape 3 -->
<rect x="432" y="46" width="348" height="34" class="bl"/>
<text x="606" y="69" class="c b">3  Stockage en profondeur</text>
<rect x="432" y="80" width="348" height="226" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<!-- couches -->
<rect x="433" y="104" width="346" height="58" fill="#EAF1FB"/>
<rect x="433" y="162" width="346" height="44" fill="url(#hc)"/>
<rect x="433" y="206" width="346" height="99" fill="#DCE6F5"/>
<path d="M433,162H779M433,206H779" stroke="#061F44" stroke-width="1.5"/>
<path d="M433,104H779" stroke="#061F44" stroke-width="3"/>
<text x="442" y="126" style="font-size:13px">Nappe d'eau potable (à protéger)</text>
<text x="442" y="190" class="b" style="font-size:13px">Roche couverture imperméable</text>
<text x="442" y="298" class="b" style="font-size:13px">Aquifère salin profond</text>
<!-- profondeur -->
<path d="M772,104V206" stroke="#061F44" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="768" y="150" class="b" text-anchor="end" style="font-size:13px">plus de 800 m</text>
<!-- puits d'injection -->
<path d="M500,104V262" stroke="#061F44" stroke-width="4"/>
<rect x="488" y="92" width="24" height="12" fill="#061F44"/>
<text x="520" y="100" style="font-size:13px">Puits d'injection</text>
<ellipse cx="500" cy="262" rx="62" ry="22" fill="#F28C28" fill-opacity="0.6" stroke="#B85C0A" stroke-width="2"/>
<text x="500" y="268" class="c b" style="font-size:13px">CO₂</text>
<!-- puits anciens -->
<path d="M630,104V280M680,104V280" stroke="#061F44" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M624,150l12,12M636,150l-12,12M674,150l12,12M686,150l-12,12" stroke="#B85C0A" stroke-width="3"/>
<text x="655" y="236" class="c b" style="font-size:13px">Gisement épuisé</text>
<text x="655" y="252" class="c" style="font-size:13px">puits anciens :</text>
<text x="655" y="268" class="c o" style="font-size:13px">fuite possible</text>

<!-- bilan fictif -->
<rect x="20" y="330" width="760" height="150" rx="8" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="400" y="358" class="c b">Exemple de bilan (chiffres fictifs, par an)</text>
<rect x="50" y="378" width="190" height="52" class="bl"/>
<text x="145" y="400" class="c b">CO₂ capté</text>
<text x="145" y="420" class="c">1 000 000 t</text>
<text x="262" y="410" class="c b" style="font-size:22px">−</text>
<rect x="284" y="378" width="230" height="52" fill="#F28C28" fill-opacity="0.35" stroke="#B85C0A" stroke-width="2.5"/>
<text x="399" y="400" class="c b">CO₂ émis par l'énergie du procédé</text>
<text x="399" y="420" class="c">200 000 t</text>
<text x="536" y="410" class="c b" style="font-size:22px">=</text>
<rect x="558" y="378" width="200" height="52" class="gr"/>
<text x="658" y="400" class="c b">Stockage net</text>
<text x="658" y="420" class="c">800 000 t</text>
<text x="400" y="460" class="c">Le captage, le transport et la compression consomment de l'énergie : le stockage net est inférieur au CO₂ capté.</text>
</svg>
