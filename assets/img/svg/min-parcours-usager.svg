<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Parcours d'un usager de l'accueil au traitement de sa demande : accueil et identification, vérification de la compétence et de la complétude, enregistrement, transmission, information et suivi, avec les cas particuliers</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Parcours d'un usager : de l'accueil au traitement</text>
<rect x="25" y="50" width="230" height="120" rx="8" class="bl"/>
<text x="140" y="77" class="c b">1. Accueillir et identifier</text>
<text x="140" y="96" class="c">Saluer, écouter, reformuler</text>
<text x="140" y="115" class="c">Nature : renseignement,</text>
<text x="140" y="134" class="c">dépôt, attestation,</text>
<text x="140" y="153" class="c">réclamation, rendez-vous</text>
<rect x="285" y="50" width="230" height="120" rx="8" class="bl"/>
<text x="400" y="87" class="c b">2. Vérifier la compétence</text>
<text x="400" y="106" class="c">Consulter l'organigramme et</text>
<text x="400" y="125" class="c">les fiches de procédure :</text>
<text x="400" y="144" class="c">traiter ou orienter</text>
<rect x="545" y="50" width="230" height="120" rx="8" class="bl"/>
<text x="660" y="87" class="c b">3. Vérifier la complétude</text>
<text x="660" y="106" class="c">Comparer le dossier à la</text>
<text x="660" y="125" class="c">liste des pièces demandée,</text>
<text x="660" y="144" class="c">avant tout enregistrement</text>
<rect x="545" y="205" width="230" height="120" rx="8" class="gr"/>
<text x="660" y="242" class="c b">4. Enregistrer</text>
<text x="660" y="261" class="c">Numéro d'ordre, date, heure,</text>
<text x="660" y="280" class="c">nom du déposant, objet</text>
<text x="660" y="299" class="c">Accusé de réception remis</text>
<rect x="285" y="205" width="230" height="120" rx="8" class="gr"/>
<text x="400" y="242" class="c b">5. Transmettre</text>
<text x="400" y="261" class="c">Au service compétent,</text>
<text x="400" y="280" class="c">dans le circuit défini ;</text>
<text x="400" y="299" class="c">transmission consignée</text>
<rect x="25" y="205" width="230" height="120" rx="8" class="gr"/>
<text x="140" y="242" class="c b">6. Informer et suivre</text>
<text x="140" y="261" class="c">Délai, interlocuteur,</text>
<text x="140" y="280" class="c">mode de réponse ;</text>
<text x="140" y="299" class="c">suivi sur tableau de bord</text>
<path d="M257,110H282" class="nv" marker-end="url(#ar)"/>
<path d="M517,110H542" class="nv" marker-end="url(#ar)"/>
<path d="M660,172V203" class="nv" marker-end="url(#ar)"/>
<path d="M543,265H518" class="nv" marker-end="url(#ar)"/>
<path d="M283,265H258" class="nv" marker-end="url(#ar)"/>
<text x="400" y="358" class="c o">Cas particuliers</text>
<rect x="25" y="370" width="230" height="84" rx="8" class="or"/>
<text x="140" y="398" class="c b">Hors compétence</text>
<text x="140" y="417" class="c">Orienter vers le bon service :</text>
<text x="140" y="436" class="c">adresse, intitulé exact</text>
<rect x="285" y="370" width="230" height="84" rx="8" class="or"/>
<text x="400" y="398" class="c b">Dossier incomplet</text>
<text x="400" y="417" class="c">Signaler à l'usager les</text>
<text x="400" y="436" class="c">pièces manquantes</text>
<rect x="545" y="370" width="230" height="84" rx="8" class="or"/>
<text x="660" y="398" class="c b">Demande urgente</text>
<text x="660" y="417" class="c">Prévenir la hiérarchie</text>
<text x="660" y="436" class="c">sans attendre</text>
<text x="400" y="483" class="c n">L'agent renseigne et oriente, mais ne décide pas à la place du service compétent.</text>

</svg>
