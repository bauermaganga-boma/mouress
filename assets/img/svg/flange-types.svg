<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Six types de brides en coupe : à collerette à souder (WN), à glissement (SO), à emboîtement (SW), libre à collet battu (LJ), filetée (TH) et pleine (BL), avec les soudures en orange</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5;stroke-linejoin:round}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5;stroke-linejoin:round}
.of{fill:#F28C28;stroke:#061F44;stroke-width:1.8;stroke-linejoin:round}
.hl{fill:#FCFBF8;stroke:#061F44;stroke-width:1.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.t{font-size:15px;font-weight:bold;text-anchor:middle}
</style>
<g id="wn"><path d="M-16,-60H-70V-36H-34L-24,-6V70H-16Z" class="bl"/><rect x="-58" y="-60" width="8" height="24" class="hl"/><path d="M-24,12L-31,18L-24,24Z" class="of"/><path d="M-24,18H-16" class="ld"/></g>
<g id="so"><path d="M-24,-60H-70V-26H-24Z" class="bl"/><path d="M-24,-54H-16V70H-24Z" class="gr"/><rect x="-58" y="-60" width="8" height="34" class="hl"/><path d="M-24,-26L-34,-26L-24,-16Z" class="of"/><path d="M-24,-60V-54H-16Z" class="of"/></g>
<g id="sw"><path d="M-16,-60H-70V-24H-24V-44H-16Z" class="bl"/><path d="M-24,-44H-16V70H-24Z" class="gr"/><rect x="-58" y="-60" width="8" height="36" class="hl"/><path d="M-24,-24L-34,-24L-24,-14Z" class="of"/></g>
<g id="lj"><path d="M-16,-60H-44V-52H-24V70H-16Z" class="gr"/><path d="M-70,-52H-26V-22H-70Z" class="bl"/><rect x="-58" y="-52" width="8" height="30" class="hl"/><path d="M-24,14L-31,20L-24,26Z" class="of"/><path d="M-24,20H-16" class="ld"/></g>
<g id="th"><path d="M-16,-60H-70V-24H-24V-50H-16Z" class="bl"/><path d="M-24,-50H-16V70H-24Z" class="gr"/><rect x="-58" y="-60" width="8" height="36" class="hl"/><polyline points="-24,-50 -29,-46 -24,-42 -29,-38 -24,-34 -29,-30 -24,-26" fill="none" stroke="#061F44" stroke-width="1.5"/></g>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Types de brides (coupes)</text>

<!-- WN -->
<text x="140" y="58" class="t">Bride à collerette (WN)</text>
<g transform="translate(140,140)"><use href="#wn"/><use href="#wn" transform="scale(-1,1)"/></g>
<text x="140" y="238" class="c">soudure bout à bout</text>

<!-- SO -->
<text x="400" y="58" class="t">Bride à glissement (SO)</text>
<g transform="translate(400,140)"><use href="#so"/><use href="#so" transform="scale(-1,1)"/></g>
<text x="400" y="238" class="c">2 soudures d'angle</text>

<!-- SW -->
<text x="660" y="58" class="t">Bride à emboîtement (SW)</text>
<g transform="translate(660,140)"><use href="#sw"/><use href="#sw" transform="scale(-1,1)"/></g>
<text x="660" y="238" class="c">1 soudure d'angle extérieure</text>

<!-- LJ -->
<text x="140" y="285" class="t">Bride libre (LJ)</text>
<g transform="translate(140,370)"><use href="#lj"/><use href="#lj" transform="scale(-1,1)"/></g>
<text x="140" y="474" class="c">collet battu + bride folle</text>

<!-- TH -->
<text x="400" y="285" class="t">Bride filetée (TH)</text>
<g transform="translate(400,370)"><use href="#th"/><use href="#th" transform="scale(-1,1)"/></g>
<text x="400" y="474" class="c">vissée, sans soudure</text>

<!-- BL -->
<text x="660" y="285" class="t">Bride pleine (BL)</text>
<g transform="translate(660,370)">
<rect x="-70" y="-72" width="140" height="24" class="bl"/>
<rect x="-58" y="-72" width="8" height="24" class="hl"/><rect x="50" y="-72" width="8" height="24" class="hl"/>
<use href="#wn" y="12"/><use href="#wn" transform="translate(0,12) scale(-1,1)"/>
</g>
<text x="660" y="474" class="c">obture l'extrémité de ligne</text>

<rect x="270" y="484" width="14" height="10" class="of"/>
<text x="292" y="494">Soudure</text>
<rect x="372" y="484" width="14" height="10" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<text x="394" y="494">Trou de boulon</text>
</svg>
