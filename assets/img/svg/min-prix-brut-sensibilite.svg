<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Valeurs fictives : courbe du prix du baril sur huit trimestres (82, 78, 71, 64, 58, 63, 72, 80 dollars) comparée à l'hypothèse budgétaire de 75 dollars, et tableau de sensibilité : un dollar de prix vaut 18,56 milliards de FCFA ; recette de l'État de 1 206,4 à 65 dollars, 1 392 à 75 dollars, 1 577,6 à 85 dollars</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.g{stroke:#D5D9E0;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Prix du brut et sensibilité du budget (valeurs fictives)</text>
<line class="g" x1="70" y1="100" x2="470" y2="100"/><line class="g" x1="70" y1="250" x2="470" y2="250"/><line class="g" x1="70" y1="325" x2="470" y2="325"/>
<text class="e" x="62" y="105">100</text><text class="e" x="62" y="180">75</text><text class="e" x="62" y="255">50</text><text class="e" x="62" y="330">25</text><text class="e" x="62" y="405">0</text>
<text class="b c" transform="translate(20,250) rotate(-90)">Dollars par baril</text>
<line x1="70" y1="400" x2="470" y2="400" stroke="#061F44" stroke-width="3"/>
<line x1="70" y1="100" x2="70" y2="400" stroke="#061F44" stroke-width="3"/>
<line x1="70" y1="175" x2="470" y2="175" stroke="#F28C28" stroke-width="3.5" stroke-dasharray="9 5"/>
<text x="476" y="180" class="o">75</text>
<polyline points="100,154 150,166 200,187 250,208 300,226 350,211 400,184 450,160" fill="none" stroke="#061F44" stroke-width="3.5"/>
<g fill="#061F44"><circle cx="100" cy="154" r="5"/><circle cx="150" cy="166" r="5"/><circle cx="200" cy="187" r="5"/><circle cx="250" cy="208" r="5"/><circle cx="300" cy="226" r="5"/><circle cx="350" cy="211" r="5"/><circle cx="400" cy="184" r="5"/><circle cx="450" cy="160" r="5"/></g>
<g class="c b"><text x="100" y="142">82</text><text x="300" y="248">58</text><text x="450" y="148">80</text></g>
<g class="c"><text x="100" y="420">T1</text><text x="150" y="420">T2</text><text x="200" y="420">T3</text><text x="250" y="420">T4</text><text x="300" y="420">T5</text><text x="350" y="420">T6</text><text x="400" y="420">T7</text><text x="450" y="420">T8</text></g>
<text x="270" y="442" class="c b">Trimestres</text>
<line x1="70" y1="466" x2="100" y2="466" stroke="#061F44" stroke-width="3.5"/><text x="108" y="471">Prix du baril</text>
<line x1="230" y1="466" x2="260" y2="466" stroke="#F28C28" stroke-width="3.5" stroke-dasharray="9 5"/><text x="268" y="471">Hypothèse de la loi de finances</text>
<rect x="510" y="70" width="270" height="340" rx="8" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="645" y="98" class="c b" style="font-size:16px">Sensibilité du budget</text>
<text x="528" y="126" class="b">Hypothèses fictives</text>
<text x="528" y="146">Production : 80 millions de barils</text>
<text x="528" y="164">Change : 580 FCFA pour 1 USD</text>
<text x="528" y="182">Part de l'État : 40 %</text>
<text x="528" y="212" class="o">1 USD de prix en plus ou en moins</text>
<text x="528" y="230" class="o">= 18,56 milliards de FCFA</text>
<line x1="525" y1="246" x2="765" y2="246" stroke="#061F44" stroke-width="2"/>
<text x="528" y="268" class="b">Prix du baril</text><text x="660" y="268" class="b">Recette de l'État</text>
<line x1="525" y1="276" x2="765" y2="276" stroke="#061F44" stroke-width="1.5"/>
<text x="528" y="300">65 USD</text><text x="660" y="300">1 206,4</text>
<text x="528" y="326">75 USD</text><text x="660" y="326">1 392,0</text>
<text x="528" y="352">85 USD</text><text x="660" y="352">1 577,6</text>
<line x1="525" y1="360" x2="765" y2="360" stroke="#061F44" stroke-width="1.5"/>
<text x="528" y="384">Recettes en milliards de FCFA.</text>
<text x="528" y="402">Valeurs fictives, à titre d'exemple.</text>
</svg>
