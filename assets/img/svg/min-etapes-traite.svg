<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Étapes de conclusion d'un traité : négociation sur mandat, adoption du texte, signature ou paraphe, ratification ou approbation selon le droit interne, entrée en vigueur ; pleins pouvoirs requis sauf pour le chef de l'État, le chef du gouvernement et le ministre des Affaires étrangères ; réserve ; pacta sunt servanda</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Étapes de conclusion d'un traité</text>
<rect x="20" y="56" width="140" height="140" rx="6" class="bl"/>
<path d="M20,96V62Q20,56 26,56H154Q160,56 160,62V96z" class="nvf"/>
<text x="90" y="76" class="w c">1. NÉGOCIATION</text>
<text x="30" y="118" class="t13">Sur mandat validé</text>
<text x="30" y="135" class="t13">par la hiérarchie</text>
<path d="M162,126H173" class="or" marker-end="url(#ao)"/>
<rect x="175" y="56" width="140" height="140" rx="6" class="bl"/>
<path d="M175,104V62Q175,56 181,56H309Q315,56 315,62V104z" class="nvf"/>
<text x="245" y="76" class="w c">2. ADOPTION DU</text>
<text x="245" y="94" class="w c">TEXTE</text>
<text x="185" y="126" class="t13">Le texte est</text>
<text x="185" y="143" class="t13">arrêté par les</text>
<text x="185" y="160" class="t13">parties</text>
<path d="M317,126H328" class="or" marker-end="url(#ao)"/>
<rect x="330" y="56" width="140" height="140" rx="6" class="bl"/>
<path d="M330,96V62Q330,56 336,56H464Q470,56 470,62V96z" class="nvf"/>
<text x="400" y="76" class="w c">3. SIGNATURE</text>
<text x="340" y="118" class="t13">Ou paraphe, qui</text>
<text x="340" y="135" class="t13">authentifie le</text>
<text x="340" y="152" class="t13">texte</text>
<path d="M472,126H483" class="or" marker-end="url(#ao)"/>
<rect x="485" y="56" width="140" height="140" rx="6" class="bl"/>
<path d="M485,96V62Q485,56 491,56H619Q625,56 625,62V96z" class="nvf"/>
<text x="555" y="76" class="w c">4. RATIFICATION</text>
<text x="495" y="118" class="t13">Ou approbation,</text>
<text x="495" y="135" class="t13">selon le droit</text>
<text x="495" y="152" class="t13">interne</text>
<path d="M627,126H638" class="or" marker-end="url(#ao)"/>
<rect x="640" y="56" width="140" height="140" rx="6" class="bl"/>
<path d="M640,104V62Q640,56 646,56H774Q780,56 780,62V104z" class="nvf"/>
<text x="710" y="76" class="w c">5. ENTRÉE EN</text>
<text x="710" y="94" class="w c">VIGUEUR</text>
<text x="650" y="126" class="t13">Selon les termes</text>
<text x="650" y="143" class="t13">du traité</text>
<path d="M380,198V232M380,232H110V250M380,232H400V250M380,232H690V250" class="ld"/>
<rect x="20" y="250" width="240" height="140" rx="6" class="gr"/>
<path d="M20,280V256Q20,250 26,250H254Q260,250 260,256V280z" class="nvf"/>
<text x="140" y="270" class="w c">PLEINS POUVOIRS</text>
<text x="30" y="302" class="t13">Requis pour conclure un traité,</text>
<text x="30" y="319" class="t13">sauf pour le chef de l'État, le</text>
<text x="30" y="336" class="t13">chef du gouvernement et le</text>
<text x="30" y="353" class="t13">ministre des Affaires étrangères</text>
<text x="30" y="370" class="t13">(article 7)</text>
<rect x="280" y="250" width="240" height="140" rx="6" class="gr"/>
<path d="M280,280V256Q280,250 286,250H514Q520,250 520,256V280z" class="nvf"/>
<text x="400" y="270" class="w c">RÉSERVE</text>
<text x="290" y="302" class="t13">Déclaration unilatérale qui vise</text>
<text x="290" y="319" class="t13">à exclure ou à modifier l'effet</text>
<text x="290" y="336" class="t13">de certaines dispositions à</text>
<text x="290" y="353" class="t13">l'égard de son auteur (article</text>
<text x="290" y="370" class="t13">19 : limites)</text>
<rect x="540" y="250" width="240" height="140" rx="6" class="gr"/>
<path d="M540,280V256Q540,250 546,250H774Q780,250 780,256V280z" class="nvf"/>
<text x="660" y="270" class="w c">PACTA SUNT SERVANDA</text>
<text x="550" y="302" class="t13">Tout traité en vigueur lie les</text>
<text x="550" y="319" class="t13">parties et doit être exécuté de</text>
<text x="550" y="336" class="t13">bonne foi (article 26)</text>
<text x="400" y="430" class="c t13">Source : Convention de Vienne sur le droit des traités (1969).</text>
</svg>
