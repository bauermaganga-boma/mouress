<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau croisé dynamique, valeurs fictives : à gauche la liste source de quatre lignes (Région, Trimestre, Volume : Nord T1 120, Nord T2 140, Sud T1 80, Sud T2 60) ; au centre les quatre zones du tableau croisé (Filtres : Année ; Lignes : Région ; Colonnes : Trimestre ; Valeurs : Somme de Volume) ; à droite le résultat : Nord 120 et 140, total 260 ; Sud 80 et 60, total 140 ; totaux T1 200, T2 200, total général 400. Une flèche Actualiser relie la source au tableau.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.cell{fill:#FFFFFF;stroke:#061F44;stroke-width:1.5}
.hd{fill:#DCE6F5;stroke:#061F44;stroke-width:1.5}
.tt{fill:#E8EAEE;stroke:#061F44;stroke-width:1.5}
.zn{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Du tableau de données au tableau croisé (valeurs fictives)</text>

<!-- source -->
<text x="30" y="68" class="b">1. Liste source</text>
<text x="30" y="86" style="font-size:13px">une ligne par observation</text>
<rect x="30" y="98" width="72" height="30" class="hd"/><text x="66" y="118" class="c b">Région</text>
<rect x="102" y="98" width="82" height="30" class="hd"/><text x="143" y="118" class="c b">Trimestre</text>
<rect x="184" y="98" width="66" height="30" class="hd"/><text x="217" y="118" class="c b">Volume</text>
<g>
<rect x="30" y="128" width="72" height="30" class="cell"/><text x="66" y="148" class="c">Nord</text>
<rect x="102" y="128" width="82" height="30" class="cell"/><text x="143" y="148" class="c">T1</text>
<rect x="184" y="128" width="66" height="30" class="cell"/><text x="217" y="148" class="c">120</text>
<rect x="30" y="158" width="72" height="30" class="cell"/><text x="66" y="178" class="c">Nord</text>
<rect x="102" y="158" width="82" height="30" class="cell"/><text x="143" y="178" class="c">T2</text>
<rect x="184" y="158" width="66" height="30" class="cell"/><text x="217" y="178" class="c">140</text>
<rect x="30" y="188" width="72" height="30" class="cell"/><text x="66" y="208" class="c">Sud</text>
<rect x="102" y="188" width="82" height="30" class="cell"/><text x="143" y="208" class="c">T1</text>
<rect x="184" y="188" width="66" height="30" class="cell"/><text x="217" y="208" class="c">80</text>
<rect x="30" y="218" width="72" height="30" class="cell"/><text x="66" y="238" class="c">Sud</text>
<rect x="102" y="218" width="82" height="30" class="cell"/><text x="143" y="238" class="c">T2</text>
<rect x="184" y="218" width="66" height="30" class="cell"/><text x="217" y="238" class="c">60</text>
</g>
<text x="30" y="272" style="font-size:13px">Ni ligne de total,</text>
<text x="30" y="290" style="font-size:13px">ni cellule fusionnée</text>

<!-- zones -->
<path d="M262,170H300" class="nv" marker-end="url(#ar)"/>
<text x="318" y="68" class="b">2. Zones à remplir</text>
<rect x="306" y="98" width="140" height="62" rx="4" class="zn"/>
<text x="316" y="118" class="o">Filtres</text><text x="316" y="140">Année</text>
<rect x="306" y="168" width="140" height="62" rx="4" class="zn"/>
<text x="316" y="188" class="o">Lignes</text><text x="316" y="210">Région</text>
<rect x="306" y="238" width="140" height="62" rx="4" class="zn"/>
<text x="316" y="258" class="o">Colonnes</text><text x="316" y="280">Trimestre</text>
<rect x="306" y="308" width="140" height="62" rx="4" class="zn"/>
<text x="316" y="328" class="o">Valeurs</text><text x="316" y="350">Somme de Volume</text>

<!-- résultat -->
<path d="M452,200H488" class="nv" marker-end="url(#ar)"/>
<text x="498" y="68" class="b">3. Tableau croisé</text>
<text x="498" y="86" style="font-size:13px">Somme de Volume</text>
<rect x="498" y="98" width="70" height="30" class="hd"/><text x="533" y="118" class="c b">Région</text>
<rect x="568" y="98" width="52" height="30" class="hd"/><text x="594" y="118" class="c b">T1</text>
<rect x="620" y="98" width="52" height="30" class="hd"/><text x="646" y="118" class="c b">T2</text>
<rect x="672" y="98" width="98" height="30" class="hd"/><text x="721" y="118" class="c b">Total</text>
<rect x="498" y="128" width="70" height="30" class="cell"/><text x="533" y="148" class="c">Nord</text>
<rect x="568" y="128" width="52" height="30" class="cell"/><text x="594" y="148" class="c">120</text>
<rect x="620" y="128" width="52" height="30" class="cell"/><text x="646" y="148" class="c">140</text>
<rect x="672" y="128" width="98" height="30" class="tt"/><text x="721" y="148" class="c b">260</text>
<rect x="498" y="158" width="70" height="30" class="cell"/><text x="533" y="178" class="c">Sud</text>
<rect x="568" y="158" width="52" height="30" class="cell"/><text x="594" y="178" class="c">80</text>
<rect x="620" y="158" width="52" height="30" class="cell"/><text x="646" y="178" class="c">60</text>
<rect x="672" y="158" width="98" height="30" class="tt"/><text x="721" y="178" class="c b">140</text>
<rect x="498" y="188" width="70" height="30" class="tt"/><text x="533" y="208" class="c b">Total</text>
<rect x="568" y="188" width="52" height="30" class="tt"/><text x="594" y="208" class="c b">200</text>
<rect x="620" y="188" width="52" height="30" class="tt"/><text x="646" y="208" class="c b">200</text>
<rect x="672" y="188" width="98" height="30" class="tt"/><text x="721" y="208" class="c b">400</text>
<text x="498" y="240" style="font-size:13px">Total général du tableau : 400,</text>
<text x="498" y="258" style="font-size:13px">à comparer au total de la source.</text>

<!-- actualiser -->
<path d="M140,300V420H620V270" class="or" marker-end="url(#ao)"/>
<rect x="220" y="404" width="300" height="32" rx="16" fill="#FCFBF8" stroke="#F28C28" stroke-width="2.5"/>
<text x="370" y="425" class="c o">Actualiser après chaque modification</text>
<text x="400" y="472" class="c" style="font-size:13px">Le tableau croisé ne se met pas toujours à jour seul quand les données de la source changent.</text>
</svg>
