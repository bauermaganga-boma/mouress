<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Coupe schématique non à l'échelle : mer territoriale jusqu'à 12 milles marins, zone économique exclusive jusqu'à 200 milles avec droits souverains sur les ressources, haute mer au-delà ; plateforme dans la zone économique exclusive avec zone de sécurité de 500 mètres au plus ; plateau continental</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Zones maritimes et hydrocarbures offshore</text>
<rect x="110" y="170" width="690" height="250" fill="#DCE6F5"/>
<path d="M0,150L100,150L112,185L300,235L560,290L650,335L800,385V440H0z" class="gr"/>
<text x="40" y="190" class="c b">Côte</text>
<path d="M110,170H800" class="s"/>
<rect x="112" y="44" width="150" height="76" rx="6" class="bl"/><text x="187" y="64" class="c t13">Mer territoriale :</text>
<text x="187" y="80" class="c t13">jusqu'à 12 milles</text>
<text x="187" y="96" class="c t13">marins</text>
<rect x="266" y="44" width="370" height="76" rx="6" class="gr"/><text x="451" y="64" class="c t13">Zone économique exclusive : jusqu'à 200 milles</text>
<text x="451" y="80" class="c t13">marins. Droits souverains sur les ressources</text>
<text x="451" y="96" class="c t13">(article 56)</text>
<rect x="640" y="44" width="150" height="76" rx="6" class="bl"/><text x="715" y="64" class="c t13">Haute mer : au-delà</text>
<text x="715" y="80" class="c t13">des 200 milles</text>
<path d="M112,120V420M264,120V420M638,120V420" class="da"/>
<text x="120" y="412" class="t13">Lignes de base</text>
<rect x="425" y="132" width="60" height="14" class="nvf"/><path d="M432,146V176M452,146V176M472,146V176" class="s"/>
<ellipse cx="455" cy="160" rx="62" ry="22" class="da" stroke="#B85C0A"/>
<text x="455" y="215" class="c o">Plateforme</text>
<text x="455" y="236" class="c t13">Zone de sécurité : 500</text>
<text x="455" y="252" class="c t13">mètres au plus (article 60)</text>
<path d="M300,260L560,315" class="or"/>
<text x="330" y="340" class="t13">Plateau continental : droits</text>
<text x="330" y="356" class="t13">souverains d'exploration et</text>
<text x="330" y="372" class="t13">d'exploitation des ressources</text>
<text x="330" y="388" class="t13">(article 77)</text>
<text x="400" y="470" class="c t13">Schéma non à l'échelle. Source : Convention des Nations unies sur le droit de la mer.</text>
</svg>
