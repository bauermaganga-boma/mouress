<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau des pièges d'orthographe fréquents : quelque et quel que, quoique et quoi que, davantage et d'avantage, pallier, ci-joint.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Pièges d’orthographe fréquents</text>
<rect x="24" y="62" width="200" height="34" rx="0" class="nv"/>
<text x="124" y="84" class="c w">Piège</text>
<rect x="224" y="62" width="530" height="34" rx="0" class="nv"/>
<text x="489" y="84" class="c w">Règle</text>
<rect x="24" y="96" width="200" height="50" rx="0" class="bl"/>
<text x="32" y="119" class="b">quelque / quel que</text>
<rect x="224" y="96" width="530" height="50" rx="0" class="bl"/>
<text x="489" y="119" class="c">quelque temps, quelques dossiers ; quel que + subjonctif : quel que</text>
<text x="489" y="137" class="c">soit le motif</text>
<rect x="24" y="146" width="200" height="32" rx="0" class="wh"/>
<text x="32" y="169" class="b">quoique / quoi que</text>
<rect x="224" y="146" width="530" height="32" rx="0" class="wh"/>
<text x="489" y="169" class="c">quoique = bien que ; quoi que = quelle que soit la chose que</text>
<rect x="24" y="178" width="200" height="32" rx="0" class="bl"/>
<text x="32" y="201" class="b">davantage / d’avantage</text>
<rect x="224" y="178" width="530" height="32" rx="0" class="bl"/>
<text x="489" y="201" class="c">davantage = plus ; d’avantage = « un avantage »</text>
<rect x="24" y="210" width="200" height="32" rx="0" class="wh"/>
<text x="32" y="233" class="b">pallier</text>
<rect x="224" y="210" width="530" height="32" rx="0" class="wh"/>
<text x="489" y="233" class="c">On pallie une difficulté ; « pallier à » est incorrect</text>
<rect x="24" y="242" width="200" height="50" rx="0" class="bl"/>
<text x="32" y="265" class="b">ci-joint</text>
<rect x="224" y="242" width="530" height="50" rx="0" class="bl"/>
<text x="489" y="265" class="c">Invariable devant le nom : « Ci-joint la liste » ; s’accorde après le</text>
<text x="489" y="283" class="c">nom : « la liste ci-jointe »</text>
<text x="400" y="326" class="c">Relire deux fois, à voix haute, en vérifiant noms, chiffres et dates.</text>
</svg>
