<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Schéma unifilaire d'une installation électrique : réseau HTA, sectionneur, disjoncteur, transformateur, jeu de barres BT et départs</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.s{stroke:#061F44;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Schéma unifilaire d'une installation électrique</text>

<text class="m b" x="150" y="64">Réseau HTA 20 kV</text>
<line class="s" x1="150" y1="72" x2="150" y2="100"/>
<!-- Q1 sectionneur -->
<line class="s" x1="150" y1="128" x2="150" y2="158"/>
<line class="s" x1="150" y1="128" x2="164" y2="102"/>
<!-- Q2 disjoncteur -->
<line class="s" x1="145" y1="153" x2="155" y2="163"/><line class="s" x1="155" y1="153" x2="145" y2="163"/>
<line class="s" x1="150" y1="186" x2="164" y2="165"/>
<line class="s" x1="150" y1="186" x2="150" y2="244"/>
<!-- TC -->
<circle class="s" cx="150" cy="215" r="9" fill="#FCFBF8"/>
<!-- transformateur -->
<circle class="s" cx="150" cy="266" r="22" fill="#DCE6F5"/>
<circle class="s" cx="150" cy="290" r="22" fill="#DCE6F5"/>
<line class="s" x1="150" y1="312" x2="150" y2="340"/>
<text class="b e" x="125" y="122">Q1</text><text x="185" y="122">Sectionneur HTA</text>
<text class="b e" x="125" y="176">Q2</text><text x="185" y="176">Disjoncteur HTA</text>
<text class="b e" x="125" y="220">TC</text><text x="185" y="220">Transformateur de courant</text>
<text class="b e" x="125" y="282">T1</text><text x="185" y="276">Transformateur 20 kV / 400 V</text><text x="185" y="294">couplage Dyn11</text>

<!-- jeu de barres -->
<line x1="70" y1="340" x2="750" y2="340" stroke="#061F44" stroke-width="7" stroke-linecap="round"/>
<text class="e b" x="750" y="324">Jeu de barres BT 400 V</text>

<!-- départ 1 : moteur -->
<g>
<line class="s" x1="260" y1="340" x2="260" y2="370"/>
<line class="s" x1="255" y1="365" x2="265" y2="375"/><line class="s" x1="265" y1="365" x2="255" y2="375"/>
<line class="s" x1="260" y1="398" x2="273" y2="377"/><line class="s" x1="260" y1="398" x2="260" y2="412"/>
<circle class="s" cx="260" cy="430" r="18" fill="#DCE6F5"/><text class="m b" x="260" y="436" style="font-size:18px">M</text>
<text class="m b" x="260" y="474">Q3</text><text class="m" x="260" y="492">Moteur 55 kW</text>
</g>
<!-- départ 2 : éclairage -->
<g>
<line class="s" x1="400" y1="340" x2="400" y2="370"/>
<line class="s" x1="395" y1="365" x2="405" y2="375"/><line class="s" x1="405" y1="365" x2="395" y2="375"/>
<line class="s" x1="400" y1="398" x2="413" y2="377"/><line class="s" x1="400" y1="398" x2="400" y2="412"/>
<circle class="s" cx="400" cy="430" r="18" fill="#DCE6F5"/>
<line class="s" x1="388" y1="418" x2="412" y2="442"/><line class="s" x1="412" y1="418" x2="388" y2="442"/>
<text class="m b" x="400" y="474">Q4</text><text class="m" x="400" y="492">Éclairage</text>
</g>
<!-- départ 3 : prises -->
<g>
<line class="s" x1="540" y1="340" x2="540" y2="370"/>
<line class="s" x1="535" y1="365" x2="545" y2="375"/><line class="s" x1="545" y1="365" x2="535" y2="375"/>
<line class="s" x1="540" y1="398" x2="553" y2="377"/><line class="s" x1="540" y1="398" x2="540" y2="412"/>
<rect class="s" x="522" y="412" width="36" height="36" fill="#DCE6F5"/><text class="m b" x="540" y="436">PC</text>
<text class="m b" x="540" y="474">Q5</text><text class="m" x="540" y="492">Prises</text>
</g>
<!-- départ 4 : compensation -->
<g>
<line class="s" x1="680" y1="340" x2="680" y2="370"/>
<line class="s" x1="675" y1="365" x2="685" y2="375"/><line class="s" x1="685" y1="365" x2="675" y2="375"/>
<line class="s" x1="680" y1="398" x2="693" y2="377"/><line class="s" x1="680" y1="398" x2="680" y2="418"/>
<line class="s" x1="664" y1="418" x2="696" y2="418"/><line class="s" x1="664" y1="430" x2="696" y2="430"/>
<line class="s" x1="680" y1="430" x2="680" y2="446"/>
<text class="m b" x="680" y="474">Q6</text><text class="m" x="680" y="492">Batterie de condensateurs</text>
</g>
</svg>
