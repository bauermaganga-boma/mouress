<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Frise du contrat à l'entrée en vigueur : négociation par les services compétents, signature par l'autorité compétente, décret d'approbation, publication au Journal officiel, entrée en vigueur à la publication du décret, puis arrêté d'octroi du titre</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.sm{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.or{fill:#FFF1DF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.ln{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Du contrat signé à l'entrée en vigueur</text><rect x="20" y="90" width="136" height="160" rx="8" class="bl"/>
<text x="88" y="131" class="b c">1. Négociation</text>
<text x="88" y="153" class="c">Services</text>
<text x="88" y="175" class="c">compétents de</text>
<text x="88" y="197" class="c">l'administration</text>
<text x="88" y="219" class="c">(art. 40)</text><path d="M158,170H174" class="nv" marker-end="url(#ar)"/><rect x="176" y="90" width="136" height="160" rx="8" class="bl"/>
<text x="244" y="131" class="b c">2. Signature</text>
<text x="244" y="153" class="c">Autorité</text>
<text x="244" y="175" class="c">compétente ;</text>
<text x="244" y="197" class="c">contreseing selon</text>
<text x="244" y="219" class="c">le type de contrat</text><path d="M314,170H330" class="nv" marker-end="url(#ar)"/><rect x="332" y="90" width="136" height="160" rx="8" class="bl"/>
<text x="400" y="142" class="b c">3. Décret</text>
<text x="400" y="164" class="c">d'approbation</text>
<text x="400" y="186" class="c">(contrats de</text>
<text x="400" y="208" class="c">partage, art. 53)</text><path d="M470,170H486" class="nv" marker-end="url(#ar)"/><rect x="488" y="90" width="136" height="160" rx="8" class="or"/>
<text x="556" y="153" class="b c">4. Publication</text>
<text x="556" y="175" class="c">du décret au</text>
<text x="556" y="197" class="c">Journal officiel</text><path d="M626,170H642" class="ln" marker-end="url(#ao)"/><rect x="644" y="90" width="136" height="160" rx="8" class="bl"/>
<text x="712" y="153" class="b c">5. Arrêté</text>
<text x="712" y="175" class="c">d'octroi du titre</text>
<text x="712" y="197" class="c">pétrolier</text><path d="M556,252V300" class="ln" marker-end="url(#ao)"/><rect x="300" y="305" width="420" height="64" rx="8" class="or"/>
<text x="510" y="333" class="o c">ENTRÉE EN VIGUEUR du contrat de partage</text>
<text x="510" y="351" class="c">À la publication du décret d'approbation (art. 44)</text><rect x="30" y="395" width="740" height="84" rx="8" class="gr"/>
<text x="400" y="420" class="b c">Avant la publication du décret d'approbation :</text>
<text x="400" y="442" class="c">le contrat n'est pas en vigueur et aucun titre n'est délivré. Aucun travail ne peut s'appuyer</text>
<text x="400" y="464" class="c">sur la seule signature du contrat.</text>
</svg>
