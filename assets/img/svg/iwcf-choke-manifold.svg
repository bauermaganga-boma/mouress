<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Manifold de duses (choke manifold) : ligne de duse depuis le BOP avec vanne hydraulique HCR et vanne manuelle, trois lignes en parallèle (duse réglable manuelle, by-pass, duse réglable à commande à distance), manomètres amont et aval, puis séparateur gaz-boue (dégazeur) avec évent vers la torche et boue vers le bac de rejet ; ligne de pompage (kill line) depuis les pompes vers le BOP</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.of{fill:#F28C28;stroke:#061F44;stroke-width:2}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
<g id="gg"><circle r="20" class="wh"/><path d="M-12,8A14,14 0 1 1 12,8" class="ld"/><path d="M0,0L8,-9" stroke="#F28C28" stroke-width="3" fill="none"/><circle r="3" fill="#061F44"/></g>
<g id="vh"><rect x="-22" y="-18" width="44" height="36" class="gr"/><path d="M-17,-13V13L0,0ZM17,-13V13L0,0Z" class="wh"/></g>
<g id="vm"><path d="M-17,-13V13L0,0ZM17,-13V13L0,0Z" class="wh"/><path d="M0,0V-20M-8,-20H8" class="ld"/></g>
<g id="ck"><rect x="-24" y="-20" width="48" height="40" class="gr"/><path d="M-16,-10L16,-4V4L-16,10Z" class="wh"/><path d="M-10,16L12,-16" class="or" style="stroke-width:3" marker-end="url(#ao)"/></g>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Manifold de duses (choke manifold)</text>

<!-- tuyauteries -->
<path d="M20,190H185M185,120V260M185,120H430M185,190H430M185,260H430M430,120V260M430,190H510M555,120V100H720M720,100V200M555,300V335H720V345M260,430H20" fill="none" stroke="#061F44" stroke-width="12"/>
<path d="M20,190H185M185,120V260M185,120H430M185,190H430M185,260H430M430,120V260M430,190H510M555,120V100H720M720,100V200M555,300V335H720V345M260,430H20" fill="none" stroke="#E8EAEE" stroke-width="7"/>

<!-- flèches de flux -->
<g class="or" style="stroke-width:3">
<path d="M24,190H178" marker-end="url(#ao)"/>
<path d="M259,120H279" marker-end="url(#ao)"/><path d="M331,120H351" marker-end="url(#ao)"/><path d="M399,120H424" marker-end="url(#ao)"/>
<path d="M259,190H351" marker-end="url(#ao)"/><path d="M399,190H424" marker-end="url(#ao)"/>
<path d="M259,260H279" marker-end="url(#ao)"/><path d="M331,260H351" marker-end="url(#ao)"/><path d="M399,260H424" marker-end="url(#ao)"/>
<path d="M436,190H504" marker-end="url(#ao)"/>
<path d="M575,100H700" marker-end="url(#ao)"/>
<path d="M575,335H700" marker-end="url(#ao)"/>
<path d="M250,430H176" marker-end="url(#ao)"/><path d="M64,430H26" marker-end="url(#ao)"/>
</g>

<!-- entrée ligne de duse -->
<text x="20" y="148">Ligne de duse</text>
<text x="20" y="164">(choke line)</text>
<use href="#vh" x="65" y="190"/><use href="#vm" x="125" y="190"/>
<text x="65" y="224" class="c">HCR</text>
<text x="125" y="224" class="c">Manuelle</text>

<!-- manomètres -->
<path d="M185,90V120M430,90V120" class="s"/>
<use href="#gg" x="185" y="70"/><use href="#gg" x="430" y="70"/>
<text x="160" y="75" class="e">Manomètre amont</text>
<text x="455" y="75">Manomètre aval</text>

<!-- ligne A : duse manuelle -->
<use href="#vm" x="235" y="120"/><use href="#ck" x="305" y="120"/><use href="#vm" x="375" y="120"/>
<text x="305" y="90" class="c b">Duse réglable manuelle</text>
<!-- ligne B : by-pass -->
<use href="#vm" x="235" y="190"/><use href="#vm" x="375" y="190"/>
<text x="305" y="224" class="c">By-pass</text>
<!-- ligne C : duse à distance -->
<use href="#vm" x="235" y="260"/><use href="#ck" x="305" y="260"/><use href="#vm" x="375" y="260"/>
<text x="295" y="300" class="e b">Duse réglable</text>
<text x="295" y="316" class="e">à distance (hydraulique)</text>
<path d="M305,330V282" class="or" style="stroke-dasharray:6 5;stroke-width:3"/>
<rect x="230" y="330" width="150" height="44" class="bl"/>
<text x="305" y="348" class="c">Panneau de commande</text>
<text x="305" y="366" class="c">de duse (plancher)</text>

<!-- dégazeur -->
<rect x="510" y="120" width="90" height="180" rx="14" class="gr"/>
<rect x="512" y="250" width="86" height="48" fill="#DCE6F5"/>
<rect x="510" y="120" width="90" height="180" rx="14" class="s"/>
<text x="555" y="170" class="c b">Dégazeur</text>
<text x="555" y="188" class="c">(mud-gas</text>
<text x="555" y="206" class="c">separator)</text>

<!-- torche -->
<path d="M720,100C706,86 714,70 720,56C727,70 734,86 720,100Z" class="of"/>
<text x="720" y="224" class="c b">Torche (flare)</text>
<text x="690" y="88" class="e">Gaz vers la torche</text>

<!-- bac de rejet -->
<text x="585" y="325">Boue dégazée</text>
<rect x="660" y="345" width="120" height="70" class="bl"/>
<text x="720" y="375" class="c b">Bac de rejet</text>
<text x="720" y="393" class="c">(vers tamis)</text>

<!-- kill line -->
<text x="20" y="398" class="b">Ligne de pompage (kill line)</text>
<use href="#vh" x="90" y="430"/><use href="#vm" x="150" y="430"/>
<rect x="260" y="405" width="100" height="50" class="bl"/>
<text x="310" y="427" class="c">Pompes</text>
<text x="310" y="445" class="c">à boue</text>
<text x="20" y="474">Vers le BOP</text>

<!-- légende -->
<path d="M430,405H465" class="or" style="stroke-width:3" marker-end="url(#ao)"/>
<text x="475" y="410">Sens du flux</text>
<use href="#vh" x="450" y="440"/><text x="485" y="445">Vanne hydraulique (HCR)</text>
<use href="#vm" x="450" y="474"/><text x="485" y="479">Vanne manuelle</text>
</svg>
