<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Graphique en barres de l'absorption nette de CO₂ avec les forêts, selon la troisième CDN du Gabon : environ moins 73,3 millions de tonnes en 2020, moins 58,2 en 2035 dans le scénario tendanciel, moins 92,4 avec les mesures existantes (58,7 pour cent de mieux que le tendanciel) et moins 121,5 avec les mesures additionnelles conditionnées à un appui international (108,6 pour cent de mieux)</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.v{font-size:18px;font-weight:bold;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">CDN 3.0 du Gabon : absorption nette de CO₂ (avec forêts)</text>
<text x="400" y="54" class="c">en millions de tonnes d'équivalent CO₂ ; plus la barre descend, plus le pays absorbe</text>

<!-- ligne zéro -->
<path d="M60,90H760" stroke="#061F44" stroke-width="2.5"/>
<text x="62" y="82" class="b">0 : au-dessus, le pays serait émetteur net</text>

<!-- barres -->
<rect x="90" y="90" width="120" height="176" fill="#E8EAEE" stroke="#061F44" stroke-width="2.5"/>
<rect x="250" y="90" width="120" height="140" fill="#E8EAEE" stroke="#061F44" stroke-width="2.5" stroke-dasharray="7 4"/>
<rect x="410" y="90" width="120" height="222" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<rect x="570" y="90" width="120" height="292" fill="#F28C28" stroke="#B85C0A" stroke-width="2.5"/>

<!-- valeurs -->
<text x="150" y="250" class="v">−73,3</text>
<text x="310" y="214" class="v">−58,2</text>
<text x="470" y="296" class="v">−92,4</text>
<text x="630" y="366" class="v">−121,5</text>
<text x="470" y="150" class="c b">+58,7 %</text>
<text x="470" y="168" class="c">par rapport</text>
<text x="470" y="186" class="c">au tendanciel</text>
<text x="630" y="150" class="c b">+108,6 %</text>
<text x="630" y="168" class="c">par rapport</text>
<text x="630" y="186" class="c">au tendanciel</text>

<!-- étiquettes -->
<text x="150" y="410" class="c b">2020</text>
<text x="150" y="428" class="c">situation de départ</text>
<text x="310" y="410" class="c b">2035 tendanciel</text>
<text x="310" y="428" class="c">sans action</text>
<text x="470" y="410" class="c b">2035 mesures</text>
<text x="470" y="428" class="c b">existantes</text>
<text x="470" y="446" class="c">déjà engagées</text>
<text x="630" y="410" class="c b">2035 mesures</text>
<text x="630" y="428" class="c b">additionnelles</text>
<text x="630" y="446" class="c">avec appui international</text>

<text x="60" y="474">Hors forêts, mesures additionnelles : émissions en baisse d'environ 30 % en 2030 et de plus de 40 % en 2035</text>
<text x="60" y="492">par rapport au tendanciel. Valeurs citées dans le cours (CDN 3.0) ; vérifier la dernière version publiée.</text>
</svg>
