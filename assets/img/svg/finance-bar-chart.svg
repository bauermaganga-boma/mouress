<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Histogramme : chiffre d'affaires et résultat net de 2020 à 2024 en millions de FCFA. Chiffre d'affaires : 420, 510, 480, 640, 720. Résultat net : 35, 52, 41, 78, 95.</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.gl{stroke:#D5D9E0;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Chiffre d'affaires et résultat net (millions de FCFA)</text>

<!-- légende -->
<rect x="400" y="52" width="16" height="16" fill="#061F44"/><text x="422" y="65">Chiffre d'affaires</text>
<rect x="570" y="52" width="16" height="16" fill="#F28C28"/><text x="592" y="65">Résultat net</text>

<!-- grille -->
<line class="gl" x1="100" y1="90" x2="720" y2="90"/><line class="gl" x1="100" y1="165" x2="720" y2="165"/><line class="gl" x1="100" y1="240" x2="720" y2="240"/><line class="gl" x1="100" y1="315" x2="720" y2="315"/>
<text class="e" x="90" y="95">800</text><text class="e" x="90" y="170">600</text><text class="e" x="90" y="245">400</text><text class="e" x="90" y="320">200</text><text class="e" x="90" y="395">0</text>

<!-- barres CA -->
<rect x="130" y="232.5" width="44" height="157.5" fill="#061F44"/>
<rect x="250" y="198.8" width="44" height="191.2" fill="#061F44"/>
<rect x="370" y="210" width="44" height="180" fill="#061F44"/>
<rect x="490" y="150" width="44" height="240" fill="#061F44"/>
<rect x="610" y="120" width="44" height="270" fill="#061F44"/>
<!-- barres RN -->
<rect x="174" y="376.9" width="44" height="13.1" fill="#F28C28"/>
<rect x="294" y="370.5" width="44" height="19.5" fill="#F28C28"/>
<rect x="414" y="374.6" width="44" height="15.4" fill="#F28C28"/>
<rect x="534" y="360.8" width="44" height="29.2" fill="#F28C28"/>
<rect x="654" y="354.4" width="44" height="35.6" fill="#F28C28"/>
<line x1="100" y1="390" x2="720" y2="390" stroke="#061F44" stroke-width="3"/>
<line x1="100" y1="90" x2="100" y2="390" stroke="#061F44" stroke-width="3"/>

<!-- valeurs -->
<text class="m b" x="152" y="224">420</text><text class="m b" x="272" y="190">510</text><text class="m b" x="392" y="202">480</text><text class="m b" x="512" y="142">640</text><text class="m b" x="632" y="112">720</text>
<text class="m b" x="196" y="368" style="fill:#D9741A">35</text><text class="m b" x="316" y="362" style="fill:#D9741A">52</text><text class="m b" x="436" y="366" style="fill:#D9741A">41</text><text class="m b" x="556" y="353" style="fill:#D9741A">78</text><text class="m b" x="676" y="346" style="fill:#D9741A">95</text>

<!-- années -->
<text class="m b" x="174" y="414">2020</text><text class="m b" x="294" y="414">2021</text><text class="m b" x="414" y="414">2022</text><text class="m b" x="534" y="414">2023</text><text class="m b" x="654" y="414">2024</text>

<text class="m" x="400" y="454">Croissance du CA 2023-2024 : +12,5 %. Marge nette 2024 : 95 / 720 ≈ 13,2 %.</text>
<text class="m" x="400" y="476" style="font-size:14px">Données illustratives.</text>
</svg>
