<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Panneaux de sécurité ISO 7010 : interdiction (cercle rouge barré), avertissement (triangle jaune), obligation (cercle bleu), sauvetage et secours (carré vert)</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.h{font-size:17px;font-weight:700}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Panneaux de sécurité (ISO 7010) : forme et couleur</text>

<!-- Interdiction -->
<g transform="translate(100,160)">
<circle r="58" fill="#FFFFFF" stroke="#C8102E" stroke-width="11"/>
<rect x="-34" y="-5" width="48" height="11" fill="#1A1A1A"/><rect x="-34" y="-5" width="14" height="11" fill="#F28C28"/>
<rect x="18" y="-5" width="8" height="11" fill="#1A1A1A"/><rect x="30" y="-5" width="8" height="11" fill="#1A1A1A"/>
<path d="M-10,-10 C-16,-22 -4,-26 -10,-38" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
<line x1="-41" y1="-41" x2="41" y2="41" stroke="#C8102E" stroke-width="11"/>
</g>
<text class="m h" x="100" y="258">Interdiction</text>
<text class="m" x="100" y="280">Cercle rouge barré</text>
<text class="m" x="100" y="300">Ex. : défense de fumer</text>

<!-- Avertissement -->
<g transform="translate(300,160)">
<path d="M0,-58 L62,48 L-62,48 Z" fill="#FFD200" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
<path d="M7,-22 L-14,8 L-2,8 L-8,34 L16,0 L3,0 Z" fill="#1A1A1A"/>
</g>
<text class="m h" x="300" y="258">Avertissement</text>
<text class="m" x="300" y="280">Triangle jaune, bord noir</text>
<text class="m" x="300" y="300">Ex. : danger électrique</text>

<!-- Obligation -->
<g transform="translate(500,160)">
<circle r="58" fill="#0A5CA8"/>
<path d="M-26,8 C-26,-26 26,-26 26,8 Z" fill="#FFFFFF"/><rect x="-33" y="8" width="66" height="9" rx="4" fill="#FFFFFF"/><line x1="0" y1="-22" x2="0" y2="4" stroke="#0A5CA8" stroke-width="3" stroke-linecap="round"/>
</g>
<text class="m h" x="500" y="258">Obligation</text>
<text class="m" x="500" y="280">Cercle bleu, symbole blanc</text>
<text class="m" x="500" y="300">Ex. : casque obligatoire</text>

<!-- Sauvetage -->
<g transform="translate(700,160)">
<rect x="-58" y="-58" width="116" height="116" rx="8" fill="#00954A"/>
<rect x="-10" y="-34" width="20" height="68" fill="#FFFFFF"/><rect x="-34" y="-10" width="68" height="20" fill="#FFFFFF"/>
</g>
<text class="m h" x="700" y="258">Sauvetage</text>
<text class="m" x="700" y="280">Carré vert, symbole blanc</text>
<text class="m" x="700" y="300">Ex. : premiers secours</text>

<rect x="40" y="340" width="720" height="110" rx="8" fill="#E8EAEE"/>
<text class="b" x="60" y="368">À retenir</text>
<text x="60" y="392">Rouge : ce qui est interdit (ou le matériel de lutte contre l'incendie, en carré rouge)</text>
<text x="60" y="414">Jaune : danger à signaler · Bleu : comportement ou équipement imposé</text>
<text x="60" y="436">Vert : issue de secours, secours, sauvetage</text>
</svg>
