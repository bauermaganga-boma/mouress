<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Deux contrôles de cohérence d'un bilan (exemples)</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Deux contrôles de cohérence d'un bilan (exemples)</text>

<rect x="30" y="60" width="370" height="390" rx="6" fill="#DCE6F5"/>
<text x="215" y="90" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Bilan de production du mois</text>
<text x="215" y="112" font-size="13" fill="#061F44" text-anchor="middle">(millions de barils, valeurs fictives)</text>
<text x="60" y="150" font-size="15" fill="#061F44">Production</text>
<text x="60" y="192" font-size="15" fill="#061F44">Exportations</text>
<text x="60" y="234" font-size="15" fill="#061F44">Livraison au raffinage</text>
<text x="60" y="276" font-size="15" fill="#061F44">Variation de stock</text>
<text x="370" y="150" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">2,7</text>
<text x="370" y="192" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">2,4</text>
<text x="370" y="234" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">0,2</text>
<text x="370" y="276" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">0</text>
<line x1="55" y1="162" x2="375" y2="162" stroke="#061F44"/><line x1="55" y1="204" x2="375" y2="204" stroke="#061F44"/><line x1="55" y1="246" x2="375" y2="246" stroke="#061F44"/>
<text x="60" y="300" font-size="14" fill="#B85C0A" font-weight="bold">Contrôle : production =</text>
<text x="60" y="321" font-size="14" fill="#B85C0A" font-weight="bold">exportations + raffinage</text>
<text x="60" y="342" font-size="14" fill="#B85C0A" font-weight="bold">+ variation de stock + écart</text>
<text x="60" y="400" font-size="14" fill="#061F44">L'écart éventuel reste à expliquer.</text>
<rect x="420" y="60" width="350" height="390" rx="6" fill="#E8EAEE"/>
<text x="595" y="90" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Total par champ</text>
<text x="595" y="112" font-size="13" fill="#061F44" text-anchor="middle">(milliers de b/j, valeurs fictives)</text>
<text x="450" y="150" font-size="15" fill="#061F44">Champ 1</text>
<text x="450" y="192" font-size="15" fill="#061F44">Champ 2</text>
<text x="450" y="234" font-size="15" fill="#061F44">Champ 3</text>
<text x="740" y="150" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">40</text>
<text x="740" y="192" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">30</text>
<text x="740" y="234" font-size="16" fill="#061F44" font-weight="bold" text-anchor="end">20</text>
<line x1="445" y1="162" x2="745" y2="162" stroke="#061F44"/><line x1="445" y1="204" x2="745" y2="204" stroke="#061F44"/>
<rect x="445" y="265" width="300" height="56" rx="6" fill="#fff" stroke="#B85C0A" stroke-width="2"/><text x="595" y="287" font-size="13" fill="#061F44" text-anchor="middle">Total transmis par le déclarant</text><text x="595" y="311" font-size="17" fill="#061F44" font-weight="bold" text-anchor="middle">95</text>
<text x="445" y="370" font-size="14" fill="#B85C0A" font-weight="bold">Contrôle : la somme des lignes</text><text x="445" y="392" font-size="14" fill="#B85C0A" font-weight="bold">doit retrouver le total publié.</text>
<text x="400" y="486" font-size="13" fill="#555" text-anchor="middle">Exemples pédagogiques : chiffres fictifs.</text>
</svg>
