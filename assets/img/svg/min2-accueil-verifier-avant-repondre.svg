<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Avant de répondre à une demande d'information : vérifier qui demande, son lien avec le dossier, son besoin d'en connaître ; trois issues possibles : informer, vérifier par un canal officiel, refuser.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Confidentialité : vérifier avant de répondre</text>
<rect x="24" y="56" width="221" height="131" rx="8" class="bl"/>
<text x="134.5" y="80" class="c b">1. Qui demande ?</text>
<text x="134.5" y="102" class="c">Identité et qualité de</text>
<text x="134.5" y="120" class="c">l’interlocuteur</text>
<rect x="289" y="56" width="221" height="131" rx="8" class="wh"/>
<text x="399.5" y="80" class="c b">2. Quel lien avec le</text>
<text x="399.5" y="99" class="c b">dossier ?</text>
<text x="399.5" y="121" class="c">Demandeur concerné ou</text>
<text x="399.5" y="139" class="c">personne habilitée</text>
<rect x="554" y="56" width="221" height="131" rx="8" class="bl"/>
<text x="664.5" y="80" class="c b">3. Besoin d’en connaître</text>
<text x="664.5" y="99" class="c b">?</text>
<text x="664.5" y="121" class="c">Seule l’information utile,</text>
<text x="664.5" y="139" class="c">et seulement à qui y a</text>
<text x="664.5" y="157" class="c">droit</text>
<path d="M247,121.5H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,121.5H551" class="ln" marker-end="url(#ar)"/>
<path d="M672,189V211H136" class="ln"/>
<path d="M136,211V233" class="ln" marker-end="url(#ar)"/>
<rect x="24" y="235" width="224" height="112" rx="8" class="bl"/>
<text x="136" y="259" class="c b">Droit établi</text>
<text x="136" y="281" class="c">Donner l’information utile</text>
<path d="M404,211V233" class="ln" marker-end="url(#ar)"/>
<rect x="292" y="235" width="224" height="112" rx="8" class="or"/>
<text x="404" y="259" class="c b">Doute</text>
<text x="404" y="281" class="c">Rappeler par un canal</text>
<text x="404" y="299" class="c">officiel ou demander un</text>
<text x="404" y="317" class="c">écrit</text>
<path d="M672,211V233" class="ln" marker-end="url(#ar)"/>
<rect x="560" y="235" width="224" height="112" rx="8" class="gr"/>
<text x="672" y="259" class="c b">Pas de droit</text>
<text x="672" y="281" class="c">Refuser, même par « oui » ou</text>
<text x="672" y="299" class="c">« non » ; la presse va au</text>
<text x="672" y="317" class="c">service de communication</text>
<text x="400" y="375" class="c">Une demande présentée comme urgente ou venue « d’en haut » ne dispense pas de vérifier.</text>
</svg>
