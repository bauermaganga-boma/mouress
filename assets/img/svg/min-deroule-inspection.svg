<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Déroulé d'une inspection en cinq étapes : préparation, visite sur site avec réunions d'ouverture et de clôture, constat, rapport avec procès-verbal, suites</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
.dn{fill:none;stroke:#061F44;stroke-width:2.5;stroke-dasharray:8 6}
</style></defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Déroulé d'une inspection</text>
<rect x="18" y="70" width="140" height="48" rx="8" class="nvf"/><text x="88" y="100" class="w c">1. Préparation</text>
<rect x="18" y="126" width="140" height="210" rx="8" class="bl"/>
<text x="88" y="156" class="c">Ordre de mission</text>
<text x="88" y="184" class="c">Dossier</text>
<text x="88" y="212" class="c">documentaire</text>
<text x="88" y="240" class="c">Analyse des risques</text>
<text x="88" y="268" class="c">Équipements de</text>
<text x="88" y="296" class="c">protection</text>
<path d="M160,94H172" class="or" marker-end="url(#ao)"/>
<rect x="174" y="70" width="140" height="48" rx="8" class="nvf"/><text x="244" y="100" class="w c">2. Visite sur site</text>
<rect x="174" y="126" width="140" height="210" rx="8" class="gr"/>
<text x="244" y="156" class="c">Réunion d'ouverture</text>
<text x="244" y="184" class="c">Entretiens</text>
<text x="244" y="212" class="c">Observations</text>
<text x="244" y="240" class="c">Prélèvements</text>
<text x="244" y="268" class="c">et photos</text>
<text x="244" y="296" class="c">Réunion de clôture</text>
<path d="M316,94H328" class="or" marker-end="url(#ao)"/>
<rect x="330" y="70" width="140" height="48" rx="8" class="nvf"/><text x="400" y="100" class="w c">3. Constat</text>
<rect x="330" y="126" width="140" height="210" rx="8" class="bl"/>
<text x="400" y="156" class="c">Fait vérifié</text>
<text x="400" y="184" class="c">Exigence visée</text>
<text x="400" y="212" class="c">Preuve jointe</text>
<path d="M472,94H484" class="or" marker-end="url(#ao)"/>
<rect x="486" y="70" width="140" height="48" rx="8" class="nvf"/><text x="556" y="100" class="w c">4. Rapport</text>
<rect x="486" y="126" width="140" height="210" rx="8" class="gr"/>
<text x="556" y="156" class="c">Observations de</text>
<text x="556" y="184" class="c">l'opérateur</text>
<text x="556" y="212" class="c">Procès-verbal</text>
<text x="556" y="240" class="c">Signatures</text>
<path d="M628,94H640" class="or" marker-end="url(#ao)"/>
<rect x="642" y="70" width="140" height="48" rx="8" class="nvf"/><text x="712" y="100" class="w c">5. Suites</text>
<rect x="642" y="126" width="140" height="210" rx="8" class="bl"/>
<text x="712" y="156" class="c">Mise en demeure</text>
<text x="712" y="184" class="c">Transaction</text>
<text x="712" y="212" class="c">éventuelle</text>
<text x="712" y="240" class="c">Sanction</text>
<text x="712" y="268" class="c">Suivi du dossier</text>
<text x="400" y="372" class="c b">Chaque étape s'appuie sur la précédente.</text>
<text x="400" y="398" class="c">Le constat n'est retenu que s'il repose sur un fait vérifié et une preuve.</text>
<text x="400" y="424" class="c">Les observations de l'opérateur sont recueillies avant la finalisation du rapport.</text>
</svg>
