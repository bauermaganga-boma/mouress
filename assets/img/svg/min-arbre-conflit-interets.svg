<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Arbre de décision : cadeau ou invitation proposé, et conflit d'intérêts potentiel, avec la conduite à tenir</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}.t{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#B85C0A;stroke-width:2.5}
.orl{fill:#FCFBF8;stroke:#F28C28;stroke-width:3}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Cadeau, invitation, conflit d'intérêts : que faire ?</text>
<text x="200" y="62" class="c o">Un avantage m'est proposé</text><text x="600" y="62" class="c o">J'ai un intérêt privé lié à un dossier</text>
<line x1="400" y1="45" x2="400" y2="485" stroke="#061F44" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="30,122 55,76 345,76 370,122 345,168 55,168" class="bl"/>
<text x="200" y="110" class="c b t">L'offrant a-t-il un intérêt dans mes</text>
<text x="200" y="127" class="c b t">décisions ? (dossier en cours,</text>
<text x="200" y="144" class="c b t">contrôle, appel d'offres)</text>
<path d="M120,168V230" class="nv" marker-end="url(#ar)"/><text x="108" y="205" class="o e">OUI</text>
<path d="M290,168V230" class="nv" marker-end="url(#ar)"/><text x="302" y="205" class="o">NON</text>
<rect x="10" y="232" width="200" height="100" rx="8" class="orf"/>
<text x="110" y="254" class="c b t">Refuser, ou remettre</text>
<text x="110" y="272" class="c b t">l'objet à la hiérarchie,</text>
<text x="110" y="290" class="c b t">qui l'inscrit sur un</text>
<text x="110" y="308" class="c b t">registre</text>
<rect x="195" y="232" width="200" height="100" rx="8" class="gr"/>
<text x="295" y="254" class="c t">Cadeau d'usage de faible</text>
<text x="295" y="272" class="c t">valeur, hors procédure :</text>
<text x="295" y="290" class="c t">toléré selon la politique</text>
<text x="295" y="308" class="c t">du service</text>
<rect x="20" y="350" width="360" height="92" rx="8" class="bl"/>
<text x="200" y="372" class="c t">Pour juger : la valeur, la fréquence,</text>
<text x="200" y="390" class="c t">le moment et l'intention apparente.</text>
<text x="200" y="408" class="c t">Test de la une du journal :</text>
<text x="200" y="426" class="c t">pourrais-je le justifier sans gêne ?</text>
<text x="200" y="468" class="c t">En cas de doute : refuser.</text>
<polygon points="430,122 455,76 745,76 770,122 745,168 455,168" class="bl"/>
<text x="600" y="110" class="c b t">Mon jugement pourrait-il être</text>
<text x="600" y="127" class="c b t">mis en doute par un observateur</text>
<text x="600" y="144" class="c b t">raisonnable ?</text>
<path d="M520,168V230" class="nv" marker-end="url(#ar)"/><text x="508" y="205" class="o e">OUI</text>
<path d="M700,168V230" class="nv" marker-end="url(#ar)"/><text x="712" y="205" class="o">NON</text>
<rect x="405" y="232" width="230" height="150" rx="8" class="orf"/>
<text x="520" y="254" class="c b t">1. Déclarer par écrit</text>
<text x="520" y="272" class="c b t">à la hiérarchie</text>
<text x="520" y="290" class="c b t">2. Se déporter : ne pas</text>
<text x="520" y="308" class="c b t">instruire ni décider</text>
<text x="520" y="326" class="c b t">3. Tracer : conserver</text>
<text x="520" y="344" class="c b t">la décision de déport</text>
<rect x="630" y="232" width="150" height="100" rx="8" class="gr"/>
<text x="705" y="254" class="c t">Poursuivre, en</text>
<text x="705" y="272" class="c t">restant vigilant si</text>
<text x="705" y="290" class="c t">la situation change</text>
<text x="600" y="412" class="c t">Le conflit d'intérêts n'est pas une infraction :</text>
<text x="600" y="430" class="c t">la faute est de ne pas le déclarer.</text>
<text x="600" y="454" class="c t">Intérêts financiers, familiaux, amicaux</text>
<text x="600" y="471" class="c t">ou futurs (recherche d'emploi).</text>
</svg>
