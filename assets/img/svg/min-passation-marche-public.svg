<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Procédure de passation d'un marché public par appel d'offres : huit étapes de la planification à la notification</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}.t{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#B85C0A;stroke-width:2.5}
.orl{fill:#FCFBF8;stroke:#F28C28;stroke-width:3}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Passation d'un marché public par appel d'offres</text>
<rect x="20" y="55" width="172" height="120" rx="8" class="gr"/>
<circle cx="42" cy="79" r="15" class="orf"/>
<text x="42" y="84" class="c b">1</text>
<text x="64" y="84" class="b">Planification</text>
<text x="32" y="113" class="t">Plan de passation</text>
<text x="32" y="132" class="t">cohérent avec</text>
<text x="32" y="151" class="t">les crédits</text>
<rect x="216" y="55" width="172" height="120" rx="8" class="gr"/>
<circle cx="238" cy="79" r="15" class="orf"/>
<text x="238" y="84" class="c b">2</text>
<text x="260" y="84" class="b">Autorisation</text>
<text x="228" y="113" class="t">Autorisation préalable</text>
<text x="228" y="132" class="t">de l'administration</text>
<text x="228" y="151" class="t">centrale, DAO prêt</text>
<rect x="412" y="55" width="172" height="120" rx="8" class="gr"/>
<circle cx="434" cy="79" r="15" class="orf"/>
<text x="434" y="84" class="c b">3</text>
<text x="456" y="84" class="b">Publicité</text>
<text x="424" y="113" class="t">Avis d'appel à la</text>
<text x="424" y="132" class="t">concurrence publié</text>
<text x="424" y="151" class="t">(journal des marchés)</text>
<rect x="608" y="55" width="172" height="120" rx="8" class="bl"/>
<circle cx="630" cy="79" r="15" class="orf"/>
<text x="630" y="84" class="c b">4</text>
<text x="652" y="84" class="b">Remise, ouverture</text>
<text x="620" y="113" class="t">Plis déposés avant</text>
<text x="620" y="132" class="t">la date limite ;</text>
<text x="620" y="151" class="t">ouverture publique</text>
<rect x="608" y="245" width="172" height="120" rx="8" class="bl"/>
<circle cx="630" cy="269" r="15" class="orf"/>
<text x="630" y="274" class="c b">5</text>
<text x="652" y="274" class="b">Analyse des offres</text>
<text x="620" y="303" class="t">La commission classe :</text>
<text x="620" y="322" class="t">offre conforme</text>
<text x="620" y="341" class="t">la moins-disante</text>
<rect x="412" y="245" width="172" height="120" rx="8" class="gr"/>
<circle cx="434" cy="269" r="15" class="orf"/>
<text x="434" y="274" class="c b">6</text>
<text x="456" y="274" class="b">Rapport approuvé</text>
<text x="424" y="303" class="t">Rapport d'analyse</text>
<text x="424" y="322" class="t">transmis à</text>
<text x="424" y="341" class="t">l'administration centrale</text>
<rect x="216" y="245" width="172" height="120" rx="8" class="bl"/>
<circle cx="238" cy="269" r="15" class="orf"/>
<text x="238" y="274" class="c b">7</text>
<text x="260" y="274" class="b">Attribution</text>
<text x="228" y="303" class="t">Notification aux écartés,</text>
<text x="228" y="322" class="t">publication ; délai avant</text>
<text x="228" y="341" class="t">signature : recours</text>
<rect x="20" y="245" width="172" height="120" rx="8" class="gr"/>
<circle cx="42" cy="269" r="15" class="orf"/>
<text x="42" y="274" class="c b">8</text>
<text x="64" y="274" class="b">Signature</text>
<text x="32" y="303" class="t">Marché signé, visé,</text>
<text x="32" y="322" class="t">puis notifié :</text>
<text x="32" y="341" class="t">l'exécution commence</text>
<path d="M194,115H213" class="nv" marker-end="url(#ar)"/>
<path d="M390,115H409" class="nv" marker-end="url(#ar)"/>
<path d="M586,115H605" class="nv" marker-end="url(#ar)"/>
<path d="M694,177V240" class="nv" marker-end="url(#ar)"/>
<path d="M606,305H587" class="nv" marker-end="url(#ar)"/>
<path d="M410,305H391" class="nv" marker-end="url(#ar)"/>
<path d="M214,305H195" class="nv" marker-end="url(#ar)"/>
<rect x="20" y="390" width="760" height="76" rx="8" class="orl"/>
<text x="400" y="415" class="c o">Appel d'offres infructueux (aucune offre conforme)</text>
<text x="400" y="438" class="c t">L'autorité déclare l'appel infructueux, l'administration centrale approuve, puis on relance.</text>
<text x="400" y="456" class="c t">Après deux appels infructueux, l'entente directe est possible, sur autorisation.</text>
</svg>
