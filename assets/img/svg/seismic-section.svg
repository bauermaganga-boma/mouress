<path id="h5" d="M90,350C200,345 320,303 410,294C520,303 640,346 730,352"/>
<path id="h6" d="M90,410C250,405 350,380 410,372C520,376 640,405 730,412"/>
<g id="hz" fill="none" stroke="#061F44">
<use href="#h4" stroke="#F28C28" stroke-width="9"/>
<use href="#h1" stroke-width="3.5"/><use href="#h1" y="-6" stroke-width="1.2"/><use href="#h1" y="6" stroke-width="1.2"/>
<use href="#h2" stroke-width="3.5"/><use href="#h2" y="-6" stroke-width="1.2"/><use href="#h2" y="6" stroke-width="1.2"/>
<use href="#h3" stroke-width="3.5"/><use href="#h3" y="-6" stroke-width="1.2"/><use href="#h3" y="6" stroke-width="1.2"/>
<use href="#h4" stroke-width="3.5"/><use href="#h4" y="-6" stroke-width="1.2"/><use href="#h4" y="6" stroke-width="1.2"/>
<use href="#h5" stroke-width="3.5"/><use href="#h5" y="-6" stroke-width="1.2"/><use href="#h5" y="6" stroke-width="1.2"/>
<use href="#h6" stroke-width="3.5"/><use href="#h6" y="-6" stroke-width="1.2"/><use href="#h6" y="6" stroke-width="1.2"/>
</g>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Section sismique interprétée (sismique réflexion)</text>

<rect x="90" y="70" width="640" height="370" fill="#E8EAEE"/>
<rect x="90" y="70" width="640" height="370" fill="url(#tr)"/>
<g clip-path="url(#pl)">
