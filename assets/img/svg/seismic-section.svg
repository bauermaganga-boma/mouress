<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Section sismique interprétée : temps double en millisecondes en fonction de la distance, horizons réflecteurs, anticlinal (piège structural), faille normale et point brillant indiquant un réservoir potentiel</title>
<defs>
