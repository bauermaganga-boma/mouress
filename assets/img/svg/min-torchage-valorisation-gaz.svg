<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne du gaz associé : puits, séparateur, traitement et compression, puis quatre destinations mesurées par des compteurs : réinjection dans le gisement, autoconsommation du champ, valorisation et vente (électricité, GPL, GNL, marché intérieur) et, en dernier recours, torche ; le bilan gaz additionne gaz réinjecté, autoconsommé, vendu, torché ou rejeté et pertes</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Chaîne du gaz associé : de la production à la torche</text>
<path d="M30,285L60,215L90,285Z" fill="#061F44"/><path d="M46,265H74M40,275H80M52,250L68,250" stroke="#FCFBF8" stroke-width="3"/><path d="M60,285V300" class="nv"/><text x="60" y="322" class="c b">Puits</text>
<path d="M72,250H116" class="nv" marker-end="url(#ar)"/>
<rect x="120" y="215" width="110" height="70" rx="8" class="gr"/><text x="175" y="246" class="c b">Séparateur</text><text x="175" y="264" class="c">gaz / huile / eau</text>
<path d="M230,250H266" class="nv" marker-end="url(#ar)"/>
<text x="250" y="240" class="c o">gaz</text>
<rect x="270" y="215" width="120" height="70" rx="8" class="gr"/><text x="330" y="243" class="c b">Traitement et</text><text x="330" y="261" class="c b">compression</text><text x="330" y="277" class="c" style="font-size:13px">(déshydratation)</text>
<path d="M175,285V350" class="nv" marker-end="url(#ar)"/><text x="175" y="372" class="c b">Huile et eau</text><text x="175" y="390" class="c">vers stockage et export</text>
<path d="M390,250H430M430,110V380" class="nv"/>
<path d="M430,110H474" fill="none" stroke="#061F44" stroke-width="3.5"/>
<circle cx="490" cy="110" r="15" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/><text x="490" y="115" class="c b">C</text>
<path d="M505,110H526" fill="none" stroke="#061F44" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="530" y="84" width="250" height="52" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="655" y="106.5" class="c b">Réinjection dans le gisement</text>
<text x="655" y="123.5" class="c">(maintien de pression, gas-lift)</text>
<path d="M430,200H474" fill="none" stroke="#061F44" stroke-width="3.5"/>
<circle cx="490" cy="200" r="15" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/><text x="490" y="205" class="c b">C</text>
<path d="M505,200H526" fill="none" stroke="#061F44" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="530" y="174" width="250" height="52" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="655" y="196.5" class="c b">Autoconsommation du champ</text>
<text x="655" y="213.5" class="c">(turbines, chauffage)</text>
<path d="M430,290H474" fill="none" stroke="#061F44" stroke-width="3.5"/>
<circle cx="490" cy="290" r="15" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/><text x="490" y="295" class="c b">C</text>
<path d="M505,290H526" fill="none" stroke="#061F44" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="530" y="258" width="250" height="64" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="655" y="278" class="c b">Valorisation et vente :</text>
<text x="655" y="295" class="c">électricité, GPL, GNL,</text>
<text x="655" y="312" class="c">marché intérieur</text>
<path d="M430,380H474" fill="none" stroke="#F28C28" stroke-width="3.5"/>
<circle cx="490" cy="380" r="15" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/><text x="490" y="385" class="c b">C</text>
<path d="M505,380H526" fill="none" stroke="#F28C28" stroke-width="3.5" marker-end="url(#ao)"/>
<rect x="530" y="354" width="250" height="52" rx="6" fill="#FFE3BF" stroke="#B85C0A" stroke-width="2.5"/>
<text x="655" y="376.5" class="c b">Torche : dernier recours</text>
<text x="655" y="393.5" class="c">(dérogation, gaz mesuré)</text>
<text x="655" y="426" class="c o">Interdit sauf dérogation (art. 125)</text>
<circle cx="50" cy="448" r="15" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/><text x="50" y="453" class="c b">C</text><text x="74" y="453">= compteur (volume mesuré)</text>
<text x="400" y="488" class="c b">Bilan gaz : produit = réinjecté + autoconsommé + vendu + torché ou rejeté + pertes</text>
</svg>
