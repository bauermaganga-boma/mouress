<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Équipements de protection individuelle : casque, lunettes, gants, chaussures de sécurité, protection auditive et gilet haute visibilité, en pictogrammes d'obligation (cercle bleu)</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}
.d{fill:#0A5CA8;stroke:#061F44;stroke-width:3}
.w{fill:#FFFFFF}.ws{fill:none;stroke:#FFFFFF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.bs{fill:none;stroke:#0A5CA8;stroke-width:3;stroke-linecap:round}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Équipements de protection individuelle (EPI)</text>

<!-- casque -->
<circle class="d" cx="160" cy="130" r="48"/>
<g transform="translate(160,130)"><path class="w" d="M-24,6 C-24,-24 24,-24 24,6 Z"/><rect class="w" x="-31" y="6" width="62" height="8" rx="4"/><line class="bs" x1="0" y1="-20" x2="0" y2="2"/></g>
<text class="m b" x="160" y="204">Casque de sécurité</text><text class="m" x="160" y="224">Protection de la tête</text>
<!-- lunettes -->
<circle class="d" cx="400" cy="130" r="48"/>
<g transform="translate(400,130)"><circle class="ws" cx="-14" cy="0" r="11"/><circle class="ws" cx="14" cy="0" r="11"/><line class="ws" x1="-3" y1="-2" x2="3" y2="-2"/><line class="ws" x1="-25" y1="-4" x2="-31" y2="-9"/><line class="ws" x1="25" y1="-4" x2="31" y2="-9"/></g>
<text class="m b" x="400" y="204">Lunettes de protection</text><text class="m" x="400" y="224">Protection des yeux</text>
<!-- gants -->
<circle class="d" cx="640" cy="130" r="48"/>
<g transform="translate(640,130)"><rect class="w" x="-15" y="-2" width="30" height="28" rx="7"/>
<rect class="w" x="-15" y="-24" width="7" height="30" rx="3.5"/><rect class="w" x="-7" y="-28" width="7" height="34" rx="3.5"/><rect class="w" x="1" y="-26" width="7" height="32" rx="3.5"/><rect class="w" x="9" y="-21" width="7" height="27" rx="3.5"/>
<rect class="w" x="-27" y="2" width="16" height="8" rx="4" transform="rotate(30 -19 6)"/></g>
<text class="m b" x="640" y="204">Gants de protection</text><text class="m" x="640" y="224">Protection des mains</text>

<!-- chaussures -->
<circle class="d" cx="160" cy="330" r="48"/>
<g transform="translate(160,330)"><path class="w" d="M-26,-18 L-8,-18 L-8,-2 C0,4 14,6 26,10 L26,22 L-26,22 Z"/><line class="bs" x1="-26" y1="15" x2="26" y2="15"/></g>
<text class="m b" x="160" y="404">Chaussures de sécurité</text><text class="m" x="160" y="424">Protection des pieds</text>
<!-- protection auditive -->
<circle class="d" cx="400" cy="330" r="48"/>
<g transform="translate(400,330)"><path class="ws" stroke-width="5" d="M-22,6 C-22,-28 22,-28 22,6"/><rect class="w" x="-31" y="0" width="15" height="26" rx="6"/><rect class="w" x="16" y="0" width="15" height="26" rx="6"/></g>
<text class="m b" x="400" y="404">Casque antibruit</text><text class="m" x="400" y="424">Protection de l'ouïe</text>
<!-- gilet -->
<circle class="d" cx="640" cy="330" r="48"/>
<g transform="translate(640,330)"><path class="w" d="M-19,-26 L-8,-26 L0,-10 L8,-26 L19,-26 L25,26 L-25,26 Z"/><line class="bs" x1="-23" y1="8" x2="23" y2="8"/><line class="bs" x1="-24" y1="18" x2="24" y2="18"/></g>
<text class="m b" x="640" y="404">Gilet haute visibilité</text><text class="m" x="640" y="424">Être vu du personnel d'engins</text>

<text class="m" x="400" y="472">Pictogrammes d'obligation : cercle bleu, symbole blanc (ISO 7010, série M)</text>
</svg>
