<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Parties prenantes d'un projet pétrolier : l'État délivre le titre et approuve le contrat ; les contracteurs (un opérateur et des associés) détiennent les droits ; l'opérateur national peut acquérir une participation ; l'opérateur confie des prestations à des sociétés de services par contrat de sous-traitance</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Parties prenantes d'un projet pétrolier</text>
<rect x="270" y="44" width="260" height="114" rx="6" class="bl"/>
<path d="M270,76V50Q270,44 276,44H524Q530,44 530,50V76z" class="nvf"/>
<text x="400" y="64" class="w c">ÉTAT</text>
<text x="280" y="98" class="t13">Propriétaire des ressources</text>
<text x="280" y="120" class="t13">Délivre les titres, approuve les</text>
<text x="280" y="137" class="t13">contrats</text>
<rect x="20" y="204" width="232" height="116" rx="6" class="bl"/>
<path d="M20,236V210Q20,204 26,204H246Q252,204 252,210V236z" class="nvf"/>
<text x="136" y="224" class="w c">OPÉRATEUR NATIONAL</text>
<text x="30" y="258" class="t13">Capital détenu par l'État seul</text>
<text x="30" y="280" class="t13">Agit pour le compte de l'État</text>
<text x="30" y="302" class="t13">Peut acquérir une participation</text>
<rect x="270" y="200" width="510" height="158" rx="8" class="s" stroke-dasharray="7 5"/>
<text x="412" y="192" class="b">CONTRACTEURS : titulaires des droits du contrat</text>
<rect x="285" y="216" width="235" height="130" rx="6" class="bl"/>
<path d="M285,248V222Q285,216 291,216H514Q520,216 520,222V248z" class="nvf"/>
<text x="402.5" y="236" class="w c">OPÉRATEUR</text>
<text x="295" y="270" class="t13">Conduit les opérations pour</text>
<text x="295" y="287" class="t13">tous</text>
<text x="295" y="309" class="t13">Répond auprès de</text>
<text x="295" y="326" class="t13">l'administration</text>
<rect x="535" y="216" width="235" height="130" rx="6" class="bl"/>
<path d="M535,248V222Q535,216 541,216H764Q770,216 770,222V248z" class="nvf"/>
<text x="652.5" y="236" class="w c">ASSOCIÉS</text>
<text x="545" y="270" class="t13">Détiennent une part des droits</text>
<text x="545" y="292" class="t13">Supportent leur quote-part des</text>
<text x="545" y="309" class="t13">coûts</text>
<rect x="285" y="386" width="485" height="112" rx="6" class="bl"/>
<path d="M285,418V392Q285,386 291,386H764Q770,386 770,392V418z" class="nvf"/>
<text x="527.5" y="406" class="w c">SOCIÉTÉS DE SERVICES ET SOUS-TRAITANTS</text>
<text x="295" y="440" class="t13">Forage, sismique, logistique, maintenance</text>
<text x="295" y="462" class="t13">Sans titre : elles agissent par contrat de sous-traitance et doivent</text>
<text x="295" y="479" class="t13">être agréées</text>
<path d="M400,160V198" class="nv" marker-end="url(#ar)"/>
<text x="410" y="177" class="t13">Titre et contrat approuvé</text>
<path d="M254,256H268" class="or" marker-end="url(#ao)"/>
<path d="M270,100H136V202" class="nv" marker-end="url(#ar)" fill="none"/>
<text x="148" y="130" class="t13">Capital 100 % public</text>
<path d="M402,360V384" class="nv" marker-end="url(#ar)"/>
<text x="412" y="376" class="t13">Contrat de sous-traitance</text>

</svg>
