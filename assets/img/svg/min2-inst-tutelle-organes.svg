<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Qui décide quoi dans une société anonyme dont l'État est actionnaire : assemblée générale ordinaire à la majorité simple (comptes, dividende, nomination des administrateurs et des commissaires aux comptes), assemblée générale extraordinaire aux deux tiers des voix (statuts), conseil d'administration, direction générale, commissaire aux comptes ; le ministère du secteur exerce la tutelle technique en passant par les organes</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.t13{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2}
.wh{fill:#FFFFFF;stroke:#F28C28;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.da{fill:none;stroke:#F28C28;stroke-width:3;stroke-dasharray:8 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Qui décide quoi dans une société à participation de l'État ?</text>
<text x="400" y="48" class="c t13">Société anonyme : répartition des pouvoirs entre les organes (schéma de principe)</text>

<rect x="30" y="64" width="520" height="150" rx="8" class="bl"/>
<text x="290" y="86" class="c b">Assemblée générale des actionnaires (l'État y vote selon sa part)</text>
<rect x="44" y="98" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="1.5"/>
<text x="56" y="118" class="o">Ordinaire : majorité simple</text>
<text x="56" y="138" class="t13">Approuve les comptes</text>
<text x="56" y="156" class="t13">Décide le dividende</text>
<text x="56" y="174" class="t13">Nomme les administrateurs</text>
<text x="56" y="192" class="t13">et les commissaires aux comptes</text>
<rect x="296" y="98" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="1.5"/>
<text x="308" y="118" class="o">Extraordinaire : deux tiers</text>
<text x="308" y="138" class="t13">Au moins les deux tiers des voix</text>
<text x="308" y="156" class="t13">(66,7 %) pour modifier</text>
<text x="308" y="174" class="t13">les statuts ou le capital</text>
<text x="308" y="192" class="t13">de la société</text>

<path d="M290,214V250" class="nv" marker-end="url(#ar)"/>
<text x="302" y="238" class="t13">nomme</text>

<rect x="30" y="252" width="520" height="86" rx="8" class="gr"/>
<text x="290" y="274" class="c b">Conseil d'administration (représentants de l'État inclus)</text>
<text x="290" y="296" class="c t13">Fixe la stratégie, arrête les comptes et propose le dividende</text>
<text x="290" y="316" class="c t13">Nomme le directeur général et contrôle la direction</text>
<path d="M290,338V370" class="nv" marker-end="url(#ar)"/>
<text x="302" y="360" class="t13">nomme</text>

<rect x="30" y="372" width="520" height="62" rx="8" class="bl"/>
<text x="290" y="396" class="c b">Direction générale</text>
<text x="290" y="418" class="c t13">Gère la société au quotidien : contrats courants, recrutement</text>

<rect x="590" y="64" width="190" height="120" rx="8" class="gr"/>
<text x="685" y="88" class="c b">Commissaire aux</text><text x="685" y="106" class="c b">comptes</text>
<text x="685" y="128" class="c t13">Indépendant : certifie</text><text x="685" y="146" class="c t13">les comptes (régularité</text><text x="685" y="164" class="c t13">et sincérité)</text>
<path d="M588,124H552" class="nv" marker-end="url(#ar)"/>

<rect x="590" y="230" width="190" height="150" rx="8" class="wh"/>
<text x="685" y="254" class="c o">Ministère du secteur</text>
<text x="685" y="272" class="c o">(tutelle technique)</text>
<text x="685" y="296" class="c t13">Oriente et suit l'activité</text><text x="685" y="314" class="c t13">selon la politique du</text><text x="685" y="332" class="c t13">secteur ; agit par les</text><text x="685" y="350" class="c t13">organes, sans gérer</text><text x="685" y="368" class="c t13">à la place de la direction</text>
<path d="M590,280H570V160H552" class="da" marker-end="url(#ao)"/>
<path d="M590,330H570V296H552" class="da" marker-end="url(#ao)"/>
<text x="400" y="462" class="c t13">Flèches pointillées : l'orientation passe par l'assemblée et le conseil, non par des ordres directs à la direction.</text>
<text x="400" y="482" class="c t13">Schéma d'illustration : les règles exactes figurent dans les statuts et dans le droit applicable (OHADA).</text>
</svg>
