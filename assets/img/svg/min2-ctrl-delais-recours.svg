<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Deux délais à retenir : mise en demeure de quinze jours avant la pénalité, puis recours hiérarchique avec réponse du Ministre sous trente jours et silence valant rejet</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="30" class="h">Les délais à retenir (exemples d'application)</text>
<text x="25" y="68" class="b">A. Mise en demeure avant pénalité (art. 267 de la loi n° 002/2019)</text>
<path d="M40,130H760" class="nv" marker-end="url(#ar)"/>
<circle cx="80" cy="130" r="9" fill="#061F44"/><circle cx="260" cy="130" r="9" fill="#F28C28" stroke="#061F44" stroke-width="2"/><circle cx="560" cy="130" r="9" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="80" y="102" class="c n b">Manquement</text><text x="80" y="160" class="c n">constaté, PV</text>
<text x="260" y="102" class="c n b">Jour 0</text><text x="260" y="160" class="c n">Mise en demeure</text><text x="260" y="177" class="c n">notifiée</text>
<text x="560" y="102" class="c n b">Jour 15</text><text x="560" y="160" class="c n">Fin du délai</text>
<rect x="260" y="112" width="300" height="10" fill="#F28C28" fill-opacity="0.5"/>
<text x="410" y="200" class="c n o">15 jours pour régulariser ; pénalité possible ensuite</text>
<path d="M25,225H775" stroke="#061F44" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="25" y="256" class="b">B. Recours hiérarchique contre la décision (art. 22)</text>
<path d="M40,330H760" class="nv" marker-end="url(#ar)"/>
<circle cx="80" cy="330" r="9" fill="#061F44"/><circle cx="260" cy="330" r="9" fill="#F28C28" stroke="#061F44" stroke-width="2"/><circle cx="500" cy="330" r="9" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="80" y="302" class="c n b">Décision</text><text x="80" y="360" class="c n">notifiée</text>
<text x="260" y="302" class="c n b">Jour 0</text><text x="260" y="360" class="c n">Recours déposé</text><text x="260" y="377" class="c n">auprès du Ministre</text>
<text x="500" y="302" class="c n b">Jour 30</text><text x="500" y="360" class="c n">Réponse expresse</text><text x="500" y="377" class="c n">ou silence</text>
<rect x="260" y="312" width="240" height="10" fill="#F28C28" fill-opacity="0.5"/>
<rect x="590" y="298" width="190" height="66" class="bl"/>
<text x="685" y="322" class="c n b">Silence = rejet</text><text x="685" y="342" class="c n">puis recours</text><text x="685" y="358" class="c n">contentieux possible</text>
<text x="400" y="410" class="c n o">Le recours ne suspend pas de plein droit le paiement de la pénalité.</text>
<text x="400" y="440" class="c n">L'agent transmet le dossier complet : la décision appartient au Ministre.</text>
<text x="400" y="486" class="c n">Schéma d'illustration : jours comptés à partir de la notification, sans cas réel.</text>
</svg>
