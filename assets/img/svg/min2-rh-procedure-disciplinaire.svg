<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Procédure disciplinaire en six étapes : constat écrit, saisine de l'autorité, communication du dossier, explications de l'agent, conseil de discipline, décision motivée avec voies de recours.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Procédure disciplinaire : les garanties de la défense</text>
<rect x="24" y="58" width="221" height="112" rx="8" class="bl"/>
<text x="134.5" y="82" class="c b">1. Constater</text>
<text x="134.5" y="104" class="c">Faits consignés par écrit</text>
<rect x="289" y="58" width="221" height="112" rx="8" class="wh"/>
<text x="399.5" y="82" class="c b">2. Saisir</text>
<text x="399.5" y="104" class="c">L’autorité hiérarchique</text>
<text x="399.5" y="122" class="c">compétente</text>
<rect x="554" y="58" width="221" height="112" rx="8" class="or"/>
<text x="664.5" y="82" class="c b">3. Communiquer le dossier</text>
<text x="664.5" y="104" class="c">À l’agent, qui peut être</text>
<text x="664.5" y="122" class="c">assisté d’un conseil (art.</text>
<text x="664.5" y="140" class="c">89)</text>
<rect x="24" y="218" width="221" height="112" rx="8" class="or"/>
<text x="134.5" y="242" class="c b">4. Entendre l’agent</text>
<text x="134.5" y="264" class="c">Procédure contradictoire :</text>
<text x="134.5" y="282" class="c">recueillir ses explications</text>
<rect x="289" y="218" width="221" height="112" rx="8" class="bl"/>
<text x="399.5" y="242" class="c b">5. Conseil de discipline</text>
<text x="399.5" y="264" class="c">Un par corps, à parité</text>
<text x="399.5" y="282" class="c">administration / personnel</text>
<text x="399.5" y="300" class="c">(art. 74-75)</text>
<rect x="554" y="218" width="221" height="112" rx="8" class="wh"/>
<text x="664.5" y="242" class="c b">6. Décision motivée</text>
<text x="664.5" y="264" class="c">Obligation violée, faits,</text>
<text x="664.5" y="282" class="c">circonstances, voies de</text>
<text x="664.5" y="300" class="c">recours (art. 90)</text>
<path d="M247,114H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,114H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,172V194H134.5V215" class="ln" marker-end="url(#ar)"/>
<path d="M247,274H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,274H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="440" class="c">Les sanctions et leur liste sont fixées par les statuts particuliers (art. 87).</text>
<text x="400" y="460" class="c">Une sanction qui ne respecte pas ces règles est exposée à l’annulation.</text>
</svg>
