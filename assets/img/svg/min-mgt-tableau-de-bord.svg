<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau de bord mensuel d'un service, valeurs fictives : dossiers traités dans les délais 72 % pour une cible de 90 % (rouge) ; délai moyen de traitement 11 jours pour une cible de 10 jours (orange) ; taux d'absentéisme 4 % pour un maximum de 5 % (vert) ; agents utilisant le nouvel outil 78 % pour une cible de 80 % (orange). Chaque ligne porte ses seuils vert, orange et rouge.</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.s{font-size:13px}.v{font-size:20px;font-weight:bold}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Tableau de bord mensuel d'un service (valeurs fictives)</text>
<rect x="15" y="48" width="770" height="28" fill="#061F44"/>
<text x="25" y="68" style="fill:#FCFBF8;font-weight:bold">Indicateur et seuils</text>
<text x="410" y="68" style="fill:#FCFBF8;font-weight:bold">Résultat</text>
<text x="520" y="68" style="fill:#FCFBF8;font-weight:bold">Jauge (trait = cible)</text>
<text x="715" y="68" style="fill:#FCFBF8;font-weight:bold">Feu</text>
<rect x="15" y="90" width="770" height="80" fill="#E8EAEE" stroke="#061F44" stroke-width="1"/>
<text x="25" y="122" class="b" style="font-size:16px">Dossiers traités dans les délais</text>
<text x="25" y="146" class="s">Cible 90 % · vert ≥ 90 % · orange 75–89 % · rouge &lt; 75 %</text>
<text x="410" y="136" class="v">72 %</text>
<rect x="520" y="120" width="170" height="18" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<rect x="520" y="120" width="122.4" height="18" fill="#C0392B"/>
<line x1="673.0" y1="112" x2="673.0" y2="146" stroke="#061F44" stroke-width="3.5"/>
<circle cx="735" cy="124" r="14" fill="#C0392B" stroke="#061F44" stroke-width="2"/>
<text x="735" y="158" class="c s b">Rouge</text>
<rect x="15" y="178" width="770" height="80" fill="#FCFBF8" stroke="#061F44" stroke-width="1"/>
<text x="25" y="210" class="b" style="font-size:16px">Délai moyen de traitement</text>
<text x="25" y="234" class="s">Cible 10 jours · vert ≤ 10 · orange 11–13 · rouge > 13</text>
<text x="410" y="224" class="v">11 jours</text>
<rect x="520" y="208" width="170" height="18" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<rect x="520" y="208" width="124.7" height="18" fill="#F28C28"/>
<line x1="633.3" y1="200" x2="633.3" y2="234" stroke="#061F44" stroke-width="3.5"/>
<circle cx="735" cy="212" r="14" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="735" y="246" class="c s b">Orange</text>
<rect x="15" y="266" width="770" height="80" fill="#E8EAEE" stroke="#061F44" stroke-width="1"/>
<text x="25" y="298" class="b" style="font-size:16px">Taux d'absentéisme</text>
<text x="25" y="322" class="s">Maximum 5 % · vert ≤ 5 % · orange 6–7 % · rouge > 7 %</text>
<text x="410" y="312" class="v">4 %</text>
<rect x="520" y="296" width="170" height="18" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<rect x="520" y="296" width="68.0" height="18" fill="#2E8B57"/>
<line x1="605.0" y1="288" x2="605.0" y2="322" stroke="#061F44" stroke-width="3.5"/>
<circle cx="735" cy="300" r="14" fill="#2E8B57" stroke="#061F44" stroke-width="2"/>
<text x="735" y="334" class="c s b">Vert</text>
<rect x="15" y="354" width="770" height="80" fill="#FCFBF8" stroke="#061F44" stroke-width="1"/>
<text x="25" y="386" class="b" style="font-size:16px">Agents utilisant le nouvel outil</text>
<text x="25" y="410" class="s">Cible 80 % · vert ≥ 80 % · orange 70–79 % · rouge &lt; 70 %</text>
<text x="410" y="400" class="v">78 %</text>
<rect x="520" y="384" width="170" height="18" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<rect x="520" y="384" width="132.6" height="18" fill="#F28C28"/>
<line x1="656.0" y1="376" x2="656.0" y2="410" stroke="#061F44" stroke-width="3.5"/>
<circle cx="735" cy="388" r="14" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="735" y="422" class="c s b">Orange</text>
<text x="400" y="472" class="c s">Valeurs fictives, données à titre d'illustration. Une jauge pleine à 100 % correspond à l'échelle de l'indicateur :</text>
<text x="400" y="490" class="c s">100 % pour les pourcentages de dossiers et d'agents, 15 jours pour le délai, 10 % pour l'absentéisme.</text>
</svg>
