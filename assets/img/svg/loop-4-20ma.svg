<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Boucle de courant 4-20 mA : alimentation 24 V DC, transmetteur 2 fils, milliampèremètre, résistance de charge 250 ohms (1 à 5 V), courbe de correspondance entre la mesure en pourcentage et le courant, et table 0 % = 4 mA, 50 % = 12 mA, 100 % = 20 mA</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.of{fill:#F28C28;stroke:#061F44;stroke-width:2}
.gd{stroke:#C9CED8;stroke-width:1;fill:none}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Boucle de courant 4-20 mA</text>

<!-- grandeur mesurée -->
<text x="270" y="52" class="c">Grandeur mesurée</text>
<line x1="270" y1="57" x2="270" y2="78" stroke="#061F44" stroke-width="2.5" marker-end="url(#ar)"/>

<!-- boucle -->
<path d="M120,150V100H205M335,100H640V130M640,192V220H422M378,220H120V162" class="s"/>
<polyline points="640,130 628,138 652,150 628,162 652,174 628,186 640,192" class="s"/>
<line x1="105" y1="150" x2="135" y2="150" stroke="#061F44" stroke-width="3"/>
<line x1="112" y1="162" x2="128" y2="162" stroke="#061F44" stroke-width="6"/>
<text x="142" y="148" class="b">+</text>
<text x="142" y="174" class="b">−</text>
<text x="100" y="152" class="e">Alimentation</text>
<text x="100" y="170" class="e">24 V DC</text>

<rect x="205" y="80" width="130" height="40" class="bl"/>
<text x="270" y="105" class="c b">Transmetteur</text>
<text x="290" y="142" class="c">(2 fils, alimenté par la boucle)</text>

<circle cx="400" cy="220" r="22" class="wh"/>
<text x="400" y="225" class="c b">mA</text>
<text x="400" y="262" class="c">Milliampèremètre</text>

<text x="520" y="84" class="c b">Courant de boucle I = 4 à 20 mA</text>
<line x1="430" y1="100" x2="500" y2="100" class="or" marker-end="url(#ao)"/>
<line x1="610" y1="220" x2="540" y2="220" class="or" marker-end="url(#ao)"/>

<text x="664" y="145">Charge 250 Ω</text>
<text x="664" y="163">(entrée automate)</text>
<text x="664" y="191" class="o">U = 1 à 5 V</text>

<!-- courbe de correspondance -->
<path class="gd" d="M130,290H500M130,315H500M130,340H500M130,365H500M130,390H500M130,415H500M222.5,280V440M315,280V440M407.5,280V440M500,280V440"/>
<line x1="130" y1="440" x2="520" y2="440" class="s" marker-end="url(#ar)"/>
<line x1="130" y1="440" x2="130" y2="278" class="s" marker-end="url(#ar)"/>
<g class="e">
<text x="122" y="445">0</text><text x="122" y="420">4</text><text x="122" y="395">8</text><text x="122" y="370">12</text><text x="122" y="345">16</text><text x="122" y="320">20</text><text x="122" y="295">24</text>
</g>
<g class="c">
<text x="130" y="459">0 %</text><text x="222.5" y="459">25 %</text><text x="315" y="459">50 %</text><text x="407.5" y="459">75 %</text><text x="500" y="459">100 %</text>
<text x="315" y="482" class="b">Grandeur mesurée (% de l'étendue)</text>
<text x="62" y="365" class="b" transform="rotate(-90 62 365)">Courant (mA)</text>
</g>
<line x1="130" y1="415" x2="500" y2="315" stroke="#F28C28" stroke-width="4"/>
<circle cx="130" cy="415" r="5" class="of"/><circle cx="222.5" cy="390" r="5" class="of"/><circle cx="315" cy="365" r="5" class="of"/><circle cx="407.5" cy="340" r="5" class="of"/><circle cx="500" cy="315" r="5" class="of"/>
<text x="238" y="432" class="o">Zéro vivant : 4 mA = 0 %</text>

<!-- table -->
<text x="548" y="300" class="b">Mesure</text>
<text x="630" y="300" class="b">Courant</text>
<text x="722" y="300" class="b">Tension</text>
<line x1="540" y1="308" x2="790" y2="308" class="ld"/>
<text x="548" y="326">0 %</text><text x="630" y="326">4 mA</text><text x="722" y="326">1 V</text>
<text x="548" y="350">25 %</text><text x="630" y="350">8 mA</text><text x="722" y="350">2 V</text>
<text x="548" y="374">50 %</text><text x="630" y="374">12 mA</text><text x="722" y="374">3 V</text>
<text x="548" y="398">75 %</text><text x="630" y="398">16 mA</text><text x="722" y="398">4 V</text>
<text x="548" y="422">100 %</text><text x="630" y="422">20 mA</text><text x="722" y="422">5 V</text>
<text x="548" y="446">U = 250 Ω × I</text>
<text x="548" y="470" class="o">Défaut (NAMUR NE 43) :</text>
<text x="548" y="488" class="o">I &lt; 3,6 mA ou I &gt; 21 mA</text>
</svg>
