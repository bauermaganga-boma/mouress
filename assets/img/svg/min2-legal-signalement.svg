<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Arbre de décision du signalement d'un manquement : noter les faits, voie interne par le supérieur ou le contrôle interne, contrôle interne ou autorité externe si le chef est impliqué, divulgation publique en dernier recours ; protection de la bonne foi et risque de dénonciation calomnieuse</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.sm{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.or{fill:#FFF1DF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.ln{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Signaler un manquement : quelle voie, dans quel ordre ?</text><rect x="250" y="48" width="300" height="46" rx="8" class="gr"/>
<text x="400" y="76" class="b c">Vous constatez un manquement grave</text><path d="M400,94V112" class="nv" marker-end="url(#ar)"/><rect x="190" y="114" width="420" height="60" rx="8" class="bl"/>
<text x="400" y="139" class="b c">1. Noter les faits</text>
<text x="400" y="159" class="c">Dates, pièces auxquelles vous avez accès régulièrement</text><path d="M400,174V192" class="nv" marker-end="url(#ar)"/><rect x="190" y="194" width="420" height="62" rx="8" class="bl"/>
<text x="400" y="220" class="b c">2. Voie interne : supérieur hiérarchique</text>
<text x="400" y="240" class="c">ou contrôle interne</text><path d="M190,225H110V310H188" class="ln" marker-end="url(#ao)"/><text x="20" y="196">Chef impliqué ?</text>
<text x="20" y="213" class="o">Passer à</text>
<text x="20" y="230" class="o">l'étape 3</text><path d="M400,256V278" class="nv" marker-end="url(#ar)"/><rect x="190" y="280" width="420" height="62" rx="8" class="bl"/>
<text x="400" y="306" class="b c">3. Contrôle interne, inspection ou</text>
<text x="400" y="326" class="c">autorité externe compétente</text><path d="M400,342V360" class="nv" marker-end="url(#ar)"/><rect x="190" y="362" width="420" height="52" rx="8" class="gr"/>
<text x="400" y="393" class="b c">4. Divulgation publique : dernier recours</text><rect x="650" y="114" width="130" height="142" rx="8" class="or"/>
<text x="715" y="158.5" class="b c">Protection</text>
<text x="715" y="179.5" class="c">Bonne foi</text>
<text x="715" y="200.5" class="c">Faits précis</text>
<text x="715" y="221.5" class="c">Confidentialité</text><rect x="30" y="428" width="740" height="52" rx="8" class="or"/>
<text x="400" y="449" class="c">Une dénonciation calomnieuse est une infraction. Le dispositif national de protection</text>
<text x="400" y="469" class="c">exact est à faire confirmer par la hiérarchie ou la direction juridique.</text>
</svg>
