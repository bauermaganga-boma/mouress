<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Plan type d'un rapport administratif : page de garde, résumé, sommaire, introduction, développement (faits, analyse, recommandations), conclusion, annexes.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Plan type d’un rapport administratif</text>
<rect x="24" y="62" width="161" height="112" rx="8" class="bl"/>
<text x="104.5" y="86" class="c b">1. Page de garde</text>
<text x="104.5" y="108" class="c">Titre, auteur, date</text>
<rect x="221" y="62" width="161" height="112" rx="8" class="wh"/>
<text x="301.5" y="86" class="c b">2. Résumé</text>
<text x="301.5" y="108" class="c">L’essentiel en</text>
<text x="301.5" y="126" class="c">tête, pour un</text>
<text x="301.5" y="144" class="c">lecteur pressé</text>
<rect x="418" y="62" width="161" height="112" rx="8" class="bl"/>
<text x="498.5" y="86" class="c b">3. Sommaire</text>
<text x="498.5" y="108" class="c">Parties et pages</text>
<rect x="615" y="62" width="161" height="112" rx="8" class="wh"/>
<text x="695.5" y="86" class="c b">4. Introduction</text>
<text x="695.5" y="108" class="c">Contexte, objet,</text>
<text x="695.5" y="126" class="c">méthode</text>
<rect x="24" y="214" width="161" height="166" rx="8" class="or"/>
<text x="104.5" y="238" class="c b">5. Développement</text>
<text x="104.5" y="260" class="c">Faits constatés,</text>
<text x="104.5" y="278" class="c">analyse,</text>
<text x="104.5" y="296" class="c">recommandations</text>
<text x="104.5" y="314" class="c">(action,</text>
<text x="104.5" y="332" class="c">responsable,</text>
<text x="104.5" y="350" class="c">échéance)</text>
<rect x="221" y="214" width="161" height="166" rx="8" class="wh"/>
<text x="301.5" y="238" class="c b">6. Conclusion</text>
<text x="301.5" y="260" class="c">Ce qu’il faut</text>
<text x="301.5" y="278" class="c">retenir et les</text>
<text x="301.5" y="296" class="c">suites</text>
<rect x="418" y="214" width="161" height="166" rx="8" class="or"/>
<text x="498.5" y="238" class="c b">7. Annexes</text>
<text x="498.5" y="260" class="c">Documents sources,</text>
<text x="498.5" y="278" class="c">données détaillées,</text>
<text x="498.5" y="296" class="c">personnes</text>
<text x="498.5" y="314" class="c">rencontrées</text>
<path d="M187,118H218" class="ln" marker-end="url(#ar)"/>
<path d="M384,118H415" class="ln" marker-end="url(#ar)"/>
<path d="M581,118H612" class="ln" marker-end="url(#ar)"/>
<path d="M695.5,176V194H104.5V211" class="ln" marker-end="url(#ar)"/>
<path d="M187,297H218" class="ln" marker-end="url(#ar)"/>
<path d="M384,297H415" class="ln" marker-end="url(#ar)"/>
<text x="400" y="420" class="c">Un rapport sépare toujours les faits, l’analyse et les recommandations.</text>
</svg>
