<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Circuit du courrier : arrivée, enregistrement, imputation, traitement, départ, archivage, avec suivi par un échéancier</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Circuit du courrier, de l'arrivée à l'archivage</text>
<rect x="25" y="55" width="230" height="140" rx="8" class="bl"/>
<text x="140" y="92" class="c b">1. Arrivée</text>
<text x="140" y="111" class="c">Réception contre décharge</text>
<text x="140" y="130" class="c">Tri : ordinaire, urgent,</text>
<text x="140" y="149" class="c">confidentiel (pli fermé)</text>
<text x="140" y="168" class="c">Cachet et pièces vérifiées</text>
<rect x="285" y="55" width="230" height="140" rx="8" class="bl"/>
<text x="400" y="92" class="c b">2. Enregistrement</text>
<text x="400" y="111" class="c">Registre d'arrivée :</text>
<text x="400" y="130" class="c">numéro d'ordre, date,</text>
<text x="400" y="149" class="c">expéditeur, objet</text>
<text x="400" y="168" class="c">Preuve de la date de réception</text>
<rect x="545" y="55" width="230" height="140" rx="8" class="bl"/>
<text x="660" y="92" class="c b">3. Imputation</text>
<text x="660" y="111" class="c">Présentation à l'autorité</text>
<text x="660" y="130" class="c">Un responsable unique,</text>
<text x="660" y="149" class="c">une action, un délai</text>
<text x="660" y="168" class="c">puis distribution (décharge)</text>
<rect x="545" y="235" width="230" height="140" rx="8" class="gr"/>
<text x="660" y="272" class="c b">4. Traitement</text>
<text x="660" y="291" class="c">Projet de réponse</text>
<text x="660" y="310" class="c">Visa de la hiérarchie</text>
<text x="660" y="329" class="c">Signature de l'autorité</text>
<text x="660" y="348" class="c">compétente</text>
<rect x="285" y="235" width="230" height="140" rx="8" class="gr"/>
<text x="400" y="272" class="c b">5. Départ</text>
<text x="400" y="291" class="c">Enregistrement au départ</text>
<text x="400" y="310" class="c">Copie gardée au dossier</text>
<text x="400" y="329" class="c">Envoi : main propre,</text>
<text x="400" y="348" class="c">recommandé ou courriel</text>
<rect x="25" y="235" width="230" height="140" rx="8" class="gr"/>
<text x="140" y="272" class="c b">6. Archivage</text>
<text x="140" y="291" class="c">Classement au dossier</text>
<text x="140" y="310" class="c">de l'affaire</text>
<text x="140" y="329" class="c">Conservation selon le</text>
<text x="140" y="348" class="c">tableau de gestion</text>
<path d="M257,125H282" class="nv" marker-end="url(#ar)"/>
<path d="M517,125H542" class="nv" marker-end="url(#ar)"/>
<path d="M660,197V233" class="nv" marker-end="url(#ar)"/>
<path d="M543,305H518" class="nv" marker-end="url(#ar)"/>
<path d="M283,305H258" class="nv" marker-end="url(#ar)"/>
<rect x="25" y="395" width="750" height="62" rx="8" class="or"/>
<text x="40" y="420" class="b">Suivi : l'échéancier liste les courriers en attente de réponse avec leur date limite ;</text>
<text x="40" y="442">le secrétariat relance les agents en retard et alerte le chef de service.</text>
<text x="400" y="483" class="c n">Exemple : lettre reçue le 8, enregistrée n° 112, imputée avec délai, réponse au départ n° 087, classée.</text>

</svg>
