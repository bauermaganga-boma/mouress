<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Pyramide de Bird, ratio 1-10-30-600 : 1 accident grave, 10 accidents avec lésions légères, 30 accidents avec dommages matériels, 600 incidents ou presque-accidents</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}
.p{stroke:#061F44;stroke-width:2.5;stroke-linejoin:round}
.n{font-size:28px;font-weight:700;text-anchor:middle}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Pyramide de Bird (ratio 1 - 10 - 30 - 600)</text>

<path class="p" d="M250,90 L297.7,165 L202.3,165 Z" fill="#D64545"/>
<path class="p" d="M202.3,165 L297.7,165 L348.6,245 L151.4,245 Z" fill="#F28C28"/>
<path class="p" d="M151.4,245 L348.6,245 L402.7,330 L97.3,330 Z" fill="#FFB766"/>
<path class="p" d="M97.3,330 L402.7,330 L460,420 L40,420 Z" fill="#DCE6F5"/>

<text class="n" x="250" y="150" style="fill:#FFFFFF">1</text>
<text class="n" x="250" y="216">10</text>
<text class="n" x="250" y="298">30</text>
<text class="n" x="250" y="382">600</text>

<g stroke="#061F44" stroke-width="1.5" stroke-dasharray="3 4">
<line x1="282" y1="128" x2="488" y2="128"/><line x1="326" y1="205" x2="488" y2="205"/><line x1="378" y1="288" x2="488" y2="288"/><line x1="434" y1="375" x2="488" y2="375"/>
</g>
<text class="b" x="500" y="124">1 accident grave ou invalidant</text><text x="500" y="143">(blessure grave, décès)</text>
<text class="b" x="500" y="201">10 accidents avec lésions légères</text><text x="500" y="220">(soins ou arrêt de travail)</text>
<text class="b" x="500" y="284">30 accidents avec dégâts</text><text x="500" y="303">matériels (équipements, produits)</text>
<text class="b" x="500" y="371">600 presque-accidents</text><text x="500" y="390">incidents sans lésion ni dommage</text>

<text class="m" x="400" y="456">Agir sur la base (presque-accidents, situations dangereuses)</text>
<text class="m" x="400" y="476">réduit le nombre d'accidents graves au sommet.</text>
</svg>
