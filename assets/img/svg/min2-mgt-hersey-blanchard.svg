<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les quatre styles de leadership situationnel de Hersey et Blanchard, selon la maturité de l'agent : 1 directif (consignes nombreuses, soutien faible) pour un débutant motivé mais peu compétent ; 2 persuasif (consignes et soutien élevés) pour un agent dont la motivation baisse ; 3 participatif (peu de consignes, soutien élevé) pour un agent compétent mais hésitant ; 4 délégatif (peu de consignes, peu de soutien) pour un agent compétent et motivé. Le style s'adapte à chaque agent.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.w{fill:#FFFFFF;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Leadership situationnel : adapter son style à l'agent</text>
<rect x="30" y="60" width="170" height="290" rx="8" class="bl"/>
<rect x="30" y="60" width="170" height="42" rx="8" fill="#061F44"/><rect x="30" y="88" width="170" height="14" fill="#061F44"/>
<text x="115" y="88" class="w c">1. Directif</text>
<text x="42" y="128" class="b">Consignes</text>
<rect x="42" y="136" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="42" y="136" width="146" height="14" fill="#F28C28"/>
<text x="42" y="176" class="b">Soutien</text>
<rect x="42" y="184" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="42" y="184" width="44" height="14" fill="#F28C28"/>
<text x="42" y="226" class="o">Agent concerné :</text>
<text x="42" y="246">Débutant : motivé</text>
<text x="42" y="264">mais peu compétent</text>
<text x="42" y="296" class="o">Geste du cadre :</text>
<text x="42" y="316">Dire quoi faire et</text>
<text x="42" y="334">comment</text>
<rect x="225" y="60" width="170" height="290" rx="8" class="bl"/>
<rect x="225" y="60" width="170" height="42" rx="8" fill="#061F44"/><rect x="225" y="88" width="170" height="14" fill="#061F44"/>
<text x="310" y="88" class="w c">2. Persuasif</text>
<text x="237" y="128" class="b">Consignes</text>
<rect x="237" y="136" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="237" y="136" width="146" height="14" fill="#F28C28"/>
<text x="237" y="176" class="b">Soutien</text>
<rect x="237" y="184" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="237" y="184" width="146" height="14" fill="#F28C28"/>
<text x="237" y="226" class="o">Agent concerné :</text>
<text x="237" y="246">A progressé,</text>
<text x="237" y="264">motivation en baisse</text>
<text x="237" y="296" class="o">Geste du cadre :</text>
<text x="237" y="316">Expliquer et</text>
<text x="237" y="334">encourager</text>
<rect x="420" y="60" width="170" height="290" rx="8" class="bl"/>
<rect x="420" y="60" width="170" height="42" rx="8" fill="#061F44"/><rect x="420" y="88" width="170" height="14" fill="#061F44"/>
<text x="505" y="88" class="w c">3. Participatif</text>
<text x="432" y="128" class="b">Consignes</text>
<rect x="432" y="136" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="432" y="136" width="44" height="14" fill="#F28C28"/>
<text x="432" y="176" class="b">Soutien</text>
<rect x="432" y="184" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="432" y="184" width="146" height="14" fill="#F28C28"/>
<text x="432" y="226" class="o">Agent concerné :</text>
<text x="432" y="246">Compétent mais</text>
<text x="432" y="264">hésitant</text>
<text x="432" y="296" class="o">Geste du cadre :</text>
<text x="432" y="316">Consulter, décider</text>
<text x="432" y="334">ensemble</text>
<rect x="615" y="60" width="170" height="290" rx="8" class="bl"/>
<rect x="615" y="60" width="170" height="42" rx="8" fill="#061F44"/><rect x="615" y="88" width="170" height="14" fill="#061F44"/>
<text x="700" y="88" class="w c">4. Délégatif</text>
<text x="627" y="128" class="b">Consignes</text>
<rect x="627" y="136" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="627" y="136" width="44" height="14" fill="#F28C28"/>
<text x="627" y="176" class="b">Soutien</text>
<rect x="627" y="184" width="146" height="14" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/><rect x="627" y="184" width="44" height="14" fill="#F28C28"/>
<text x="627" y="226" class="o">Agent concerné :</text>
<text x="627" y="246">Compétent et motivé</text>
<text x="627" y="296" class="o">Geste du cadre :</text>
<text x="627" y="316">Confier et contrôler</text>
<text x="627" y="334">à distance</text>
<line x1="30" y1="385" x2="770" y2="385" stroke="#F28C28" stroke-width="4" marker-end="url(#ao)"/>
<text x="400" y="415" class="b c">Maturité de l'agent (compétence + motivation) : croissante</text>
<text x="400" y="455" class="c">Le bon style dépend de chaque agent et de chaque tâche :</text>
<text x="400" y="477" class="c">le danger est d'appliquer le même style à tous.</text>
</svg>
