<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Du bénéfice au dividende, exemple fictif : bénéfice de 10 milliards de FCFA, prélèvement d'au moins un dixième pour la réserve légale soit 1 milliard, dividende voté de 3 milliards dont 60 % pour l'État soit 1,8 milliard et 40 % pour les minoritaires soit 1,2 milliard ; chaîne de participations : l'État détient 100 % de la GOC qui détient 71 % d'une filiale, le dividende remonte par la GOC dont les organes décident de ce qui revient à l'État</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.t13{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2}
.wh{fill:#FFFFFF;stroke:#F28C28;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.da{fill:none;stroke:#F28C28;stroke-width:3;stroke-dasharray:8 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Du bénéfice au dividende (exemple fictif)</text>
<text x="400" y="48" class="c t13">Montants en milliards de FCFA, pour illustrer le mécanisme : ils n'ont aucune valeur réelle</text>

<rect x="30" y="64" width="360" height="52" rx="6" class="bl"/>
<text x="210" y="86" class="c b">Bénéfice de l'exercice : 10</text>
<text x="210" y="104" class="c t13">comptes approuvés par l'assemblée</text>
<path d="M210,116V138" class="nv" marker-end="url(#ar)"/>
<rect x="30" y="140" width="360" height="52" rx="6" class="gr"/>
<text x="210" y="162" class="c b">Réserve légale : au moins 10 % = 1</text>
<text x="210" y="180" class="c t13">jusqu'à un cinquième du capital</text>
<path d="M210,192V214" class="nv" marker-end="url(#ar)"/>
<rect x="30" y="216" width="360" height="52" rx="6" class="bl"/>
<text x="210" y="238" class="c b">Dividende voté en assemblée : 3</text>
<text x="210" y="256" class="c t13">seulement sur un bénéfice distribuable</text>
<path d="M130,268V300" class="nv" marker-end="url(#ar)"/>
<path d="M320,268V300" class="nv" marker-end="url(#ar)"/>
<rect x="30" y="302" width="200" height="60" rx="6" class="wh"/>
<text x="130" y="326" class="c o">État : 60 % de 3</text>
<text x="130" y="346" class="c b">= 1,8</text>
<rect x="250" y="302" width="140" height="60" rx="6" class="gr"/>
<text x="320" y="326" class="c b">Minoritaires</text>
<text x="320" y="346" class="c t13">40 % de 3 = 1,2</text>

<line x1="410" y1="64" x2="410" y2="370" stroke="#061F44" stroke-width="1.5" stroke-dasharray="4 4"/>

<text x="595" y="80" class="c b">Chaîne de participations</text>
<text x="595" y="98" class="c t13">exemple, chiffres de presse à confirmer</text>
<rect x="500" y="112" width="190" height="44" rx="6" class="bl"/>
<text x="595" y="140" class="c b">État</text>
<path d="M595,156V184" class="nv"/>
<text x="607" y="176" class="t13">détient 100 %</text>
<rect x="500" y="186" width="190" height="44" rx="6" class="gr"/>
<text x="595" y="214" class="c b">GOC (société nationale)</text>
<path d="M595,230V258" class="nv"/>
<text x="607" y="250" class="t13">détient 71 %</text>
<rect x="500" y="260" width="190" height="44" rx="6" class="bl"/>
<text x="595" y="288" class="c b">Filiale (vote un dividende)</text>
<path d="M692,282H712V208H692" class="da" marker-end="url(#ao)"/>
<text x="722" y="250" class="t13">au prorata</text>
<path d="M498,208H476V134H498" class="da" marker-end="url(#ao)"/>
<text x="468" y="164" class="t13 e">la GOC</text>
<text x="468" y="182" class="t13 e">décide</text>
<text x="595" y="332" class="c t13">Le dividende suit la chaîne : la filiale paie ses</text>
<text x="595" y="350" class="c t13">actionnaires au prorata, puis la GOC décide.</text>
<rect x="30" y="396" width="740" height="64" rx="6" fill="#FFFFFF" stroke="#F28C28" stroke-width="2"/>
<text x="400" y="420" class="c t13">En cas de perte, pas de dividende : on ne distribue pas le capital. Le ministre ne fixe pas le dividende par courrier,</text>
<text x="400" y="440" class="c t13">c'est l'assemblée générale qui vote, sur proposition du conseil d'administration.</text>
</svg>
