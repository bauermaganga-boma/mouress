<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">ITIE : les entreprises déclarent les paiements versés à l'État, l'État déclare les recettes reçues ; le rapport rapproche les deux déclarations, explique et documente les écarts, puis est publié ; le groupe multipartite réunit gouvernement, entreprises et société civile</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">ITIE : le rapprochement des déclarations</text>
<rect x="180" y="48" width="440" height="76" rx="6" class="bl"/>
<path d="M180,78V54Q180,48 186,48H614Q620,48 620,54V78z" class="nvf"/>
<text x="400" y="68" class="w c">GROUPE MULTIPARTITE</text>
<text x="190" y="100" class="t13">Gouvernement, entreprises et société civile</text>
<rect x="20" y="170" width="250" height="100" rx="6" class="bl"/>
<path d="M20,202V176Q20,170 26,170H264Q270,170 270,176V202z" class="nvf"/>
<text x="145" y="190" class="w c">ENTREPRISES</text>
<text x="30" y="224">Déclarent les paiements versés</text>
<text x="30" y="242">à l'État</text>
<rect x="530" y="170" width="250" height="100" rx="6" class="bl"/>
<path d="M530,202V176Q530,170 536,170H774Q780,170 780,176V202z" class="nvf"/>
<text x="655" y="190" class="w c">ADMINISTRATIONS DE L'ÉTAT</text>
<text x="540" y="224">Déclarent les recettes reçues</text>
<rect x="290" y="170" width="220" height="112" rx="6" class="bl"/>
<path d="M290,202V176Q290,170 296,170H504Q510,170 510,176V202z" class="nvf"/>
<text x="400" y="190" class="w c">RAPPORT ITIE</text>
<text x="300" y="224">Rapprochement</text>
<text x="300" y="242">(réconciliation) des deux</text>
<text x="300" y="260">déclarations</text>
<path d="M272,220H288" class="or" marker-end="url(#ao)"/>
<path d="M528,220H512" class="or" marker-end="url(#ao)"/>
<path d="M400,126V168" class="nv" marker-end="url(#ar)"/>
<rect x="20" y="316" width="360" height="108" rx="6" class="gr"/>
<path d="M20,348V322Q20,316 26,316H374Q380,316 380,322V348z" class="nvf"/>
<text x="200" y="336" class="w c">ÉCART</text>
<text x="30" y="370">Paiements déclarés par l'entreprise moins</text>
<text x="30" y="388">recettes déclarées par l'État</text>
<rect x="420" y="316" width="360" height="108" rx="6" class="gr"/>
<path d="M420,348V322Q420,316 426,316H774Q780,316 780,322V348z" class="nvf"/>
<text x="600" y="336" class="w c">TRAITEMENT</text>
<text x="430" y="370" class="t13">Écart examiné et documenté (calendrier, périmètre,</text>
<text x="430" y="387" class="t13">erreur de saisie) : il n'est pas présumé</text>
<text x="430" y="404" class="t13">frauduleux</text>
<path d="M400,284V300H200V314" class="nv" marker-end="url(#ar)"/>
<path d="M382,366H418" class="or" marker-end="url(#ao)"/>
<rect x="20" y="436" width="760" height="40" rx="6" class="bl"/><text x="400" y="462" class="c b">Le rapport est rendu public</text>
</svg>
