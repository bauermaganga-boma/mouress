<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Ensemble de contrôle câble (wireline) : arbre de Noël avec vanne maîtresse, vanne latérale et vanne de curage (swab), BOP wireline à mâchoires câble, lubricateur en sections, presse-étoupe (stuffing box) avec graisseur, poulie, câble venant du treuil et outil en fond de puits</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.of{fill:#F28C28;stroke:#061F44;stroke-width:2}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
<g id="vm"><path d="M-17,-13V13L0,0ZM17,-13V13L0,0Z" class="wh"/><path d="M0,0V-20M-8,-20H8" class="ld"/></g>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Ensemble de contrôle câble (wireline)</text>

<!-- corps de l'ensemble -->
<rect x="310" y="98" width="40" height="38" class="gr"/>
<rect x="314" y="136" width="32" height="75" class="gr"/>
<rect x="308" y="211" width="44" height="10" class="bl"/>
<rect x="314" y="221" width="32" height="64" class="gr"/>
<rect x="308" y="285" width="44" height="10" class="bl"/>
<rect x="300" y="296" width="60" height="30" class="gr"/>
<rect x="270" y="303" width="30" height="16" class="bl"/><rect x="360" y="303" width="30" height="16" class="bl"/>
<rect x="314" y="326" width="32" height="16" class="gr"/>
<rect x="310" y="342" width="40" height="28" class="gr"/>
<rect x="310" y="378" width="40" height="28" class="gr"/>
<rect x="310" y="410" width="40" height="28" class="gr"/>
<rect x="314" y="438" width="32" height="57" class="gr"/>
<rect x="314" y="370" width="32" height="8" class="gr"/><rect x="314" y="406" width="32" height="4" class="gr"/>
<!-- alésage -->
<rect x="322" y="98" width="16" height="397" fill="#FCFBF8"/>
<!-- mâchoires câble -->
<rect x="318" y="303" width="8" height="16" class="of"/><rect x="334" y="303" width="8" height="16" class="of"/>
<!-- presse-étoupe garniture -->
<rect x="322" y="110" width="16" height="12" class="of"/>
<!-- poignées de vannes -->
<path d="M310,356H294M294,348V364M310,424H294M294,416V432" class="ld"/>
<!-- ligne de production -->
<path d="M350,392H560" fill="none" stroke="#061F44" stroke-width="12"/><path d="M350,392H560" fill="none" stroke="#E8EAEE" stroke-width="7"/>
<path d="M360,392H550" class="or" style="stroke-width:3" marker-end="url(#ao)"/>
<use href="#vm" x="430" y="392"/>
<!-- outil et câble -->
<rect x="324" y="457" width="12" height="28" class="of"/>
<path d="M330,457V470" class="ld"/>
<path d="M780,58H352A22,22 0 0 0 330,80V457" fill="none" stroke="#061F44" stroke-width="2.5"/>
<circle cx="352" cy="80" r="22" class="wh"/><circle cx="352" cy="80" r="4" fill="#061F44"/>
<path d="M780,58H352A22,22 0 0 0 330,80V457" fill="none" stroke="#061F44" stroke-width="2.5"/>
<path d="M500,58H600" class="or" style="stroke-width:3" marker-end="url(#ao)"/>
<!-- pression du puits -->
<path d="M342,490V445" class="or" style="stroke-width:3" marker-end="url(#ao)"/>

<!-- libellés gauche -->
<text x="20" y="108">Graisseur (injection</text><text x="20" y="124">de graisse)</text>
<path d="M175,118H308" class="ld"/>
<text x="296" y="247" class="e">Câble</text><path d="M300,243H328" class="ld"/>
<text x="20" y="372" class="b">Arbre de Noël</text>
<text x="284" y="428" class="e">Vanne maîtresse (master valve)</text>
<text x="290" y="474" class="e">Outil en fond de puits</text><path d="M294,470H322" class="ld"/>

<!-- libellés droite -->
<text x="395" y="95">Poulie (sheave)</text>
<text x="395" y="122" class="b">Presse-étoupe (stuffing box)</text><path d="M350,118H390" class="ld"/>
<text x="395" y="215" class="b">Lubricateur</text><text x="395" y="231">(sections vissées)</text><path d="M346,216H390" class="ld"/>
<text x="400" y="305" class="b">BOP wireline</text><text x="400" y="321">(mâchoires câble)</text>
<text x="395" y="360" class="b">Vanne de curage (swab valve)</text><path d="M350,356H390" class="ld"/>
<text x="462" y="382">Ligne de production</text>
<text x="400" y="420">Vanne latérale (wing valve)</text>
<text x="355" y="482">Pression du puits</text>
<text x="780" y="46" class="e">Câble vers le treuil</text>
</svg>
