<path d="M216,250V333" class="nv" marker-end="url(#ar)"/>
<rect x="170" y="335" width="190" height="80" rx="30" class="bl"/><text x="265" y="372" class="c b">Cuve de gasoil</text><text x="265" y="391" class="c n">(enterrée)</text>
<rect x="400" y="335" width="190" height="80" rx="30" class="bl"/><text x="495" y="372" class="c b">Cuve de super</text><text x="495" y="391" class="c n">(enterrée)</text>
<path d="M330,335V150M560,335V150" class="s"/><path d="M322,150H338M552,150H568" class="s"/>
<text x="330" y="140" class="c n">Évent</text><text x="560" y="140" class="c n">Évent</text>
<path d="M590,380H660V254" class="nv" marker-end="url(#ar)"/>
<text x="594" y="402" class="n">Canalisation</text><text x="594" y="418" class="n">vers la pompe</text>
<path d="M625,140H780" class="s"/><text x="705" y="130" class="c n">Auvent</text>
<rect x="640" y="170" width="40" height="80" class="bl"/><rect x="730" y="170" width="40" height="80" class="bl"/>
<text x="660" y="164" class="c n">Pompe</text><text x="750" y="164" class="c n">Pompe</text>
<path d="M705,252V335" class="nv" marker-end="url(#ar)"/><text x="712" y="295" class="n">Eaux de</text><text x="712" y="311" class="n">ruissellement</text>
<rect x="676" y="338" width="104" height="64" class="gr"/><text x="728" y="365" class="c n">Séparateur</text><text x="728" y="383" class="c n">d'hydrocarbures</text>
<rect x="438" y="200" width="30" height="46" fill="#F28C28" stroke="#061F44" stroke-width="2"/><text x="470" y="180" class="c n">Coupure d'urgence</text>
