<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Frise des repères internationaux du Gabon : création de l’OPEP en 1960, adhésion en 1975, APPO en 1987, fin de l’adhésion à l’OPEP en 1995, retour le 1er juillet 2016 ; CIRDI 1965-1966, ITIE 2007, radiation en février 2013, Accord de Paris signé le 22 avril 2016 et ratifié le 2 novembre 2016, arrangement du FMI le 28 juillet 2021, candidature ITIE approuvée le 21 octobre 2021, validation ITIE le 13 mars 2025</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold;text-anchor:middle}
.t13{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:1.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:1.5}
.ax{stroke:#F28C28;stroke-width:5}
.ld{stroke:#061F44;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Repères internationaux du Gabon (frise)</text>
<text x="400" y="48" class="c t13">Dans l’ordre chronologique dans chaque voie ; intervalles de temps non à l’échelle</text>
<text x="30" y="72" class="b">Pétrole et coopération entre producteurs</text>
<line x1="30" y1="250" x2="770" y2="250" class="ax"/>
<text x="30" y="272" class="b">Transparence, climat, finance et différends</text>
<rect x="20" y="82" width="140" height="124" rx="6" class="bl"/>
<line x1="90" y1="206" x2="90" y2="250" class="ld"/>
<text x="90" y="102" class="o">1960</text>
<text x="90" y="124" class="c t13">Bagdad : création</text>
<text x="90" y="140" class="c t13">de l’OPEP par</text>
<text x="90" y="156" class="c t13">cinq pays</text>
<text x="90" y="172" class="c t13">(siège à Vienne</text>
<text x="90" y="188" class="c t13">depuis 1965)</text>
<rect x="175" y="130" width="140" height="76" rx="6" class="gr"/>
<line x1="245" y1="206" x2="245" y2="250" class="ld"/>
<text x="245" y="150" class="o">1975</text>
<text x="245" y="172" class="c t13">Le Gabon devient</text>
<text x="245" y="188" class="c t13">membre de l’OPEP</text>
<rect x="330" y="98" width="140" height="108" rx="6" class="bl"/>
<line x1="400" y1="206" x2="400" y2="250" class="ld"/>
<text x="400" y="118" class="o">1987</text>
<text x="400" y="140" class="c t13">Naissance de</text>
<text x="400" y="156" class="c t13">l’APPO à Lagos :</text>
<text x="400" y="172" class="c t13">le Gabon est</text>
<text x="400" y="188" class="c t13">membre fondateur</text>
<rect x="485" y="114" width="140" height="92" rx="6" class="gr"/>
<line x1="555" y1="206" x2="555" y2="250" class="ld"/>
<text x="555" y="134" class="o">1995</text>
<text x="555" y="156" class="c t13">Fin de</text>
<text x="555" y="172" class="c t13">l’adhésion du</text>
<text x="555" y="188" class="c t13">Gabon à l’OPEP</text>
<rect x="640" y="130" width="140" height="76" rx="6" class="bl"/>
<line x1="710" y1="206" x2="710" y2="250" class="ld"/>
<text x="710" y="150" class="o">1er juil. 2016</text>
<text x="710" y="172" class="c t13">Retour du Gabon</text>
<text x="710" y="188" class="c t13">dans l’OPEP</text>
<line x1="70" y1="250" x2="70" y2="292" class="ld"/>
<rect x="19" y="292" width="102" height="136" rx="6" class="bl"/>
<text x="70" y="310" class="o t13">1965-1966</text>
<text x="70" y="330" class="c t13">CIRDI :</text>
<text x="70" y="346" class="c t13">signé le</text>
<text x="70" y="362" class="c t13">21 sept. 1965,</text>
<text x="70" y="378" class="c t13">en vigueur pour</text>
<text x="70" y="394" class="c t13">le Gabon le</text>
<text x="70" y="410" class="c t13">14 oct. 1966</text>
<line x1="180" y1="250" x2="180" y2="292" class="ld"/>
<rect x="129" y="292" width="102" height="88" rx="6" class="gr"/>
<text x="180" y="310" class="o t13">2007</text>
<text x="180" y="330" class="c t13">Le Gabon</text>
<text x="180" y="346" class="c t13">rejoint</text>
<text x="180" y="362" class="c t13">l’ITIE</text>
<line x1="290" y1="250" x2="290" y2="292" class="ld"/>
<rect x="239" y="292" width="102" height="72" rx="6" class="bl"/>
<text x="290" y="310" class="o t13">Fév. 2013</text>
<text x="290" y="330" class="c t13">Radiation</text>
<text x="290" y="346" class="c t13">de l’ITIE</text>
<line x1="400" y1="250" x2="400" y2="292" class="ld"/>
<rect x="349" y="292" width="102" height="120" rx="6" class="gr"/>
<text x="400" y="310" class="o t13">2016</text>
<text x="400" y="330" class="c t13">Accord de</text>
<text x="400" y="346" class="c t13">Paris : signé</text>
<text x="400" y="362" class="c t13">le 22 avril,</text>
<text x="400" y="378" class="c t13">ratifié le</text>
<text x="400" y="394" class="c t13">2 novembre</text>
<line x1="510" y1="250" x2="510" y2="292" class="ld"/>
<rect x="459" y="292" width="102" height="104" rx="6" class="bl"/>
<text x="510" y="310" class="o t13">28 juil. 2021</text>
<text x="510" y="330" class="c t13">FMI :</text>
<text x="510" y="346" class="c t13">arrangement</text>
<text x="510" y="362" class="c t13">élargi de 388,8</text>
<text x="510" y="378" class="c t13">millions de DTS</text>
<line x1="620" y1="250" x2="620" y2="292" class="ld"/>
<rect x="569" y="292" width="102" height="104" rx="6" class="gr"/>
<text x="620" y="310" class="o t13">21 oct. 2021</text>
<text x="620" y="330" class="c t13">ITIE :</text>
<text x="620" y="346" class="c t13">nouvelle</text>
<text x="620" y="362" class="c t13">candidature</text>
<text x="620" y="378" class="c t13">approuvée</text>
<line x1="730" y1="250" x2="730" y2="292" class="ld"/>
<rect x="679" y="292" width="102" height="120" rx="6" class="bl"/>
<text x="730" y="310" class="o t13">13 mars 2025</text>
<text x="730" y="330" class="c t13">ITIE : première</text>
<text x="730" y="346" class="c t13">validation,</text>
<text x="730" y="362" class="c t13">73,5 sur 100</text>
<text x="730" y="378" class="c t13">(chiffre de</text>
<text x="730" y="394" class="c t13">presse)</text>
<text x="400" y="480" class="c t13">Dates tirées des fiches officielles et de la presse citées dans le cours : à confirmer auprès des institutions.</text>
</svg>
