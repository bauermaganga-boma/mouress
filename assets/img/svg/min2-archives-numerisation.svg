<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne de numérisation à valeur probante : préparer, numériser, contrôler, nommer et classer, empreinte et journal, décider du sort de l'original.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Numérisation à valeur probante</text>
<rect x="24" y="58" width="221" height="94" rx="8" class="bl"/>
<text x="134.5" y="82" class="c b">1. Préparer</text>
<text x="134.5" y="104" class="c">Retirer agrafes, trier,</text>
<text x="134.5" y="122" class="c">vérifier l’ordre des pages</text>
<rect x="289" y="58" width="221" height="94" rx="8" class="wh"/>
<text x="399.5" y="82" class="c b">2. Numériser</text>
<text x="399.5" y="104" class="c">Résolution suffisante pour</text>
<text x="399.5" y="122" class="c">lire tous les détails</text>
<rect x="554" y="58" width="221" height="94" rx="8" class="or"/>
<text x="664.5" y="82" class="c b">3. Contrôler la qualité</text>
<text x="664.5" y="104" class="c">Lisibilité, complétude,</text>
<text x="664.5" y="122" class="c">nombre de pages</text>
<rect x="24" y="200" width="221" height="112" rx="8" class="wh"/>
<text x="134.5" y="224" class="c b">4. Nommer et classer</text>
<text x="134.5" y="246" class="c">Format durable (PDF/A) et</text>
<text x="134.5" y="264" class="c">plan de classement</text>
<rect x="289" y="200" width="221" height="112" rx="8" class="or"/>
<text x="399.5" y="224" class="c b">5. Empreinte et journal</text>
<text x="399.5" y="246" class="c">Empreinte numérique</text>
<text x="399.5" y="264" class="c">(SHA-256) et journal des</text>
<text x="399.5" y="282" class="c">opérations</text>
<rect x="554" y="200" width="221" height="112" rx="8" class="wh"/>
<text x="664.5" y="224" class="c b">6. Sort de l’original</text>
<text x="664.5" y="246" class="c">Décidé selon la règle de</text>
<text x="664.5" y="264" class="c">conservation, jamais</text>
<text x="664.5" y="282" class="c">automatiquement</text>
<path d="M247,105H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,105H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,154V176H134.5V197" class="ln" marker-end="url(#ar)"/>
<path d="M247,256H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,256H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="440" class="c">Une copie est crédible si le procédé est documenté, contrôlé et tracé.</text>
<text x="400" y="460" class="c">Intégrité, authenticité et lisibilité fondent la valeur probante.</text>
</svg>
