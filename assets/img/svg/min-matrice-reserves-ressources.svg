<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Classification des ressources et réserves pétrolières (PRMS) : lignes production, réserves, ressources contingentes, ressources prospectives et quantités non récupérables ; colonnes estimation basse, meilleure estimation et estimation haute ; réserves 1P, 2P, 3P ; ressources contingentes 1C, 2C, 3C ; incertitude croissante vers la droite et maturité croissante vers le haut</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#B85C0A"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Classification des ressources et des réserves</text>
<text x="330" y="92" class="c b">Estimation basse</text>
<text x="330" y="110" class="c">(P90, au moins 90 %)</text>
<text x="510" y="92" class="c b">Meilleure estimation</text>
<text x="510" y="110" class="c">(P50, au moins 50 %)</text>
<text x="690" y="92" class="c b">Estimation haute</text>
<text x="690" y="110" class="c">(P10, au moins 10 %)</text>
<path d="M240,56H770" stroke="#B85C0A" stroke-width="3.5" fill="none" marker-end="url(#ao)"/>
<text x="240" y="50" class="o" style="text-anchor:start">Incertitude croissante</text>
<rect x="78" y="122" width="154" height="42" fill="#FFFFFF" stroke="#061F44" stroke-width="2" />
<text x="155" y="139" class="c b">Production</text>
<text x="155" y="155" class="c">(déjà produite)</text>
<rect x="240" y="122" width="540" height="42" fill="#061F44" stroke="#061F44" stroke-width="2" />
<text x="510" y="148" class="c b" style="fill:#FFFFFF">Production commerciale (quantités déjà produites)</text>
<rect x="78" y="170" width="154" height="62" fill="#FFFFFF" stroke="#061F44" stroke-width="2" />
<text x="155" y="189" class="c b">Réserves</text>
<text x="155" y="205" class="c">commerciales,</text>
<text x="155" y="221" class="c">restant à produire</text>
<rect x="240" y="170" width="180" height="62" fill="#FFE3BF" stroke="#061F44" stroke-width="2" />
<text x="330" y="194" class="c b" style="font-size:18px">1P</text>
<text x="330" y="212" class="c">prouvées</text>
<text x="330" y="228" class="c">seules</text>
<rect x="420" y="170" width="180" height="62" fill="#FFE3BF" stroke="#061F44" stroke-width="2" />
<text x="510" y="194" class="c b" style="font-size:18px">2P</text>
<text x="510" y="212" class="c">prouvées</text>
<text x="510" y="228" class="c">+ probables</text>
<rect x="600" y="170" width="180" height="62" fill="#FFE3BF" stroke="#061F44" stroke-width="2" />
<text x="690" y="194" class="c b" style="font-size:18px">3P</text>
<text x="690" y="212" class="c">prouvées + probables</text>
<text x="690" y="228" class="c">+ possibles</text>
<rect x="78" y="238" width="154" height="62" fill="#FFFFFF" stroke="#061F44" stroke-width="2" />
<text x="155" y="257" class="c b">Ressources</text>
<text x="155" y="273" class="c">contingentes</text>
<text x="155" y="289" class="c">(non commerciales)</text>
<rect x="240" y="238" width="180" height="62" fill="#DCE6F5" stroke="#061F44" stroke-width="2" />
<text x="330" y="262" class="c b" style="font-size:18px">1C</text>
<text x="330" y="280" class="c">estimation</text>
<text x="330" y="296" class="c">basse</text>
<rect x="420" y="238" width="180" height="62" fill="#DCE6F5" stroke="#061F44" stroke-width="2" />
<text x="510" y="262" class="c b" style="font-size:18px">2C</text>
<text x="510" y="280" class="c">meilleure</text>
<text x="510" y="296" class="c">estimation</text>
<rect x="600" y="238" width="180" height="62" fill="#DCE6F5" stroke="#061F44" stroke-width="2" />
<text x="690" y="262" class="c b" style="font-size:18px">3C</text>
<text x="690" y="280" class="c">estimation</text>
<text x="690" y="296" class="c">haute</text>
<rect x="78" y="306" width="154" height="62" fill="#FFFFFF" stroke="#061F44" stroke-width="2" />
<text x="155" y="325" class="c b">Ressources</text>
<text x="155" y="341" class="c">prospectives</text>
<text x="155" y="357" class="c">(non découvertes)</text>
<rect x="240" y="306" width="180" height="62" fill="#E8EAEE" stroke="#061F44" stroke-width="2" />
<text x="330" y="330" class="c b" style="font-size:18px">Basse</text>
<text x="330" y="348" class="c">estimation</text>
<rect x="420" y="306" width="180" height="62" fill="#E8EAEE" stroke="#061F44" stroke-width="2" />
<text x="510" y="330" class="c b" style="font-size:18px">Meilleure</text>
<text x="510" y="348" class="c">estimation</text>
<rect x="600" y="306" width="180" height="62" fill="#E8EAEE" stroke="#061F44" stroke-width="2" />
<text x="690" y="330" class="c b" style="font-size:18px">Haute</text>
<text x="690" y="348" class="c">estimation</text>
<rect x="78" y="374" width="154" height="40" fill="#FFFFFF" stroke="#061F44" stroke-width="2" />
<text x="155" y="398" class="c b">Non récupérable</text>
<rect x="240" y="374" width="540" height="40" fill="#F1EDE3" stroke="#061F44" stroke-width="2" />
<text x="510" y="399" class="c b">Quantités en place jugées non récupérables</text>
<rect x="32" y="122" width="40" height="178" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text transform="translate(57,211) rotate(-90)" class="c b">Découvert</text>
<rect x="32" y="306" width="40" height="62" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text transform="translate(49,337) rotate(-90)" class="c b" style="font-size:13px">Non</text><text transform="translate(65,337) rotate(-90)" class="c b" style="font-size:13px">découvert</text>
<path d="M16,300V130" stroke="#B85C0A" stroke-width="3.5" fill="none" marker-end="url(#ao)"/>
<text x="400" y="442" class="c b">Plus on monte, plus le projet est mûr (chance de commercialité) ;</text>
<text x="400" y="462" class="c b">plus on va vers la droite, plus l'incertitude est grande. Source : PRMS (SPE, 2018).</text>
</svg>
