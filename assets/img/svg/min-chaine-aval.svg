<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne aval pétrolière : 1 raffinage ou importation, 2 stockage en dépôt, 3 transport par camion-citerne, cabotage ou oléoduc, 4 distribution par le distributeur puis la station-service, jusqu'au consommateur ; contrôles de quantité, de qualité et de stock minimum tout au long de la chaîne</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="30" class="h">La chaîne aval : de la raffinerie à la pompe</text>
<rect x="20" y="70" width="170" height="60" class="bl"/><text x="105" y="96" class="c b">1 Raffinage</text><text x="105" y="116" class="c n">(raffinerie nationale)</text>
<rect x="20" y="170" width="170" height="60" class="bl"/><text x="105" y="196" class="c b">1 Importation</text><text x="105" y="216" class="c n">(navire de produits)</text>
<path d="M190,100H212V150M190,200H212V150M212,150H238" class="nv" marker-end="url(#ar)"/>
<rect x="240" y="110" width="160" height="80" class="gr"/><text x="320" y="142" class="c b">2 Stockage</text><text x="320" y="164" class="c n">dépôt pétrolier</text>
<path d="M400,150H438" class="nv" marker-end="url(#ar)"/>
<rect x="440" y="95" width="170" height="110" class="gr"/><text x="525" y="126" class="c b">3 Transport</text><text x="525" y="148" class="c n">camion-citerne</text><text x="525" y="166" class="c n">cabotage (côte)</text><text x="525" y="184" class="c n">oléoduc</text>
<path d="M610,150H648" class="nv" marker-end="url(#ar)"/>
<rect x="650" y="95" width="130" height="110" class="gr"/><text x="715" y="126" class="c b">4 Distribution</text><text x="715" y="148" class="c n">distributeur,</text><text x="715" y="166" class="c n">puis station-</text><text x="715" y="184" class="c n">service</text>
<path d="M715,205V270" class="nv" marker-end="url(#ar)"/>
<rect x="640" y="272" width="150" height="56" class="bl"/><text x="715" y="305" class="c b">Consommateur</text>
<rect x="20" y="370" width="760" height="85" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="400" y="400" class="c b">Contrôles tout au long de la chaîne</text>
<text x="400" y="425" class="c">quantités (mesure à 15 °C) · qualité (spécifications) · stock minimum</text>
<text x="400" y="445" class="c n">Chaque maillon dépend du précédent : une rupture en amont se répercute jusqu'à la station.</text>

</svg>
