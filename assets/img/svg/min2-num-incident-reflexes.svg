<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les six réflexes face à un incident de sécurité, dans l'ordre : 1 ne pas paniquer et ne pas effacer les messages ou fichiers ; 2 isoler le poste en débranchant le câble réseau ou en coupant le Wi-Fi, sans l'éteindre brutalement ; 3 alerter le service informatique et la hiérarchie par un canal sûr en donnant l'heure, ce qui s'est passé et les actions déjà faites ; 4 ne pas réparer seul, ne pas répondre à l'attaquant, ne pas payer de rançon ; 5 noter les faits (expéditeur, capture d'écran, nom du fichier) ; 6 changer les mots de passe concernés depuis un appareil sain, sur indication de l'informatique.</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.nb{fill:#061F44}
.nt{fill:#FFFFFF;font-weight:bold;font-size:18px;text-anchor:middle}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Incident de sécurité : les six réflexes, dans l'ordre</text>

<!-- ligne 1 -->
<rect x="30" y="56" width="230" height="170" rx="8" class="bl"/>
<circle cx="56" cy="82" r="14" class="nb"/><text x="56" y="88" class="nt">1</text>
<text x="80" y="88" class="b">Ne rien effacer</text>
<text x="46" y="118">Rester calme. Les messages</text><text x="46" y="138">et les fichiers servent à</text><text x="46" y="158">l'analyse : ne pas les</text><text x="46" y="178">supprimer.</text>

<rect x="285" y="56" width="230" height="170" rx="8" class="wh"/>
<circle cx="311" cy="82" r="14" class="nb"/><text x="311" y="88" class="nt">2</text>
<text x="335" y="88" class="b">Isoler le poste</text>
<text x="301" y="118">Débrancher le câble réseau</text><text x="301" y="138">ou couper le Wi-Fi, sans</text><text x="301" y="158">éteindre brutalement la</text><text x="301" y="178">machine.</text>

<rect x="540" y="56" width="230" height="170" rx="8" class="bl"/>
<circle cx="566" cy="82" r="14" class="nb"/><text x="566" y="88" class="nt">3</text>
<text x="590" y="88" class="b">Alerter</text>
<text x="556" y="118">Informatique et hiérarchie,</text><text x="556" y="138">par un canal sûr. Donner</text><text x="556" y="158">l'heure, les faits et les</text><text x="556" y="178">actions déjà faites.</text>

<!-- ligne 2 -->
<rect x="30" y="246" width="230" height="170" rx="8" class="wh"/>
<circle cx="56" cy="272" r="14" class="nb"/><text x="56" y="278" class="nt">4</text>
<text x="80" y="278" class="b">Ne pas réparer seul</text>
<text x="46" y="308">Ne pas répondre à</text><text x="46" y="328">l'attaquant, ne pas payer de</text><text x="46" y="348">rançon, ne pas tenter de</text><text x="46" y="368">nettoyer le poste.</text>

<rect x="285" y="246" width="230" height="170" rx="8" class="bl"/>
<circle cx="311" cy="272" r="14" class="nb"/><text x="311" y="278" class="nt">5</text>
<text x="335" y="278" class="b">Noter les faits</text>
<text x="301" y="308">Adresse de l'expéditeur,</text><text x="301" y="328">capture d'écran, nom du</text><text x="301" y="348">fichier : tout ce qui aide</text><text x="301" y="368">l'équipe informatique.</text>

<rect x="540" y="246" width="230" height="170" rx="8" class="wh"/>
<circle cx="566" cy="272" r="14" class="nb"/><text x="566" y="278" class="nt">6</text>
<text x="590" y="278" class="b">Changer les accès</text>
<text x="556" y="308">Mots de passe concernés,</text><text x="556" y="328">depuis un appareil sain,</text><text x="556" y="348">sur indication du service</text><text x="556" y="368">informatique.</text>

<path d="M262,141H283" class="or" marker-end="url(#ao)"/>
<path d="M517,141H538" class="or" marker-end="url(#ao)"/>
<path d="M262,331H283" class="or" marker-end="url(#ao)"/>
<path d="M517,331H538" class="or" marker-end="url(#ao)"/>

<rect x="30" y="432" width="740" height="52" rx="6" class="bl"/>
<text x="400" y="454" class="c b">Signaler vite n'est pas une dénonciation : c'est un acte de protection</text>
<text x="400" y="474" class="c">Les premières heures déterminent l'ampleur des dégâts.</text>
</svg>
