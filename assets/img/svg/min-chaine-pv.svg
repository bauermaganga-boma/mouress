<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne d'un procès-verbal : constat, contradictoire, procès-verbal, mise en demeure, transaction éventuelle, sanction, recours</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
.dn{fill:none;stroke:#061F44;stroke-width:2.5;stroke-dasharray:8 6}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}.dn{fill:none;stroke:#061F44;stroke-width:2.5;stroke-dasharray:8 6}
</style></defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Chaîne d'un procès-verbal</text>
<rect x="30" y="60" width="150" height="40" rx="8" class="nvf"/><text x="105" y="86" class="w c">1. Constat</text>
<rect x="30" y="108" width="150" height="100" rx="8" class="bl"/>
<text x="105" y="138" class="c" style="font-size:13px">Faits relevés par</text>
<text x="105" y="162" class="c" style="font-size:13px">l'agent assermenté,</text>
<text x="105" y="186" class="c" style="font-size:13px">preuves réunies</text>
<path d="M182,80H228" class="or" marker-end="url(#ao)"/>
<rect x="230" y="60" width="150" height="40" rx="8" class="nvf"/><text x="305" y="86" class="w c">2. Contradictoire</text>
<rect x="230" y="108" width="150" height="100" rx="8" class="bl"/>
<text x="305" y="138" class="c" style="font-size:13px">Constats communiqués,</text>
<text x="305" y="162" class="c" style="font-size:13px">observations de</text>
<text x="305" y="186" class="c" style="font-size:13px">l'opérateur recueillies</text>
<path d="M382,80H428" class="or" marker-end="url(#ao)"/>
<rect x="430" y="60" width="150" height="40" rx="8" class="nvf"/><text x="505" y="86" class="w c">3. Procès-verbal</text>
<rect x="430" y="108" width="150" height="100" rx="8" class="bl"/>
<text x="505" y="138" class="c" style="font-size:13px">Faits décrits, texte</text>
<text x="505" y="162" class="c" style="font-size:13px">visé, signatures,</text>
<text x="505" y="186" class="c" style="font-size:13px">remise à l'opérateur</text>
<path d="M582,80H628" class="or" marker-end="url(#ao)"/>
<rect x="630" y="60" width="150" height="40" rx="8" class="nvf"/><text x="705" y="86" class="w c">4. Mise en demeure</text>
<rect x="630" y="108" width="150" height="100" rx="8" class="bl"/>
<text x="705" y="138" class="c" style="font-size:13px">Écrit demandant de</text>
<text x="705" y="162" class="c" style="font-size:13px">régulariser dans</text>
<text x="705" y="186" class="c" style="font-size:13px">le délai fixé</text>
<rect x="30" y="260" width="150" height="40" rx="8" class="nvf"/><text x="105" y="286" class="w c">5. Transaction</text>
<rect x="30" y="308" width="150" height="100" rx="8" class="gr" stroke-dasharray="8 6"/>
<text x="105" y="338" class="c" style="font-size:13px">Éventuelle : proposée</text>
<text x="105" y="362" class="c" style="font-size:13px">par l'administration</text>
<text x="105" y="386" class="c" style="font-size:13px">avant la sanction</text>
<path d="M182,280H228" class="or" marker-end="url(#ao)"/>
<rect x="230" y="260" width="150" height="40" rx="8" class="nvf"/><text x="305" y="286" class="w c">6. Sanction</text>
<rect x="230" y="308" width="150" height="100" rx="8" class="bl"/>
<text x="305" y="338" class="c" style="font-size:13px">Pénalité, ou</text>
<text x="305" y="362" class="c" style="font-size:13px">poursuite devant</text>
<text x="305" y="386" class="c" style="font-size:13px">la juridiction</text>
<path d="M382,280H428" class="or" marker-end="url(#ao)"/>
<rect x="430" y="260" width="150" height="40" rx="8" class="nvf"/><text x="505" y="286" class="w c">7. Recours</text>
<rect x="430" y="308" width="150" height="100" rx="8" class="bl"/>
<text x="505" y="338" class="c" style="font-size:13px">Recours de</text>
<text x="505" y="362" class="c" style="font-size:13px">l'opérateur contre</text>
<text x="505" y="386" class="c" style="font-size:13px">la décision</text>
<path d="M705,208V232H105V256" class="or" marker-end="url(#ao)"/>
<text x="400" y="440" class="c">Le contradictoire précède la finalisation du procès-verbal ; la transaction reste facultative.</text>
<text x="400" y="464" class="c" style="font-size:13px">Délais et montants : fixés par les textes, voir le cours.</text>
</svg>
