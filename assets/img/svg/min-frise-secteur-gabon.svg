<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" width="930" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Frise chronologique non à l'échelle : années 1950 premiers forages côtiers, 1963 Gamba, 1967 Ivinga, 1975 entrée à l'OPEP, 1985 Rabi-Kounga, 1995 sortie de l'OPEP, 1997 pic d'environ 370 000 barils par jour, 2016 retour à l'OPEP, 2017 cession des actifs de Shell, 2019 loi 002/2019, 2023-2025 réappropriation nationale</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="930" height="500" fill="#FCFBF8"/>
<text x="465" y="30" class="h">Repères chronologiques du secteur pétrolier gabonais</text>
<path d="M25,240H920" class="nv" marker-end="url(#ar)"/>
<circle cx="82" cy="240" r="8" class="orf"/>
<path d="M82,231V210" class="ld"/>
<text x="82" y="144" class="o c">Années 1950</text>
<text x="82" y="166" class="c t13">Premiers forages sur</text>
<text x="82" y="183" class="c t13">la côte, autour de</text>
<text x="82" y="200" class="c t13">Port-Gentil</text>
<circle cx="158" cy="240" r="8" class="orf"/>
<path d="M158,249V270" class="ld"/>
<text x="158" y="290" class="o c">1963</text>
<text x="158" y="310" class="c t13">Shell Gabon découvre</text>
<text x="158" y="327" class="c t13">le champ de Gamba</text>
<circle cx="234" cy="240" r="8" class="orf"/>
<path d="M234,231V210" class="ld"/>
<text x="234" y="161" class="o c">1967</text>
<text x="234" y="183" class="c t13">Découverte du champ</text>
<text x="234" y="200" class="c t13">d'Ivinga</text>
<circle cx="310" cy="240" r="8" class="orf"/>
<path d="M310,249V270" class="ld"/>
<text x="310" y="290" class="o c">1975</text>
<text x="310" y="310" class="c t13">Entrée à l'OPEP</text>
<circle cx="386" cy="240" r="8" class="orf"/>
<path d="M386,231V210" class="ld"/>
<text x="386" y="161" class="o c">1985</text>
<text x="386" y="183" class="c t13">Découverte de</text>
<text x="386" y="200" class="c t13">Rabi-Kounga</text>
<circle cx="462" cy="240" r="8" class="orf"/>
<path d="M462,249V270" class="ld"/>
<text x="462" y="290" class="o c">1995</text>
<text x="462" y="310" class="c t13">Sortie de l'OPEP</text>
<circle cx="538" cy="240" r="8" class="orf"/>
<path d="M538,231V210" class="ld"/>
<text x="538" y="161" class="o c">1997</text>
<text x="538" y="183" class="c t13">Pic de production :</text>
<text x="538" y="200" class="c t13">environ 370 000 b/j</text>
<circle cx="614" cy="240" r="8" class="orf"/>
<path d="M614,249V270" class="ld"/>
<text x="614" y="290" class="o c">2016</text>
<text x="614" y="310" class="c t13">Retour à l'OPEP (1er</text>
<text x="614" y="327" class="c t13">juillet)</text>
<circle cx="690" cy="240" r="8" class="orf"/>
<path d="M690,231V210" class="ld"/>
<text x="690" y="144" class="o c">2017</text>
<text x="690" y="166" class="c t13">Shell cède ses actifs</text>
<text x="690" y="183" class="c t13">onshore à Carlyle</text>
<text x="690" y="200" class="c t13">(futur Assala Energy)</text>
<circle cx="766" cy="240" r="8" class="orf"/>
<path d="M766,249V270" class="ld"/>
<text x="766" y="290" class="o c">2019</text>
<text x="766" y="310" class="c t13">Loi n° 002/2019 ;</text>
<text x="766" y="327" class="c t13">production d'environ</text>
<text x="766" y="344" class="c t13">201 000 b/j</text>
<circle cx="842" cy="240" r="8" class="orf"/>
<path d="M842,231V210" class="ld"/>
<text x="842" y="144" class="o c">2023-2025</text>
<text x="842" y="166" class="c t13">Mouvement de</text>
<text x="842" y="183" class="c t13">réappropriation</text>
<text x="842" y="200" class="c t13">nationale</text>
<rect x="45" y="385" width="226" height="40" rx="6" class="bl"/><text x="158" y="410" class="b c">Pionniers</text>
<rect x="273" y="385" width="150" height="40" rx="6" class="gr"/><text x="348" y="410" class="b c">Consolidation</text>
<rect x="425" y="385" width="150" height="40" rx="6" class="bl"/><text x="500" y="410" class="b c">Apogée</text>
<rect x="577" y="385" width="302" height="40" rx="6" class="gr"/><text x="728" y="410" class="b c">Nouveau cadre et réappropriation</text>
<path d="M558,452H786" class="or" marker-end="url(#ao)"/>
<text x="498" y="457" class="o e">Déclin de la production après 1997</text>
<text x="465" y="485" class="c t13">Frise non à l'échelle. Sources citées dans le cours : EIA, OPEP, opérateurs.</text>
</svg>
