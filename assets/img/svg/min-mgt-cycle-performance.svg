<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Cycle de la gestion de la performance en quatre étapes : 1 fixer l'objectif (cible chiffrée et échéance), 2 mesurer (indicateur relevé régulièrement), 3 analyser l'écart (écart égal résultat mesuré moins cible, puis causes), 4 agir (action corrective avec responsable et date), puis retour à l'objectif pour un nouveau cycle.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.t{font-size:16px;font-weight:bold;text-anchor:middle}
.bx{stroke:#061F44;stroke-width:2.5}
.k{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Cycle de la gestion de la performance</text>

<rect x="290" y="50" width="220" height="90" rx="10" class="bx" fill="#DCE6F5"/>
<text x="400" y="78" class="t">1 · Fixer l'objectif</text>
<text x="400" y="102" class="c">Cible chiffrée</text><text x="400" y="122" class="c">et échéance</text>

<rect x="540" y="205" width="220" height="90" rx="10" class="bx" fill="#DCE6F5"/>
<text x="650" y="233" class="t">2 · Mesurer</text>
<text x="650" y="257" class="c">Indicateur relevé</text><text x="650" y="277" class="c">régulièrement</text>

<rect x="290" y="360" width="220" height="90" rx="10" class="bx" fill="#F9DDBB"/>
<text x="400" y="388" class="t">3 · Analyser l'écart</text>
<text x="400" y="412" class="c">Mesure de l'écart,</text><text x="400" y="432" class="c">puis recherche des causes</text>

<rect x="40" y="205" width="220" height="90" rx="10" class="bx" fill="#F9DDBB"/>
<text x="150" y="233" class="t">4 · Agir</text>
<text x="150" y="257" class="c">Action corrective,</text><text x="150" y="277" class="c">responsable et date</text>

<path d="M512,95Q650,95 650,203" class="k" marker-end="url(#ar)"/>
<path d="M650,297Q650,405 512,405" class="k" marker-end="url(#ar)"/>
<path d="M288,405Q150,405 150,297" class="k" marker-end="url(#ar)"/>
<path d="M150,203Q150,95 288,95" class="k" marker-end="url(#ar)"/>

<text x="400" y="232" class="c o">Écart = résultat mesuré − cible</text>
<text x="400" y="256" class="c">Après l'action, on revient</text>
<text x="400" y="276" class="c">à l'objectif pour un nouveau cycle.</text>
</svg>
