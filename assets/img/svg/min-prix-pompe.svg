<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Barre empilée fictive du prix à la pompe en FCFA par litre : coût du produit 380, fret 40, entreposage et transport 35, marge du distributeur 45, marge du détaillant 35, taxes spécifiques 90, TVA à 18 % 112,5 ; total hors TVA 625, prix TTC 737,5</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Décomposition du prix à la pompe (exemple fictif)</text>
<text x="400" y="52" class="c o">CHIFFRES FICTIFS, pour s'exercer : FCFA par litre de super</text>
<rect x="80" y="271.0" width="110" height="209.0" fill="#061F44" stroke="#061F44" stroke-width="2"/>
<path d="M190,375.5H240" class="ld"/><text x="246" y="380.5">Coût du produit rendu au port : <tspan class="b">380</tspan></text>
<rect x="80" y="249.0" width="110" height="22.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<path d="M190,260.0H240" class="ld"/><text x="246" y="265.0">Fret, assurance, frais portuaires : <tspan class="b">40</tspan></text>
<rect x="80" y="229.7" width="110" height="19.3" fill="#E8EAEE" stroke="#061F44" stroke-width="2"/>
<path d="M190,239.4H240" class="ld"/><text x="246" y="244.4">Entreposage et transport intérieur : <tspan class="b">35</tspan></text>
<rect x="80" y="205.0" width="110" height="24.7" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<path d="M190,217.4H240" class="ld"/><text x="246" y="222.4">Marge du distributeur : <tspan class="b">45</tspan></text>
<rect x="80" y="185.8" width="110" height="19.3" fill="#E8EAEE" stroke="#061F44" stroke-width="2"/>
<path d="M190,195.4H240" class="ld"/><text x="246" y="200.4">Marge du détaillant : <tspan class="b">35</tspan></text>
<rect x="80" y="136.3" width="110" height="49.5" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M190,161.0H240" class="ld"/><text x="246" y="166.0">Taxes spécifiques : <tspan class="b">90</tspan></text>
<rect x="80" y="74.4" width="110" height="61.9" fill="#B85C0A" stroke="#061F44" stroke-width="2"/>
<path d="M190,105.3H240" class="ld"/><text x="246" y="110.3">TVA à 18 % : <tspan class="b">112,5</tspan></text>
<path d="M560,136.3V480M552,136.3H560M552,480H560" class="ld"/><text x="572" y="308.1" class="b">Total hors TVA</text><text x="572" y="326.1" class="b">625</text>
<path d="M680,74.4V480M672,74.4H680M672,480H680" class="ld"/><text x="692" y="90.4" class="o">Prix TTC</text><text x="692" y="108.4" class="o">737,5</text>
<text x="400" y="498" class="c n">Ne décrit pas la structure de prix en vigueur. Chaque valeur est en FCFA par litre.</text>
</svg>
