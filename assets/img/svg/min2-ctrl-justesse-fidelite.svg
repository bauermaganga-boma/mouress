<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Quatre cibles illustrant justesse et fidélité d'une mesure : juste et fidèle, fidèle mais biaisée, juste mais dispersée, ni juste ni fidèle</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="30" class="h">Justesse et fidélité d'une mesure</text>
<text x="400" y="52" class="c n">Le centre de la cible est la valeur vraie ; chaque point orange est un résultat de mesure.</text>
<circle cx="110" cy="150" r="75" class="bl"/><circle cx="110" cy="150" r="50" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/><circle cx="110" cy="150" r="25" class="bl"/><circle cx="110" cy="150" r="5" fill="#061F44"/><circle cx="104" cy="146" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="115" cy="143" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="110" cy="156" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="102" cy="155" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="117" cy="153" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><text x="110" y="250" class="c b">Juste et fidèle</text><text x="110" y="270" class="c n">proche du centre, groupée</text>
<circle cx="305" cy="150" r="75" class="bl"/><circle cx="305" cy="150" r="50" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/><circle cx="305" cy="150" r="25" class="bl"/><circle cx="305" cy="150" r="5" fill="#061F44"/><circle cx="345" cy="116" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="351" cy="122" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="341" cy="124" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="349" cy="112" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="355" cy="118" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><text x="305" y="250" class="c b">Fidèle, pas juste</text><text x="305" y="270" class="c n">groupée mais décalée : biais</text>
<circle cx="500" cy="150" r="75" class="bl"/><circle cx="500" cy="150" r="50" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/><circle cx="500" cy="150" r="25" class="bl"/><circle cx="500" cy="150" r="5" fill="#061F44"/><circle cx="452" cy="120" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="544" cy="114" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="470" cy="194" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="550" cy="180" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="502" cy="144" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><text x="500" y="250" class="c b">Juste, pas fidèle</text><text x="500" y="270" class="c n">centrée en moyenne, dispersée</text>
<circle cx="695" cy="150" r="75" class="bl"/><circle cx="695" cy="150" r="50" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/><circle cx="695" cy="150" r="25" class="bl"/><circle cx="695" cy="150" r="5" fill="#061F44"/><circle cx="645" cy="180" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="715" cy="100" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="750" cy="162" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="685" cy="205" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><circle cx="743" cy="190" r="6" fill="#F28C28" stroke="#061F44" stroke-width="1.5"/><text x="695" y="250" class="c b">Ni juste ni fidèle</text><text x="695" y="270" class="c n">décalée et dispersée</text>
<rect x="25" y="300" width="370" height="120" class="gr"/>
<text x="40" y="326" class="b">Justesse</text>
<text x="40" y="348" class="n">Écart entre la moyenne des résultats et la valeur</text><text x="40" y="366" class="n">vraie. Un défaut de justesse est un biais : on le</text><text x="40" y="384" class="n">corrige par l'étalonnage ou la correction.</text>
<rect x="405" y="300" width="370" height="120" class="gr"/>
<text x="420" y="326" class="b">Fidélité</text>
<text x="420" y="348" class="n">Accord entre les résultats d'une série répétée</text><text x="420" y="366" class="n">(répétabilité, reproductibilité). On la juge à la</text><text x="420" y="384" class="n">dispersion, mesurée par l'écart-type.</text>
<text x="400" y="452" class="c n o">Des mesures très groupées mais loin du centre : bonne fidélité, mauvaise justesse.</text>
<text x="400" y="480" class="c n">Schéma d'illustration pédagogique, sans valeurs réelles.</text>
</svg>
