<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau d'aiguillage de dossiers à la Direction générale des Hydrocarbures : coordonnées des blocs et cartes vers le Service Cadastre pétrolier, programme de réduction du torchage vers le Service Hygiène industrielle, santé et environnement, redevance minière proportionnelle vers la Direction des Participations et de la Commercialisation, vente du brut de l'État vers le Service Commercialisation, lubrifiants, production et transport, archives et données, budget et logistique</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:1.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:1.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:1.5}
.or{fill:none;stroke:#F28C28;stroke-width:3}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Où orienter un dossier à la DGH ? (exemples)</text>
<text x="400" y="48" class="c t13">Tableau d'aiguillage d'après le décret n° 0123/PR/MP du 21 mars 2024, à confirmer : l'organisation peut avoir évolué</text>

<rect x="30" y="60" width="300" height="30" class="nvf"/>
<rect x="330" y="60" width="440" height="30" class="nvf"/>
<text x="42" y="80" class="w">Objet du dossier</text>
<text x="342" y="80" class="w">Service ou direction qui l'instruit</text>

<g>
<rect x="30" y="90" width="300" height="44" class="bl"/><rect x="330" y="90" width="440" height="44" class="bl"/>
<text x="42" y="109" class="b">Coordonnées des blocs, cartes</text><text x="42" y="126">du bassin, tenue du cadastre</text>
<text x="342" y="109" class="o">Service Cadastre pétrolier</text><text x="342" y="126" class="t13">Direction de l'Exploration (article 14)</text>

<rect x="30" y="134" width="300" height="44" class="gr"/><rect x="330" y="134" width="440" height="44" class="gr"/>
<text x="42" y="153" class="b">Programme de réduction</text><text x="42" y="170">du torchage du gaz</text>
<text x="342" y="153" class="o">Service Hygiène industrielle, santé et environnement</text><text x="342" y="170" class="t13">Direction de la Prévention et gestion des risques (art. 38)</text>

<rect x="30" y="178" width="300" height="44" class="bl"/><rect x="330" y="178" width="440" height="44" class="bl"/>
<text x="42" y="197" class="b">Redevance minière proportionnelle</text><text x="42" y="214">calculs et paiements</text>
<text x="342" y="197" class="o">Direction des Participations et de la Commercialisation</text><text x="342" y="214" class="t13">Suivi des calculs et des paiements (article 24)</text>

<rect x="30" y="222" width="300" height="44" class="gr"/><rect x="330" y="222" width="440" height="44" class="gr"/>
<text x="42" y="241" class="b">Vente de la part de brut</text><text x="42" y="258">revenant à l'État</text>
<text x="342" y="241" class="o">Service Commercialisation</text><text x="342" y="258" class="t13">Direction des Participations et de la Commercialisation</text>

<rect x="30" y="266" width="300" height="44" class="bl"/><rect x="330" y="266" width="440" height="44" class="bl"/>
<text x="42" y="285" class="b">Huiles de base et lubrifiants</text><text x="42" y="302">usines de formulation</text>
<text x="342" y="285" class="o">Service Lubrifiants</text><text x="342" y="302" class="t13">Direction de la Transformation et de la Distribution</text>

<rect x="30" y="310" width="300" height="44" class="gr"/><rect x="330" y="310" width="440" height="44" class="gr"/>
<text x="42" y="329" class="b">Production d'un champ,</text><text x="42" y="346">transport par conduite</text>
<text x="342" y="329" class="o">Service Production et transport</text><text x="342" y="346" class="t13">Direction de l'Exploitation</text>

<rect x="30" y="354" width="300" height="44" class="bl"/><rect x="330" y="354" width="440" height="44" class="bl"/>
<text x="42" y="373" class="b">Archives, carothèque,</text><text x="42" y="390">données numériques</text>
<text x="342" y="373" class="o">Archives, carothèque et documentation</text><text x="342" y="390" class="t13">Direction de la Gestion des données pétrolières et gazières</text>

<rect x="30" y="398" width="300" height="44" class="gr"/><rect x="330" y="398" width="440" height="44" class="gr"/>
<text x="42" y="417" class="b">Budget prévisionnel, moyens</text><text x="42" y="434">et logistique de la DGH</text>
<text x="342" y="417" class="o">Service Finances et logistique</text><text x="342" y="434" class="t13">Service d'appui de la DGH</text>
</g>

<rect x="30" y="454" width="740" height="36" rx="6" fill="#FFFFFF" stroke="#F28C28" stroke-width="2"/>
<text x="400" y="470" class="c t13">Outil d'aiguillage, pas un organigramme : choisissez le service d'après l'objet du dossier.</text>
<text x="400" y="486" class="c t13">En cas de doute sur une dénomination, vérifiez le texte publié le plus récent.</text>
</svg>
