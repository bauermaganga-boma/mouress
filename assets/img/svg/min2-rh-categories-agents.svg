<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Comparaison des agents permanents et non permanents : mode d’entrée, durée, qualité, base légale.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Agents permanents et agents non permanents</text>
<rect x="24" y="66" width="110" height="34" rx="0" class="nv"/>
<text x="79" y="88" class="c w"></text>
<rect x="134" y="66" width="320" height="34" rx="0" class="nv"/>
<text x="294" y="88" class="c w">Agent permanent</text>
<rect x="454" y="66" width="300" height="34" rx="0" class="nv"/>
<text x="604" y="88" class="c w">Agent non permanent</text>
<rect x="24" y="100" width="110" height="68" rx="0" class="bl"/>
<text x="32" y="123" class="b">Entrée</text>
<rect x="134" y="100" width="320" height="68" rx="0" class="bl"/>
<text x="294" y="123" class="c">Nommé dans un emploi, puis titularisé</text>
<text x="294" y="141" class="c">dans un corps (concours, ou sur titre à</text>
<text x="294" y="159" class="c">titre exceptionnel)</text>
<rect x="454" y="100" width="300" height="68" rx="0" class="bl"/>
<text x="604" y="123" class="c">Recruté par contrat pour un besoin</text>
<text x="604" y="141" class="c">précis</text>
<rect x="24" y="168" width="110" height="50" rx="0" class="wh"/>
<text x="32" y="191" class="b">Durée</text>
<rect x="134" y="168" width="320" height="50" rx="0" class="wh"/>
<text x="294" y="191" class="c">Carrière dans le corps</text>
<rect x="454" y="168" width="300" height="50" rx="0" class="wh"/>
<text x="604" y="191" class="c">Contrat de trois ans au plus,</text>
<text x="604" y="209" class="c">renouvelable (art. 14)</text>
<rect x="24" y="218" width="110" height="50" rx="0" class="bl"/>
<text x="32" y="241" class="b">Qualité</text>
<rect x="134" y="218" width="320" height="50" rx="0" class="bl"/>
<text x="294" y="241" class="c">Fonctionnaire : statut général et statut</text>
<text x="294" y="259" class="c">particulier du corps</text>
<rect x="454" y="218" width="300" height="50" rx="0" class="bl"/>
<text x="604" y="241" class="c">Un contrat, même renouvelé, ne vaut pas</text>
<text x="604" y="259" class="c">titularisation</text>
<rect x="24" y="268" width="110" height="32" rx="0" class="wh"/>
<text x="32" y="291" class="b">Texte</text>
<rect x="134" y="268" width="320" height="32" rx="0" class="wh"/>
<text x="294" y="291" class="c">Loi n° 001/2005 (art. 9 à 12)</text>
<rect x="454" y="268" width="300" height="32" rx="0" class="wh"/>
<text x="604" y="291" class="c">Loi n° 001/2005 (art. 9 à 12 et 14)</text>
<text x="400" y="334" class="c">Seul un recrutement dans un corps, puis la titularisation, confère la qualité d’agent permanent.</text>
</svg>
