<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Budget approuvé et dépenses réalisées (exemples)</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Budget approuvé et dépenses réalisées (exemples)</text>

<text x="400" y="62" font-size="14" fill="#555" text-anchor="middle">Montants en millions de dollars (valeurs fictives)</text>
<text x="40" y="130" font-size="16" fill="#061F44" font-weight="bold">Cas A</text><rect x="120" y="90" width="450" height="34" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/><text x="130" y="112" font-size="14" fill="#061F44">Budget approuvé : 100</text><rect x="120" y="132" width="585" height="34" rx="6" fill="#F28C28"/><text x="130" y="154" font-size="14" fill="#061F44" font-weight="bold">Dépensé : 130</text><text x="40" y="245" font-size="16" fill="#061F44" font-weight="bold">Cas B</text><rect x="120" y="205" width="450" height="34" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/><text x="130" y="227" font-size="14" fill="#061F44">Budget approuvé : 100</text><rect x="120" y="247" width="531" height="34" rx="6" fill="#F28C28"/><text x="130" y="269" font-size="14" fill="#061F44" font-weight="bold">Dépensé : 118</text><text x="40" y="360" font-size="16" fill="#061F44" font-weight="bold">Cas C</text><rect x="120" y="320" width="225" height="34" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/><text x="130" y="342" font-size="14" fill="#061F44">Budget approuvé : 50</text><rect x="120" y="362" width="252" height="34" rx="6" fill="#F28C28"/><text x="130" y="384" font-size="14" fill="#061F44" font-weight="bold">Dépensé : 56</text>
<rect x="40" y="440" width="720" height="36" rx="6" fill="#E8EAEE"/>
<text x="400" y="463" font-size="14" fill="#061F44" text-anchor="middle">Dans ces trois cas, aucune demande d'accord préalable n'a été déposée.</text>

</svg>
