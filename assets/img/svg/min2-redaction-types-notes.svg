<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau des principaux types de notes administratives : destinataire, but et exemple de chacune (note d'information, de service, de synthèse, de présentation).</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Quelle note pour quel besoin ?</text>
<rect x="24" y="62" width="160" height="34" rx="0" class="nv"/>
<text x="104" y="84" class="c w">Écrit</text>
<rect x="184" y="62" width="150" height="34" rx="0" class="nv"/>
<text x="259" y="84" class="c w">Destinataire</text>
<rect x="334" y="62" width="230" height="34" rx="0" class="nv"/>
<text x="449" y="84" class="c w">But</text>
<rect x="564" y="62" width="190" height="34" rx="0" class="nv"/>
<text x="659" y="84" class="c w">Exemple (fictif)</text>
<rect x="24" y="96" width="160" height="50" rx="0" class="bl"/>
<text x="32" y="119" class="b">Note d’information</text>
<rect x="184" y="96" width="150" height="50" rx="0" class="bl"/>
<text x="259" y="119" class="c">La hiérarchie</text>
<rect x="334" y="96" width="230" height="50" rx="0" class="bl"/>
<text x="449" y="119" class="c">Informer d’un fait ou d’une</text>
<text x="449" y="137" class="c">situation</text>
<rect x="564" y="96" width="190" height="50" rx="0" class="bl"/>
<text x="659" y="119" class="c">Retards de transmission</text>
<text x="659" y="137" class="c">des rapports</text>
<rect x="24" y="146" width="160" height="50" rx="0" class="wh"/>
<text x="32" y="169" class="b">Note de service</text>
<rect x="184" y="146" width="150" height="50" rx="0" class="wh"/>
<text x="259" y="169" class="c">Les agents du</text>
<text x="259" y="187" class="c">service</text>
<rect x="334" y="146" width="230" height="50" rx="0" class="wh"/>
<text x="449" y="169" class="c">Donner des instructions</text>
<text x="449" y="187" class="c">applicables</text>
<rect x="564" y="146" width="190" height="50" rx="0" class="wh"/>
<text x="659" y="169" class="c">Rappel d’une procédure</text>
<text x="659" y="187" class="c">de dépôt</text>
<rect x="24" y="196" width="160" height="50" rx="0" class="bl"/>
<text x="32" y="219" class="b">Note de synthèse</text>
<rect x="184" y="196" width="150" height="50" rx="0" class="bl"/>
<text x="259" y="219" class="c">Celui qui doit</text>
<text x="259" y="237" class="c">décider</text>
<rect x="334" y="196" width="230" height="50" rx="0" class="bl"/>
<text x="449" y="219" class="c">Condenser un dossier, sans</text>
<text x="449" y="237" class="c">rien ajouter</text>
<rect x="564" y="196" width="190" height="50" rx="0" class="bl"/>
<text x="659" y="219" class="c">Résumé de plusieurs</text>
<text x="659" y="237" class="c">documents</text>
<rect x="24" y="246" width="160" height="50" rx="0" class="wh"/>
<text x="32" y="269" class="b">Note de présentation</text>
<rect x="184" y="246" width="150" height="50" rx="0" class="wh"/>
<text x="259" y="269" class="c">L’autorité qui</text>
<text x="259" y="287" class="c">décide</text>
<rect x="334" y="246" width="230" height="50" rx="0" class="wh"/>
<text x="449" y="269" class="c">Proposer une décision :</text>
<text x="449" y="287" class="c">options et recommandation</text>
<rect x="564" y="246" width="190" height="50" rx="0" class="wh"/>
<text x="659" y="269" class="c">Demande de prolongation</text>
<text x="659" y="287" class="c">de délai</text>
<text x="400" y="330" class="c">Pas d’appel ni de formule de politesse dans une note.</text>
</svg>
