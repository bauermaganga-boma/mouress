<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Amortissement linéaire d'un bien de 16 000 000 FCFA sur 8 ans (exemple fictif) : annuité de 2 000 000 FCFA, valeur nette comptable décroissante de 16 000 000 à 0.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Amortissement linéaire (exemple fictif)</text>
<path d="M80,90V380H760" class="ln" style="stroke-width:2.5"/>
<text x="40" y="58">Valeur nette comptable (millions de FCFA)</text>
<rect x="90" y="100" width="52" height="280" rx="2" class="bl"/>
<text x="116" y="92" class="c b">16</text>
<text x="116" y="400" class="c">An 0</text>
<rect x="156" y="135" width="52" height="245" rx="2" class="bl"/>
<text x="182" y="127" class="c b">14</text>
<text x="182" y="400" class="c">An 1</text>
<rect x="222" y="170" width="52" height="210" rx="2" class="bl"/>
<text x="248" y="162" class="c b">12</text>
<text x="248" y="400" class="c">An 2</text>
<rect x="288" y="205" width="52" height="175" rx="2" class="bl"/>
<text x="314" y="197" class="c b">10</text>
<text x="314" y="400" class="c">An 3</text>
<rect x="354" y="240" width="52" height="140" rx="2" class="or"/>
<text x="380" y="232" class="c b">8</text>
<text x="380" y="400" class="c">An 4</text>
<rect x="420" y="275" width="52" height="105" rx="2" class="bl"/>
<text x="446" y="267" class="c b">6</text>
<text x="446" y="400" class="c">An 5</text>
<rect x="486" y="310" width="52" height="70" rx="2" class="bl"/>
<text x="512" y="302" class="c b">4</text>
<text x="512" y="400" class="c">An 6</text>
<rect x="552" y="345" width="52" height="35" rx="2" class="bl"/>
<text x="578" y="337" class="c b">2</text>
<text x="578" y="400" class="c">An 7</text>
<text x="644" y="372" class="c b">0</text>
<text x="644" y="400" class="c">An 8</text>
<text x="400" y="428" class="c b">Annuité = valeur d’acquisition ÷ durée = 16 000 000 ÷ 8 = 2 000 000 FCFA par an</text>
<text x="400" y="458" class="c">Exemple chiffré fictif, non réglementaire. L’amortissement n’est pas un décaissement.</text>
</svg>
