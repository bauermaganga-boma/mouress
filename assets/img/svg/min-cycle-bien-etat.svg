<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Inventaire et cycle de vie d'un bien de l'État : réception, inscription, affectation, inventaire annuel, proposition de réforme, constat par commission, décision, sortie par vente, don ou destruction</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Inventaire et cycle de vie d'un bien de l'État</text>
<rect x="15" y="50" width="170" height="135" rx="8" class="bl"/>
<text x="100" y="94" class="c b">1. Réception</text>
<text x="100" y="113" class="c">Contrôle : quantité,</text>
<text x="100" y="132" class="c">qualité, conformité</text>
<text x="100" y="151" class="c">Bon d'entrée signé</text>
<rect x="215" y="50" width="170" height="135" rx="8" class="bl"/>
<text x="300" y="85" class="c b">2. Inscription</text>
<text x="300" y="104" class="c">Fiche d'inventaire :</text>
<text x="300" y="123" class="c">désignation, valeur,</text>
<text x="300" y="142" class="c">lieu, détenteur</text>
<text x="300" y="161" class="c">N° et étiquette</text>
<rect x="415" y="50" width="170" height="135" rx="8" class="bl"/>
<text x="500" y="94" class="c b">3. Affectation</text>
<text x="500" y="113" class="c">Détenteur désigné</text>
<text x="500" y="132" class="c">Tout mouvement est</text>
<text x="500" y="151" class="c">consigné par écrit</text>
<rect x="615" y="50" width="170" height="135" rx="8" class="bl"/>
<text x="700" y="94" class="c b">4. Inventaire</text>
<text x="700" y="113" class="c">Au moins une fois</text>
<text x="700" y="132" class="c">par an : récolement</text>
<text x="700" y="151" class="c">et PV des écarts</text>
<rect x="615" y="225" width="170" height="135" rx="8" class="gr"/>
<text x="700" y="269" class="c b">5. Proposition</text>
<text x="700" y="288" class="c">de réforme : bien hors</text>
<text x="700" y="307" class="c">d'usage, irréparable</text>
<text x="700" y="326" class="c">ou dangereux</text>
<rect x="415" y="225" width="170" height="135" rx="8" class="gr"/>
<text x="500" y="269" class="c b">6. Constat</text>
<text x="500" y="288" class="c">Commission : PV,</text>
<text x="500" y="307" class="c">valeur estimée ;</text>
<text x="500" y="326" class="c">pas le détenteur seul</text>
<rect x="215" y="225" width="170" height="135" rx="8" class="gr"/>
<text x="300" y="269" class="c b">7. Décision</text>
<text x="300" y="288" class="c">Décision de réforme</text>
<text x="300" y="307" class="c">par l'autorité</text>
<text x="300" y="326" class="c">compétente</text>
<rect x="15" y="225" width="170" height="150" rx="8" class="gr"/>
<text x="100" y="258" class="c b">8. Sortie</text>
<text x="100" y="277" class="c">Vente publique (mode</text>
<text x="100" y="296" class="c">normal), don ou</text>
<text x="100" y="315" class="c">destruction</text>
<text x="100" y="334" class="c">Produit au Trésor</text>
<text x="100" y="353" class="c">Bon de sortie</text>
<path d="M187,117H212" class="nv" marker-end="url(#ar)"/>
<path d="M387,117H412" class="nv" marker-end="url(#ar)"/>
<path d="M587,117H612" class="nv" marker-end="url(#ar)"/>
<path d="M700,187V223" class="nv" marker-end="url(#ar)"/>
<path d="M613,292H588" class="nv" marker-end="url(#ar)"/>
<path d="M413,292H388" class="nv" marker-end="url(#ar)"/>
<path d="M213,292H188" class="nv" marker-end="url(#ar)"/>
<text x="400" y="418" class="c b">Vigilance : un bien qui bouge ou disparaît sans écriture est un bien perdu pour la comptabilité.</text>
<text x="400" y="442" class="c">Interdit : acheter un bien qu'on a contribué à réformer ; déclarer « hors d'usage » un bien en bon état.</text>
<text x="400" y="478" class="c n">Seuils, organes et modèles : textes sur le patrimoine de l'État et la comptabilité publique (à confirmer).</text>

</svg>
