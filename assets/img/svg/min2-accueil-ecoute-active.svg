<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Boucle de l'écoute active : écouter sans couper, questions ouvertes puis fermées, reformuler, faire valider par l'usager, répondre ou agir.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Écoute active : la boucle de reformulation</text>
<rect x="24" y="62" width="221" height="94" rx="8" class="bl"/>
<text x="134.5" y="86" class="c b">1. Écouter</text>
<text x="134.5" y="108" class="c">Sans couper la parole</text>
<rect x="289" y="62" width="221" height="94" rx="8" class="wh"/>
<text x="399.5" y="86" class="c b">2. Questionner</text>
<text x="399.5" y="108" class="c">Questions ouvertes, puis</text>
<text x="399.5" y="126" class="c">fermées</text>
<rect x="554" y="62" width="221" height="94" rx="8" class="bl"/>
<text x="664.5" y="86" class="c b">3. Reformuler</text>
<text x="664.5" y="108" class="c">Reflet, clarification ou</text>
<text x="664.5" y="126" class="c">synthèse ; brève et neutre</text>
<rect x="24" y="206" width="221" height="94" rx="8" class="or"/>
<text x="134.5" y="230" class="c b">4. Faire valider</text>
<text x="134.5" y="252" class="c">Demander à l’usager de</text>
<text x="134.5" y="270" class="c">confirmer ou de corriger</text>
<rect x="289" y="206" width="221" height="94" rx="8" class="bl"/>
<text x="399.5" y="230" class="c b">5. Répondre ou agir</text>
<text x="399.5" y="252" class="c">Une fois la demande réelle</text>
<text x="399.5" y="270" class="c">comprise</text>
<path d="M247,109H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,109H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,158V181H134.5V203" class="ln" marker-end="url(#ar)"/>
<path d="M247,253H286" class="ln" marker-end="url(#ar)"/>
<text x="400" y="340" class="c">Distinguer l’émotion, la demande et le besoin réel.</text>
<text x="400" y="360" class="c">Si la validation est négative, on reformule à nouveau.</text>
</svg>
