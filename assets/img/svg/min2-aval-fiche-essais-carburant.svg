<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Fiche d'essais fictive : lot A d'essence avec indice d'octane de 92,0 pour un minimum de 95 (non conforme) et soufre conforme ; lot B de gazole avec densité, teneur en eau et indice de cétane conformes mais point d'éclair de 38 °C pour plus de 55 °C exigé (non conforme)</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.gd{fill:none;stroke:#D5D9E0;stroke-width:1.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Fiche d'essais de deux lots de carburant (exemple fictif)</text>
<text x="400" y="52" class="c o">LIMITES ET RÉSULTATS FICTIFS : les limites des textes en vigueur font foi</text>
<rect x="40" y="70" width="720" height="34" fill="#061F44"/>
<text x="52" y="92" class="w">Lot et paramètre</text><text x="332" y="92" class="w">Limite de l'exemple</text><text x="520" y="92" class="w">Résultat</text><text x="640" y="92" class="w">Verdict</text>
<rect x="40" y="104" width="720" height="46" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="124" class="n b">Lot A, essence</text><text x="52" y="141">Indice d'octane (RON)</text>
<text x="332" y="132">95 au minimum</text><text x="520" y="132" class="b">92,0</text>
<rect x="632" y="111" width="120" height="32" rx="6" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="692" y="132" class="c b">Non conforme</text>
<rect x="40" y="150" width="720" height="46" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="170" class="n b">Lot A, essence</text><text x="52" y="187">Soufre</text>
<text x="332" y="178">10 mg/kg au plus</text><text x="520" y="178" class="b">8 mg/kg</text>
<rect x="632" y="157" width="120" height="32" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<text x="692" y="178" class="c b">Conforme</text>
<rect x="40" y="196" width="720" height="46" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="216" class="n b">Lot B, gazole</text><text x="52" y="233">Densité à 15 °C</text>
<text x="332" y="224">820 à 845 kg/m³</text><text x="520" y="224" class="b">832 kg/m³</text>
<rect x="632" y="203" width="120" height="32" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<text x="692" y="224" class="c b">Conforme</text>
<rect x="40" y="242" width="720" height="46" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="262" class="n b">Lot B, gazole</text><text x="52" y="279">Point d'éclair</text>
<text x="332" y="270">plus de 55 °C</text><text x="520" y="270" class="b">38 °C</text>
<rect x="632" y="249" width="120" height="32" rx="6" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="692" y="270" class="c b">Non conforme</text>
<rect x="40" y="288" width="720" height="46" fill="#FCFBF8" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="308" class="n b">Lot B, gazole</text><text x="52" y="325">Teneur en eau</text>
<text x="332" y="316">200 mg/kg au plus</text><text x="520" y="316" class="b">150 mg/kg</text>
<rect x="632" y="295" width="120" height="32" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<text x="692" y="316" class="c b">Conforme</text>
<rect x="40" y="334" width="720" height="46" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="52" y="354" class="n b">Lot B, gazole</text><text x="52" y="371">Indice de cétane</text>
<text x="332" y="362">51 au minimum</text><text x="520" y="362" class="b">53</text>
<rect x="632" y="341" width="120" height="32" rx="6" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<text x="692" y="362" class="c b">Conforme</text>
<text x="400" y="408" class="c b">Un seul paramètre hors limite suffit à rendre un lot non conforme.</text>
<text x="400" y="432" class="c">Un point d'éclair très bas évoque un produit plus léger (solvant, essence) mélangé au gazole.</text>
<text x="400" y="456" class="c">Les paramètres conformes ne rattrapent pas un paramètre hors limite.</text>
<text x="400" y="486" class="c n">Valeurs inventées pour s'exercer ; elles ne décrivent aucune livraison réelle.</text>
</svg>
