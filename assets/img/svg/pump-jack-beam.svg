<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Unité de pompage à balancier (pompe à tiges) : tête de cheval, balancier, chevalet (Samson post), bielle, manivelle avec contrepoids, réducteur, moteur et courroies, tige lisse, tête de puits, tubing, tiges de pompage et pompe de fond</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.of{fill:#F28C28;stroke:#061F44;stroke-width:2}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Unité de pompage à balancier (pompe à tiges)</text>

<!-- sol -->
<rect x="0" y="420" width="800" height="80" fill="#E8EAEE"/>
<line x1="0" y1="420" x2="800" y2="420" class="s"/>

<!-- base et chevalet -->
<rect x="270" y="410" width="330" height="10" class="gr"/>
<path d="M310,412L360,195L410,412" fill="none" stroke="#061F44" stroke-width="4"/>
<path d="M338,290H382M327,340H393M338,290L393,340M382,290L327,340" class="ld"/>

<!-- balancier et tête de cheval -->
<polygon points="180,166 540,212 540,226 180,180" class="bl"/>
<path d="M186,110C150,150 150,215 182,250L196,240C172,205 172,150 200,118Z" class="bl"/>
<circle cx="360" cy="195" r="11" class="gr"/>

<!-- câble, tige lisse -->
<path d="M172,222L160,262M186,224L172,262" class="ld"/>
<rect x="150" y="262" width="30" height="7" class="gr"/>
<line x1="165" y1="269" x2="165" y2="400" stroke="#061F44" stroke-width="4"/>

<!-- tête de puits et tubing -->
<rect x="145" y="395" width="40" height="25" class="gr"/>
<line x1="145" y1="408" x2="60" y2="408" class="or" marker-end="url(#ao)"/>
<path d="M152,420V495M178,420V495" class="s"/>
<line x1="165" y1="420" x2="165" y2="470" stroke="#061F44" stroke-width="3"/>
<rect x="156" y="468" width="18" height="24" class="bl"/>

<!-- bielle, manivelle, réducteur -->
<line x1="540" y1="226" x2="540" y2="300" stroke="#061F44" stroke-width="7"/>
<rect x="505" y="350" width="70" height="62" class="gr"/>
<circle cx="540" cy="345" r="45" class="gr"/>
<line x1="540" y1="345" x2="540" y2="303" stroke="#061F44" stroke-width="6"/>
<circle cx="540" cy="303" r="8" class="of"/>
<rect x="514" y="376" width="52" height="28" class="gr"/>

<!-- moteur et courroies -->
<path d="M575,386L636,388M575,410L636,408" class="ld"/>
<rect x="640" y="382" width="70" height="38" class="bl"/>
<circle cx="636" cy="398" r="10" class="wh"/>

<!-- libellés -->
<text x="20" y="100">Tête de cheval (horsehead)</text>
<text x="400" y="158">Balancier (walking beam)</text>
<text x="148" y="250" class="e">Câble (bridle)</text>
<path d="M150,246H166" class="ld"/>
<text x="148" y="325" class="e">Tige lisse</text>
<text x="148" y="341" class="e">(polished rod)</text>
<path d="M150,331H162" class="ld"/>
<text x="322" y="300" class="e">Chevalet</text>
<text x="322" y="316" class="e">(Samson post)</text>
<text x="556" y="262">Bielle (pitman)</text>
<text x="596" y="345">Manivelle + contrepoids</text>
<text x="615" y="376" class="c">Courroies</text>
<text x="540" y="442" class="c">Réducteur</text>
<text x="675" y="445" class="c">Moteur</text>
<text x="20" y="396">Vers conduite</text>
<text x="192" y="412">Tête de puits</text>
<text x="196" y="446">Tubing</text>
<text x="196" y="468">Tiges de pompage</text>
<text x="196" y="490">Pompe de fond (piston + clapets)</text>
<path d="M180,442H192M168,464H192M175,486H192" class="ld"/>
</svg>
