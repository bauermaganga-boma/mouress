<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Participations : dans un contrat de partage de production, l'État détient au plus 10 % des parts d'intérêts, portés par le contracteur et sans risque en exploration (article 218) ; l'opérateur national peut acquérir au plus 15 % aux conditions du marché (article 219) ; au capital d'un opérateur, l'État peut prendre au plus 10 % aux conditions du marché (article 5) ; en cas de cession, préemption de l'État sous 60 jours puis de l'opérateur national sous 45 jours</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Participations de l'État et de l'opérateur national</text>
<text x="40" y="58" class="b">Contrat de partage de production : parts d'intérêts (illustration aux plafonds, sur 100 parts)</text>
<rect x="40" y="68" width="72" height="44" class="orf"/><text x="76" y="95" class="c b">État</text>
<rect x="112" y="68" width="108" height="44" class="bl"/><text x="166" y="95" class="c b">Op. national</text>
<rect x="220" y="68" width="540" height="44" class="gr"/><text x="490" y="95" class="c b">Autres partenaires : le solde</text>
<path d="M76,114V132M166,114V132" class="ld"/>
<rect x="40" y="132" width="330" height="92" rx="6" class="gr"/>
<text x="50" y="154" class="t13">État : au plus 10 % des parts d'intérêts</text>
<text x="50" y="171" class="t13">(article 218). Part portée par le contracteur</text>
<text x="50" y="188" class="t13">; aucun risque en exploration.</text>
<rect x="385" y="132" width="375" height="92" rx="6" class="gr"/>
<text x="395" y="154" class="t13">Opérateur national : peut acquérir au plus 15 %, aux</text>
<text x="395" y="171" class="t13">conditions du marché, à compter de la signature du</text>
<text x="395" y="188" class="t13">contrat (article 219).</text>
<text x="40" y="256" class="b">Capital d'un opérateur (article 5)</text>
<rect x="40" y="266" width="72" height="34" class="orf"/><text x="76" y="288" class="c b">État</text>
<rect x="112" y="266" width="648" height="34" class="gr"/><text x="436" y="288" class="c b">Autres actionnaires</text>
<text x="40" y="322" class="t13">L'État peut prendre au plus 10 % du capital d'un opérateur titulaire d'une autorisation exclusive de</text>
<text x="40" y="339" class="t13">développement et de production, aux conditions du marché.</text>
<text x="40" y="372" class="b">Cession de droits d'un contrat (articles 55 et 56)</text>
<rect x="40" y="384" width="150" height="64" rx="6" class="bl"/><text x="115" y="410" class="c t13">Notification de la</text>
<text x="115" y="426" class="c t13">cession</text>
<rect x="215" y="384" width="190" height="64" rx="6" class="bl"/><text x="310" y="410" class="c t13">Préemption de l'État : 60</text>
<text x="310" y="426" class="c t13">jours</text>
<rect x="430" y="384" width="190" height="64" rx="6" class="bl"/><text x="525" y="410" class="c t13">Préemption de l'opérateur</text>
<text x="525" y="426" class="c t13">national : 45 jours</text>
<rect x="645" y="384" width="135" height="64" rx="6" class="bl"/><text x="712.5" y="410" class="c t13">Approbation de</text>
<text x="712.5" y="426" class="c t13">l'autorité</text>
<text x="712.5" y="442" class="c t13">compétente</text>
<path d="M192,416H213" class="or" marker-end="url(#ao)"/>
<path d="M407,416H428" class="or" marker-end="url(#ao)"/>
<path d="M622,416H643" class="or" marker-end="url(#ao)"/>
<text x="40" y="474" class="t13">Pas de droit de préemption entre sociétés d'un même groupe (article 56).</text>
</svg>
