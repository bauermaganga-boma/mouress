<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Gabarit annoté d'une lettre administrative : en-tête, lieu et date, destinataire, objet, appel, corps en trois temps, formule finale, signature, pièces jointes</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Structure d'une lettre administrative (gabarit annoté)</text>
<rect x="30" y="48" width="420" height="410" rx="6" class="wh"/>
<rect x="42" y="58" width="185" height="98" rx="8" class="bl"/>
<text x="134.5" y="74" class="c">Émetteur (ministère,</text>
<text x="134.5" y="93" class="c">direction, service)</text>
<text x="134.5" y="112" class="c">N° d'enregistrement</text>
<text x="134.5" y="131" class="c">Réf. : lettre citée</text>
<text x="134.5" y="150" class="c">P.J. : pièces jointes</text>
<rect x="247" y="58" width="191" height="98" rx="8" class="bl"/>
<text x="342.5" y="74" class="c">Libreville, le (date)</text>
<text x="342.5" y="93" class="c">Destinataire :</text>
<text x="342.5" y="112" class="c">fonction et adresse</text>
<text x="342.5" y="131" class="c">S/C : sous couvert de</text>
<text x="342.5" y="150" class="c">l'autorité intermédiaire</text>
<rect x="42" y="166" width="396" height="28" rx="4" class="or"/>
<text x="54" y="185" class="b">Objet : demande des données de production</text>
<text x="54" y="214">Monsieur le Directeur général,</text>
<rect x="42" y="226" width="396" height="30" rx="8" class="gr"/>
<text x="240" y="246" class="c">Rappel : référence citée et texte fondant la demande</text>
<rect x="42" y="262" width="396" height="30" rx="8" class="gr"/>
<text x="240" y="282" class="c">Exposé : un paragraphe court par idée</text>
<rect x="42" y="298" width="396" height="30" rx="8" class="gr"/>
<text x="240" y="318" class="c">Demande : ce qu'il faut faire, avant le (date limite)</text>
<rect x="42" y="338" width="396" height="46" rx="8" class="wh"/>
<text x="240" y="357" class="c">Je vous prie d'agréer, Monsieur le Directeur général,</text>
<text x="240" y="376" class="c">l'expression de ma haute considération.</text>
<rect x="257" y="394" width="181" height="54" rx="8" class="bl"/>
<text x="347.5" y="417" class="c">Fonction du signataire</text>
<text x="347.5" y="436" class="c">Signature et nom</text>
<rect x="42" y="394" width="205" height="54" rx="8" class="bl"/>
<text x="144.5" y="417" class="c">P.J. : 1. Tableau</text>
<text x="144.5" y="436" class="c">Copie : services concernés</text>
<circle cx="42" cy="58" r="11" class="dot"/><text x="42" y="62.5" class="wt">1</text>
<circle cx="438" cy="58" r="11" class="dot"/><text x="438" y="62.5" class="wt">2</text>
<circle cx="450" cy="180" r="11" class="dot"/><text x="450" y="184.5" class="wt">3</text>
<circle cx="450" cy="212" r="11" class="dot"/><text x="450" y="216.5" class="wt">4</text>
<circle cx="450" cy="277" r="11" class="dot"/><text x="450" y="281.5" class="wt">5</text>
<circle cx="450" cy="361" r="11" class="dot"/><text x="450" y="365.5" class="wt">6</text>
<circle cx="450" cy="421" r="11" class="dot"/><text x="450" y="425.5" class="wt">7</text>
<circle cx="42" cy="421" r="11" class="dot"/><text x="42" y="425.5" class="wt">8</text>
<circle cx="505" cy="70" r="11" class="dot"/><text x="505" y="74.5" class="wt">1</text>
<text x="525" y="75">Émetteur, n° d'enregistrement,</text>
<text x="525" y="93">référence, pièces jointes</text>
<circle cx="505" cy="117" r="11" class="dot"/><text x="505" y="121.5" class="wt">2</text>
<text x="525" y="122">Lieu, date et destinataire ;</text>
<text x="525" y="140">S/C = sous couvert de</text>
<circle cx="505" cy="164" r="11" class="dot"/><text x="505" y="168.5" class="wt">3</text>
<text x="525" y="169">Objet : une ligne précise,</text>
<text x="525" y="187">sans point final</text>
<circle cx="505" cy="211" r="11" class="dot"/><text x="505" y="215.5" class="wt">4</text>
<text x="525" y="216">Appel : reprend le titre</text>
<text x="525" y="234">du destinataire</text>
<circle cx="505" cy="258" r="11" class="dot"/><text x="505" y="262.5" class="wt">5</text>
<text x="525" y="263">Corps : rappel, exposé, demande</text>
<text x="525" y="281">avec délai souhaité</text>
<circle cx="505" cy="305" r="11" class="dot"/><text x="505" y="309.5" class="wt">6</text>
<text x="525" y="310">Formule finale : reprend l'appel,</text>
<text x="525" y="328">déférence selon le rang</text>
<circle cx="505" cy="352" r="11" class="dot"/><text x="505" y="356.5" class="wt">7</text>
<text x="525" y="357">Signature : fonction, nom ;</text>
<text x="525" y="375">P.O. = par ordre</text>
<circle cx="505" cy="399" r="11" class="dot"/><text x="505" y="403.5" class="wt">8</text>
<text x="525" y="404">Pièces jointes et copies</text>
<text x="525" y="422">listées en bas de lettre</text>
<text x="400" y="482" class="c n">Gabarit d'une lettre administrative (usages courants, à confirmer auprès du secrétariat de la direction).</text>

</svg>
