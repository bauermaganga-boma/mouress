<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Émissions de gaz à effet de serre par portée pour un opérateur pétrolier : portée 1 émissions directes (torchères, turbines, fuites), portée 2 électricité, vapeur et chaleur achetées, portée 3 autres émissions indirectes en amont (achats, transport par des tiers) et en aval (combustion des produits vendus par les clients)</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Émissions par portée (en tCO₂e)</text>
<rect x="18" y="60" width="226" height="250" rx="8" class="gr"/>
<text x="131" y="84" class="c b" style="font-size:14px">PORTÉE 3 · AMONT</text>
<text x="131" y="116" class="c" style="font-size:14px">Achats de biens et</text>
<text x="131" y="136" class="c" style="font-size:14px">de services</text>
<text x="131" y="156" class="c" style="font-size:14px"></text>
<text x="131" y="176" class="c" style="font-size:14px">Transport assuré</text>
<text x="131" y="196" class="c" style="font-size:14px">par des tiers</text>
<text x="131" y="216" class="c" style="font-size:14px">(navires, camions)</text>
<text x="131" y="236" class="c" style="font-size:14px"></text>
<text x="131" y="256" class="c" style="font-size:14px">Déplacements</text>
<text x="131" y="276" class="c" style="font-size:14px">professionnels</text>
<rect x="290" y="60" width="226" height="250" rx="8" class="bl"/>
<text x="403" y="84" class="c b" style="font-size:14px">L'OPÉRATEUR PÉTROLIER</text>
<rect x="304" y="98" width="198" height="116" rx="8" class="or"/>
<text x="403" y="120" class="c b" style="font-size:13px">PORTÉE 1 · directes</text>
<text x="403" y="137" class="c" style="font-size:13px"></text>
<text x="403" y="154" class="c" style="font-size:13px">Torchère, turbines,</text>
<text x="403" y="171" class="c" style="font-size:13px">moteurs, fours,</text>
<text x="403" y="188" class="c" style="font-size:13px">véhicules et navires propres,</text>
<text x="403" y="205" class="c" style="font-size:13px">fuites sur équipements</text>
<rect x="304" y="226" width="198" height="72" rx="8" class="gr"/>
<text x="403" y="250" class="c b" style="font-size:13px">PORTÉE 2 · énergie achetée</text>
<text x="403" y="268" class="c" style="font-size:13px">Électricité, vapeur,</text>
<text x="403" y="286" class="c" style="font-size:13px">chaleur achetées</text>
<rect x="562" y="60" width="220" height="250" rx="8" class="gr"/>
<text x="672" y="84" class="c b" style="font-size:14px">PORTÉE 3 · AVAL</text>
<text x="672" y="116" class="c" style="font-size:14px">Combustion par les clients</text>
<text x="672" y="136" class="c" style="font-size:14px">des produits vendus :</text>
<text x="672" y="156" class="c" style="font-size:14px">essence, gazole,</text>
<text x="672" y="176" class="c" style="font-size:14px">kérosène, gaz</text>
<text x="672" y="196" class="c" style="font-size:14px"></text>
<text x="672" y="216" class="c" style="font-size:14px">Transport et distribution</text>
<text x="672" y="236" class="c" style="font-size:14px">par des tiers</text>
<text x="672" y="276" class="c o" style="font-size:13px">Poste généralement dominant</text>
<path d="M246,185H288" class="ln" marker-end="url(#ar)" style="stroke-width:3"/>
<path d="M518,185H560" class="ln" marker-end="url(#ar)" style="stroke-width:3"/>
<rect x="304" y="350" width="198" height="50" rx="8" class="gr"/>
<text x="403" y="371" class="c" style="font-size:13px">Fournisseur d'énergie</text>
<text x="403" y="388" class="c" style="font-size:13px">(réseau électrique)</text>
<path d="M403,348V312" class="ln" marker-end="url(#ar)" style="stroke-width:3"/>
<text x="418" y="336" style="font-size:13px">émissions chez le fournisseur</text>
<rect x="20" y="420" width="760" height="82" rx="8" class="bl"/>
<text x="400" y="444" class="c" style="font-size:14px">Double comptage : la portée 3 d'une entreprise est souvent la portée 1 d'une autre (le client</text>
<text x="400" y="465" class="c" style="font-size:14px">qui brûle le carburant). On n'additionne donc pas les portées 3 de plusieurs entreprises.</text>
<text x="400" y="486" class="c" style="font-size:14px">Un bilan se lit toujours avec son périmètre : quelles portées, quelle année, quelle méthode.</text>
</svg>
