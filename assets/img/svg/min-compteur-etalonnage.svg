<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Étalonnage d'un compteur : comparaison avec le prouveur (volume de l'étalon 5,000 m³, volume indiqué 4,985 m³, facteur égal à 5,000 divisé par 4,985, soit environ 1,0030), étapes de l'étalonnage et chaîne de traçabilité de l'étalon national au compteur en service</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
.dn{fill:none;stroke:#061F44;stroke-width:2.5;stroke-dasharray:8 6}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}.dn{fill:none;stroke:#061F44;stroke-width:2.5;stroke-dasharray:8 6}
</style></defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Un compteur et son étalonnage</text>
<rect x="30" y="48" width="170" height="60" class="bl"/><text x="115" y="74" class="c b">Compteur en service</text><text x="115" y="96" class="c">indique 4,985 m³</text>
<path d="M200,78H265" class="nv" marker-end="url(#ar)"/>
<rect x="270" y="48" width="170" height="60" class="gr"/><text x="355" y="74" class="c b">Prouveur (étalon)</text><text x="355" y="96" class="c">délivre 5,000 m³</text>
<rect x="465" y="48" width="305" height="60" rx="8" class="orf"/>
<text x="617" y="70" class="c b">Facteur du compteur =</text><text x="617" y="92" class="c b">volume étalon ÷ volume indiqué</text>
<text x="617" y="128" class="c o">5,000 ÷ 4,985 ≈ 1,0030</text>
<text x="30" y="160" class="b">Étapes de l'étalonnage</text>
<rect x="30" y="172" width="164" height="76" rx="8" class="bl"/><text x="40" y="196" class="o">1</text><text x="112" y="196" class="c" dx="8">Mesures « tel que</text><text x="112" y="216" class="c" dx="8">trouvé »</text>
<path d="M196,210H218" class="or" marker-end="url(#ao)"/>
<rect x="222" y="172" width="164" height="76" rx="8" class="gr"/><text x="232" y="196" class="o">2</text><text x="304" y="196" class="c" dx="8">Comparaison avec</text><text x="304" y="216" class="c" dx="8">l'étalon</text>
<path d="M388,210H410" class="or" marker-end="url(#ao)"/>
<rect x="414" y="172" width="164" height="76" rx="8" class="bl"/><text x="424" y="196" class="o">3</text><text x="496" y="196" class="c" dx="8">Ajustage si le</text><text x="496" y="216" class="c" dx="8">compteur est hors</text><text x="496" y="236" class="c" dx="8">tolérance</text>
<path d="M580,210H602" class="or" marker-end="url(#ao)"/>
<rect x="606" y="172" width="164" height="76" rx="8" class="gr"/><text x="616" y="196" class="o">4</text><text x="688" y="196" class="c" dx="8">Certificat</text><text x="688" y="216" class="c" dx="8">d'étalonnage</text>
<text x="30" y="285" class="b">Chaîne de traçabilité (du plus haut au plus bas)</text>
<rect x="30" y="300" width="164" height="70" rx="8" class="gr"/><text x="112" y="330" class="c b">Étalon national</text><text x="112" y="352" class="c">raccordé au SI</text>
<path d="M196,335H218" class="nv" marker-end="url(#ar)"/>
<rect x="222" y="300" width="164" height="70" rx="8" class="gr"/><text x="304" y="330" class="c b">Étalon de référence</text><text x="304" y="352" class="c">laboratoire accrédité</text>
<path d="M388,335H410" class="nv" marker-end="url(#ar)"/>
<rect x="414" y="300" width="164" height="70" rx="8" class="gr"/><text x="496" y="330" class="c b">Étalon de travail</text><text x="496" y="352" class="c">prouveur</text>
<path d="M580,335H602" class="nv" marker-end="url(#ar)"/>
<rect x="606" y="300" width="164" height="70" rx="8" class="bl"/><text x="688" y="330" class="c b">Compteur en service</text><text x="688" y="352" class="c">mesure la production</text>
<text x="400" y="408" class="c">Chaque maillon est comparé au maillon qui le précède : le résultat reste raccordé à l'étalon national.</text>
<text x="400" y="434" class="c" style="font-size:13px">Les volumes de l'exemple sont fictifs. SI : Système international d'unités.</text>
</svg>
