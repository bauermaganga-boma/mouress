<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Courbe de probabilité de dépassement d’un volume de prospect en millions de barils, valeurs fictives : P90 égal 20 Mbbl avec 90 % de chances d’en trouver au moins autant, P50 égal 60 Mbbl avec 50 % de chances, P10 égal 150 Mbbl avec 10 % de chances</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.t{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.dz{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:6 5}
.og{fill:#F28C28;stroke:#061F44;stroke-width:2}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Fourchette de volumes : P90, P50, P10 (valeurs fictives)</text>

<path d="M110,80V400H720" class="s"/><path d="M105,400H110" class="ld"/><text x="98" y="405" class="e t">0 %</text><path d="M105,320H110" class="ld"/><text x="98" y="325" class="e t">25 %</text><path d="M105,240H110" class="ld"/><text x="98" y="245" class="e t">50 %</text><path d="M105,160H110" class="ld"/><text x="98" y="165" class="e t">75 %</text><path d="M105,80H110" class="ld"/><text x="98" y="85" class="e t">100 %</text><path d="M110,400v6" class="ld"/><text x="110" y="424" class="c t">0</text><path d="M260,400v6" class="ld"/><text x="260" y="424" class="c t">50</text><path d="M410,400v6" class="ld"/><text x="410" y="424" class="c t">100</text><path d="M560,400v6" class="ld"/><text x="560" y="424" class="c t">150</text><path d="M710,400v6" class="ld"/><text x="710" y="424" class="c t">200</text><text x="415" y="452" class="c">Volume d’huile récupérable (millions de barils, Mbbl)</text><text x="14" y="62" class="t">Probabilité de dépasser ce volume</text><path d="M110,83.19999999999999 C120.0,88.0 150.0,96.5 170,112 C190.0,127.5 210.0,154.7 230,176 C250.0,197.3 260.0,216.0 290,240 C320.0,264.0 365.0,298.7 410,320 C455.0,341.3 510.0,356.3 560,368 C610.0,379.7 685.0,386.7 710,390.4" class="nv"/><path d="M170,400V112H110" class="dz"/><circle cx="170" cy="112" r="7" class="og"/><text x="184" y="104" class="o">P90 = 20 Mbbl</text><path d="M290,400V240H110" class="dz"/><circle cx="290" cy="240" r="7" class="og"/><text x="304" y="230" class="o">P50 = 60 Mbbl</text><path d="M560,400V368H110" class="dz"/><circle cx="560" cy="368" r="7" class="og"/><text x="550" y="352" class="o">P10 = 150 Mbbl</text><text x="480" y="130" class="t">P90 : estimation basse (90 % de chances</text><text x="480" y="148" class="t">d’en trouver au moins autant)</text><text x="480" y="180" class="t">P50 : médiane</text><text x="480" y="212" class="t">P10 : estimation haute (10 % de chances</text><text x="480" y="230" class="t">seulement de dépasser ce volume)</text></svg>
