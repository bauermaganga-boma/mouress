<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Phases d'un projet amont et jalons administratifs : accès au domaine, exploration, évaluation, développement, production, abandon ; décret d'approbation du contrat et autorisation d'exploration, notification de la découverte, déclaration de commercialité et autorisation de développement et de production, premier pétrole, fin d'exploitation ; risque géologique décroissant et dépenses cumulées croissantes</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Phases d'un projet amont et jalons administratifs</text>
<polygon points="20.0,55.0 136.7,55.0 146.7,80.0 136.7,105.0 20.0,105.0 30.0,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="83.3" y="76" class="c b">Accès au</text><text x="83.3" y="93" class="c b">domaine</text>
<polygon points="146.7,55.0 263.3,55.0 273.3,80.0 263.3,105.0 146.7,105.0 156.7,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="210.0" y="85" class="c b">Exploration</text>
<polygon points="273.3,55.0 390.0,55.0 400.0,80.0 390.0,105.0 273.3,105.0 283.3,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="336.7" y="85" class="c b">Évaluation</text>
<polygon points="400.0,55.0 516.7,55.0 526.7,80.0 516.7,105.0 400.0,105.0 410.0,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="463.3" y="85" class="c b">Développement</text>
<polygon points="526.7,55.0 643.3,55.0 653.3,80.0 643.3,105.0 526.7,105.0 536.7,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="590.0" y="85" class="c b">Production</text>
<polygon points="653.3,55.0 770.0,55.0 780.0,80.0 770.0,105.0 653.3,105.0 663.3,80.0" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="716.7" y="85" class="c b">Abandon</text>
<path d="M146.7,87V165" class="ld"/>
<rect x="41.7" y="165" width="210" height="82" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="146.7" y="187" class="c">Décret d'approbation du contrat,</text>
<text x="146.7" y="204" class="c">puis autorisation exclusive</text>
<text x="146.7" y="221" class="c">d'exploration (art. 82)</text>
<polygon points="138.7,80.0 146.7,72.0 154.7,80.0 146.7,88.0" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M273.3,87V262" class="ld"/>
<rect x="168.3" y="262" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="273.3" y="284" class="c">Découverte : le contracteur</text>
<text x="273.3" y="301" class="c">informe l'administration</text>
<text x="273.3" y="318" class="c">sans délai (art. 63)</text>
<polygon points="265.3,80.0 273.3,72.0 281.3,80.0 273.3,88.0" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M400.0,87V165" class="ld"/>
<rect x="295.0" y="165" width="210" height="82" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="400.0" y="187" class="c">Commercialité déclarée,</text>
<text x="400.0" y="204" class="c">plan de développement approuvé,</text>
<text x="400.0" y="221" class="c">autorisation de développement</text>
<text x="400.0" y="238" class="c">et de production (art. 84-86)</text>
<polygon points="392.0,80.0 400.0,72.0 408.0,80.0 400.0,88.0" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M526.7,87V262" class="ld"/>
<rect x="421.7" y="262" width="210" height="66" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="526.7" y="284" class="c">Fin des installations,</text>
<text x="526.7" y="301" class="c">démarrage de la production</text>
<text x="526.7" y="318" class="c">(« premier pétrole »)</text>
<polygon points="518.7,80.0 526.7,72.0 534.7,80.0 526.7,88.0" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M653.3,87V165" class="ld"/>
<rect x="548.3" y="165" width="210" height="82" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="653.3" y="187" class="c">Fin d'exploitation du champ :</text>
<text x="653.3" y="204" class="c">bouchage des puits, démontage,</text>
<text x="653.3" y="221" class="c">remise en état (art. 173)</text>
<polygon points="645.3,80.0 653.3,72.0 661.3,80.0 653.3,88.0" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M20,455H780" class="ld"/>
<path d="M20,362C250,366 400,425 780,452" fill="none" stroke="#F28C28" stroke-width="4"/>
<path d="M20,452C300,451 420,449 540,430S700,372 780,362" fill="none" stroke="#061F44" stroke-width="4"/>
<text x="20" y="346" class="o">Risque géologique (de plus en plus faible)</text>
<text x="780" y="346" class="b e">Dépenses cumulées (de plus en plus élevées)</text>
<text x="400" y="482" class="c b">Avant toute opération : plan d'abandon et de réhabilitation à soumettre (art. 173)</text>
</svg>
