<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Clauses essentielles d'un contrat d'exploration et de partage de production : programme minimum de travaux, récupération des coûts, partage de la production, phases d'exploration, participation de l'État, suivi et contrôle ; modèle type fixé par arrêté</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.sm{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.or{fill:#FFF1DF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.ln{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Clauses essentielles d'un contrat d'exploration et de partage de production</text><rect x="150" y="50" width="500" height="56" rx="8" class="or"/>
<text x="400" y="74" class="b c">Modèle type de chaque contrat : fixé par arrêté</text>
<text x="400" y="92" class="c">de l'autorité compétente (article 43)</text><rect x="30" y="135" width="230" height="118" rx="8" class="bl"/>
<text x="145" y="167.5" class="b c">1. Programme minimum</text>
<text x="145" y="188.5" class="b c">de travaux</text>
<text x="145" y="209.5" class="c">Engagement d'exploration</text>
<text x="145" y="230.5" class="c">(art. 61)</text><rect x="285" y="135" width="230" height="118" rx="8" class="bl"/>
<text x="400" y="167.5" class="b c">2. Récupération des</text>
<text x="400" y="188.5" class="b c">coûts pétroliers</text>
<text x="400" y="209.5" class="c">Modalités et plafond annuel</text>
<text x="400" y="230.5" class="c">(art. 61, 220, 221)</text><rect x="540" y="135" width="230" height="118" rx="8" class="bl"/>
<text x="655" y="167.5" class="b c">3. Partage de la</text>
<text x="655" y="188.5" class="b c">production</text>
<text x="655" y="209.5" class="c">Quote-part de chacun ; taux de la</text>
<text x="655" y="230.5" class="c">redevance minière (art. 61, 209)</text><rect x="30" y="275" width="230" height="118" rx="8" class="bl"/>
<text x="145" y="307.5" class="b c">4. Phases d'exploration</text>
<text x="145" y="328.5" class="b c">et primes</text>
<text x="145" y="349.5" class="c">Durée, prorogation, extension</text>
<text x="145" y="370.5" class="c">(art. 83, 91, 206)</text><rect x="285" y="275" width="230" height="118" rx="8" class="bl"/>
<text x="400" y="307.5" class="b c">5. Participation de l'État</text>
<text x="400" y="328.5" class="b c">clause obligatoire</text>
<text x="400" y="349.5" class="c">10 % au plus, sans risque en</text>
<text x="400" y="370.5" class="c">exploration (art. 218)</text><rect x="540" y="275" width="230" height="118" rx="8" class="bl"/>
<text x="655" y="318" class="b c">6. Suivi et contrôle</text>
<text x="655" y="339" class="c">Modalités d'exécution, de suivi</text>
<text x="655" y="360" class="c">et de contrôle (art. 41)</text><path d="M400,106V128" class="ln" marker-end="url(#ao)"/><rect x="30" y="418" width="740" height="60" rx="8" class="gr"/>
<text x="400" y="444" class="b c">Le contracteur agit au nom et pour le compte de l'État, à ses risques techniques et financiers exclusifs,</text>
<text x="400" y="462" class="c">et reçoit une quote-part de la production (article 61).</text>
</svg>
