<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Courbe schématique des réactions face à un changement, en quatre phases : 1 choc et déni (la performance baisse), 2 résistance (le point bas), 3 exploration (les agents essaient et remontent), 4 engagement (les nouvelles pratiques s'installent). Pour chaque phase, un geste du cadre : informer, écouter, former et accompagner, reconnaître et ancrer. Illustration qualitative sans valeurs chiffrées.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.w{fill:#FFFFFF;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Courbe des réactions face à un changement</text>
<line x1="70" y1="300" x2="70" y2="55" class="nv" marker-end="url(#ar)"/><line x1="70" y1="300" x2="770" y2="300" class="nv" marker-end="url(#ar)"/>
<text x="80" y="72">Performance et moral</text>
<text x="770" y="324" class="e b">Temps</text>
<line x1="70" y1="130" x2="770" y2="130" stroke="#061F44" stroke-width="1.5" stroke-dasharray="6 6"/>

<text x="770" y="150" class="e">Niveau avant le changement</text>
<path d="M70,130 C140,128 180,150 230,215 C270,268 310,276 350,270 C420,255 470,180 540,150 C610,120 680,105 760,100" class="or"/>
<rect x="30" y="345" width="175" height="120" rx="8" class="gr"/>
<text x="117" y="372" class="b c">1. Choc, déni</text>
<text x="42" y="400" class="o">Geste du cadre :</text>
<text x="42" y="424">Informer vite,</text>
<text x="42" y="444">expliquer pourquoi</text>
<rect x="225" y="345" width="175" height="120" rx="8" class="gr"/>
<text x="312" y="372" class="b c">2. Résistance</text>
<text x="237" y="400" class="o">Geste du cadre :</text>
<text x="237" y="424">Écouter, accueillir</text>
<text x="237" y="444">les craintes</text>
<rect x="420" y="345" width="175" height="120" rx="8" class="bl"/>
<text x="507" y="372" class="b c">3. Exploration</text>
<text x="432" y="400" class="o">Geste du cadre :</text>
<text x="432" y="424">Former, accompagner,</text>
<text x="432" y="444">laisser essayer</text>
<rect x="615" y="345" width="175" height="120" rx="8" class="bl"/>
<text x="702" y="372" class="b c">4. Engagement</text>
<text x="627" y="400" class="o">Geste du cadre :</text>
<text x="627" y="424">Reconnaître, ancrer</text>
<text x="627" y="444">les nouvelles pratiques</text>
<text x="340" y="296" class="b c">Point bas</text>
<line x1="340" y1="274" x2="340" y2="282" stroke="#061F44" stroke-width="2"/>
<text x="400" y="490" class="c">Schéma qualitatif : la durée de chaque phase varie selon les agents.</text>
</svg>
