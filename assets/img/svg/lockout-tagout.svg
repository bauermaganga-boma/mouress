<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Consignation d'une installation : un organe de coupure condamné par un cadenas et une étiquette, et les étapes séparer, condamner, identifier, vérifier l'absence de tension, mettre à la terre</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.h{font-size:16px;font-weight:700}
.s{stroke:#061F44;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.n{font-size:16px;font-weight:700;fill:#061F44;text-anchor:middle}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Consignation d'une installation avant intervention</text>

<!-- coffret / disjoncteur -->
<rect x="50" y="70" width="230" height="330" rx="10" fill="#E8EAEE" stroke="#061F44" stroke-width="3"/>
<rect x="95" y="105" width="140" height="150" rx="8" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text class="m b" x="165" y="130">OFF  0</text>
<rect x="143" y="145" width="44" height="86" rx="6" fill="#FCFBF8" stroke="#061F44" stroke-width="2.5"/>
<rect x="148" y="190" width="34" height="36" rx="4" fill="#061F44"/>
<!-- cadenas -->
<path d="M184,262 L184,246 C184,226 216,226 216,246 L216,262" class="s" stroke-width="5"/>
<rect x="170" y="262" width="60" height="46" rx="6" fill="#F28C28" stroke="#061F44" stroke-width="3"/>
<circle cx="200" cy="282" r="6" fill="#061F44"/><rect x="198" y="284" width="4" height="14" fill="#061F44"/>
<!-- étiquette -->
<line class="s" x1="170" y1="296" x2="128" y2="326"/>
<rect x="68" y="322" width="120" height="66" rx="5" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<rect x="68" y="322" width="120" height="22" rx="5" fill="#C8102E"/>
<text class="m b" x="128" y="338" style="fill:#FFFFFF">DANGER</text>
<text class="m b" x="128" y="362" style="font-size:14px">NE PAS</text><text class="m b" x="128" y="380" style="font-size:14px">MANŒUVRER</text>
<text class="m" x="165" y="426">Cadenas + étiquette de condamnation</text>

<!-- étapes -->
<g>
<circle cx="335" cy="96" r="17" fill="#F28C28"/><text class="n" x="335" y="102">1</text>
<text class="h" x="365" y="92">Séparer</text><text x="365" y="112">Ouvrir les organes de coupure de toutes les sources</text>
<circle cx="335" cy="176" r="17" fill="#F28C28"/><text class="n" x="335" y="182">2</text>
<text class="h" x="365" y="172">Condamner</text><text x="365" y="192">Cadenas et étiquette, clé gardée sur soi</text>
<circle cx="335" cy="256" r="17" fill="#F28C28"/><text class="n" x="335" y="262">3</text>
<text class="h" x="365" y="252">Identifier</text><text x="365" y="272">Repérer l'ouvrage et le circuit concernés</text>
<circle cx="335" cy="336" r="17" fill="#F28C28"/><text class="n" x="335" y="342">4</text>
<text class="h" x="365" y="332">Vérifier l'absence de tension (VAT)</text><text x="365" y="352">Avec un VAT, en amont et en aval du point de travail</text>
<circle cx="335" cy="416" r="17" fill="#F28C28"/><text class="n" x="335" y="422">5</text>
<text class="h" x="365" y="412">Mettre à la terre et en court-circuit</text><text x="365" y="432">Si nécessaire (HT), puis délimiter la zone de travail</text>
</g>
<line x1="335" y1="113" x2="335" y2="159" stroke="#061F44" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="335" y1="193" x2="335" y2="239" stroke="#061F44" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="335" y1="273" x2="335" y2="319" stroke="#061F44" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="335" y1="353" x2="335" y2="399" stroke="#061F44" stroke-width="2" stroke-dasharray="4 4"/>
<text x="50" y="466">Seul le personnel habilité peut consigner et déconsigner.</text>
</svg>
