<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Organigramme d'une entreprise : direction générale, directions technique, ressources humaines, administrative et financière, QHSE, et services de la DRH</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}
.k{stroke:#061F44;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.x{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}.y{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}.o{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Organigramme : place de la fonction ressources humaines</text>

<!-- liens -->
<path class="k" d="M400,126 V150 M90,150 H700 M90,150 V176 M300,150 V176 M520,150 V176 M700,150 V176"/>
<path class="k" d="M300,226 V266 M120,266 H480 M120,266 V300 M300,266 V300 M480,266 V300"/>

<!-- niveau 1 -->
<rect class="x" x="290" y="76" width="220" height="50" rx="8"/>
<text class="m b" x="400" y="98">Direction générale</text><text class="m" x="400" y="116">Directeur général</text>

<!-- niveau 2 -->
<rect class="y" x="15" y="176" width="150" height="50" rx="8"/><text class="m b" x="90" y="198">Direction</text><text class="m b" x="90" y="216">technique</text>
<rect class="o" x="225" y="176" width="150" height="50" rx="8"/><text class="m b" x="300" y="198">DRH</text><text class="m" x="300" y="216">Ressources humaines</text>
<rect class="y" x="445" y="176" width="150" height="50" rx="8"/><text class="m b" x="520" y="198">DAF</text><text class="m" x="520" y="216">Admin. et finances</text>
<rect class="y" x="625" y="176" width="150" height="50" rx="8"/><text class="m b" x="700" y="198">Direction</text><text class="m b" x="700" y="216">QHSE</text>

<!-- niveau 3 -->
<rect class="x" x="40" y="300" width="160" height="56" rx="8"/><text class="m" x="120" y="324">Recrutement</text><text class="m" x="120" y="342">et formation</text>
<rect class="x" x="220" y="300" width="160" height="56" rx="8"/><text class="m" x="300" y="324">Paie et</text><text class="m" x="300" y="342">administration</text>
<rect class="x" x="400" y="300" width="160" height="56" rx="8"/><text class="m" x="480" y="324">Relations sociales</text><text class="m" x="480" y="342">et dialogue social</text>

<!-- encadré missions -->
<rect x="585" y="268" width="195" height="130" rx="8" fill="#FCFBF8" stroke="#F28C28" stroke-width="2.5"/>
<text class="b" x="598" y="292">Missions de la DRH</text>
<text x="598" y="316">Recrutement, intégration</text>
<text x="598" y="336">Paie, congés, contrats</text>
<text x="598" y="356">Formation, carrières</text>
<text x="598" y="376">Dialogue social</text>

<text class="m" x="300" y="424">La DRH rend compte à la direction générale.</text>
<text class="m" x="300" y="444">Elle veille au respect du Code du travail.</text>
</svg>
