<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Circuit du gaz de pétrole liquéfié : navire (importation), dépôt de stockage, camion-citerne, centre emplisseur, bouteilles pleines, revendeurs, ménage, retour des bouteilles vides par la consigne ; quatre étapes au centre emplisseur : tri et contrôle de la bouteille vide, remplissage à la pesée, contrôle d'étanchéité, épreuve hydraulique périodique</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="30" class="h">Circuit du GPL, du navire au ménage</text>
<rect x="20" y="60" width="150" height="62" class="bl"/><text x="95" y="86" class="c">Navire de GPL</text><text x="95" y="106" class="c n">(importation)</text>
<path d="M170,91H213" class="nv" marker-end="url(#ar)"/>
<rect x="215" y="60" width="150" height="62" class="bl"/><text x="290" y="86" class="c">Dépôt de GPL</text><text x="290" y="106" class="c n">(sphères, réservoirs)</text>
<path d="M365,91H408" class="nv" marker-end="url(#ar)"/>
<rect x="410" y="60" width="150" height="62" class="bl"/><text x="485" y="86" class="c">Camion-citerne</text><text x="485" y="106" class="c n">(GPL en vrac)</text>
<path d="M560,91H603" class="nv" marker-end="url(#ar)"/>
<rect x="605" y="60" width="150" height="62" class="gr"/><text x="680" y="86" class="c b">Centre</text><text x="680" y="106" class="c b">emplisseur</text>
<path d="M680,122V198" class="nv" marker-end="url(#ar)"/>
<rect x="605" y="200" width="150" height="60" class="bl"/><text x="680" y="226" class="c">Bouteilles</text><text x="680" y="246" class="c">pleines</text>
<path d="M603,230H562" class="nv" marker-end="url(#ar)"/>
<rect x="410" y="200" width="150" height="60" class="bl"/><text x="485" y="226" class="c">Revendeurs</text><text x="485" y="246" class="c n">(points de vente)</text>
<path d="M408,230H367" class="nv" marker-end="url(#ar)"/>
<rect x="215" y="200" width="150" height="60" class="bl"/><text x="290" y="226" class="c">Ménage</text><text x="290" y="246" class="c n">(bouteille en usage)</text>
<path d="M290,262V300H780V91H757" class="or" marker-end="url(#ao)"/>
<text x="520" y="292" class="c o">Retour des bouteilles vides (consigne)</text>
<text x="20" y="345" class="b">Étapes principales au centre emplisseur</text>
<rect x="20" y="360" width="175" height="95" class="gr"/><text x="107" y="385" class="c b">1</text><text x="107" y="405" class="c n">Tri et contrôle de</text><text x="107" y="422" class="c n">la bouteille vide</text><text x="107" y="439" class="c n">(état, date d'épreuve)</text>
<rect x="215" y="360" width="175" height="95" class="gr"/><text x="302" y="385" class="c b">2</text><text x="302" y="405" class="c n">Remplissage</text><text x="302" y="422" class="c n">à la pesée</text><text x="302" y="439" class="c n">(tare + masse de gaz)</text>
<rect x="410" y="360" width="175" height="95" class="gr"/><text x="497" y="385" class="c b">3</text><text x="497" y="405" class="c n">Contrôle de</text><text x="497" y="422" class="c n">l'étanchéité</text><text x="497" y="439" class="c n">(détection de fuite)</text>
<rect x="605" y="360" width="175" height="95" class="gr"/><text x="692" y="385" class="c b">4</text><text x="692" y="405" class="c n">Épreuve hydraulique</text><text x="692" y="422" class="c n">périodique de la</text><text x="692" y="439" class="c n">bouteille (requalification)</text>
<path d="M195,407H213M390,407H408M585,407H603" class="nv" marker-end="url(#ar)"/>
<text x="400" y="485" class="c n">Schéma de principe, sans valeur réglementaire.</text>

</svg>
