<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Ventilation d'une mine souterraine : puits d'entrée d'air frais, galerie d'entrée, chantier, galerie de retour, puits de sortie d'air vicié avec ventilateur principal, galerie en cul-de-sac avec gaine et ventilateur auxiliaire</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.f{stroke:#2E7DD1;stroke-width:4;fill:none}.v{stroke:#D9741A;stroke-width:4;fill:none}
</style>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7DD1"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D9741A"/></marker>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Ventilation d'une mine souterraine</text>

<!-- terrain -->
<rect x="20" y="120" width="760" height="300" fill="#E8EAEE" stroke="#061F44" stroke-width="3"/>
<!-- chantier -->
<rect x="240" y="225" width="160" height="110" fill="#FFB766" stroke="#061F44" stroke-width="2"/>
<!-- galeries -->
<rect x="134" y="335" width="466" height="20" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/>
<rect x="240" y="205" width="436" height="20" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/>
<!-- puits -->
<rect x="106" y="120" width="28" height="235" fill="#FCFBF8" stroke="#061F44" stroke-width="2.5"/>
<rect x="676" y="120" width="28" height="105" fill="#FCFBF8" stroke="#061F44" stroke-width="2.5"/>
<!-- ventilateur principal -->
<rect x="655" y="78" width="70" height="42" fill="#E8EAEE" stroke="#061F44" stroke-width="2.5"/>
<circle cx="690" cy="99" r="15" fill="#FCFBF8" stroke="#061F44" stroke-width="2.5"/>
<path d="M690,99 L690,86 M690,99 L701,106 M690,99 L679,106" stroke="#061F44" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<!-- gaine + ventilateur auxiliaire -->
<rect x="426" y="338" width="164" height="6" fill="#DCE6F5" stroke="#061F44" stroke-width="1.5"/>
<circle cx="420" cy="341" r="7" fill="#FCFBF8" stroke="#061F44" stroke-width="2"/>

<!-- flux air frais -->
<line class="f" x1="120" y1="92" x2="120" y2="124" marker-end="url(#ab)"/>
<line class="f" x1="120" y1="140" x2="120" y2="190" marker-end="url(#ab)"/>
<line class="f" x1="120" y1="240" x2="120" y2="300" marker-end="url(#ab)"/>
<line class="f" x1="150" y1="345" x2="215" y2="345" marker-end="url(#ab)"/>
<line class="f" x1="270" y1="345" x2="330" y2="345" marker-end="url(#ab)"/>
<line class="f" x1="262" y1="328" x2="262" y2="238" marker-end="url(#ab)"/>
<line class="f" x1="378" y1="328" x2="378" y2="238" marker-end="url(#ab)"/>
<line class="f" x1="438" y1="341" x2="578" y2="341" stroke-width="3" marker-end="url(#ab)"/>
<!-- flux air vicié -->
<line class="v" x1="590" y1="349" x2="430" y2="349" stroke-width="3" marker-end="url(#ao)"/>
<line class="v" x1="290" y1="215" x2="380" y2="215" marker-end="url(#ao)"/>
<line class="v" x1="410" y1="215" x2="500" y2="215" marker-end="url(#ao)"/>
<line class="v" x1="520" y1="215" x2="600" y2="215" marker-end="url(#ao)"/>
<line class="v" x1="620" y1="215" x2="668" y2="215" marker-end="url(#ao)"/>
<line class="v" x1="690" y1="200" x2="690" y2="132" marker-end="url(#ao)"/>
<line class="v" x1="690" y1="76" x2="690" y2="50" marker-end="url(#ao)"/>

<text class="b" x="132" y="86">Air frais</text>
<text class="b" x="702" y="62" style="fill:#D9741A">Air vicié</text>
<text class="e" x="645" y="104">Ventilateur principal</text>
<text x="150" y="172">Puits d'entrée d'air frais</text>
<text class="e" x="650" y="172">Puits de sortie d'air vicié</text>
<text class="b m" x="320" y="277">Chantier</text>
<text class="m" x="320" y="295">d'exploitation</text>
<text x="140" y="382">Galerie d'entrée d'air frais</text>
<text x="440" y="196">Galerie de retour d'air vicié</text>
<text x="430" y="320">Gaine et ventilateur auxiliaire</text>
<text class="m" x="515" y="382">Galerie en cul-de-sac (traçage)</text>

<!-- légende -->
<line class="f" x1="60" y1="450" x2="110" y2="450" marker-end="url(#ab)"/><text x="122" y="455">Air frais</text>
<line class="v" x1="240" y1="450" x2="290" y2="450" marker-end="url(#ao)"/><text x="302" y="455">Air vicié</text>
<text x="60" y="484">Ventilation aspirante : le ventilateur principal met la mine en dépression.</text>
</svg>
