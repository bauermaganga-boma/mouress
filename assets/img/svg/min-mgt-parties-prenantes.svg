<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Grille pouvoir et intérêt des parties prenantes. Pouvoir élevé et intérêt élevé : gérer étroitement (1 directeur sponsor, 5 cabinet du ministre). Pouvoir élevé et intérêt faible : tenir satisfait (2 service financier). Pouvoir faible et intérêt élevé : tenir informé (3 agents du service). Pouvoir faible et intérêt faible : surveiller (4 usagers non concernés).</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold;font-size:15px}
.s{font-size:13px}.w{fill:#FCFBF8;font-weight:bold;font-size:16px;text-anchor:middle}
.q{stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Grille pouvoir / intérêt des parties prenantes</text>

<rect x="100" y="60" width="210" height="175" class="q" fill="#E8EAEE"/>
<rect x="310" y="60" width="210" height="175" class="q" fill="#F9DDBB"/>
<rect x="100" y="235" width="210" height="175" class="q" fill="#FCFBF8"/>
<rect x="310" y="235" width="210" height="175" class="q" fill="#DCE6F5"/>

<text x="112" y="84" class="o">TENIR SATISFAIT</text>
<text x="112" y="102" class="s">Répondre à leurs attentes</text>
<text x="322" y="84" class="o">GÉRER ÉTROITEMENT</text>
<text x="322" y="102" class="s">Associer, rechercher l'accord</text>
<text x="112" y="259" class="o">SURVEILLER</text>
<text x="112" y="277" class="s">Effort minimal</text>
<text x="322" y="259" class="o">TENIR INFORMÉ</text>
<text x="322" y="277" class="s">Informer et consulter</text>

<g fill="#061F44" stroke="#FCFBF8" stroke-width="2">
<circle cx="380" cy="160" r="16"/><circle cx="465" cy="195" r="16"/><circle cx="200" cy="160" r="16"/><circle cx="415" cy="340" r="16"/><circle cx="205" cy="340" r="16"/>
</g>
<text x="380" y="166" class="w">1</text><text x="465" y="201" class="w">5</text><text x="200" y="166" class="w">2</text><text x="415" y="346" class="w">3</text><text x="205" y="346" class="w">4</text>

<text x="310" y="438" class="c b">INTÉRÊT pour le projet (faible vers élevé)</text>
<text transform="translate(60,235) rotate(-90)" class="c b">POUVOIR (faible vers élevé)</text>

<text x="548" y="84" class="b">Parties prenantes</text>
<text x="548" y="120">1  Directeur (sponsor)</text>
<text x="548" y="150">2  Service financier</text>
<text x="548" y="180">3  Agents du service</text>
<text x="548" y="210">4  Usagers non concernés</text>
<text x="548" y="240">5  Cabinet du ministre</text>
<text x="548" y="290" class="s">Classement donné à titre</text>
<text x="548" y="308" class="s">d'illustration.</text>
</svg>
