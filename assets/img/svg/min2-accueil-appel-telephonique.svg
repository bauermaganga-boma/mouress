<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Déroulé d'un appel téléphonique au ministère : décrocher, se présenter, écouter, renseigner ou transférer, noter un message complet, conclure.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Accueil téléphonique : le déroulé d’un appel</text>
<rect x="24" y="58" width="221" height="94" rx="8" class="bl"/>
<text x="134.5" y="82" class="c b">1. Décrocher</text>
<text x="134.5" y="104" class="c">Rapidement, sans laisser</text>
<text x="134.5" y="122" class="c">sonner</text>
<rect x="289" y="58" width="221" height="94" rx="8" class="wh"/>
<text x="399.5" y="82" class="c b">2. Se présenter</text>
<text x="399.5" y="104" class="c">Formule d’accueil, nom du</text>
<text x="399.5" y="122" class="c">service, nom de l’agent</text>
<rect x="554" y="58" width="221" height="94" rx="8" class="bl"/>
<text x="664.5" y="82" class="c b">3. Écouter</text>
<text x="664.5" y="104" class="c">Comprendre la demande</text>
<text x="664.5" y="122" class="c">réelle, reformuler</text>
<rect x="24" y="200" width="221" height="113" rx="8" class="wh"/>
<text x="134.5" y="224" class="c b">4. Renseigner ou</text>
<text x="134.5" y="243" class="c b">transférer</text>
<text x="134.5" y="265" class="c">Expliquer tout transfert</text>
<text x="134.5" y="283" class="c">avant de le faire</text>
<rect x="289" y="200" width="221" height="113" rx="8" class="or"/>
<text x="399.5" y="224" class="c b">5. Noter un message</text>
<text x="399.5" y="246" class="c">Nom, organisme, objet,</text>
<text x="399.5" y="264" class="c">numéro de rappel, heure de</text>
<text x="399.5" y="282" class="c">l’appel</text>
<rect x="554" y="200" width="221" height="113" rx="8" class="wh"/>
<text x="664.5" y="224" class="c b">6. Conclure</text>
<text x="664.5" y="246" class="c">Annoncer la suite et tenir</text>
<text x="664.5" y="264" class="c">son rappel</text>
<path d="M247,105H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,105H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,154V176H134.5V197" class="ln" marker-end="url(#ar)"/>
<path d="M247,256.5H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,256.5H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="440" class="c">Ne jamais répondre « ce n’est pas mon service » sans orienter vers le bon interlocuteur.</text>
<text x="400" y="460" class="c">Ne pas promettre ce que l’on ne maîtrise pas.</text>
</svg>
