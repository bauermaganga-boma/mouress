<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Du programme aux crédits : engagement et paiements</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Du programme aux crédits : engagement et paiements</text>

<rect x="30" y="60" width="330" height="390" rx="6" fill="#DCE6F5"/>
<text x="195" y="88" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Structure du budget</text>
<rect x="55" y="105" width="280" height="50" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="195" y="128" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">MISSION</text><text x="195" y="146" font-size="13" fill="#061F44" text-anchor="middle">une politique publique</text>
<rect x="55" y="185" width="280" height="60" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="195" y="208" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">PROGRAMME</text><text x="195" y="228" font-size="13" fill="#061F44" text-anchor="middle">d'un seul ministère, avec un responsable</text>
<rect x="55" y="275" width="280" height="50" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="195" y="298" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">ACTIONS</text><text x="195" y="316" font-size="13" fill="#061F44" text-anchor="middle">objectifs et indicateurs</text>
<line x1="195" y1="155" x2="195" y2="177" stroke="#061F44" stroke-width="2.5"/><polygon points="195,185 188,175 202,175" fill="#061F44"/><line x1="195" y1="245" x2="195" y2="267" stroke="#061F44" stroke-width="2.5"/><polygon points="195,275 188,265 202,265" fill="#061F44"/>
<rect x="55" y="350" width="280" height="80" rx="6" fill="#E8EAEE"/><text x="195" y="375" font-size="13" fill="#061F44" font-weight="bold" text-anchor="middle">DOTATIONS (hors programmes)</text><text x="195" y="394" font-size="13" fill="#061F44" text-anchor="middle">institutions, dépenses accidentelles,</text><text x="195" y="412" font-size="13" fill="#061F44" text-anchor="middle">risques liés aux garanties</text>
<rect x="380" y="60" width="390" height="390" rx="6" fill="#E8EAEE"/>
<text x="575" y="88" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Marché d'équipement de 400 M FCFA</text>
<text x="575" y="108" font-size="13" fill="#061F44" text-anchor="middle">sur trois ans (exemple fictif)</text>
<text x="460" y="148" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Année 1</text><text x="575" y="148" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Année 2</text><text x="690" y="148" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Année 3</text>
<rect x="410" y="165" width="330" height="60" rx="6" fill="#061F44"/><text x="575" y="200" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">AE : engagement du marché (400)</text>
<rect x="410" y="260" width="100" height="50" rx="6" fill="#F28C28"/><text x="460" y="291" font-size="13" fill="#061F44" font-weight="bold" text-anchor="middle">CP année 1</text>
<rect x="525" y="260" width="100" height="50" rx="6" fill="#F28C28"/><text x="575" y="291" font-size="13" fill="#061F44" font-weight="bold" text-anchor="middle">CP année 2</text>
<rect x="640" y="260" width="100" height="50" rx="6" fill="#F28C28"/><text x="690" y="291" font-size="13" fill="#061F44" font-weight="bold" text-anchor="middle">CP année 3</text>
<text x="575" y="345" font-size="14" fill="#061F44" text-anchor="middle">Les montants des CP ne sont pas fixés ici :</text>
<text x="575" y="366" font-size="14" fill="#061F44" text-anchor="middle">ils suivent le rythme des paiements.</text>
<text x="575" y="410" font-size="13" fill="#555" text-anchor="middle">AE : autorisation d'engagement</text><text x="575" y="428" font-size="13" fill="#555" text-anchor="middle">CP : crédit de paiement</text>
<text x="400" y="486" font-size="13" fill="#555" text-anchor="middle">Schéma simplifié ; le détail est dans la loi organique relative aux lois de finances.</text>
</svg>
