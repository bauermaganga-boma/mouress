<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Courbe en S d'un budget de projet, exemple fictif en millions de francs CFA : le budget prévisionnel cumulé atteint 50 au mois 6 et 100 au mois 12 ; la consommation réelle cumulée atteint 32 au mois 6, soit un écart de moins 18 par rapport au prévu, et 55 au mois 8 contre 80 prévu. Un retard de consommation peut signaler un retard d'exécution, pas une économie.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.w{fill:#FFFFFF;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Budget cumulé : prévu et réalisé (exemple fictif)</text>
<line x1="80" y1="400" x2="760" y2="400" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="405" class="e">0</text>
<line x1="80" y1="336" x2="760" y2="336" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="341" class="e">20</text>
<line x1="80" y1="272" x2="760" y2="272" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="277" class="e">40</text>
<line x1="80" y1="208" x2="760" y2="208" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="213" class="e">60</text>
<line x1="80" y1="144" x2="760" y2="144" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="149" class="e">80</text>
<line x1="80" y1="80" x2="760" y2="80" stroke="#E8EAEE" stroke-width="1.5"/><text x="70" y="85" class="e">100</text>
<text x="80" y="424" class="c">0</text>
<text x="193.33333333333331" y="424" class="c">2</text>
<text x="306.66666666666663" y="424" class="c">4</text>
<text x="420" y="424" class="c">6</text>
<text x="533.3333333333333" y="424" class="c">8</text>
<text x="646.6666666666666" y="424" class="c">10</text>
<text x="760" y="424" class="c">12</text>
<line x1="80" y1="60" x2="80" y2="400" class="nv"/><line x1="80" y1="400" x2="760" y2="400" class="nv"/>
<text x="420" y="448" class="c b">Mois depuis le lancement</text>
<text x="80" y="52" class="b">Millions de FCFA cumulés (fictifs)</text>
<path d="M80,400L193,384L307,336L420,240L533,144L647,96L760,80" fill="none" stroke="#061F44" stroke-width="3.5" stroke-dasharray="9 6"/>
<path d="M80,400L193,387L307,362L420,298L533,224" class="or"/>
<circle cx="80" cy="400" r="4" fill="#061F44"/><circle cx="193" cy="384" r="4" fill="#061F44"/><circle cx="307" cy="336" r="4" fill="#061F44"/><circle cx="420" cy="240" r="4" fill="#061F44"/><circle cx="533" cy="144" r="4" fill="#061F44"/><circle cx="647" cy="96" r="4" fill="#061F44"/><circle cx="760" cy="80" r="4" fill="#061F44"/><circle cx="80" cy="400" r="5" fill="#F28C28"/><circle cx="193" cy="387" r="5" fill="#F28C28"/><circle cx="307" cy="362" r="5" fill="#F28C28"/><circle cx="420" cy="298" r="5" fill="#F28C28"/><circle cx="533" cy="224" r="5" fill="#F28C28"/>
<line x1="420" y1="240" x2="420" y2="297.6" stroke="#B85C0A" stroke-width="3"/>
<text x="430" y="273.79999999999995" class="o">Écart : -18</text>
<text x="410" y="234" class="e">Prévu : 50</text>
<text x="430" y="319.6">Réalisé : 32</text>
<line x1="110" y1="82" x2="150" y2="82" stroke="#061F44" stroke-width="3.5" stroke-dasharray="9 6"/><text x="158" y="87">Budget prévu</text>
<line x1="110" y1="106" x2="150" y2="106" stroke="#F28C28" stroke-width="3.5"/><text x="158" y="111">Dépenses réelles</text>
<text x="420" y="482" class="c">Total prévu : 100 millions. Valeurs inventées, à titre d'exemple.</text>
</svg>
