<text x="528" y="159">Détecteur de fumée, alarme,</text>
<text x="528" y="176">extincteur adapté</text>
<circle cx="505" cy="212" r="13" fill="#F28C28"/><text x="505" y="217" class="c b">3</text>
<text x="528" y="210" class="b">Rayonnage éloigné du mur</text>
<text x="528" y="228">Ne jamais le coller au mur</text>
<circle cx="505" cy="264" r="13" fill="#F28C28"/><text x="505" y="269" class="c b">4</text>
