<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Coupe d'un local d'archives avec six points de contrôle : toit sans fuite, détecteur de fumée, rayonnage éloigné du mur, boîtes sans acide, rayonnage surélevé de 10 à 15 cm, hygromètre.</title>
