<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Graphique de la pression du réservoir en pourcentage de la pression initiale en fonction de la récupération en pourcentage du volume en place, pour trois mécanismes : A gaz dissous, pression qui chute vite, récupération de 5 à 30 % ; B chapeau de gaz, pression qui baisse lentement, 20 à 40 % ; C aquifère actif, pression presque stable, 35 à 75 % ; fourchettes indicatives</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.t{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.dz{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:6 5}
.og{fill:#F28C28;stroke:#061F44;stroke-width:2}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Mécanismes de drainage : pression et récupération (indicatif)</text>

<path d="M100,80V400H740" class="s"/><path d="M95,400H100" class="ld"/><text x="90" y="405" class="e t">0 %</text><path d="M95,240H100" class="ld"/><text x="90" y="245" class="e t">50 %</text><path d="M95,80H100" class="ld"/><text x="90" y="85" class="e t">100 %</text><path d="M100,400v6" class="ld"/><text x="100" y="424" class="c t">0 %</text><path d="M260,400v6" class="ld"/><text x="260" y="424" class="c t">20 %</text><path d="M420,400v6" class="ld"/><text x="420" y="424" class="c t">40 %</text><path d="M580,400v6" class="ld"/><text x="580" y="424" class="c t">60 %</text><path d="M740,400v6" class="ld"/><text x="740" y="424" class="c t">80 %</text><text x="420" y="446" class="c">Récupération (% du volume d’huile en place)</text><text x="14" y="62" class="t">Pression (% de la pression initiale)</text><path d="M100,80 L124,208 L164,265.6 L220,304 L276,329.6 L340,348.8" fill="none" stroke="#B85C0A" stroke-width="4"/><path d="M100,80 L140,128 L196,169.6 L260,208 L340,240 L420,265.6" fill="none" stroke="#061F44" stroke-width="4" stroke-dasharray="10 5"/><path d="M100,80 L180,92.79999999999995 L300,105.59999999999997 L420,112 L540,118.39999999999998 L700,124.80000000000001" fill="none" stroke="#F28C28" stroke-width="4"/><path d="M140,462H340" stroke="#B85C0A" stroke-width="8"/><path d="M140,455v14M340,455v14" stroke="#B85C0A" stroke-width="3"/><text x="350" y="467" class="t">A : 5 à 30 %</text><path d="M260,478H420" stroke="#061F44" stroke-width="8"/><path d="M260,471v14M420,471v14" stroke="#061F44" stroke-width="3"/><text x="430" y="483" class="t">B : 20 à 40 %</text><path d="M380,494H700" stroke="#F28C28" stroke-width="8"/><path d="M380,487v14M700,487v14" stroke="#F28C28" stroke-width="3"/><text x="710" y="499" class="t">C : 35 à 75 %</text><text x="540" y="100.80000000000001" class="o">C : aquifère actif</text><text x="540" y="116.80000000000001" class="t">pression presque stable, eau produite</text><text x="436" y="247.60000000000002" class="b">B : chapeau de gaz</text><text x="436" y="263.6" class="t">pression en baisse lente</text><text x="356" y="330.8" class="o">A : gaz dissous</text><text x="356" y="346.8" class="t">pression qui chute vite, GOR en hausse</text></svg>
