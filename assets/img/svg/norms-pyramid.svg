<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Hiérarchie des normes, du plus haut au plus bas : Constitution, traités et accords internationaux dont l'OHADA, lois, décrets, arrêtés</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}
.p{stroke:#061F44;stroke-width:2.5;stroke-linejoin:round}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#061F44"/></marker>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Hiérarchie des normes</text>

<path class="p" d="M190,70 L310,70 L340,140 L160,140 Z" fill="#F28C28"/>
<path class="p" d="M160,140 L340,140 L370,210 L130,210 Z" fill="#FFB766"/>
<path class="p" d="M130,210 L370,210 L400,280 L100,280 Z" fill="#DCE6F5"/>
<path class="p" d="M100,280 L400,280 L430,350 L70,350 Z" fill="#C5D3EA"/>
<path class="p" d="M70,350 L430,350 L460,420 L40,420 Z" fill="#E8EAEE"/>

<text class="m b" x="250" y="110">Constitution</text>
<text class="m b" x="250" y="180">Traités, OHADA</text>
<text class="m b" x="250" y="250">Lois</text>
<text class="m b" x="250" y="320">Décrets</text>
<text class="m b" x="250" y="390">Arrêtés</text>

<g stroke="#061F44" stroke-width="1.5" stroke-dasharray="3 4">
<line x1="332" y1="105" x2="488" y2="105"/><line x1="362" y1="175" x2="488" y2="175"/><line x1="392" y1="245" x2="488" y2="245"/><line x1="422" y1="315" x2="488" y2="315"/><line x1="452" y1="385" x2="488" y2="385"/>
</g>
<text class="b" x="500" y="102">Constitution</text><text x="500" y="120">norme suprême de l'État</text>
<text class="b" x="500" y="172">Traités et accords internationaux</text><text x="500" y="190">dont les Actes uniformes OHADA</text>
<text class="b" x="500" y="242">Lois</text><text x="500" y="260">votées par le Parlement</text>
<text class="b" x="500" y="312">Décrets</text><text x="500" y="330">pris par le pouvoir exécutif</text>
<text class="b" x="500" y="382">Arrêtés</text><text x="500" y="400">ministériels ou locaux</text>

<line x1="26" y1="410" x2="26" y2="90" stroke="#061F44" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" transform="translate(12,250) rotate(-90)" style="text-anchor:middle">Primauté</text>

<text class="m" x="400" y="462">Une norme inférieure doit respecter toutes les normes supérieures.</text>
</svg>
