<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Frise sur deux exercices : le service est rendu le 28 novembre de l'exercice N et payé le 15 février de l'exercice N+1 ; en droits constatés la charge se rattache à l'exercice N (exemple fictif).</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Droits constatés : à quel exercice rattacher une charge ?</text>
<rect x="40" y="120" width="340" height="54" rx="4" class="bl"/>
<rect x="420" y="120" width="340" height="54" rx="4" class="wh"/>
<text x="210" y="154" class="c b">Exercice N</text>
<text x="590" y="154" class="c b">Exercice N+1</text>
<path d="M400,100V200" class="lo" style="stroke-dasharray:8 6"/>
<text x="400" y="92" class="c o">31 décembre</text>
<circle cx="250" cy="220" r="12" fill="#F28C28"/>
<path d="M250,174V208" class="ln"/>
<circle cx="560" cy="220" r="12" fill="#061F44"/>
<path d="M560,174V208" class="ln"/>
<text x="250" y="256" class="c b">28 novembre</text>
<text x="250" y="276" class="c">Service rendu (livraison)</text>
<text x="560" y="256" class="c b">15 février</text>
<text x="560" y="276" class="c">Paiement par le comptable</text>
<rect x="40" y="310" width="340" height="82" rx="8" class="or"/>
<text x="210" y="336" class="c b">Comptabilité générale</text>
<text x="210" y="358" class="c">Droits constatés : la charge suit</text>
<text x="210" y="378" class="c">l’exercice où l’obligation naît (N)</text>
<rect x="420" y="310" width="340" height="82" rx="8" class="gr"/>
<text x="590" y="336" class="c b">Date du paiement</text>
<text x="590" y="358" class="c">Logique de caisse : elle ne décide</text>
<text x="590" y="378" class="c">pas de l’exercice de la charge</text>
<text x="400" y="440" class="c">Exemple fictif : le principe est l’indépendance des exercices.</text>
</svg>
