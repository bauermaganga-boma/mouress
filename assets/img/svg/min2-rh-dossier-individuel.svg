<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Dossier individuel de l'agent : pièces classées par ordre chronologique, consultation et copie par l'agent, liste limitative des pièces, aucune opinion politique, philosophique ou religieuse.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Le dossier individuel de l’agent</text>
<text x="190" y="62" class="c b">Contenu type (exemple)</text>
<rect x="40" y="74" width="300" height="46" rx="8" class="bl"/>
<text x="60" y="103">1. Acte de recrutement</text>
<rect x="40" y="136" width="300" height="46" rx="8" class="wh"/>
<text x="60" y="165">2. Titularisation</text>
<rect x="40" y="198" width="300" height="46" rx="8" class="bl"/>
<text x="60" y="227">3. Arrêté d’affectation</text>
<rect x="40" y="260" width="300" height="46" rx="8" class="wh"/>
<text x="60" y="289">4. Fiche d’évaluation</text>
<rect x="40" y="322" width="300" height="46" rx="8" class="bl"/>
<text x="60" y="351">5. Arrêté d’avancement</text>
<path d="M366,90V370" class="lo" marker-end="url(#ao)"/>
<text x="190" y="404" class="c">Ordre chronologique : du plus ancien au plus récent</text>
<text x="595" y="62" class="c b">Règles du dossier</text>
<rect x="410" y="74" width="370" height="66" rx="8" class="wh"/>
<text x="595" y="98" class="c b">Classement chronologique</text>
<text x="595" y="126" class="c">art. 58</text>
<rect x="410" y="156" width="370" height="66" rx="8" class="wh"/>
<text x="595" y="180" class="c b">Consultation et copie à frais de l’agent</text>
<text x="595" y="208" class="c">art. 59</text>
<rect x="410" y="238" width="370" height="66" rx="8" class="wh"/>
<text x="595" y="262" class="c b">Liste des pièces fixée par texte</text>
<text x="595" y="290" class="c">art. 60</text>
<rect x="410" y="320" width="370" height="66" rx="8" class="or"/>
<text x="595" y="338" class="c b">Aucune opinion politique, philosophique</text>
<text x="595" y="356" class="c b">ou religieuse</text>
<text x="595" y="372" class="c">art. 53</text>
</svg>
