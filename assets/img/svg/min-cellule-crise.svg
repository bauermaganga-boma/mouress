<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Organisation type d'une cellule de crise (rôles génériques) : directeur unique, coordonnateur, cellule situation avec main courante, experts techniques, conseil juridique, communication, liaison avec l'exploitant et les autres administrations, équipe d'anticipation, soutien ; trame d'un point de situation et relève</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="26" class="h">Organisation type d'une cellule de crise</text>
<text x="400" y="46" class="c" style="font-size:13px;font-style:italic">Rôles génériques, à adapter ; la composition réelle est à confirmer.</text>
<rect x="270" y="58" width="260" height="52" rx="8" class="nv"/>
<text x="400" y="79" class="c w b" style="font-size:14px">Directeur de cellule (unique)</text>
<text x="400" y="98" class="c w" style="font-size:14px">décide après avis des experts</text>
<rect x="270" y="126" width="260" height="44" rx="8" class="or"/>
<text x="400" y="144" class="c b" style="font-size:13px">Coordonnateur</text>
<text x="400" y="161" class="c" style="font-size:13px">anime les points de situation</text>
<path d="M400,111V125" class="ln" style="stroke-width:2.5"/>
<rect x="20" y="62" width="225" height="66" rx="8" class="gr"/>
<text x="132.5" y="82.5" class="c b" style="font-size:13px">Soutien</text>
<text x="132.5" y="99.5" class="c" style="font-size:13px">salle, moyens, relève,</text>
<text x="132.5" y="116.5" class="c" style="font-size:13px">restauration</text>
<rect x="555" y="62" width="225" height="66" rx="8" class="gr"/>
<text x="667.5" y="82.5" class="c b" style="font-size:13px">Équipe d'anticipation</text>
<text x="667.5" y="99.5" class="c" style="font-size:13px">scénarios à 24 - 72 heures,</text>
<text x="667.5" y="116.5" class="c" style="font-size:13px">distincte de la gestion immédiate</text>
<path d="M400,171V192M90,192H710" class="ln" style="stroke-width:2.5"/>
<path d="M90,192V210" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="20" y="212" width="140" height="94" rx="8" class="bl"/>
<text x="90" y="238" class="c b" style="font-size:13px">Cellule situation</text>
<text x="90" y="255" class="c" style="font-size:13px">Recoupe l'information,</text>
<text x="90" y="272" class="c" style="font-size:13px">tient la main courante</text>
<text x="90" y="289" class="c" style="font-size:13px">(journal daté)</text>
<path d="M245,192V210" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="175" y="212" width="140" height="94" rx="8" class="bl"/>
<text x="245" y="246.5" class="c b" style="font-size:13px">Experts techniques</text>
<text x="245" y="263.5" class="c" style="font-size:13px">Évaluent les risques</text>
<text x="245" y="280.5" class="c" style="font-size:13px">et les options</text>
<path d="M400,192V210" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="330" y="212" width="140" height="94" rx="8" class="bl"/>
<text x="400" y="246.5" class="c b" style="font-size:13px">Conseil juridique</text>
<text x="400" y="263.5" class="c" style="font-size:13px">Vérifie la base légale</text>
<text x="400" y="280.5" class="c" style="font-size:13px">des décisions</text>
<path d="M555,192V210" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="485" y="212" width="140" height="94" rx="8" class="bl"/>
<text x="555" y="238" class="c b" style="font-size:13px">Communication</text>
<text x="555" y="255" class="c" style="font-size:13px">Prépare les messages,</text>
<text x="555" y="272" class="c" style="font-size:13px">validés par le</text>
<text x="555" y="289" class="c" style="font-size:13px">directeur</text>
<path d="M710,192V210" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="640" y="212" width="140" height="94" rx="8" class="bl"/>
<text x="710" y="238" class="c b" style="font-size:13px">Liaison</text>
<text x="710" y="255" class="c" style="font-size:13px">Interlocuteur unique</text>
<text x="710" y="272" class="c" style="font-size:13px">des opérateurs et des</text>
<text x="710" y="289" class="c" style="font-size:13px">autres administrations</text>
<rect x="555" y="336" width="105" height="46" rx="8" class="gr"/>
<text x="607.5" y="363.5" class="c b" style="font-size:13px">Exploitant</text>
<rect x="675" y="336" width="105" height="46" rx="8" class="gr"/>
<text x="727.5" y="355.5" class="c b" style="font-size:13px">Autres</text>
<text x="727.5" y="371.5" class="c" style="font-size:13px">administrations</text>
<path d="M710,307V322M607,322H727M607,322V334M727,322V334" class="ld"/>
<rect x="20" y="336" width="520" height="46" rx="8" class="gr"/>
<text x="280" y="355" class="c" style="font-size:13px">Un seul décideur par sujet ; chaque décision est tracée</text>
<text x="280" y="372" class="c" style="font-size:13px">dans la main courante : qui, quoi, quand, pourquoi.</text>
<text x="20" y="410" class="b" style="font-size:14px">Point de situation (15 à 30 minutes, à heures fixes) : ordre du jour</text>
<path d="M20,420h128l12,24l-12,24h-128l12,-24z" class="or"/>
<text x="94" y="439" class="c" style="font-size:13px">1 · Faits</text>
<text x="94" y="456" class="c" style="font-size:13px">confirmés</text>
<path d="M175,420h128l12,24l-12,24h-128l12,-24z" class="bl"/>
<text x="249" y="439" class="c" style="font-size:13px">2 · Hypothèses et</text>
<text x="249" y="456" class="c" style="font-size:13px">incertitudes</text>
<path d="M330,420h128l12,24l-12,24h-128l12,-24z" class="bl"/>
<text x="404" y="439" class="c" style="font-size:13px">3 · Décisions</text>
<text x="404" y="456" class="c" style="font-size:13px">à prendre</text>
<path d="M485,420h128l12,24l-12,24h-128l12,-24z" class="bl"/>
<text x="559" y="439" class="c" style="font-size:13px">4 · Actions en cours</text>
<text x="559" y="456" class="c" style="font-size:13px">et responsables</text>
<path d="M640,420h128l12,24l-12,24h-128l12,-24z" class="bl"/>
<text x="714" y="439" class="c" style="font-size:13px">5 · Heure du</text>
<text x="714" y="456" class="c" style="font-size:13px">prochain point</text>
<text x="400" y="500" class="c" style="font-size:13px">Relève par roulement (postes de 8 à 12 heures) avec transmission écrite entre les équipes.</text>
</svg>
