<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne de valeur pétrolière : amont (exploration, développement, production), transport, raffinage et stockage, distribution ; l'aval regroupe le raffinage, le stockage des produits finis et la distribution</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Chaîne de valeur pétrolière (schéma général)</text>
<rect x="20" y="60" width="160" height="200" rx="6" class="bl"/>
<path d="M20,92V66Q20,60 26,60H174Q180,60 180,66V92z" class="nvf"/>
<text x="100" y="80" class="w c">AMONT</text>
<text x="30" y="114">• Exploration :</text>
<text x="30" y="132">sismique et forages</text>
<text x="30" y="155">• Développement du</text>
<text x="30" y="173">gisement</text>
<text x="30" y="196">• Production de</text>
<text x="30" y="214">brut et de gaz</text>
<rect x="220" y="60" width="160" height="200" rx="6" class="bl"/>
<path d="M220,92V66Q220,60 226,60H374Q380,60 380,66V92z" class="nvf"/>
<text x="300" y="80" class="w c">TRANSPORT</text>
<text x="230" y="114">• Oléoducs et</text>
<text x="230" y="132">gazoducs</text>
<text x="230" y="155">• Terminaux de</text>
<text x="230" y="173">chargement</text>
<text x="230" y="196">• Stockage du brut</text>
<text x="230" y="219">• Navires</text>
<text x="230" y="237">pétroliers</text>
<rect x="420" y="60" width="160" height="200" rx="6" class="bl"/>
<path d="M420,108V66Q420,60 426,60H574Q580,60 580,66V108z" class="nvf"/>
<text x="500" y="80" class="w c">RAFFINAGE ET</text>
<text x="500" y="98" class="w c">STOCKAGE</text>
<text x="430" y="130">• Raffinage du brut</text>
<text x="430" y="153">• Stockage des</text>
<text x="430" y="171">produits finis dans</text>
<text x="430" y="189">les dépôts</text>
<rect x="620" y="60" width="160" height="200" rx="6" class="bl"/>
<path d="M620,92V66Q620,60 626,60H774Q780,60 780,66V92z" class="nvf"/>
<text x="700" y="80" class="w c">DISTRIBUTION</text>
<text x="630" y="114">• Réseaux de</text>
<text x="630" y="132">distribution</text>
<text x="630" y="155">• Stations-service</text>
<text x="630" y="178">• Commercialisation</text>
<text x="630" y="196">des produits finis</text>
<path d="M182,160H217" class="or" marker-end="url(#ao)"/>
<path d="M382,160H417" class="or" marker-end="url(#ao)"/>
<path d="M582,160H617" class="or" marker-end="url(#ao)"/>
<text x="20" y="282" class="b">Ce qui circule</text>
<rect x="20" y="292" width="160" height="32" rx="16" class="gr"/><text x="100" y="313" class="c">Brut et gaz</text>
<rect x="220" y="292" width="160" height="32" rx="16" class="gr"/><text x="300" y="313" class="c">Brut acheminé</text>
<rect x="420" y="292" width="160" height="32" rx="16" class="gr"/><text x="500" y="313" class="c">Produits finis</text>
<rect x="620" y="292" width="160" height="32" rx="16" class="gr"/><text x="700" y="313" class="c">Carburants livrés</text>
<path d="M20,345V357H180V345" class="or"/><text x="100" y="380" class="o c">AMONT</text>
<path d="M220,345V357H380V345" class="ld"/><text x="300" y="380" class="b c">TRANSPORT</text>
<path d="M420,345V357H780V345" class="or"/><text x="600" y="380" class="o c">AVAL</text>
<rect x="20" y="400" width="760" height="74" rx="6" class="bl"/>
<text x="400" y="427" class="c">À chaque maillon de la chaîne correspondent des textes, des autorisations et des services de</text>
<text x="400" y="445" class="c">l'administration. Savoir situer un acteur dans la chaîne permet de s'adresser au bon</text>
<text x="400" y="463" class="c">interlocuteur.</text>
</svg>
