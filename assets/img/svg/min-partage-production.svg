<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Cascade du partage de la production, chiffres fictifs en barils : production totale 1 000 000 ; redevance minière de 10 % soit 100 000 ; reste 900 000 ; récupération des coûts 600 000 (plafond de 70 % soit 630 000) ; production à partager 300 000 ; part de l'État 150 000 et part du contracteur 150 000</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.d{stroke:#061F44;stroke-width:1.5;stroke-dasharray:4 3}
</style>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Partage de la production : la cascade (exemple fictif)</text>
<line x1="30" y1="380" x2="740" y2="380" stroke="#061F44" stroke-width="2.5"/>
<rect x="40" y="100" width="64" height="280" fill="#061F44"/>
<text x="72" y="92" class="c b">1 000 000</text>
<rect x="150" y="100" width="64" height="28" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="182" y="92" class="c b">100 000</text>
<text x="182" y="156" class="c o">Taux : 10 %</text>
<rect x="260" y="128" width="64" height="252" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="292" y="120" class="c b">900 000</text>
<rect x="370" y="128" width="64" height="168" fill="#E8EAEE" stroke="#061F44" stroke-width="2.5"/>
<rect x="366" y="124" width="72" height="180.4" fill="none" stroke="#F28C28" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="402" y="116" class="c b">600 000</text>
<text x="402" y="330" class="c o">Plafond 70 %</text>
<text x="402" y="348" class="c o">= 630 000</text>
<rect x="480" y="296" width="64" height="84" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="512" y="288" class="c b">300 000</text>
<rect x="590" y="296" width="64" height="42" fill="#F28C28" stroke="#061F44" stroke-width="2.5"/>
<rect x="590" y="338" width="64" height="42" fill="#DCE6F5" stroke="#061F44" stroke-width="2.5"/>
<text x="664" y="312" class="b">État</text><text x="664" y="328">150 000</text>
<text x="664" y="354" class="b">Contracteur</text><text x="664" y="370">150 000</text>
<path d="M104,100H150M214,128H260M324,128H370M434,296H480M544,296H590" class="d" fill="none"/>
<g class="c n b">
<text x="72" y="402">Production totale</text><text x="72" y="419">disponible</text>
<text x="182" y="402">Redevance</text><text x="182" y="419">minière (RMP)</text>
<text x="292" y="402">Production après</text><text x="292" y="419">redevance</text>
<text x="402" y="402">Récupération</text><text x="402" y="419">des coûts</text>
<text x="512" y="402">Production à</text><text x="512" y="419">partager</text>
<text x="622" y="402">Partage de l'État</text><text x="622" y="419">et du contracteur</text>
</g>
<g class="n">
<text x="30" y="458">Chiffres fictifs en barils, pour illustrer le mécanisme : le contrat fixe les taux dans les limites de la loi.</text>
<text x="30" y="476">Plafond de récupération : 70 % de la production après redevance (base de calcul à vérifier au contrat).</text>
<text x="30" y="494">Total : État 250 000 barils (redevance et partage) ; contracteur 750 000 barils (coûts récupérés et partage).</text>
</g>
</svg>
