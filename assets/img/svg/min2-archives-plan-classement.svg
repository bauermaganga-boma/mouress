<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Plan de classement : du fonds à la pièce, et construction d'une cote fictive CTR-2024-017 (série, année, numéro d'ordre).</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Plan de classement et cote d’un dossier</text>
<rect x="24" y="56" width="161" height="130" rx="8" class="bl"/>
<text x="104.5" y="80" class="c b">Fonds</text>
<text x="104.5" y="102" class="c">Ensemble des</text>
<text x="104.5" y="120" class="c">documents d’un même</text>
<text x="104.5" y="138" class="c">producteur (ex. une</text>
<text x="104.5" y="156" class="c">direction)</text>
<rect x="221" y="56" width="161" height="130" rx="8" class="wh"/>
<text x="301.5" y="80" class="c b">Série</text>
<text x="301.5" y="102" class="c">Regroupement par</text>
<text x="301.5" y="120" class="c">activité, avec un</text>
<text x="301.5" y="138" class="c">code court</text>
<rect x="418" y="56" width="161" height="130" rx="8" class="bl"/>
<text x="498.5" y="80" class="c b">Dossier</text>
<text x="498.5" y="102" class="c">Pièces d’une même</text>
<text x="498.5" y="120" class="c">affaire, dans</text>
<text x="498.5" y="138" class="c">l’ordre des</text>
<text x="498.5" y="156" class="c">opérations</text>
<rect x="615" y="56" width="161" height="130" rx="8" class="wh"/>
<text x="695.5" y="80" class="c b">Pièce</text>
<text x="695.5" y="102" class="c">Un document :</text>
<text x="695.5" y="120" class="c">lettre, note,</text>
<text x="695.5" y="138" class="c">contrat</text>
<path d="M187,121H218" class="ln" marker-end="url(#ar)"/>
<path d="M384,121H415" class="ln" marker-end="url(#ar)"/>
<path d="M581,121H612" class="ln" marker-end="url(#ar)"/>
<text x="400" y="262" class="c b">Exemple fictif de cote d’un dossier</text>
<rect x="190" y="278" width="420" height="66" rx="10" class="or"/>
<text x="400" y="322" class="h" style="font-size:34px">CTR-2024-017</text>
<path d="M312,350L200,372" class="lo"/>
<rect x="110" y="372" width="180" height="54" rx="8" class="wh"/>
<text x="200" y="393" class="c b">Code de la série</text>
<text x="200" y="413" class="c">(ex. contrats)</text>
<path d="M405,350L400,372" class="lo"/>
<rect x="310" y="372" width="180" height="54" rx="8" class="wh"/>
<text x="400" y="393" class="c b">Année d’ouverture</text>
<text x="400" y="413" class="c">du dossier</text>
<path d="M492,350L600,372" class="lo"/>
<rect x="510" y="372" width="180" height="54" rx="8" class="wh"/>
<text x="600" y="393" class="c b">Numéro d’ordre</text>
<text x="600" y="413" class="c">dans la série</text>
<text x="400" y="450" class="c">La cote est unique et stable : jamais un nom d’agent, une priorité ou un emplacement.</text>
<text x="400" y="470" class="c">Format constant : série, année, numéro d’ordre (exemple fictif).</text>
</svg>
