<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Types de contrats d'hydrocarbures</text>
<text x="400" y="56" class="c b">Liste fermée : cinq types de contrats, aucun autre (article 39)</text>
<rect x="20" y="72" width="228" height="34" rx="6" class="nvf"/><text x="134" y="94" class="w c">CONTRATS DE SERVICES</text>
<rect x="286" y="72" width="228" height="34" rx="6" class="nvf"/><text x="400" y="94" class="w c">PARTAGE DE PRODUCTION</text>
<rect x="552" y="72" width="228" height="34" rx="6" class="nvf"/><text x="666" y="94" class="w c">AUTRES CONTRATS</text>
<rect x="20" y="116" width="228" height="96" rx="6" class="bl"/>
<text x="30" y="138" class="t13">Contrat de services pour des</text>
<text x="30" y="155" class="t13">études de géosciences :</text>
<text x="30" y="172" class="t13">signature de l'autorité</text>
<text x="30" y="189" class="t13">compétente seule</text>
<rect x="20" y="222" width="228" height="116" rx="6" class="bl"/>
<text x="30" y="244" class="t13">Contrat de services de</text>
<text x="30" y="261" class="t13">production : signature de</text>
<text x="30" y="278" class="t13">l'autorité compétente,</text>
<text x="30" y="295" class="t13">contreseing du Ministre de</text>
<text x="30" y="312" class="t13">l'Économie</text>
<rect x="286" y="116" width="228" height="96" rx="6" class="bl"/>
<text x="296" y="138">Contrat d'exploration et de</text>
<text x="296" y="156">partage de production</text>
<rect x="286" y="222" width="228" height="108" rx="6" class="bl"/>
<text x="296" y="244">Contrat d'exploitation et de</text>
<text x="296" y="262">partage de production</text>
<rect x="552" y="116" width="228" height="96" rx="6" class="bl"/>
<text x="562" y="138">Contrat d'évaluation</text>
<text x="562" y="156">technique</text>
<rect x="552" y="222" width="228" height="120" rx="6" class="bl"/>
<text x="562" y="244" class="t13">Convention d'exploitation,</text>
<text x="562" y="261" class="t13">conclue en priorité avec</text>
<text x="562" y="278" class="t13">l'opérateur national et les</text>
<text x="562" y="295" class="t13">entreprises autochtones</text>
<rect x="286" y="340" width="228" height="78" rx="6" class="gr"/><text x="400" y="360" class="c t13">Signature de l'autorité</text>
<text x="400" y="376" class="c t13">compétente, contreseing du</text>
<text x="400" y="392" class="c t13">Ministre de l'Économie,</text>
<text x="400" y="408" class="c t13">approbation par décret</text>
<path d="M400,331V339" class="nv"/>
<rect x="20" y="428" width="760" height="50" rx="6" class="bl"/>
<text x="400" y="450" class="c b">Entrée en vigueur d'un contrat : publication du décret d'approbation (article 44)</text>
<text x="400" y="468" class="c t13">La signature seule ne suffit pas</text>
