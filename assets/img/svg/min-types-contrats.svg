<title id="ttl">Liste fermée de l'article 39 : contrat de services (études de géosciences ou production), contrat d'évaluation technique, contrat d'exploration et de partage de production, contrat d'exploitation et de partage de production, convention d'exploitation ; signatures et entrée en vigueur à la publication du décret d'approbation</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
