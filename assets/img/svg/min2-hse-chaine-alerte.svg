<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Chaîne d'alerte et de remontée d'information en crise (schéma type à confirmer) : l'exploitant informe sans délai la permanence de la direction concernée, puis le directeur général, puis le cabinet du ministre, tandis que les autres administrations sont prévenues selon les plans ; le message d'alerte répond à sept questions et chaque information est qualifiée de fait confirmé, d'information non confirmée ou d'hypothèse</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Alerte et remontée d'information</text>
<text x="400" y="48" class="c">schéma type, à confirmer</text>

<!-- chaîne -->
<rect x="20" y="68" width="150" height="50" class="bl"/>
<text x="95" y="98" class="c b">Exploitant</text>
<path d="M172,93H218" class="nv" marker-end="url(#ar)"/>
<text x="195" y="62" class="c o">sans délai</text>
<rect x="222" y="68" width="150" height="50" class="bl"/>
<text x="297" y="90" class="c b">Permanence de la</text>
<text x="297" y="108" class="c b">direction concernée</text>
<path d="M374,93H418" class="nv" marker-end="url(#ar)"/>
<rect x="422" y="68" width="150" height="50" class="bl"/>
<text x="497" y="98" class="c b">Directeur général</text>
<path d="M574,93H618" class="nv" marker-end="url(#ar)"/>
<rect x="622" y="68" width="150" height="50" class="bl"/>
<text x="697" y="90" class="c b">Cabinet du</text>
<text x="697" y="108" class="c b">ministre</text>

<!-- parallèle -->
<path d="M297,120V187H386" fill="none" stroke="#F28C28" stroke-width="3.5" marker-end="url(#ao)"/>
<rect x="390" y="162" width="382" height="50" fill="#FFFFFF" stroke="#B85C0A" stroke-width="2.5"/>
<text x="581" y="184" class="c b">Autres administrations prévenues selon les plans</text>
<text x="581" y="203" class="c">environnement, marine marchande, défense, santé</text>
<text x="20" y="190" class="o" style="font-size:15px">Mieux vaut une alerte précoce</text>
<text x="20" y="210" class="o" style="font-size:15px">et incomplète qu'un rapport</text>
<text x="20" y="230" class="o" style="font-size:15px">complet et tardif</text>

<!-- message d'alerte -->
<rect x="20" y="256" width="370" height="224" rx="8" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="205" y="282" class="c b">Le message d'alerte répond à 7 questions</text>
<text x="40" y="312">1  Quoi ?</text>
<text x="40" y="334">2  Où ?</text>
<text x="40" y="356">3  Quand ?</text>
<text x="40" y="378">4  Quelle ampleur (victimes, quantités) ?</text>
<text x="40" y="400">5  Quelles mesures déjà prises ?</text>
<text x="40" y="422">6  Quelle aide demandée ?</text>
<text x="40" y="444">7  Qui est le contact ?</text>
<text x="205" y="468" class="c o">Horodaté, signé, consigné dans la main courante</text>

<!-- qualification -->
<rect x="410" y="256" width="362" height="224" rx="8" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="591" y="282" class="c b">Qualifier chaque information</text>
<rect x="424" y="298" width="334" height="48" class="bl"/>
<text x="434" y="318" class="b">Fait confirmé</text>
<text x="434" y="336">vérifié par une source directe</text>
<rect x="424" y="356" width="334" height="48" fill="#F28C28" fill-opacity="0.3" stroke="#061F44" stroke-width="2.5"/>
<text x="434" y="376" class="b">Information non confirmée</text>
<text x="434" y="394">source unique ou indirecte</text>
<rect x="424" y="414" width="334" height="52" class="gr"/>
<text x="434" y="434" class="b">Hypothèse</text>
<text x="434" y="452">explication proposée, cause non établie</text>
</svg>
