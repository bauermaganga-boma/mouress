<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Règle d'épargne et évolution d'un fonds (exemples)</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Règle d'épargne et évolution d'un fonds (exemples)</text>

<rect x="30" y="60" width="360" height="390" rx="6" fill="#DCE6F5"/>
<text x="210" y="90" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Règle d'épargne de l'écart de prix</text>
<rect x="55" y="110" width="150" height="70" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="130" y="138" font-size="13" fill="#061F44" text-anchor="middle">Prix du budget</text><text x="130" y="166" font-size="20" fill="#061F44" font-weight="bold" text-anchor="middle">65 USD</text>
<rect x="215" y="110" width="150" height="70" rx="6" fill="#fff" stroke="#B85C0A" stroke-width="2"/><text x="290" y="138" font-size="13" fill="#061F44" text-anchor="middle">Prix observé</text><text x="290" y="166" font-size="20" fill="#B85C0A" font-weight="bold" text-anchor="middle">85 USD</text>
<rect x="55" y="200" width="310" height="70" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="210" y="228" font-size="13" fill="#061F44" text-anchor="middle">Sensibilité des recettes de l'État</text><text x="210" y="256" font-size="17" fill="#061F44" font-weight="bold" text-anchor="middle">18,56 milliards de FCFA par USD</text>
<text x="55" y="300" font-size="14" fill="#061F44">Règle : l'écart de prix par rapport au prix du</text>
<text x="55" y="320" font-size="14" fill="#061F44">budget, multiplié par la sensibilité, est mis</text>
<text x="55" y="340" font-size="14" fill="#061F44">de côté au lieu d'être dépensé.</text>
<text x="55" y="385" font-size="14" fill="#B85C0A" font-weight="bold">Montant épargné : à calculer.</text>
<rect x="410" y="60" width="360" height="390" rx="6" fill="#E8EAEE"/>
<text x="590" y="90" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Évolution d'un fonds sur un an</text>
<rect x="440" y="115" width="300" height="60" rx="6" fill="#fff" stroke="#061F44" stroke-width="2"/><text x="590" y="140" font-size="13" fill="#061F44" text-anchor="middle">Capital au départ</text><text x="590" y="166" font-size="20" fill="#061F44" font-weight="bold" text-anchor="middle">1 000</text>
<rect x="440" y="200" width="140" height="60" rx="6" fill="#F28C28"/><text x="510" y="225" font-size="13" fill="#061F44" text-anchor="middle">Rendement</text><text x="510" y="251" font-size="20" fill="#061F44" font-weight="bold" text-anchor="middle">+ 4 %</text>
<rect x="600" y="200" width="140" height="60" rx="6" fill="#061F44"/><text x="670" y="225" font-size="13" fill="#fff" text-anchor="middle">Retrait annuel</text><text x="670" y="251" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">− 3 %</text>
<text x="440" y="300" font-size="14" fill="#061F44">Le retrait est calculé sur le capital</text>
<text x="440" y="320" font-size="14" fill="#061F44">initial (1 000), comme le rendement.</text>
<text x="440" y="385" font-size="14" fill="#B85C0A" font-weight="bold">Capital en fin d'année : à calculer.</text>
<text x="400" y="486" font-size="13" fill="#555" text-anchor="middle">Valeurs fictives, conçues pour la formation.</text>
</svg>
