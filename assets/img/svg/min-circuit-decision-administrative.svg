<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Circuit d'un dossier : réception, instruction, décision, notification et archivage ; forme de l'acte selon l'objet ; recours hiérarchique auprès du Ministre sous trente jours, le silence vaut rejet, puis recours contentieux</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.da{fill:none;stroke:#061F44;stroke-width:2;stroke-dasharray:7 5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Circuit d'une décision administrative (schéma général)</text>
<rect x="20" y="50" width="165" height="150" rx="6" class="bl"/>
<path d="M20,82V56Q20,50 26,50H179Q185,50 185,56V82z" class="nvf"/>
<text x="102.5" y="70" class="w c">1. RÉCEPTION</text>
<text x="30" y="104" class="t13">Dépôt de la demande</text>
<text x="30" y="126" class="t13">Enregistrement du</text>
<text x="30" y="143" class="t13">courrier d'arrivée</text>
<rect x="218" y="50" width="165" height="150" rx="6" class="bl"/>
<path d="M218,82V56Q218,50 224,50H377Q383,50 383,56V82z" class="nvf"/>
<text x="300.5" y="70" class="w c">2. INSTRUCTION</text>
<text x="228" y="104" class="t13">Examen technique et</text>
<text x="228" y="121" class="t13">juridique du dossier</text>
<text x="228" y="143" class="t13">Direction compétente</text>
<rect x="416" y="50" width="165" height="150" rx="6" class="bl"/>
<path d="M416,82V56Q416,50 422,50H575Q581,50 581,56V82z" class="nvf"/>
<text x="498.5" y="70" class="w c">3. DÉCISION</text>
<text x="426" y="104" class="t13">Prise par l'autorité</text>
<text x="426" y="121" class="t13">compétente</text>
<text x="426" y="143" class="t13">Forme de l'acte :</text>
<text x="426" y="160" class="t13">voir ci-dessous</text>
<rect x="614" y="50" width="165" height="150" rx="6" class="bl"/>
<path d="M614,98V56Q614,50 620,50H773Q779,50 779,56V98z" class="nvf"/>
<text x="696.5" y="70" class="w c">4. NOTIFICATION ET</text>
<text x="696.5" y="88" class="w c">ARCHIVAGE</text>
<text x="624" y="120" class="t13">Notification au</text>
<text x="624" y="137" class="t13">demandeur</text>
<text x="624" y="159" class="t13">Archivage physique et</text>
<text x="624" y="176" class="t13">numérique</text>
<path d="M187,125H215" class="or" marker-end="url(#ao)"/>
<path d="M385,125H413" class="or" marker-end="url(#ao)"/>
<path d="M583,125H611" class="or" marker-end="url(#ao)"/>
<text x="20" y="226" class="b">Forme de l'acte selon l'objet</text>
<path d="M498,200V232" class="nv"/><path d="M110,232H500M110,232V250M305,232V250M500,232V250" class="nv"/>
<rect x="20" y="250" width="180" height="126" rx="6" class="gr"/>
<text x="30" y="272" class="t13">Contrat : signature par</text>
<text x="30" y="289" class="t13">l'autorité compétente,</text>
<text x="30" y="306" class="t13">puis décret</text>
<text x="30" y="323" class="t13">d'approbation ; effet à</text>
<text x="30" y="340" class="t13">la publication du</text>
<text x="30" y="357" class="t13">décret</text>
<rect x="215" y="250" width="180" height="126" rx="6" class="gr"/>
<text x="225" y="272" class="t13">Autorisation exclusive</text>
<text x="225" y="289" class="t13">d'exploration : arrêté</text>
<text x="225" y="306" class="t13">du Ministre, après le</text>
<text x="225" y="323" class="t13">décret d'approbation du</text>
<text x="225" y="340" class="t13">contrat</text>
<rect x="410" y="250" width="180" height="126" rx="6" class="gr"/>
<text x="420" y="272" class="t13">Autorisation de</text>
<text x="420" y="289" class="t13">raffinage : décret du</text>
<text x="420" y="306" class="t13">Président de la</text>
<text x="420" y="323" class="t13">République, sur</text>
<text x="420" y="340" class="t13">proposition de</text>
<text x="420" y="357" class="t13">l'autorité compétente</text>
<path d="M696,200V220" class="nv" marker-end="url(#ar)"/>
<rect x="614" y="222" width="165" height="92" rx="6" class="bl"/>
<text x="624" y="244" class="t13">Recours hiérarchique</text>
<text x="624" y="261" class="t13">auprès du Ministre :</text>
<text x="624" y="278" class="t13">30 jours pour</text>
<text x="624" y="295" class="t13">répondre</text>
<path d="M696,316V324" class="nv" marker-end="url(#ar)"/>
<rect x="614" y="326" width="165" height="58" rx="6" class="gr"/>
<text x="624" y="348" class="t13">Silence au bout de 30</text>
<text x="624" y="365" class="t13">jours : rejet</text>
<path d="M696,386V394" class="nv" marker-end="url(#ar)"/>
<rect x="614" y="396" width="165" height="78" rx="6" class="gr"/>
<text x="624" y="418" class="t13">Recours contentieux</text>
<text x="624" y="435" class="t13">devant la juridiction</text>
<rect x="20" y="388" width="570" height="86" rx="6" class="bl"/>
<text x="32" y="408" class="b">Bons réflexes</text>
<text x="32" y="426" class="t13">Noter les dates de réception et de notification : elles servent à calculer les</text>
<text x="32" y="443" class="t13">délais de recours. En cas d'infraction, la transaction est possible ; en cas</text>
<text x="32" y="460" class="t13">d'échec, la peine ne peut être inférieure au montant proposé.</text>
</svg>
