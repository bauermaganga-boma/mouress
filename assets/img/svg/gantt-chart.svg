<line x1="20" y1="105" x2="770" y2="105"/><line x1="20" y1="149" x2="770" y2="149"/><line x1="20" y1="193" x2="770" y2="193"/><line x1="20" y1="237" x2="770" y2="237"/><line x1="20" y1="281" x2="770" y2="281"/><line x1="20" y1="325" x2="770" y2="325"/><line x1="20" y1="369" x2="770" y2="369"/><line x1="20" y1="413" x2="770" y2="413"/>
