<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Diagramme de Gantt sur 13 semaines avec chemin critique : étude et plans S1-S2, génie civil S3-S6, montage S7-S10, essais S11-S12, réception S13 ; commande des équipements S3-S5 et formation S8-S11 avec une semaine de marge</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.e{text-anchor:end}
.g{stroke:#D5D9E0;stroke-width:1.2}
.c{fill:#F28C28;stroke:#061F44;stroke-width:2}.n{fill:#DCE6F5;stroke:#061F44;stroke-width:2}.f{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:4 3}
.k{stroke:#061F44;stroke-width:2;fill:none}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#061F44"/></marker>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Diagramme de Gantt et chemin critique</text>

