<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Composition de la rémunération (solde indiciaire, indemnités, primes) et plafond des primes à un tiers de la solde, exemple fictif de 300 000 FCFA.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Rémunération de l’agent et plafond des primes</text>
<rect x="24" y="60" width="350" height="70" rx="8" class="bl"/>
<text x="199" y="86" class="c b">Solde indiciaire</text>
<text x="199" y="108" class="c">Indice du grade et de l’échelon</text>
<rect x="24" y="144" width="350" height="70" rx="8" class="wh"/>
<text x="199" y="170" class="c b">Indemnités (art. 81)</text>
<text x="199" y="192" class="c">Compensent des charges ou des frais</text>
<rect x="24" y="228" width="350" height="130" rx="8" class="or"/>
<text x="199" y="254" class="c b">Primes (art. 79) : quatre types</text>
<text x="60" y="282">• Responsabilité</text>
<text x="60" y="304">• Rendement</text>
<text x="60" y="326">• Risque</text>
<text x="60" y="348">• Fonction</text>
<text x="290" y="282" class="c">Liste des primes et</text>
<text x="290" y="302" class="c">indemnités fixée par</text>
<text x="290" y="322" class="c">décret (art. 82)</text>
<text x="199" y="384" class="c o">Versée après service fait</text>
<text x="590" y="70" class="c b">Plafond des primes (exemple fictif)</text>
<text x="590" y="112" class="c">Solde de référence : 300 000 FCFA</text>
<rect x="430" y="124" width="300" height="44" rx="4" class="bl"/>
<rect x="430" y="124" width="100" height="44" rx="4" class="or"/>
<text x="480" y="152" class="c b">1/3</text>
<text x="630" y="152" class="c b">2/3</text>
<path d="M430,176V190H530V176" class="lo"/>
<text x="480" y="212" class="c">Plafond de l’ensemble</text>
<text x="480" y="231" class="c">des primes : 100 000</text>
<text x="480" y="250" class="c">FCFA (art. 80)</text>
<text x="590" y="296" class="c b">Toutes primes confondues :</text>
<text x="590" y="316" class="c b">le total ne dépasse pas</text>
<text x="590" y="336" class="c b">un tiers de la solde.</text>
<rect x="410" y="352" width="340" height="54" rx="8" class="wh"/>
<text x="580" y="376" class="c b">Aucune prime sans texte</text>
<text x="580" y="396" class="c">(décret ou arrêté)</text>
<text x="400" y="452" class="c">Exemple chiffré fictif, non réglementaire : à confirmer auprès du ministère.</text>
</svg>
