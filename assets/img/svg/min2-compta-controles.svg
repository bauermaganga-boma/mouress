<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les moments du contrôle : avant la dépense (contrôle financier a priori), pendant (hiérarchique, comptable, interne), après (inspection, juge des comptes, Parlement par la loi de règlement).</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Les contrôles : avant, pendant, après</text>
<rect x="24" y="70" width="221" height="130" rx="8" class="or"/>
<text x="134.5" y="94" class="c b">Avant la dépense</text>
<text x="134.5" y="116" class="c">Contrôle financier a priori</text>
<text x="134.5" y="134" class="c">: visa avant l’engagement</text>
<rect x="289" y="70" width="221" height="130" rx="8" class="wh"/>
<text x="399.5" y="94" class="c b">Pendant</text>
<text x="399.5" y="116" class="c">Contrôle hiérarchique,</text>
<text x="399.5" y="134" class="c">contrôle du comptable avant</text>
<text x="399.5" y="152" class="c">paiement, contrôle interne</text>
<rect x="554" y="70" width="221" height="130" rx="8" class="bl"/>
<text x="664.5" y="94" class="c b">Après</text>
<text x="664.5" y="116" class="c">Inspection ; Cour des</text>
<text x="664.5" y="134" class="c">comptes juge les comptes ;</text>
<text x="664.5" y="152" class="c">loi de règlement arrête les</text>
<text x="664.5" y="170" class="c">comptes</text>
<path d="M247,135H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,135H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="250" class="c">Chaque contrôle a son rôle et son moment.</text>
<text x="400" y="270" class="c">Un contrôle inopiné peut intervenir à tout moment, sans prévenir.</text>
</svg>
