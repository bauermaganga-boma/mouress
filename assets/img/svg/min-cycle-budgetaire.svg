<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Cycle budgétaire annuel en six étapes : 1 cadrage à moyen terme avant le 15 juin ; 2 débat d'orientation avant le 30 juin, sans vote ; 3 préparation du projet et arbitrages du Premier Ministre ; 4 dépôt et vote du projet de loi de finances par programme ; 5 exécution du budget et corrections ; 6 loi de règlement, avant le projet suivant ; puis un nouveau cycle</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.t{font-size:15px;font-weight:bold}.n{font-size:13px}.b{font-weight:bold}
.p{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}.v{fill:#FFE2BF;stroke:#061F44;stroke-width:2.5}.x{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.a{fill:none;stroke:#061F44;stroke-width:3.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Le cycle budgétaire annuel</text>
<rect x="50" y="65" width="210" height="120" rx="8" class="p"/>
<text x="64" y="90" class="t">1. Cadrage à moyen terme</text>
<text x="64" y="112" class="n">Cadre sur trois ans au minimum,</text><text x="64" y="130" class="n">transmis au Parlement</text><text x="64" y="148" class="n b">avant le 15 juin</text>
<rect x="295" y="65" width="210" height="120" rx="8" class="p"/>
<text x="309" y="90" class="t">2. Débat d'orientation</text>
<text x="309" y="112" class="n">En séance publique,</text><text x="309" y="130" class="n b">avant le 30 juin,</text><text x="309" y="148" class="n">sans vote</text>
<rect x="540" y="65" width="210" height="120" rx="8" class="p"/>
<text x="554" y="90" class="t">3. Préparation du projet</text>
<text x="554" y="112" class="n">Le Premier Ministre arbitre ;</text><text x="554" y="130" class="n">demandes de crédits par</text><text x="554" y="148" class="n">programme des ministères</text>
<path d="M262,125H292" class="a" marker-end="url(#ar)"/><path d="M507,125H537" class="a" marker-end="url(#ar)"/>
<path d="M645,187V272" class="a" marker-end="url(#ar)"/>
<rect x="540" y="275" width="210" height="120" rx="8" class="v"/>
<text x="554" y="300" class="t">4. Dépôt et vote</text>
<text x="554" y="322" class="n">Dépôt 45 jours au plus tard</text><text x="554" y="340" class="n">après l'ouverture de la 2e</text><text x="554" y="358" class="n">session ordinaire ; vote par</text><text x="554" y="376" class="n">programme</text>
<rect x="295" y="275" width="210" height="120" rx="8" class="x"/>
<text x="309" y="300" class="t">5. Exécution du budget</text>
<text x="309" y="322" class="n">Virements, transferts ;</text><text x="309" y="340" class="n">loi de finances rectificative</text><text x="309" y="358" class="n">si l'équilibre est bouleversé</text>
<rect x="50" y="275" width="210" height="120" rx="8" class="x"/>
<text x="64" y="300" class="t">6. Loi de règlement</text>
<text x="64" y="322" class="n">Arrête les comptes de l'exercice,</text><text x="64" y="340" class="n">donne quitus au Gouvernement,</text><text x="64" y="358" class="n b">avant le projet suivant</text>
<path d="M538,335H508" class="a" marker-end="url(#ar)"/><path d="M293,335H263" class="a" marker-end="url(#ar)"/>
<path d="M155,273V188" class="a" marker-end="url(#ar)"/>
<text x="170" y="236" class="b">Nouveau cycle l'année suivante</text>
<rect x="50" y="424" width="18" height="18" class="p"/><text x="76" y="438">Préparation</text>
<rect x="200" y="424" width="18" height="18" class="v"/><text x="226" y="438">Vote</text>
<rect x="320" y="424" width="18" height="18" class="x"/><text x="346" y="438">Exécution et contrôle</text>
<text x="50" y="472" class="n">Les dates précises de la préparation sont fixées par voie réglementaire (à confirmer auprès des services budgétaires).</text>
</svg>
