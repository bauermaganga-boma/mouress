<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Frise comparant en années les durées et délais de la loi n° 002/2019 : autorisation de prospection 18 mois au plus ; exploration 8 ans plus 1 an de prorogation, 10 ans au maximum ; appréciation à entreprendre sous 18 mois en zone conventionnelle ou 24 mois en mer profonde ; installations sous 2 ans ; développement et production : liquides 10 ans plus 3 fois 5 ans en zone conventionnelle, 15 ans plus 8 et 7 ans en mer profonde ; gaz 15 ans plus 3 fois 5 ans, ou 20 ans plus 8 et 7 ans</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.t{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.dz{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:6 5}
.og{fill:#F28C28;stroke:#061F44;stroke-width:2}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Durées et délais clés des titres amont</text>

<path d="M285,62H757.5" class="ld"/><path d="M285,62v6" class="ld"/><text x="285" y="54" class="c t">0</text><path d="M352.5,62v6" class="ld"/><text x="352.5" y="54" class="c t">5</text><path d="M420,62v6" class="ld"/><text x="420" y="54" class="c t">10</text><path d="M487.5,62v6" class="ld"/><text x="487.5" y="54" class="c t">15</text><path d="M555,62v6" class="ld"/><text x="555" y="54" class="c t">20</text><path d="M622.5,62v6" class="ld"/><text x="622.5" y="54" class="c t">25</text><path d="M690,62v6" class="ld"/><text x="690" y="54" class="c t">30</text><path d="M757.5,62v6" class="ld"/><text x="757.5" y="54" class="c t">35</text><text x="277" y="54" class="e t">années</text>
<text x="12" y="90" class="b t">Autorisation de prospection</text><text x="12" y="106" class="t">au plus 18 mois</text><rect x="285" y="76" width="20.25" height="20" class="bl"/><text x="313.25" y="91" class="t">≤ 18 mois (art. 80)</text>
<text x="12" y="136" class="b t">Exploration</text><text x="12" y="152" class="t">8 ans + 1 an, 10 ans au plus</text><rect x="285" y="122" width="108" height="20" class="bl"/><rect x="393" y="122" width="13.5" height="20" class="og"/><rect x="406.5" y="122" width="13.5" height="20" class="dz"/><text x="428" y="137" class="t">8 ans, +1 an, plafond 10 ans (art. 83)</text>
<text x="12" y="182" class="b t">Appréciation (début des travaux)</text><text x="12" y="198" class="t">après notification de la découverte</text><rect x="285" y="164" width="20.25" height="20" class="bl"/><text x="313.25" y="178" class="t">≤ 18 mois : zone conventionnelle</text><rect x="285" y="184" width="27" height="20" class="gr"/><text x="320" y="198" class="t">≤ 24 mois : mer profonde (art. 64)</text>
<text x="12" y="234" class="b t">Début des installations</text><text x="12" y="250" class="t">après délivrance du titre</text><rect x="285" y="220" width="27" height="20" class="bl"/><text x="320" y="235" class="t">≤ 2 ans, sauf prorogation (art. 92)</text>
<text x="12" y="280" class="b t">Liquides, zone conventionnelle</text><text x="12" y="296" class="t">développement-production</text><rect x="285" y="266" width="135" height="20" class="bl"/><rect x="420" y="266" width="67.5" height="20" class="og"/><rect x="487.5" y="266" width="67.5" height="20" class="og"/><rect x="555" y="266" width="67.5" height="20" class="og"/><text x="293" y="281" class="t b">10+5+5+5 = 25 ans max.</text>
<text x="12" y="320" class="b t">Liquides, mer profonde</text><text x="12" y="336" class="t">développement-production</text><rect x="285" y="306" width="202.5" height="20" class="bl"/><rect x="487.5" y="306" width="108" height="20" class="og"/><rect x="595.5" y="306" width="94.5" height="20" class="og"/><text x="293" y="321" class="t b">15+8+7 = 30 ans max.</text>
<text x="12" y="360" class="b t">Gaz, zone conventionnelle</text><text x="12" y="376" class="t">développement-production</text><rect x="285" y="346" width="202.5" height="20" class="bl"/><rect x="487.5" y="346" width="67.5" height="20" class="og"/><rect x="555" y="346" width="67.5" height="20" class="og"/><rect x="622.5" y="346" width="67.5" height="20" class="og"/><text x="293" y="361" class="t b">15+5+5+5 = 30 ans max.</text>
<text x="12" y="400" class="b t">Gaz, mer profonde</text><text x="12" y="416" class="t">développement-production</text><rect x="285" y="386" width="270" height="20" class="bl"/><rect x="555" y="386" width="108" height="20" class="og"/><rect x="663" y="386" width="94.5" height="20" class="og"/><text x="293" y="401" class="t b">20+8+7 = 35 ans max.</text>
<rect x="12" y="428" width="16" height="14" class="bl"/><text x="34" y="440" class="t">période initiale</text><rect x="150" y="428" width="16" height="14" class="og"/><text x="172" y="440" class="t">prorogation ou renouvellement</text><rect x="400" y="428" width="16" height="14" class="dz"/><text x="422" y="440" class="t">plafond atteint (exploration)</text><text x="12" y="462" class="t">Le décompte du développement-production part du démarrage de la production (art. 89 et 90).</text></svg>
