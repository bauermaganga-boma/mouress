<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Ordre de passage au guichet : règle générale de l'ordre d'arrivée, priorités prévues par le service, situations qui ne donnent aucune priorité.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Ordre de passage et priorités admises</text>
<rect x="24" y="70" width="230" height="34" rx="0" class="nv"/>
<text x="139" y="92" class="c w">Situation</text>
<rect x="254" y="70" width="500" height="34" rx="0" class="nv"/>
<text x="504" y="92" class="c w">Traitement</text>
<rect x="24" y="104" width="230" height="32" rx="0" class="bl"/>
<text x="32" y="127" class="b">Règle générale</text>
<rect x="254" y="104" width="500" height="32" rx="0" class="bl"/>
<text x="504" y="127" class="c">Ordre d’arrivée ; mêmes règles et mêmes délais pour tous</text>
<rect x="24" y="136" width="230" height="50" rx="0" class="wh"/>
<text x="32" y="159" class="b">Priorité prévue par le</text>
<text x="32" y="177" class="b">service</text>
<rect x="254" y="136" width="500" height="50" rx="0" class="wh"/>
<text x="504" y="159" class="c">Personne âgée, femme enceinte, personne en situation de handicap,</text>
<text x="504" y="177" class="c">urgence légale identifiée</text>
<rect x="24" y="186" width="230" height="50" rx="0" class="bl"/>
<text x="32" y="209" class="b">Aucune priorité</text>
<rect x="254" y="186" width="500" height="50" rx="0" class="bl"/>
<text x="504" y="209" class="c">Ami ou connaissance de l’agent, personne influente, service</text>
<text x="504" y="227" class="c">offert, insistance</text>
<text x="400" y="276" class="c">Passer devant les autres sans motif prévu est une rupture d’égalité.</text>
</svg>
