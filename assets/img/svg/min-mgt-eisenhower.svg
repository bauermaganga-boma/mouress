<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Matrice d'Eisenhower : quatre cases selon l'urgence et l'importance. Urgent et important : à faire tout de suite. Important mais pas urgent : à planifier. Urgent mais peu important : à déléguer. Ni urgent ni important : à limiter ou éliminer.</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.t{font-size:15px;font-weight:bold}.o{fill:#B85C0A;font-weight:bold;font-size:16px}
.q{stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Matrice d'Eisenhower : urgent et important</text>
<text x="280" y="68" class="c b">URGENT</text>
<text x="610" y="68" class="c b">PAS URGENT</text>
<text transform="translate(75,170) rotate(-90)" class="c b">IMPORTANT</text>
<text transform="translate(75,365) rotate(-90)" class="c b">PEU IMPORTANT</text>

<rect x="120" y="78" width="320" height="185" rx="8" class="q" fill="#F9DDBB"/>
<text x="136" y="104" class="t">1 · Urgent et important</text>
<text x="136" y="128" class="o">À FAIRE TOUT DE SUITE</text>
<text x="136" y="160">• Demande du cabinet à rendre demain</text>
<text x="136" y="186">• Incident grave dans le service</text>
<text x="136" y="212">• Échéance réglementaire du jour</text>

<rect x="450" y="78" width="320" height="185" rx="8" class="q" fill="#DCE6F5"/>
<text x="466" y="104" class="t">2 · Important, pas urgent</text>
<text x="466" y="128" class="o">À PLANIFIER</text>
<text x="466" y="160">• Rapport mensuel (dû dans cinq jours)</text>
<text x="466" y="186">• Formation des agents</text>
<text x="466" y="212">• Entretien annuel d'un agent</text>

<rect x="120" y="273" width="320" height="185" rx="8" class="q" fill="#E8EAEE"/>
<text x="136" y="299" class="t">3 · Urgent, peu important</text>
<text x="136" y="323" class="o">À DÉLÉGUER</text>
<text x="136" y="355">• Enregistrement du courrier courant</text>
<text x="136" y="381">• Appel de routine d'un collègue</text>
<text x="136" y="407">• Mise en forme d'un tableau de routine</text>

<rect x="450" y="273" width="320" height="185" rx="8" class="q" fill="#FCFBF8"/>
<text x="466" y="299" class="t">4 · Ni urgent ni important</text>
<text x="466" y="323" class="o">À LIMITER OU ÉLIMINER</text>
<text x="466" y="355">• Réunion sans ordre du jour</text>
<text x="466" y="381">• Messages sans rapport avec le travail</text>
<text x="466" y="407">• Bavardages prolongés</text>

<text x="445" y="486" class="c" style="font-size:13px">Exemples donnés à titre d'illustration.</text>
</svg>
