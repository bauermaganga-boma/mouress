<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Cycle de vie d'une donnée pétrolière en six étapes : 1 acquisition (sismique, puits, production) ; 2 remise au Ministère au fur et à mesure, avec métadonnées et bordereau ; 3 contrôle qualité ; 4 conservation (sauvegarde 3-2-1, archivage, carothèque) ; 5 période de confidentialité, durée fixée au contrat ; 6 accès contrôlé en salle de données ; puis de nouveaux travaux produisent de nouvelles données</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.t{font-size:15px;font-weight:bold}.n{font-size:13px}.b{font-weight:bold}
.p{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}.v{fill:#FFE2BF;stroke:#061F44;stroke-width:2.5}.x{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.a{fill:none;stroke:#061F44;stroke-width:3.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Cycle de vie d'une donnée pétrolière</text>
<rect x="50" y="65" width="210" height="120" rx="8" class="x"/>
<text x="64" y="90" class="t">1. Acquisition</text>
<text x="64" y="112" class="n">Sismique, puits, production ;</text><text x="64" y="130" class="n">la donnée brute est</text><text x="64" y="148" class="n">irremplaçable</text>
<rect x="295" y="65" width="210" height="120" rx="8" class="p"/>
<text x="309" y="90" class="t">2. Remise au Ministère</text>
<text x="309" y="112" class="n b">Au fur et à mesure</text><text x="309" y="130" class="n">de l'acquisition, avec</text><text x="309" y="148" class="n">métadonnées et bordereau</text>
<rect x="540" y="65" width="210" height="120" rx="8" class="p"/>
<text x="554" y="90" class="t">3. Contrôle qualité</text>
<text x="554" y="112" class="n">Fichier lisible et complet ;</text><text x="554" y="130" class="n">unités, coordonnées et</text><text x="554" y="148" class="n">identifiants vérifiés</text>
<path d="M262,125H292" class="a" marker-end="url(#ar)"/><path d="M507,125H537" class="a" marker-end="url(#ar)"/>
<path d="M645,187V272" class="a" marker-end="url(#ar)"/>
<rect x="540" y="275" width="210" height="120" rx="8" class="v"/>
<text x="554" y="300" class="t">4. Conservation</text>
<text x="554" y="322" class="n">Sauvegarde 3-2-1, archivage</text><text x="554" y="340" class="n">à long terme ; carothèque</text><text x="554" y="358" class="n">pour les échantillons</text>
<rect x="295" y="275" width="210" height="120" rx="8" class="v"/>
<text x="309" y="300" class="t">5. Confidentialité</text>
<text x="309" y="322" class="n">Réservée à l'État et au</text><text x="309" y="340" class="n">contracteur ; durée fixée au</text><text x="309" y="358" class="n b">contrat (à confirmer)</text>
<rect x="50" y="275" width="210" height="120" rx="8" class="v"/>
<text x="64" y="300" class="t">6. Accès contrôlé</text>
<text x="64" y="322" class="n">Salle de données, accord de</text><text x="64" y="340" class="n">confidentialité signé, journal</text><text x="64" y="358" class="n">des consultations</text>
<path d="M538,335H508" class="a" marker-end="url(#ar)"/><path d="M293,335H263" class="a" marker-end="url(#ar)"/>
<path d="M155,273V188" class="a" marker-end="url(#ar)"/>
<text x="170" y="236" class="b">Nouveaux travaux : nouvelles données</text>
<rect x="50" y="424" width="18" height="18" class="x"/><text x="76" y="438">Production</text>
<rect x="190" y="424" width="18" height="18" class="p"/><text x="216" y="438">Remise et qualité</text>
<rect x="370" y="424" width="18" height="18" class="v"/><text x="396" y="438">Protection et accès</text>
<text x="50" y="472" class="n">Toute divulgation à un tiers exige l'accord préalable de l'autorité compétente.</text>
</svg>
