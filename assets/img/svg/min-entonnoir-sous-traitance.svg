<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Entonnoir de la sous-traitance pétrolière : l'opérateur, la société B de rang 1 (120 salariés dont 70 Gabonais), la société C de rang 2 (40 salariés dont 30 Gabonais) et les PME nationales, reliés par les contrats n° 1, 2 et 3</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style></defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Entonnoir de la sous-traitance pétrolière (exemple fictif)</text>
<polygon points="60,55 560,55 520,135 100,135" class="nvf"/>
<text x="310" y="88" class="w c">Opérateur</text>
<text x="310" y="110" class="w c">titulaire de l'autorisation</text>
<polygon points="100,145 520,145 480,235 140,235" class="bl"/>
<text x="310" y="175" class="b c">Sous-traitant de rang 1</text>
<text x="310" y="196" class="c">Société B</text>
<text x="310" y="217" class="c">120 salariés dont 70 Gabonais</text>
<polygon points="140,245 480,245 440,335 180,335" class="gr"/>
<text x="310" y="275" class="b c">Sous-traitant de rang 2</text>
<text x="310" y="296" class="c">Société C</text>
<text x="310" y="317" class="c">40 salariés dont 30 Gabonais</text>
<polygon points="180,345 440,345 410,435 210,435" class="orf"/>
<text x="310" y="377" class="b c">PME nationales</text>
<text x="310" y="398" class="c">fournisseurs et prestataires</text>
<text x="310" y="418" class="c">locaux</text>
<path d="M590,140H640" class="nv"/><text x="650" y="146" class="o">Contrat n° 1</text>
<text x="590" y="170" style="font-size:13px">Opérateur – société B</text>
<path d="M530,240H640" class="nv"/><text x="650" y="246" class="o">Contrat n° 2</text>
<text x="590" y="270" style="font-size:13px">Société B – société C</text>
<path d="M490,340H640" class="nv"/><text x="650" y="346" class="o">Contrat n° 3</text>
<text x="590" y="370" style="font-size:13px">Société C – PME</text>
<path d="M740,60V430" class="or" marker-end="url(#ao)"/>
<text x="400" y="472" class="c" style="font-size:14px">À chaque rang, la part du marché qui descend vers les PME nationales se réduit.</text>
<text x="400" y="492" class="c" style="font-size:13px">Schéma d'illustration : les sociétés et les effectifs sont fictifs.</text>
</svg>
