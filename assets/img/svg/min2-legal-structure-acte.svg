<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Structure d'un décret : en-tête, intitulé avec numéro et objet, visas du plus élevé au plus bas, formule DÉCRÈTE, articles du dispositif, dispositions finales (abrogation, entrée en vigueur) et formule de publication au Journal officiel</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.sm{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.or{fill:#FFF1DF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.ln{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Structure d'un décret (schéma de lecture)</text><rect x="40" y="50" width="400" height="432" rx="6" class="wh"/><rect x="54" y="58" width="372" height="40" rx="4" class="gr"/>
<text x="240" y="83" class="b c">RÉPUBLIQUE GABONAISE</text><rect x="54" y="108" width="372" height="46" rx="4" class="bl"/>
<text x="240" y="136" class="b c">Décret n° …/PR/… portant …</text><rect x="54" y="162" width="372" height="100" rx="4" class="wh"/>
<text x="240" y="190" class="c">Vu la Constitution ;</text>
<text x="240" y="208" class="c">Vu la loi n° … ;</text>
<text x="240" y="226" class="c">Vu le décret n° … ;</text>
<text x="240" y="244" class="c">Le Conseil d'État entendu ;</text><rect x="54" y="270" width="372" height="36" rx="4" class="gr"/>
<text x="240" y="293" class="b c">DÉCRÈTE :</text><rect x="54" y="314" width="372" height="52" rx="4" class="bl"/>
<text x="240" y="336" class="c">Article 1er : …</text>
<text x="240" y="354" class="c">Article 2 : …</text><rect x="54" y="374" width="372" height="40" rx="4" class="wh"/>
<text x="240" y="390" class="c">Dispositions finales : abrogation,</text>
<text x="240" y="408" class="c">entrée en vigueur</text><rect x="54" y="422" width="372" height="52" rx="4" class="gr"/>
<text x="240" y="444" class="c">Le présent décret sera enregistré, publié</text>
<text x="240" y="462" class="c">au Journal officiel et communiqué…</text><path d="M426,78H478" class="ln" marker-end="url(#ao)"/><text x="486" y="72" class="o">En-tête</text>
<text x="486" y="89">Autorité et pays</text><path d="M426,131H478" class="ln" marker-end="url(#ao)"/><text x="486" y="125" class="o">Intitulé</text>
<text x="486" y="142">Numéro, référence et objet</text><path d="M426,200H478" class="ln" marker-end="url(#ao)"/><text x="486" y="194" class="o">Visas</text>
<text x="486" y="211">Du texte le plus élevé au plus bas,</text>
<text x="486" y="228">jamais un texte abrogé</text><path d="M426,288H478" class="ln" marker-end="url(#ao)"/><text x="486" y="282" class="o">Formule d'adoption</text>
<text x="486" y="299">DÉCRÈTE (arrêté : ARRÊTE)</text><path d="M426,340H478" class="ln" marker-end="url(#ao)"/><text x="486" y="334" class="o">Dispositif</text>
<text x="486" y="351">Un article = une idée</text><path d="M426,394H478" class="ln" marker-end="url(#ao)"/><text x="486" y="388" class="o">Dispositions finales</text>
<text x="486" y="405">Abrogation expresse et</text>
<text x="486" y="422">clause d'entrée en vigueur</text><path d="M426,448H478" class="ln" marker-end="url(#ao)"/><text x="486" y="442" class="o">Formule de publication</text>
<text x="486" y="459">Enregistré, publié au JO</text>
</svg>
