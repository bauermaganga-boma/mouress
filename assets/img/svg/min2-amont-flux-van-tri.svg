<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Graphique en barres des flux nets annuels d’un projet fictif en millions de dollars : année 0 moins 300 d’investissement, puis plus 120 par an de l’année 1 à l’année 5 ; courbe orange des flux cumulés qui passent de moins 300 à plus 300 en coupant l’axe zéro entre l’année 2 et l’année 3</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.t{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.dz{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:6 5}
.og{fill:#F28C28;stroke:#061F44;stroke-width:2}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Flux de trésorerie d’un projet (millions USD, fictif)</text>

<path d="M70,270H760" class="s"/><path d="M70,80V470" class="s"/><path d="M64,450h6" class="ld"/><text x="58" y="455" class="e t">-300</text><path d="M64,390h6" class="ld"/><text x="58" y="395" class="e t">-200</text><path d="M64,330h6" class="ld"/><text x="58" y="335" class="e t">-100</text><path d="M64,270h6" class="ld"/><text x="58" y="275" class="e t">0</text><path d="M64,210h6" class="ld"/><text x="58" y="215" class="e t">100</text><path d="M64,150h6" class="ld"/><text x="58" y="155" class="e t">200</text><path d="M64,90h6" class="ld"/><text x="58" y="95" class="e t">300</text><rect x="84" y="270" width="52" height="180" class="bl"/><text x="110" y="468" class="c b t">-300</text><text x="110" y="490" class="c t">année 0</text><rect x="189" y="198" width="52" height="72" class="bl"/><text x="215" y="192" class="c b t">+120</text><text x="215" y="490" class="c t">année 1</text><rect x="294" y="198" width="52" height="72" class="bl"/><text x="320" y="192" class="c b t">+120</text><text x="320" y="490" class="c t">année 2</text><rect x="399" y="198" width="52" height="72" class="bl"/><text x="425" y="192" class="c b t">+120</text><text x="425" y="490" class="c t">année 3</text><rect x="504" y="198" width="52" height="72" class="bl"/><text x="530" y="192" class="c b t">+120</text><text x="530" y="490" class="c t">année 4</text><rect x="609" y="198" width="52" height="72" class="bl"/><text x="635" y="192" class="c b t">+120</text><text x="635" y="490" class="c t">année 5</text><path d="M110,450 L215,378 L320,306 L425,234 L530,162 L635,90" class="or"/><circle cx="110" cy="450" r="5" class="og"/><circle cx="215" cy="378" r="5" class="og"/><circle cx="320" cy="306" r="5" class="og"/><circle cx="425" cy="234" r="5" class="og"/><circle cx="530" cy="162" r="5" class="og"/><circle cx="635" cy="90" r="5" class="og"/><rect x="100" y="60" width="14" height="14" class="bl"/><text x="120" y="72" class="t">flux net de l’année</text><path d="M100,92h14" class="or"/><text x="120" y="97" class="t">flux cumulé</text><text x="560" y="400" class="t">Quand le cumul coupe l’axe zéro,</text><text x="560" y="418" class="t">l’investissement est compensé.</text></svg>
