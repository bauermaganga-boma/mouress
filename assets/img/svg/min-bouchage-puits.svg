<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Bouchage définitif d'un puits : trois bouchons de ciment (un face au réservoir, posé sur un bouchon mécanique d'appui, un à cheval sur le sabot du tubage, un en surface), fluide dense entre les bouchons, tubages coupés sous le niveau du sol et tête de puits retirée ; contrôle de chaque bouchon par essai de poids et essai de pression</title>
<defs>
<pattern id="cim" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#C9CDD6"/><path d="M0,6L6,0" stroke="#061F44" stroke-width="1"/></pattern>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.cs{fill:none;stroke:#061F44;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Bouchage définitif d'un puits (coupe schématique)</text>

<rect x="40" y="75" width="720" height="390" fill="#F1EDE3" stroke="#061F44" stroke-width="2"/>
<text x="46" y="68" class="b">Niveau du sol (ou fond marin)</text>
<!-- reservoir -->
<rect x="41" y="380" width="718" height="40" fill="#F28C28" opacity="0.55"/>
<text x="196" y="404" class="e b" style="font-size:13px">Réservoir</text>

<!-- interieur du puits -->
<path d="M206,75H294V265H280V455H220V265H206Z" fill="#FFFFFF"/>
<rect x="222" y="75" width="56" height="378" fill="#DCE6F5"/>
<!-- tubages -->
<path d="M206,75V265M294,75V265" class="cs"/>
<path d="M220,75V455M280,75V455" class="cs"/>
<path d="M196,265H214M286,265H304" stroke="#061F44" stroke-width="7"/>
<text x="190" y="270" class="e" style="font-size:13px">Sabot</text>
<!-- perforations -->
<path d="M220,386H206M220,396H206M220,406H206M220,416H206M280,386H294M280,396H294M280,406H294M280,416H294" stroke="#061F44" stroke-width="2.5"/>
<!-- bouchons -->
<rect x="222" y="85" width="56" height="50" fill="url(#cim)" stroke="#061F44" stroke-width="2"/>
<rect x="222" y="235" width="56" height="60" fill="url(#cim)" stroke="#061F44" stroke-width="2"/>
<rect x="222" y="335" width="56" height="88" fill="url(#cim)" stroke="#061F44" stroke-width="2"/>
<rect x="222" y="425" width="56" height="10" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<!-- coupe en surface -->
<path d="M196,75H304" stroke="#B85C0A" stroke-width="3" stroke-dasharray="7 4"/>

<!-- etiquettes -->
<text x="340" y="104" class="b">③ Bouchon de surface</text><text x="340" y="121">(ciment)</text>
<path d="M336,108H280" class="ld"/>
<text x="340" y="186" class="b">Fluide dense (boue)</text><text x="340" y="203">entre les bouchons</text>
<path d="M336,190H280" class="ld"/>
<text x="340" y="256" class="b">② Bouchon au sabot :</text><text x="340" y="273">à cheval sur le sabot</text>
<path d="M336,260H280" class="ld"/>
<text x="340" y="352" class="b">① Bouchon face au</text><text x="340" y="369" class="b">réservoir (ciment)</text>
<path d="M336,362H280" class="ld"/>
<text x="340" y="430" class="b">Bouchon mécanique d'appui</text>
<path d="M336,426H280" class="ld"/>
<text x="340" y="64" class="o" style="font-size:13px">Tubages coupés sous le sol, tête de puits retirée</text>

<!-- controles -->
<rect x="545" y="150" width="215" height="165" rx="6" fill="#FFFFFF" stroke="#061F44" stroke-width="2"/>
<text x="652" y="172" class="c b">Contrôle de chaque bouchon</text>
<text x="557" y="196" class="b">Essai de poids :</text>
<text x="557" y="213">le train de tiges est posé</text>
<text x="557" y="230">sur le ciment durci</text>
<text x="557" y="256" class="b">Essai de pression</text>
<text x="557" y="282" class="b">Rapport final avec le</text>
<text x="557" y="299">schéma du puits laissé</text>

<text x="400" y="490" class="c b">En général deux barrières indépendantes, étanchéité démontrée par des essais</text>
</svg>
