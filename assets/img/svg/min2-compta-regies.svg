<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Deux types de régies : régie d'avances (avance, dépenses urgentes, justification, reconstitution) et régie de recettes (encaissement, reçu à souche, versement au comptable). Exemple fictif d'avance de 1 000 000 FCFA.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Régie d’avances et régie de recettes</text>
<text x="24" y="60" class="b">Régie d’avances</text>
<rect x="24" y="70" width="165" height="112" rx="8" class="bl"/>
<text x="106.5" y="94" class="c b">Avance remise</text>
<text x="106.5" y="116" class="c">Au régisseur, pour</text>
<text x="106.5" y="134" class="c">de menues dépenses</text>
<rect x="219" y="70" width="165" height="112" rx="8" class="wh"/>
<text x="301.5" y="94" class="c b">Dépenses payées</text>
<text x="301.5" y="116" class="c">Urgentes, avec</text>
<text x="301.5" y="134" class="c">pièces</text>
<text x="301.5" y="152" class="c">justificatives</text>
<rect x="414" y="70" width="165" height="112" rx="8" class="bl"/>
<text x="496.5" y="94" class="c b">Justification</text>
<text x="496.5" y="116" class="c">Pièces remises au</text>
<text x="496.5" y="134" class="c">comptable</text>
<rect x="609" y="70" width="165" height="112" rx="8" class="or"/>
<text x="691.5" y="94" class="c b">Reconstitution</text>
<text x="691.5" y="116" class="c">Rétablit l’avance à</text>
<text x="691.5" y="134" class="c">hauteur des</text>
<text x="691.5" y="152" class="c">dépenses justifiées</text>
<path d="M191,126H216" class="ln" marker-end="url(#ar)"/>
<path d="M386,126H411" class="ln" marker-end="url(#ar)"/>
<path d="M581,126H606" class="ln" marker-end="url(#ar)"/>
<text x="24" y="218" class="b">Régie de recettes</text>
<rect x="24" y="228" width="221" height="84" rx="8" class="bl"/>
<text x="134.5" y="252" class="c b">Encaissement</text>
<text x="134.5" y="274" class="c">De petits produits</text>
<rect x="289" y="228" width="221" height="84" rx="8" class="wh"/>
<text x="399.5" y="252" class="c b">Reçu à souche</text>
<text x="399.5" y="274" class="c">Remis à chaque payeur,</text>
<text x="399.5" y="292" class="c">inscrit au livre de caisse</text>
<rect x="554" y="228" width="221" height="84" rx="8" class="or"/>
<text x="664.5" y="252" class="c b">Versement</text>
<text x="664.5" y="274" class="c">Au comptable, dans les</text>
<text x="664.5" y="292" class="c">délais</text>
<path d="M247,270H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,270H551" class="ln" marker-end="url(#ar)"/>
<text x="400" y="346" class="c">Exemple fictif : avance de 1 000 000 FCFA, dépenses justifiées de 700 000 FCFA.</text>
<text x="400" y="366" class="c">Il reste 300 000 FCFA en caisse ; la reconstitution porte sur les dépenses justifiées.</text>
</svg>
