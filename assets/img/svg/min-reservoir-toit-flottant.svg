<rect x="14" y="325" width="12" height="95" class="gr"/><rect x="774" y="325" width="12" height="95" class="gr"/>
<rect x="90" y="160" width="200" height="235" class="s"/>
<rect x="91" y="240" width="198" height="155" fill="#DCE6F5"/>
<rect x="91" y="375" width="198" height="20" fill="#E8EAEE"/>
<path d="M90,160L190,120L290,160" class="s"/>
