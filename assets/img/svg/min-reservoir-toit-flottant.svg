<text x="190" y="300" class="c b">Produit</text>
<text x="190" y="389" class="c n">Eau de fond</text>
<text x="190" y="445" class="c b">Bac à toit fixe</text>
<rect x="500" y="160" width="200" height="235" class="s"/>
<rect x="501" y="210" width="198" height="185" fill="#DCE6F5"/>
<rect x="501" y="375" width="198" height="20" fill="#E8EAEE"/>
