<text x="600" y="190" class="c b">Toit flottant</text>
<path d="M700,207H716" class="ld"/><text x="720" y="204" class="n">Joint</text><text x="720" y="220" class="n">d'étanchéité</text>
<text x="600" y="300" class="c b">Produit</text>
<text x="600" y="389" class="c n">Eau de fond</text>
<text x="600" y="445" class="c b">Bac à toit flottant</text>
