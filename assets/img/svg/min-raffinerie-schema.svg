<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Schéma de principe d'une raffinerie : dessalage, four, distillation atmosphérique, hydrotraitement du naphta, du kérosène et du gazole, reformage catalytique du naphta, distillation sous vide du résidu et craquage catalytique</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Schéma de principe d'une raffinerie (simplifié)</text>
<text x="10" y="257" class="b">Brut</text>
<path d="M48,262H80" class="nv" marker-end="url(#ar)"/>
<rect x="82" y="238" width="80" height="48" class="gr"/><text x="122" y="267" class="c">Dessalage</text>
<path d="M162,262H190" class="nv" marker-end="url(#ar)"/>
<rect x="192" y="240" width="48" height="44" class="gr"/><text x="216" y="267" class="c">Four</text>
<path d="M240,262H258" class="nv" marker-end="url(#ar)"/>
<rect x="260" y="60" width="100" height="370" rx="36" class="bl"/>
<text x="310" y="238" class="c b n">Distillation</text><text x="310" y="256" class="c b n">atmosphérique</text>
<path d="M262,120H358M282,200H338M262,280H358M282,350H338" fill="none" stroke="#061F44" stroke-width="2"/>
<!-- gaz -->
<path d="M360,100H460" class="nv" marker-end="url(#ar)"/><text x="366" y="93" class="n">Gaz</text><text x="468" y="105" class="o">Gaz (GPL)</text>
<!-- naphta -->
<path d="M360,150H460" class="nv" marker-end="url(#ar)"/><text x="366" y="143" class="n">Coupe naphta</text>
<rect x="460" y="130" width="110" height="40" class="gr"/><text x="515" y="155" class="c n">Hydrotraitement</text>
<path d="M570,150H608" class="nv" marker-end="url(#ar)"/>
<rect x="610" y="130" width="120" height="40" class="bl"/><text x="670" y="148" class="c n">Reformage</text><text x="670" y="163" class="c n">catalytique</text>
<path d="M670,130V116" class="or" marker-end="url(#ao)"/><text x="670" y="104" class="c o">Essence (base)</text>
<text x="670" y="192" class="c o">+ hydrogène</text>
<!-- kerosene -->
<path d="M360,215H460" class="nv" marker-end="url(#ar)"/><text x="366" y="208" class="n">Coupe kérosène</text>
<rect x="460" y="195" width="110" height="40" class="gr"/><text x="515" y="220" class="c n">Hydrotraitement</text>
<path d="M570,215H608" class="nv" marker-end="url(#ar)"/><text x="614" y="220" class="o">Kérosène</text>
<!-- gazole -->
<path d="M360,285H460" class="nv" marker-end="url(#ar)"/><text x="366" y="278" class="n">Coupe gazole</text>
<rect x="460" y="265" width="110" height="40" class="gr"/><text x="515" y="290" class="c n">Hydrotraitement</text>
<path d="M570,285H608" class="nv" marker-end="url(#ar)"/><text x="614" y="290" class="o">Gazole</text>
<!-- residu -->
<path d="M360,370H460" class="nv" marker-end="url(#ar)"/><text x="366" y="362" class="n">Résidu</text><text x="366" y="388" class="n">atmosphérique</text>
<rect x="460" y="345" width="110" height="50" class="bl"/><text x="515" y="365" class="c n">Distillation</text><text x="515" y="382" class="c n">sous vide</text>
<path d="M570,370H638" class="nv" marker-end="url(#ar)"/><text x="604" y="361" class="c n">Distillat</text><text x="604" y="388" class="c n">sous vide</text>
<rect x="640" y="345" width="130" height="50" class="bl"/><text x="705" y="365" class="c n">Craquage</text><text x="705" y="382" class="c n">catalytique</text>
<path d="M705,345V318" class="or" marker-end="url(#ao)"/><text x="705" y="311" class="c o">Essence et gazole</text>
<path d="M515,395V430" class="nv" marker-end="url(#ar)"/><text x="515" y="450" class="c o">Résidu sous vide</text><text x="515" y="468" class="c n">(bitume, fioul lourd)</text>
<text x="400" y="505" class="c n">Schéma de principe : les raffineries réelles varient selon leurs unités.</text>
</svg>
