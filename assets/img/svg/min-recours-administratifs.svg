<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Voies de recours contre une décision administrative : recours gracieux, hiérarchique, de tutelle, puis recours contentieux</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}.t{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#B85C0A;stroke-width:2.5}
.orl{fill:#FCFBF8;stroke:#F28C28;stroke-width:3}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Voies de recours contre une décision administrative</text>
<rect x="250" y="48" width="300" height="52" rx="8" class="nvf"/>
<text x="400" y="70" class="c w">Décision administrative contestée</text>
<text x="400" y="89" class="c w t">expresse ou implicite (silence)</text>
<path d="M400,100V122" class="nv" marker-end="url(#ar)"/>
<rect x="20" y="124" width="760" height="150" rx="10" class="bl" style="opacity:.55"/>
<text x="34" y="146" class="b">Recours administratifs : adressés à l'administration, gratuits</text>
<rect x="40" y="158" width="220" height="104" rx="8" class="wh"/>
<text x="150" y="181" class="c b">Recours gracieux</text>
<text x="150" y="205" class="c t">Adressé à l'auteur</text>
<text x="150" y="224" class="c t">de la décision :</text>
<text x="150" y="243" class="c t">retrait ou modification</text>
<rect x="290" y="158" width="220" height="104" rx="8" class="wh"/>
<text x="400" y="181" class="c b">Recours hiérarchique</text>
<text x="400" y="205" class="c t">Adressé au supérieur</text>
<text x="400" y="224" class="c t">de l'auteur : annule,</text>
<text x="400" y="243" class="c t">réforme ou confirme</text>
<rect x="540" y="158" width="220" height="104" rx="8" class="wh"/>
<text x="650" y="181" class="c b">Recours de tutelle</text>
<text x="650" y="205" class="c t">Adressé à l'autorité de</text>
<text x="650" y="224" class="c t">tutelle, seulement si</text>
<text x="650" y="243" class="c t">un texte le prévoit</text>
<path d="M400,274V316" class="or" marker-end="url(#ao)"/>
<text x="414" y="300" class="o">Rejet exprès ou silence : saisine du juge</text>
<rect x="20" y="318" width="760" height="130" rx="10" class="gr" style="opacity:.7"/>
<text x="34" y="340" class="b">Recours contentieux : portés devant la juridiction administrative</text>
<rect x="40" y="350" width="220" height="86" rx="8" class="wh"/>
<text x="150" y="372" class="c b">Excès de pouvoir</text>
<text x="150" y="392" class="c t">Le juge contrôle la</text>
<text x="150" y="409" class="c t">légalité et annule</text>
<text x="150" y="426" class="c t">l'acte illégal</text>
<rect x="290" y="350" width="220" height="86" rx="8" class="wh"/>
<text x="400" y="372" class="c b">Plein contentieux</text>
<text x="400" y="392" class="c t">Le juge tranche le</text>
<text x="400" y="409" class="c t">litige : indemnité,</text>
<text x="400" y="426" class="c t">somme à payer</text>
<rect x="540" y="350" width="220" height="86" rx="8" class="wh"/>
<text x="650" y="372" class="c b">Référé</text>
<text x="650" y="392" class="c t">Mesure provisoire</text>
<text x="650" y="409" class="c t">en urgence : suspension</text>
<text x="650" y="426" class="c t">de la décision</text>
<text x="400" y="473" class="c o">Délais et juridiction compétente : à vérifier dans les textes gabonais en vigueur.</text>
<text x="400" y="492" class="c t">Un recours administratif formé dans les délais prolonge ou interrompt le délai du recours contentieux.</text>
</svg>
