<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Repères de la fiscalité pétrolière de la loi n° 002/2019 : redevance superficiaire de 100 FCFA par hectare en exploration et 5 000 FCFA par hectare en exploitation avant le 31 janvier, redevance minière proportionnelle dès la mise en production, PID et PIH sur le chiffre d'affaires à 1 % et 2 %, droits d'enregistrement de 3 % sur les cessions, TVA à 0 %, franchise douanière sur certificat d'utilisation finale et taux réduit de 5 % ; qui saisir : douane, direction générale des impôts</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF;font-weight:bold}
.t13{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:1.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:1.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="28" class="h">Fiscalité pétrolière : repères de la loi n° 002/2019</text>
<text x="400" y="48" class="c t13">Prélèvements du contracteur : montants et taux cités par le cours (à vérifier dans le texte en vigueur)</text>

<rect x="30" y="58" width="230" height="28" class="nvf"/><rect x="260" y="58" width="510" height="28" class="nvf"/>
<text x="42" y="77" class="w">Prélèvement</text><text x="272" y="77" class="w">Montant, taux et règle</text>

<rect x="30" y="86" width="230" height="46" class="bl"/><rect x="260" y="86" width="510" height="46" class="bl"/>
<text x="42" y="114" class="b">Redevance superficiaire</text>
<text x="272" y="106" class="o">100 FCFA par hectare en exploration</text><text x="272" y="124">5 000 FCFA par hectare en exploitation, avant le 31 janvier (art. 208)</text>

<rect x="30" y="132" width="230" height="46" class="gr"/><rect x="260" y="132" width="510" height="46" class="gr"/>
<text x="42" y="160" class="b">Redevance minière (RMP)</text>
<text x="272" y="152" class="o">Dès la mise en production</text><text x="272" y="170">Fourchette par exemple de 7 % à 15 % pour les liquides (art. 209)</text>

<rect x="30" y="178" width="230" height="46" class="bl"/><rect x="260" y="178" width="510" height="46" class="bl"/>
<text x="42" y="206" class="b">PID et PIH</text>
<text x="272" y="198" class="o">Assiette : le chiffre d'affaires</text><text x="272" y="216">Taux de 1 % et de 2 % (art. 217)</text>

<rect x="30" y="224" width="230" height="46" class="gr"/><rect x="260" y="224" width="510" height="46" class="gr"/>
<text x="42" y="252" class="b">Cession de droits</text>
<text x="272" y="244" class="o">3 % de droits d'enregistrement (art. 196)</text><text x="272" y="262">sur la valeur réelle ; plus-value taxée à l'impôt sur les sociétés (art. 197)</text>

<rect x="30" y="270" width="230" height="46" class="bl"/><rect x="260" y="270" width="510" height="46" class="bl"/>
<text x="42" y="298" class="b">TVA</text>
<text x="272" y="290" class="o">Taux de 0 % pour les activités d'hydrocarbures</text><text x="272" y="308">des contracteurs ; importations exonérées (art. 202)</text>

<rect x="30" y="316" width="230" height="46" class="gr"/><rect x="260" y="316" width="510" height="46" class="gr"/>
<text x="42" y="344" class="b">Matériel importé</text>
<text x="272" y="336" class="o">Franchise pour l'exploration, sur certificat</text><text x="272" y="354">d'utilisation finale ; taux réduit de 5 % pour la production (art. 227)</text>

<text x="400" y="388" class="c b">Qui saisir, pour quoi ?</text>
<rect x="30" y="398" width="240" height="60" rx="6" class="bl"/>
<text x="150" y="418" class="c b">Exonération, certificat</text><text x="150" y="436" class="c t13">La douane, après avis technique</text><text x="150" y="452" class="c t13">du ministère des Hydrocarbures</text>
<rect x="280" y="398" width="240" height="60" rx="6" class="gr"/>
<text x="400" y="418" class="c b">Contrôle d'une redevance</text><text x="400" y="436" class="c t13">La Direction générale des Impôts ;</text><text x="400" y="452" class="c t13">le ministère fournit les volumes</text>
<rect x="530" y="398" width="240" height="60" rx="6" class="bl"/>
<text x="650" y="418" class="c b">Litige douanier</text><text x="650" y="436" class="c t13">La douane, puis les recours</text><text x="650" y="452" class="c t13">prévus par les textes</text>
<text x="400" y="482" class="c t13">Les délais de traitement dépendent des administrations ; seules les dates fixées par la loi s'imposent.</text>
</svg>
