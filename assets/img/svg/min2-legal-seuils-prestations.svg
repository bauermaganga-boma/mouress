<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau des seuils de passation obligatoire de l'État (travaux 50, fournitures 35, services 25 millions de FCFA TTC, arrêté du 23 février 2024), procédure sous le seuil avec trois cotations, interdiction du fractionnement, et paliers des prestations supplémentaires : moins de 15 % ordre de service, 15 % et plus avenant, 30 % et plus nouveau marché</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.sm{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2.5}
.or{fill:#FFF1DF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3}
.ln{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Marchés publics : seuils de passation et prestations supplémentaires</text><rect x="20" y="50" width="380" height="50" rx="8" class="or"/>
<text x="210" y="70" class="b c">Seuils de passation obligatoire (État)</text>
<text x="210" y="90" class="c">Arrêté n° 008.24/MEP du 23 février 2024, TTC</text><rect x="20" y="112" width="380" height="50" class="bl"/><text x="34" y="134" class="b">Travaux</text><text x="34" y="153">50 millions de FCFA</text><rect x="20" y="170" width="380" height="50" class="bl"/><text x="34" y="192" class="b">Fournitures</text><text x="34" y="211">35 millions de FCFA</text><rect x="20" y="228" width="380" height="50" class="bl"/><text x="34" y="250" class="b">Services et prestations intellectuelles</text><text x="34" y="269">25 millions de FCFA</text><rect x="20" y="290" width="380" height="86" rx="8" class="gr"/>
<text x="210" y="309.5" class="b c">Sous le seuil (art. 8)</text>
<text x="210" y="328.5" class="c">Demande de cotations auprès d'au moins trois</text>
<text x="210" y="347.5" class="c">fournisseurs à actionnariat différent,</text>
<text x="210" y="366.5" class="c">puis lettre de commande</text><rect x="20" y="388" width="380" height="92" rx="8" class="or"/>
<text x="210" y="419" class="b c">Fractionnement interdit</text>
<text x="210" y="439" class="c">Scinder une même dépense en plusieurs commandes</text>
<text x="210" y="459" class="c">pour rester sous le seuil est prohibé et sanctionné</text><rect x="420" y="50" width="360" height="50" rx="8" class="or"/>
<text x="600" y="70" class="b c">Prestations supplémentaires</text>
<text x="600" y="90" class="c">Part de la valeur du marché de base</text><rect x="420" y="112" width="360" height="82" class="bl"/><text x="436" y="138" class="b">Moins de 15 %</text><text x="436" y="160" class="o">Ordre de service</text><text x="436" y="180">(financement disponible)</text><rect x="420" y="204" width="360" height="82" class="bl"/><text x="436" y="230" class="b">15 % et plus</text><text x="436" y="252" class="o">Avenant</text><text x="436" y="272">(autorisation préalable)</text><rect x="420" y="296" width="360" height="82" class="bl"/><text x="436" y="322" class="b">30 % et plus</text><text x="436" y="344" class="o">Nouveau marché</text><text x="436" y="364">(règles de passation du Code)</text><text x="420" y="410">Seuils et pourcentages à vérifier dans l'arrêté et</text>
<text x="420" y="429">le Code en vigueur à la date de la dépense.</text>
</svg>
