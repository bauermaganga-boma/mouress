<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Modèle des barrières (fromage suisse) : quatre barrières successives, deux de prévention et deux d'atténuation ; une trajectoire A arrêtée par une barrière sans trou en face, une trajectoire B qui traverse quatre trous alignés jusqu'à l'accident</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Modèle des barrières (« fromage suisse »)</text>
<path d="M112,270H596" fill="none" stroke="#F28C28" stroke-width="5" marker-end="url(#ao)"/>
<path d="M112,170H382" class="ln"/>
<path d="M382,152V188" fill="none" stroke="#061F44" stroke-width="6"/>
<path d="M170,105h50v230h-50z M212,125a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M212,170a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M212,270a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z" fill-rule="evenodd" class="bl"/>
<path d="M280,105h50v230h-50z M322,170a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M322,215a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M322,270a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z" fill-rule="evenodd" class="bl"/>
<path d="M390,105h50v230h-50z M432,125a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M432,215a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M432,270a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z" fill-rule="evenodd" class="bl"/>
<path d="M500,105h50v230h-50z M542,130a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M542,215a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z M542,270a17,17 0 1,0 -34,0a17,17 0 1,0 34,0z" fill-rule="evenodd" class="bl"/>
<rect x="18" y="140" width="92" height="170" rx="8" class="gr"/>
<text x="64" y="184.5" class="c b" style="font-size:13px">Danger</text>
<text x="64" y="202.5" class="c" style="font-size:13px"></text>
<text x="64" y="220.5" class="c" style="font-size:13px">Bac</text>
<text x="64" y="238.5" class="c" style="font-size:13px">d'hydro-</text>
<text x="64" y="256.5" class="c" style="font-size:13px">carbure</text>
<text x="64" y="274.5" class="c" style="font-size:13px">(exemple)</text>
<path d="M170,92V84H330V92" class="s"/><text x="250" y="76" class="o c">Prévention (avant)</text>
<path d="M390,92V84H550V92" class="s"/><text x="470" y="76" class="o c">Atténuation (après)</text>
<text x="195" y="360" class="c b" style="font-size:14px">1 · Ronde et</text>
<text x="195" y="378" class="c" style="font-size:14px">procédure</text>
<text x="195" y="396" class="c" style="font-size:14px">(humaine)</text>
<text x="305" y="360" class="c b" style="font-size:14px">2 · Alarme de</text>
<text x="305" y="378" class="c" style="font-size:14px">niveau haut</text>
<text x="305" y="396" class="c" style="font-size:14px">(active)</text>
<text x="415" y="360" class="c b" style="font-size:14px">3 · Cuvette de</text>
<text x="415" y="378" class="c" style="font-size:14px">rétention</text>
<text x="415" y="396" class="c" style="font-size:14px">(passive)</text>
<text x="525" y="360" class="c b" style="font-size:14px">4 · Déluge</text>
<text x="525" y="378" class="c" style="font-size:14px">d'eau</text>
<text x="525" y="396" class="c" style="font-size:14px">(active)</text>
<rect x="590" y="128" width="195" height="84" rx="8" class="bl"/>
<text x="687.5" y="157.5" class="c b" style="font-size:13px">Trajectoire A (haut)</text>
<text x="687.5" y="174.5" class="c" style="font-size:13px">Arrêtée par la tranche 3 :</text>
<text x="687.5" y="191.5" class="c" style="font-size:13px">pas de trou en face</text>
<rect x="606" y="240" width="179" height="60" rx="8" class="or"/>
<text x="695.5" y="257.5" class="c b" style="font-size:13px">Trajectoire B (bas)</text>
<text x="695.5" y="274.5" class="c" style="font-size:13px">Quatre trous alignés :</text>
<text x="695.5" y="291.5" class="c" style="font-size:13px">accident</text>
<rect x="20" y="425" width="760" height="62" rx="8" class="gr"/>
<text x="400" y="449" class="c" style="font-size:14px">Un trou est un défaut de la barrière, souvent latent : maintenance repoussée, dispositif</text>
<text x="400" y="469" class="c" style="font-size:14px">neutralisé « pour un test », procédure contournée. L'accident survient quand les trous s'alignent.</text>
</svg>
