<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Cycle de vie d'un contrat pétrolier : octroi, exploration, développement, production, abandon</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}.t{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#B85C0A;stroke-width:2.5}
.orl{fill:#FCFBF8;stroke:#F28C28;stroke-width:3}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Cycle de vie d'un contrat pétrolier</text>
<polygon points="12,60 146,60 160,85 146,110 12,110 26,85" class="nvf"/>
<text x="86" y="91" class="c w" style="font-size:15px">1. Octroi</text>
<rect x="12" y="125" width="148" height="250" class="wh"/>
<text x="20" y="148" class="t">Appel d'offres ou</text>
<text x="20" y="167" class="t">consultation directe</text>
<text x="20" y="186" class="t">Négociation</text>
<text x="20" y="205" class="t">Signature de l'autorité</text>
<text x="20" y="224" class="t">compétente</text>
<text x="20" y="243" class="t">Décret d'approbation</text>
<text x="20" y="262" class="t">(contrat de partage)</text>
<text x="20" y="281" class="t">Titre délivré par arrêté</text>
<polygon points="169,60 303,60 317,85 303,110 169,110 183,85" class="bl"/>
<text x="243" y="91" class="c b" style="font-size:15px">2. Exploration</text>
<rect x="169" y="125" width="148" height="250" class="wh"/>
<text x="177" y="148" class="t">Programme minimum</text>
<text x="177" y="167" class="t">de travaux</text>
<text x="177" y="186" class="t">Transmission des</text>
<text x="177" y="205" class="t">données et rapports</text>
<text x="177" y="224" class="t">Durée totale limitée</text>
<text x="177" y="243" class="t">à dix ans</text>
<polygon points="326,60 460,60 474,85 460,110 326,110 340,85" class="bl"/>
<text x="400" y="91" class="c b" style="font-size:15px">3. Développement</text>
<rect x="326" y="125" width="148" height="250" class="wh"/>
<text x="334" y="148" class="t">Plan de développement</text>
<text x="334" y="167" class="t">approuvé</text>
<text x="334" y="186" class="t">Autorisation de</text>
<text x="334" y="205" class="t">développement et de</text>
<text x="334" y="224" class="t">production</text>
<text x="334" y="243" class="t">Installations soumises</text>
<text x="334" y="262" class="t">à autorisation</text>
<polygon points="483,60 617,60 631,85 617,110 483,110 497,85" class="bl"/>
<text x="557" y="91" class="c b" style="font-size:15px">4. Production</text>
<rect x="483" y="125" width="148" height="250" class="wh"/>
<text x="491" y="148" class="t">Mesurage et comptage</text>
<text x="491" y="167" class="t">sous contrôle de l'État</text>
<text x="491" y="186" class="t">Récupération des coûts</text>
<text x="491" y="205" class="t">et partage de la</text>
<text x="491" y="224" class="t">production</text>
<text x="491" y="243" class="t">Audits et contrôles</text>
<polygon points="640,60 774,60 788,85 774,110 640,110 654,85" class="orf"/>
<text x="714" y="91" class="c b" style="font-size:15px">5. Abandon</text>
<rect x="640" y="125" width="148" height="250" class="wh"/>
<text x="648" y="148" class="t">Plan d'abandon et de</text>
<text x="648" y="167" class="t">réhabilitation</text>
<text x="648" y="186" class="t">Fonds de réhabilitation</text>
<text x="648" y="205" class="t">alimenté chaque année</text>
<text x="648" y="224" class="t">L'État peut agir en</text>
<text x="648" y="243" class="t">cas de carence</text>
<rect x="12" y="395" width="776" height="62" rx="8" class="bl"/>
<text x="400" y="420" class="c b">Pendant toute la vie du contrat</text>
<text x="400" y="442" class="c t">Suivi et contrôle par le ministère : rapports, budgets approuvés, agents assermentés, sanctions</text>
<text x="400" y="482" class="c o">La fin du contrat suit les clauses du contrat : l'agent lit toujours la clause concernée.</text>
</svg>
