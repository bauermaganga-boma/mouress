<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Part du pétrole dans les recettes totales (exemple)</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Part du pétrole dans les recettes totales (exemple)</text>

<text x="60" y="85" font-size="16" fill="#061F44" font-weight="bold">Recettes totales de l'État = 100 % (valeurs fictives)</text>
<rect x="60" y="110" width="640" height="70" rx="6" fill="#DCE6F5"/>
<rect x="60" y="110" width="230" height="70" rx="6" fill="#F28C28"/>
<text x="175" y="152" font-size="18" fill="#061F44" font-weight="bold" text-anchor="middle">Pétrole : 36 %</text>
<text x="495" y="152" font-size="18" fill="#061F44" font-weight="bold" text-anchor="middle">Recettes non pétrolières : 64 %</text>
<text x="60" y="215" font-size="16" fill="#061F44" font-weight="bold">Choc supposé sur les recettes pétrolières :</text>
<rect x="60" y="230" width="230" height="70" rx="6" fill="#fff" stroke="#B85C0A" stroke-width="2"/>
<rect x="60" y="230" width="172.5" height="70" rx="6" fill="#F28C28"/>
<line x1="290" y1="224" x2="290" y2="306" stroke="#061F44" stroke-width="2" stroke-dasharray="6 4"/>
<text x="305" y="268" font-size="13" fill="#555">trait pointillé : niveau initial</text>
<text x="60" y="325" font-size="16" fill="#B85C0A" font-weight="bold">Recettes pétrolières : baisse de 25 %</text>
<rect x="60" y="350" width="640" height="100" rx="6" fill="#E8EAEE"/>
<text x="80" y="382" font-size="14" fill="#061F44">Les recettes non pétrolières sont supposées inchangées (toutes choses égales par ailleurs).</text>
<text x="80" y="408" font-size="14" fill="#061F44">Question : de combien de % les recettes totales de l'État baissent-elles ?</text>
<text x="80" y="434" font-size="14" fill="#061F44">La baisse totale dépend du poids de la composante touchée.</text>
<text x="400" y="486" font-size="13" fill="#555" text-anchor="middle">Exemple pédagogique : chiffres fictifs, sans rapport avec le budget réel.</text>
</svg>
