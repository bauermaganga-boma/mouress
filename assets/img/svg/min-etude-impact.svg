<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Étapes d'une étude d'impact environnemental et social : 1 avis de projet, 2 évaluation préliminaire (étude ou notice d'impact), 3 termes de référence et cadrage, 4 étude et consultations publiques, 5 dépôt du rapport, 6 communiqué de presse puis avis du comité, 7 décision, 8 mise en œuvre, 9 surveillance et suivi ; contenu de l'étude : état initial, impacts, mesures, coût</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Étude d'impact environnemental et social : les étapes</text>
<rect x="20" y="60" width="140" height="100" rx="8" class="bl"/>
<text x="90" y="89" class="c b" style="font-size:13px">Avis de projet</text>
<text x="90" y="106" class="c" style="font-size:13px">du promoteur à</text>
<text x="90" y="123" class="c" style="font-size:13px">l'administration</text>
<text x="90" y="140" class="c" style="font-size:13px">de l'environnement</text>
<circle cx="36" cy="60" r="14" class="nv"/><text x="36" y="65" class="c b w" style="font-size:15px">1</text>
<path d="M161,110H174" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="175" y="60" width="140" height="100" rx="8" class="bl"/>
<text x="245" y="80.5" class="c b" style="font-size:13px">Évaluation</text>
<text x="245" y="97.5" class="c" style="font-size:13px">préliminaire :</text>
<text x="245" y="114.5" class="c" style="font-size:13px">étude complète ou</text>
<text x="245" y="131.5" class="c" style="font-size:13px">notice d'impact</text>
<text x="245" y="148.5" class="c" style="font-size:13px">(comité, 1 mois)</text>
<circle cx="191" cy="60" r="14" class="nv"/><text x="191" y="65" class="c b w" style="font-size:15px">2</text>
<path d="M316,110H329" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="330" y="60" width="140" height="100" rx="8" class="bl"/>
<text x="400" y="97.5" class="c b" style="font-size:13px">Termes de</text>
<text x="400" y="114.5" class="c" style="font-size:13px">référence validés,</text>
<text x="400" y="131.5" class="c" style="font-size:13px">réunion de cadrage</text>
<circle cx="346" cy="60" r="14" class="nv"/><text x="346" y="65" class="c b w" style="font-size:15px">3</text>
<path d="M471,110H484" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="485" y="60" width="140" height="100" rx="8" class="or"/>
<text x="555" y="89" class="c b" style="font-size:13px">Étude et</text>
<text x="555" y="106" class="c" style="font-size:13px">consultations</text>
<text x="555" y="123" class="c" style="font-size:13px">publiques : procès-</text>
<text x="555" y="140" class="c" style="font-size:13px">verbaux annexés</text>
<circle cx="501" cy="60" r="14" class="nv"/><text x="501" y="65" class="c b w" style="font-size:15px">4</text>
<path d="M626,110H639" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="640" y="60" width="140" height="100" rx="8" class="bl"/>
<text x="710" y="106" class="c b" style="font-size:13px">Dépôt du rapport</text>
<text x="710" y="123" class="c" style="font-size:13px">(15 exemplaires)</text>
<circle cx="656" cy="60" r="14" class="nv"/><text x="656" y="65" class="c b w" style="font-size:15px">5</text>
<path d="M710,161V190H109V222" class="ln" style="stroke-width:2.5" marker-end="url(#ar)"/>
<rect x="20" y="225" width="178" height="92" rx="8" class="bl"/>
<text x="109" y="258.5" class="c b" style="font-size:13px">Communiqué de presse</text>
<text x="109" y="275.5" class="c" style="font-size:13px">(3 jours, dans un journal),</text>
<text x="109" y="292.5" class="c" style="font-size:13px">puis avis du comité</text>
<circle cx="36" cy="225" r="14" class="nv"/><text x="36" y="230" class="c b w" style="font-size:15px">6</text>
<path d="M199,271H213" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="214" y="225" width="178" height="92" rx="8" class="bl"/>
<text x="303" y="258.5" class="c b" style="font-size:13px">Décision de l'autorité :</text>
<text x="303" y="275.5" class="c" style="font-size:13px">autorisation, récépissé ou</text>
<text x="303" y="292.5" class="c" style="font-size:13px">certificat de conformité</text>
<circle cx="230" cy="225" r="14" class="nv"/><text x="230" y="230" class="c b w" style="font-size:15px">7</text>
<path d="M393,271H407" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="408" y="225" width="178" height="92" rx="8" class="bl"/>
<text x="497" y="258.5" class="c b" style="font-size:13px">Mise en œuvre</text>
<text x="497" y="275.5" class="c" style="font-size:13px">du projet et des</text>
<text x="497" y="292.5" class="c" style="font-size:13px">mesures prévues</text>
<circle cx="424" cy="225" r="14" class="nv"/><text x="424" y="230" class="c b w" style="font-size:15px">8</text>
<path d="M587,271H601" class="ln" marker-end="url(#ar)" style="stroke-width:2.5"/>
<rect x="602" y="225" width="178" height="92" rx="8" class="or"/>
<text x="691" y="258.5" class="c b" style="font-size:13px">Surveillance et suivi</text>
<text x="691" y="275.5" class="c" style="font-size:13px">par le promoteur et</text>
<text x="691" y="292.5" class="c" style="font-size:13px">l'administration</text>
<circle cx="618" cy="225" r="14" class="nv"/><text x="618" y="230" class="c b w" style="font-size:15px">9</text>
<text x="20" y="352" class="b">Contenu de l'étude (article 32 de la loi n° 007/2014)</text>
<path d="M20,362h162l14,25l-14,25h-162l14,-25z" class="or"/>
<text x="114" y="382" class="c b" style="font-size:13px">Départ :</text>
<text x="114" y="399" class="c" style="font-size:13px">état initial du site</text>
<path d="M214,362h162l14,25l-14,25h-162l14,-25z" class="bl"/>
<text x="308" y="382" class="c b" style="font-size:13px">Impacts</text>
<text x="308" y="399" class="c" style="font-size:13px">identifiés et évalués</text>
<path d="M408,362h162l14,25l-14,25h-162l14,-25z" class="bl"/>
<text x="502" y="382" class="c b" style="font-size:13px">Mesures pour éviter,</text>
<text x="502" y="399" class="c" style="font-size:13px">réduire ou compenser</text>
<path d="M602,362h162l14,25l-14,25h-162l14,-25z" class="bl"/>
<text x="696" y="382" class="c b" style="font-size:13px">Coût des mesures</text>
<text x="696" y="399" class="c" style="font-size:13px">avant, pendant, après</text>
<rect x="20" y="430" width="760" height="62" rx="8" class="gr"/>
<text x="400" y="453" class="c" style="font-size:14px">Le plan de gestion environnementale et sociale (PGES) reprend, pour chaque mesure : l'indicateur,</text>
<text x="400" y="474" class="c" style="font-size:14px">le responsable et le coût. Procédure d'après le manuel de procédure, à confirmer dans sa version en vigueur.</text>
</svg>
