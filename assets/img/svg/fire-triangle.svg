<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ti">
<title id="ti">Triangle du feu : combustible, comburant et énergie d'activation, avec les modes d'extinction correspondants</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.t{font-size:20px;font-weight:700}.b{font-weight:700}.m{text-anchor:middle}.h{font-size:16px;font-weight:700}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text class="t m" x="400" y="34">Le triangle du feu</text>

<path d="M230,100 L390,370 L70,370 Z" fill="#DCE6F5" stroke="#061F44" stroke-width="3" stroke-linejoin="round"/>
<path d="M230,205 C248,238 276,252 268,292 C262,320 240,334 230,334 C214,334 192,320 192,292 C192,268 210,258 214,238 C222,248 227,232 230,205 Z" fill="#F28C28" stroke="#061F44" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M230,262 C240,280 252,288 248,306 C245,320 236,326 230,326 C222,326 212,320 212,306 C212,292 224,286 230,262 Z" fill="#FFB766"/>

<text class="m h" x="230" y="76">Énergie d'activation</text>
<text class="m" x="230" y="94">(chaleur, étincelle, flamme)</text>
<text class="m h" x="90" y="398">Combustible</text>
<text class="m" x="90" y="418">bois, gaz, pétrole</text>
<text class="m h" x="365" y="398">Comburant</text>
<text class="m" x="365" y="418">oxygène (air, 21 %)</text>
<text class="m" x="230" y="458">Le feu exige les trois éléments réunis.</text>

<text class="h" x="450" y="82">Pour éteindre : supprimer un côté</text>
<rect x="450" y="102" width="330" height="86" rx="8" fill="#E8EAEE"/>
<text class="b" x="466" y="128">Supprimer le combustible</text>
<text x="466" y="150">couper l'alimentation (vanne, gaz),</text><text x="466" y="168">écarter les matières</text>
<rect x="450" y="206" width="330" height="86" rx="8" fill="#E8EAEE"/>
<text class="b" x="466" y="232">Supprimer le comburant</text>
<text x="466" y="254">étouffer : CO₂, mousse, couverture</text><text x="466" y="272">anti-feu</text>
<rect x="450" y="310" width="330" height="86" rx="8" fill="#E8EAEE"/>
<text class="b" x="466" y="336">Supprimer la chaleur</text>
<text x="466" y="358">refroidir : eau (feux de classe A),</text><text x="466" y="376">arrosage</text>
<rect x="450" y="102" width="6" height="86" fill="#F28C28"/><rect x="450" y="206" width="6" height="86" fill="#F28C28"/><rect x="450" y="310" width="6" height="86" fill="#F28C28"/>
<text x="450" y="428">Attention : ne jamais utiliser d'eau sur un feu</text>
<text x="450" y="448">d'origine électrique sous tension.</text>
</svg>
