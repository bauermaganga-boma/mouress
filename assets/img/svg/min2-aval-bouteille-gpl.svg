<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Coupe d'une bouteille de GPL debout, robinet en haut, avec environ 85 % de GPL liquide et environ 15 % de vapeur pour la dilatation, et pièce en coupe où une fuite forme une couche de gaz lourd au ras du sol</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.gd{fill:none;stroke:#D5D9E0;stroke-width:1.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Bouteille de GPL : remplissage, position et fuite</text>
<text x="400" y="52" class="c o">Schéma de principe, non à l'échelle</text>
<clipPath id="cp"><rect x="70" y="170" width="130" height="260" rx="45"/></clipPath>
<rect x="70" y="170" width="130" height="260" rx="45" fill="#FCFBF8"/>
<g clip-path="url(#cp)"><rect x="70" y="170" width="130" height="39" fill="#E8EAEE"/><rect x="70" y="209" width="130" height="221" fill="#DCE6F5"/></g>
<path d="M70,209H200" stroke="#061F44" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="70" y="170" width="130" height="260" rx="45" class="s"/>
<rect x="110" y="140" width="50" height="30" class="gr"/>
<rect x="95" y="158" width="80" height="12" rx="5" fill="#E8EAEE" stroke="#061F44" stroke-width="2"/>
<rect x="118" y="114" width="34" height="26" class="gr"/>
<rect x="103" y="102" width="64" height="12" rx="4" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<path d="M170,108H225" class="ld"/><text x="232" y="113" class="b">Robinet, en haut</text>
<path d="M175,164H225" class="ld"/><text x="232" y="160" class="b">Collerette</text><text x="232" y="178" class="n">tare et dates inscrites</text>
<path d="M200,190H225" class="ld"/><text x="232" y="212" class="b">Vapeur</text><text x="232" y="230" class="n">environ 15 % de vide :</text><text x="232" y="247" class="n">place pour la dilatation</text>
<path d="M200,320H225" class="ld"/><text x="232" y="318" class="b">GPL liquide</text><text x="232" y="336" class="n">environ 85 % au plus</text>
<text x="135" y="452" class="c b">Debout, robinet en haut</text>
<rect x="430" y="80" width="350" height="290" fill="#FCFBF8" stroke="#061F44" stroke-width="3"/>
<rect x="432" y="305" width="346" height="63" fill="#F28C28" opacity="0.4"/>
<path d="M430,370H780" class="nv"/>
<rect x="640" y="108" width="140" height="46" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<text x="710" y="136" class="c n">Fenêtre</text>
<rect x="472" y="262" width="38" height="98" rx="15" class="bl"/>
<rect x="484" y="248" width="14" height="14" class="gr"/>
<path d="M498,252C540,252 560,270 560,300" class="or" marker-end="url(#ao)"/>
