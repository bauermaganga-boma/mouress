<text x="605" y="245" class="c b">au ras du sol</text>
<path d="M590,252V300" class="nv" marker-end="url(#ar)"/>
<text x="605" y="340" class="c b">Couche de gaz</text>
<text x="430" y="392" class="b">Pièce en coupe</text>
<rect x="40" y="466" width="720" height="28" rx="8" class="bl"/>
<text x="400" y="485" class="c b">Contrôle d'un raccord : eau savonneuse, des bulles signalent une fuite. Aucune flamme.</text>
</svg>
