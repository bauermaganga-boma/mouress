<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Niveaux de réponse à un déversement d'hydrocarbures : niveau 1 moyens locaux de l'exploitant, niveau 2 moyens régionaux ou mutualisés, niveau 3 aide internationale en plus ; cinq priorités d'intervention et règle de dérive de la nappe à 3 % de la vitesse du vent</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Plan de lutte contre un déversement : niveaux de réponse</text>
<rect x="20" y="55" width="236" height="215" rx="8" class="bl"/>
<rect x="20" y="55" width="236" height="56" rx="8" class="gr"/>
<text x="138" y="78" class="c b" style="font-size:16px">Niveau 1</text>
<text x="138" y="100" class="c" style="font-size:13px">Moyens locaux</text>
<text x="138" y="138" class="c b" style="font-size:14px">Déversement limité</text>
<text x="138" y="158" class="c" style="font-size:14px"></text>
<text x="138" y="178" class="c" style="font-size:14px">Traité par les moyens</text>
<text x="138" y="198" class="c" style="font-size:14px">de l'exploitant, sur place.</text>
<text x="138" y="218" class="c" style="font-size:14px"></text>
<text x="138" y="238" class="c" style="font-size:14px">Le ministère est informé</text>
<text x="138" y="258" class="c" style="font-size:14px">et suit.</text>
<rect x="282" y="55" width="236" height="215" rx="8" class="bl"/>
<rect x="282" y="55" width="236" height="56" rx="8" class="or"/>
<text x="400" y="78" class="c b" style="font-size:16px">Niveau 2</text>
<text x="400" y="100" class="c" style="font-size:13px">Moyens régionaux ou mutualisés</text>
<text x="400" y="138" class="c b" style="font-size:14px">Déversement plus important</text>
<text x="400" y="158" class="c" style="font-size:14px"></text>
<text x="400" y="178" class="c" style="font-size:14px">Moyens régionaux et moyens</text>
<text x="400" y="198" class="c" style="font-size:14px">mutualisés entre exploitants</text>
<text x="400" y="218" class="c" style="font-size:14px">en renfort de ceux</text>
<text x="400" y="238" class="c" style="font-size:14px">de l'exploitant.</text>
<rect x="544" y="55" width="236" height="215" rx="8" class="bl"/>
<rect x="544" y="55" width="236" height="56" rx="8" class="nv"/>
<text x="662" y="78" class="c b w" style="font-size:16px">Niveau 3</text>
<text x="662" y="100" class="c w" style="font-size:13px">Aide internationale en plus</text>
<text x="662" y="138" class="c b" style="font-size:14px">Déversement majeur</text>
<text x="662" y="158" class="c" style="font-size:14px"></text>
<text x="662" y="178" class="c" style="font-size:14px">Les moyens locaux et</text>
<text x="662" y="198" class="c" style="font-size:14px">régionaux ne suffisent pas :</text>
<text x="662" y="218" class="c" style="font-size:14px">appel à l'aide</text>
<text x="662" y="238" class="c" style="font-size:14px">internationale.</text>
<path d="M30,288H770" class="lo" marker-end="url(#ao)"/>
<text x="400" y="312" class="c o">Ampleur de la nappe et moyens à mobiliser croissants</text>
<text x="20" y="342" class="b">Priorités d'intervention, dans l'ordre</text>
<path d="M20,352h132l14,29l-14,29h-132l14,-29z" class="or"/>
<text x="93" y="381" class="c b" style="font-size:13px">1 · Sécurité</text>
<text x="93" y="397" class="c" style="font-size:13px">des personnes</text>
<path d="M173.5,352h132l14,29l-14,29h-132l14,-29z" class="bl"/>
<text x="246.5" y="381" class="c b" style="font-size:13px">2 · Maîtrise</text>
<text x="246.5" y="397" class="c" style="font-size:13px">de la source</text>
<path d="M327,352h132l14,29l-14,29h-132l14,-29z" class="bl"/>
<text x="400" y="381" class="c b" style="font-size:13px">3 · Protection</text>
<text x="400" y="397" class="c" style="font-size:13px">des sites sensibles</text>
<path d="M480.5,352h132l14,29l-14,29h-132l14,-29z" class="bl"/>
<text x="553.5" y="374" class="c b" style="font-size:13px">4 · Confinement</text>
<text x="553.5" y="390" class="c" style="font-size:13px">et récupération</text>
<text x="553.5" y="406" class="c" style="font-size:13px">en mer</text>
<path d="M634,352h132l14,29l-14,29h-132l14,-29z" class="bl"/>
<text x="707" y="374" class="c b" style="font-size:13px">5 · Nettoyage</text>
<text x="707" y="390" class="c" style="font-size:13px">du littoral,</text>
<text x="707" y="406" class="c" style="font-size:13px">déchets</text>
<rect x="20" y="430" width="760" height="76" rx="8" class="gr"/>
<text x="400" y="454" class="c" style="font-size:14px">Prévoir la dérive : la nappe dérive avec le courant et à environ 3 % de la vitesse du vent.</text>
<text x="400" y="474" class="c" style="font-size:14px">Durée avant l'arrivée à la côte = distance ÷ vitesse de dérive (estimation, sans courant).</text>
<text x="400" y="494" class="c" style="font-size:14px">Dispersants : autorisation préalable. Seuils propres à chaque plan, à confirmer.</text>
</svg>
