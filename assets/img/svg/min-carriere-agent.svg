<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Carrière d'un agent public permanent : concours, prise de service, période probatoire, titularisation, activité avec avancement, positions, puis retraite à 60 ans</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FFFFFF;stroke:#061F44;stroke-width:2}
.or{fill:#FFFFFF;stroke:#F28C28;stroke-width:3}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.dot{fill:#B85C0A}
.wt{fill:#FFFFFF;font-weight:bold;font-size:13px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Carrière d'un agent public (étapes génériques)</text>
<rect x="25" y="55" width="170" height="80" rx="8" class="bl"/>
<text x="110" y="81" class="c b">1. Concours</text>
<text x="110" y="100" class="c">(ou titre, à titre</text>
<text x="110" y="119" class="c">exceptionnel)</text>
<path d="M197,95H217" class="nv" marker-end="url(#ar)"/>
<rect x="220" y="55" width="170" height="80" rx="8" class="bl"/>
<text x="305" y="81" class="c b">2. Prise de service</text>
<text x="305" y="100" class="c">Début de la</text>
<text x="305" y="119" class="c">rémunération</text>
<path d="M392,95H412" class="nv" marker-end="url(#ar)"/>
<rect x="415" y="55" width="170" height="80" rx="8" class="bl"/>
<text x="500" y="81" class="c b">3. Période probatoire</text>
<text x="500" y="100" class="c">Période</text>
<text x="500" y="119" class="c">d'évaluation</text>
<path d="M587,95H607" class="nv" marker-end="url(#ar)"/>
<rect x="610" y="55" width="170" height="80" rx="8" class="bl"/>
<text x="695" y="81" class="c b">4. Titularisation</text>
<text x="695" y="100" class="c">Qualité de</text>
<text x="695" y="119" class="c">fonctionnaire</text>
<text x="25" y="157" class="n">Admis : liste publiée, information individuelle.</text>
<text x="415" y="157" class="n">Issues à l'étape 4 : titularisation, nouvelle période</text>
<text x="415" y="174" class="n">probatoire ou licenciement (avis de l'organe consultatif).</text>
<path d="M692,178V196" class="nv" marker-end="url(#ar)"/>
<rect x="25" y="198" width="530" height="118" rx="8" class="gr"/>
<text x="290" y="222" class="c b">5. Activité : la carrière se déroule dans le corps</text>
<text x="45" y="250">Échelon : avancement à l'ancienneté</text>
<text x="45" y="269">Classe et grade : évaluation et emplois disponibles (agent en activité)</text>
<text x="45" y="288">Catégorie supérieure : concours uniquement</text>
<text x="45" y="307">Avancement prononcé au 1er janvier et au 1er juin</text>
<rect x="590" y="198" width="185" height="118" rx="8" class="wh"/>
<text x="682.5" y="224" class="c b">Positions</text>
<text x="682.5" y="243" class="c">Détachement</text>
<text x="682.5" y="262" class="c">Disponibilité</text>
<text x="682.5" y="281" class="c">Congé spécial</text>
<text x="682.5" y="300" class="c">Pré-retraite (3 ans)</text>
<path d="M557,257H588" class="nv" marker-end="url(#ar)"/>
<path d="M290,318V352" class="nv" marker-end="url(#ar)"/>
<rect x="25" y="354" width="530" height="80" rx="8" class="bl"/>
<text x="290" y="380" class="c b">6. Cessation d'activité</text>
<text x="290" y="399" class="c">Mise à la retraite à l'âge limite : 60 ans (agents civils de l'État)</text>
<text x="290" y="418" class="c">Radiation des cadres, perte de la qualité d'agent public, pension</text>
<text x="25" y="470" class="n">Étapes génériques d'un agent permanent. Durées et modalités : statuts particuliers (à confirmer).</text>

</svg>
