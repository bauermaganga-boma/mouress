<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="ttl">
<title id="ttl">Hiérarchie d'atténuation : éviter, puis réduire, puis compenser en dernier recours l'impact résiduel, avec des exemples pour le milieu naturel et pour le climat</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FFFFFF}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3.5}
.lo{fill:none;stroke:#F28C28;stroke-width:4}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="520" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Hiérarchie d'atténuation : éviter, réduire, compenser</text>
<text x="170" y="72" class="c b">Principe</text><text x="415" y="72" class="c b">Exemple : milieu naturel</text><text x="662" y="72" class="c b">Exemple : climat</text>
<path d="M36,95V395" class="lo" marker-end="url(#ao)"/>
<text x="22" y="250" transform="rotate(-90 22 250)" class="c o" style="font-size:14px">Ordre de priorité</text>
<rect x="55" y="88" width="230" height="96" rx="8" class="nv"/>
<text x="170" y="120" class="c w b" style="font-size:14px">1 · ÉVITER</text>
<text x="170" y="141" class="c w" style="font-size:14px">Supprimer l'impact</text>
<text x="170" y="162" class="c w" style="font-size:14px">à la source</text>
<rect x="300" y="88" width="230" height="96" rx="8" class="gr"/>
<text x="415" y="130" class="c" style="font-size:14px">Choisir un autre tracé,</text>
<text x="415" y="151" class="c" style="font-size:14px">hors de la zone humide</text>
<rect x="545" y="88" width="235" height="96" rx="8" class="gr"/>
<text x="662.5" y="130" class="c" style="font-size:14px">Supprimer le torchage</text>
<text x="662.5" y="151" class="c" style="font-size:14px">de routine du site</text>
<rect x="55" y="196" width="230" height="96" rx="8" class="bl"/>
<text x="170" y="228" class="c b" style="font-size:14px">2 · RÉDUIRE</text>
<text x="170" y="249" class="c" style="font-size:14px">Limiter l'ampleur</text>
<text x="170" y="270" class="c" style="font-size:14px">ou la durée de l'impact</text>
<rect x="300" y="196" width="230" height="96" rx="8" class="gr"/>
<text x="415" y="238" class="c" style="font-size:14px">Adapter la période et</text>
<text x="415" y="259" class="c" style="font-size:14px">les méthodes de travaux</text>
<rect x="545" y="196" width="235" height="96" rx="8" class="gr"/>
<text x="662.5" y="238" class="c" style="font-size:14px">Efficacité énergétique,</text>
<text x="662.5" y="259" class="c" style="font-size:14px">remplacement du diesel</text>
<rect x="55" y="304" width="230" height="96" rx="8" class="or"/>
<text x="170" y="336" class="c b" style="font-size:14px">3 · COMPENSER</text>
<text x="170" y="357" class="c" style="font-size:14px">Contrebalancer l'impact</text>
<text x="170" y="378" class="c" style="font-size:14px">résiduel, en dernier recours</text>
<rect x="300" y="304" width="230" height="96" rx="8" class="gr"/>
<text x="415" y="346" class="c" style="font-size:14px">Restaurer un milieu</text>
<text x="415" y="367" class="c" style="font-size:14px">équivalent ailleurs</text>
<rect x="545" y="304" width="235" height="96" rx="8" class="gr"/>
<text x="662.5" y="346" class="c" style="font-size:14px">Crédits carbone vérifiés</text>
<text x="662.5" y="367" class="c" style="font-size:14px">pour les émissions restantes</text>
<rect x="20" y="420" width="760" height="82" rx="8" class="bl"/>
<text x="400" y="445" class="c" style="font-size:14px">La compensation ne vaut que pour l'impact qui reste après avoir évité puis réduit : elle ne les remplace pas.</text>
<text x="400" y="467" class="c" style="font-size:14px">L'étude d'impact prévoit des mesures pour supprimer, réduire ou compenser, avec leur coût (article 32).</text>
</svg>
