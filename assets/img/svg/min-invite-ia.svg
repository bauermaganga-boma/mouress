<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les cinq éléments d'une bonne invite : 1. rôle, 2. contexte, 3. tâche, 4. format, 5. limites, chacun avec un exemple de formulation. La réponse de l'outil est ensuite vérifiée par l'agent.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.nm{font-size:16px;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.nb{fill:#061F44}.nt{fill:#FCFBF8;font-weight:bold;font-size:16px;text-anchor:middle}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Les cinq éléments d'une bonne invite</text>

<rect x="30" y="56" width="570" height="58" rx="8" class="bl"/><circle cx="62" cy="85" r="15" class="nb"/><text x="62" y="91" class="nt">1</text>
<text x="92" y="80" class="nm">Rôle</text><text x="92" y="100">« Vous êtes rédacteur administratif au ministère. »</text>
<rect x="30" y="122" width="570" height="58" rx="8" class="gr"/><circle cx="62" cy="151" r="15" class="nb"/><text x="62" y="157" class="nt">2</text>
<text x="92" y="146" class="nm">Contexte</text><text x="92" y="166">« Note d'une page pour un directeur, à partir d'un extrait public. »</text>
<rect x="30" y="188" width="570" height="58" rx="8" class="bl"/><circle cx="62" cy="217" r="15" class="nb"/><text x="62" y="223" class="nt">3</text>
<text x="92" y="212" class="nm">Tâche</text><text x="92" y="232">« Résumez en trois constats » (un verbe précis)</text>
<rect x="30" y="254" width="570" height="58" rx="8" class="gr"/><circle cx="62" cy="283" r="15" class="nb"/><text x="62" y="289" class="nt">4</text>
<text x="92" y="278" class="nm">Format</text><text x="92" y="298">« Trois parties, style administratif sobre, sans jargon. »</text>
<rect x="30" y="320" width="570" height="58" rx="8" class="bl"/><circle cx="62" cy="349" r="15" class="nb"/><text x="62" y="355" class="nt">5</text>
<text x="92" y="344" class="nm">Limites</text><text x="92" y="364">« N'ajoutez aucun chiffre absent du texte ; signalez vos incertitudes. »</text>

<path d="M604,85H620V349H604M620,217H640" class="nv" marker-end="url(#ar)"/>
<rect x="644" y="170" width="136" height="94" rx="10" class="gr"/>
<text x="712" y="200" class="c b" style="font-size:14px">Réponse</text><text x="712" y="220" class="c b" style="font-size:14px">de l'outil</text>
<text x="712" y="246" class="c">à contrôler</text>
<path d="M712,266V300" class="nv" marker-end="url(#ar)"/>
<rect x="644" y="304" width="136" height="74" rx="10" class="or"/>
<text x="712" y="332" class="c b" style="font-size:14px">Vérification</text><text x="712" y="352" class="c">par l'agent</text>

<text x="400" y="420" class="c b" style="font-size:14px">Une invite précise réduit les erreurs sans les supprimer : la vérification reste nécessaire.</text>
<text x="400" y="446" class="c">Exemples de formulations ; ne jamais y coller de données sensibles dans un outil externe.</text>
</svg>
