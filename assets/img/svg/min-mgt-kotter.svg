<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les huit étapes de Kotter : 1 créer un sentiment d'urgence, 2 former une coalition directrice, 3 élaborer une vision et une stratégie, 4 communiquer la vision, 5 donner le pouvoir d'agir, 6 générer des victoires à court terme, 7 consolider les gains et poursuivre le changement, 8 ancrer les changements dans la culture. Groupes : créer le climat (1 à 3), impliquer et permettre (4 à 6), mettre en œuvre et pérenniser (7 et 8).</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}
.n{fill:none;stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Les huit étapes de la conduite du changement (Kotter)</text>

<!-- marches -->
<g stroke="#061F44" stroke-width="2.5">
<rect x="30" y="60" width="400" height="44" rx="6" fill="#F9DDBB"/>
<rect x="62" y="108" width="400" height="44" rx="6" fill="#F9DDBB"/>
<rect x="94" y="156" width="400" height="44" rx="6" fill="#F9DDBB"/>
<rect x="126" y="204" width="400" height="44" rx="6" fill="#DCE6F5"/>
<rect x="158" y="252" width="400" height="44" rx="6" fill="#DCE6F5"/>
<rect x="190" y="300" width="400" height="44" rx="6" fill="#DCE6F5"/>
<rect x="222" y="348" width="400" height="44" rx="6" fill="#E8EAEE"/>
<rect x="254" y="396" width="400" height="44" rx="6" fill="#E8EAEE"/>
</g>
<g class="b">
<text x="44" y="88">1</text><text x="76" y="136">2</text><text x="108" y="184">3</text><text x="140" y="232">4</text><text x="172" y="280">5</text><text x="204" y="328">6</text><text x="236" y="376">7</text><text x="268" y="424">8</text>
</g>
<text x="68" y="88">Créer un sentiment d'urgence</text>
<text x="100" y="136">Former une coalition directrice</text>
<text x="132" y="184">Élaborer une vision et une stratégie</text>
<text x="164" y="232">Communiquer la vision</text>
<text x="196" y="280">Donner le pouvoir d'agir (lever les obstacles)</text>
<text x="228" y="328">Générer des victoires à court terme</text>
<text x="260" y="376">Consolider les gains et poursuivre le changement</text>
<text x="292" y="424">Ancrer les changements dans la culture</text>

<!-- groupes -->
<g class="n"><path d="M506,62V198M604,206V342M666,350V438"/></g>
<text x="516" y="118" class="o">Créer le climat</text>
<text x="516" y="136" class="o">(étapes 1 à 3)</text>
<text x="614" y="262" class="o">Impliquer</text>
<text x="614" y="280" class="o">et permettre</text>
<text x="614" y="298" class="o">(étapes 4 à 6)</text>
<text x="678" y="394" class="o">Mettre en œuvre</text>
<text x="678" y="412" class="o">et pérenniser</text>
<text x="678" y="430" class="o">(étapes 7 et 8)</text>
</svg>
