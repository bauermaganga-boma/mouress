<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Hiérarchie des normes : Constitution, traités, lois, ordonnances, décrets, arrêtés, circulaires</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}.t{font-size:13px}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#B85C0A;stroke-width:2.5}
.orl{fill:#FCFBF8;stroke:#F28C28;stroke-width:3}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Hiérarchie des normes (de la plus forte à la plus faible)</text>
<polygon points="170,52 280,52 301.8181818181818,106 148.1818181818182,106" class="nvf"/>
<text x="225" y="84" class="c w">Constitution</text>
<path d="M309.8181818181818,79H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="77" class="t">Norme suprême de l'État</text>
<polygon points="146.96969696969697,109 303.030303030303,109 324.8484848484849,163 125.15151515151516,163" class="nvf"/>
<text x="225" y="141" class="c w">Traités ratifiés</text>
<path d="M332.8484848484849,136H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="134" class="t">Supérieurs aux lois, sous réserve</text>
<text x="462" y="150" class="t">de réciprocité</text>
<polygon points="123.93939393939394,166 326.06060606060606,166 347.8787878787879,220 102.12121212121212,220" class="bl"/>
<text x="225" y="198" class="c b">Lois</text>
<path d="M355.8787878787879,193H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="191" class="t">Lois organiques, puis lois ordinaires</text>
<text x="462" y="207" class="t">votées par le Parlement</text>
<polygon points="100.9090909090909,223 349.0909090909091,223 370.9090909090909,277 79.0909090909091,277" class="bl"/>
<text x="225" y="255" class="c b">Ordonnances</text>
<path d="M378.9090909090909,250H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="248" class="t">Président, sur habilitation du Parlement ;</text>
<text x="462" y="264" class="t">caduques sans loi de ratification</text>
<polygon points="77.87878787878788,280 372.1212121212121,280 393.93939393939394,334 56.06060606060606,334" class="gr"/>
<text x="225" y="312" class="c b">Décrets</text>
<path d="M401.93939393939394,307H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="305" class="t">Actes du Président de la République</text>
<text x="462" y="321" class="t">(actes réglementaires)</text>
<polygon points="54.848484848484844,337 395.1515151515151,337 416.969696969697,391 33.03030303030303,391" class="gr"/>
<text x="225" y="369" class="c b">Arrêtés</text>
<path d="M424.969696969697,364H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="362" class="t">Actes des ministres</text>
<text x="462" y="378" class="t">(arrêté conjoint possible)</text>
<polygon points="31.818181818181813,394 418.1818181818182,394 440,448 10,448" class="orl"/>
<text x="225" y="426" class="c b">Circulaires, notes</text>
<path d="M448,421H455" stroke="#061F44" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<text x="462" y="419" class="t">Expliquent et organisent ;</text>
<text x="462" y="435" class="t">ne créent pas de règle nouvelle</text>
<text x="400" y="488" class="c b">Une norme inférieure doit respecter toutes les normes supérieures.</text>
</svg>
