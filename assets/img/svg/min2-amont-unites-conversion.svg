<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Fiche de conversion des unités : pour le pétrole, 1 baril vaut environ 159 litres ou 0,159 m³ et 1 m³ vaut environ 6,29 barils ; pour le gaz, 1 m³ vaut environ 35,3 pieds cubes et 6 000 pieds cubes valent 1 baril équivalent pétrole ; exemples chiffrés fictifs</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.t{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.dz{fill:none;stroke:#061F44;stroke-width:1.5;stroke-dasharray:6 5}
.og{fill:#F28C28;stroke:#061F44;stroke-width:2}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Unités de l’amont : pétrole et gaz</text>

<rect x="30" y="60" width="355" height="290" rx="12" class="bl"/>
<text x="207" y="92" class="h" style="font-size:18px">Pétrole : le baril (bbl)</text>
<text x="55" y="132" class="b">1 baril</text><text x="140" y="132">≈ 159 litres</text>
<text x="140" y="158">≈ 0,159 m³</text>
<path d="M55,176H360" class="ld"/>
<text x="55" y="206" class="b">1 m³</text><text x="140" y="206">≈ 6,29 barils</text>
<path d="M55,224H360" class="ld"/>
<text x="55" y="254" class="b">Débit</text><text x="140" y="254">en barils par jour (b/j)</text>
<text x="55" y="284" class="b">Année</text><text x="140" y="284">= b/j × jours de production</text>
<text x="55" y="320" class="o">Sens m³ → baril : × 6,29</text>
<text x="55" y="340" class="o">Sens baril → m³ : × 0,159</text>
<rect x="415" y="60" width="355" height="290" rx="12" class="gr"/>
<text x="592" y="92" class="h" style="font-size:18px">Gaz : le pied cube (pi³)</text>
<text x="440" y="132" class="b">1 m³ de gaz</text><text x="590" y="132">≈ 35,3 pi³</text>
<path d="M440,152H745" class="ld"/>
<text x="440" y="182" class="b">1 million de pi³</text><text x="600" y="182" class="t">≈ 28 300 m³</text>
<path d="M440,200H745" class="ld"/>
<text x="440" y="230" class="b">6 000 pi³ de gaz</text><text x="610" y="230">≈ 1 bep</text>
<text x="440" y="258" class="t">bep = baril équivalent pétrole (convention)</text>
<path d="M440,274H745" class="ld"/>
<text x="440" y="304" class="o">bep = pi³ de gaz ÷ 6 000</text>
<text x="440" y="326" class="t">Volumes de gaz donnés à des conditions de référence</text>
<rect x="30" y="375" width="740" height="95" rx="12" class="s"/>
<text x="400" y="402" class="c b">Exemples d’application (valeurs fictives)</text>
<text x="55" y="430">1 000 b/j × 0,159 = 159 m³/j</text>
<text x="55" y="454">1 000 b/j × 365 j = 365 000 barils par an</text>
<text x="420" y="430">600 000 pi³ ÷ 6 000 = 100 bep</text>
<text x="420" y="454">1 000 m³ de gaz × 35,3 = 35 300 pi³</text>
</svg>
