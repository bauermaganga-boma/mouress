<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Voie hiérarchique d'un courrier sortant : l'agent prépare le projet, le chef de service puis le directeur le visent, l'autorité compétente signe, puis envoi à l'autre administration.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">La voie hiérarchique d’un courrier sortant</text>
<rect x="24" y="62" width="221" height="76" rx="8" class="bl"/>
<text x="134.5" y="86" class="c b">1. Agent rédacteur</text>
<text x="134.5" y="108" class="c">Prépare le projet de lettre</text>
<rect x="289" y="62" width="221" height="76" rx="8" class="wh"/>
<text x="399.5" y="86" class="c b">2. Chef de service</text>
<text x="399.5" y="108" class="c">Relit et vise le projet</text>
<rect x="554" y="62" width="221" height="76" rx="8" class="bl"/>
<text x="664.5" y="86" class="c b">3. Directeur</text>
<text x="664.5" y="108" class="c">Vérifie le fond et vise</text>
<rect x="24" y="188" width="221" height="94" rx="8" class="or"/>
<text x="134.5" y="212" class="c b">4. Autorité compétente</text>
<text x="134.5" y="234" class="c">Signe au nom du ministère</text>
<rect x="289" y="188" width="221" height="94" rx="8" class="bl"/>
<text x="399.5" y="212" class="c b">5. Envoi</text>
<text x="399.5" y="234" class="c">À l’autre administration ;</text>
<text x="399.5" y="252" class="c">copie gardée au dossier</text>
<path d="M247,100H286" class="ln" marker-end="url(#ar)"/>
<path d="M512,100H551" class="ln" marker-end="url(#ar)"/>
<path d="M664.5,140V163H134.5V185" class="ln" marker-end="url(#ar)"/>
<path d="M247,235H286" class="ln" marker-end="url(#ar)"/>
<text x="400" y="322" class="c">On ne contourne pas les échelons : jamais d’envoi en son nom propre,</text>
<text x="400" y="342" class="c">ni de signature sans délégation écrite.</text>
</svg>
