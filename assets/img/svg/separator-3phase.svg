<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Séparateur triphasique horizontal : entrée du mélange, déflecteur, zones gaz, huile et eau, extracteur de brouillard, déversoir, sorties gaz, huile et eau</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<clipPath id="vc"><rect x="150" y="170" width="500" height="160" rx="60"/></clipPath>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Séparateur triphasique horizontal (gaz / huile / eau)</text>

<!-- entrée -->
<rect x="40" y="210" width="115" height="20" class="gr"/>
<text x="30" y="182">Entrée</text>
<text x="30" y="200">gaz + huile + eau</text>
<line x1="48" y1="220" x2="178" y2="220" class="or" marker-end="url(#ao)"/>

<!-- cuve et phases -->
<rect x="150" y="170" width="500" height="160" rx="60" fill="#FCFBF8"/>
<g clip-path="url(#vc)">
<rect x="150" y="290" width="350" height="40" fill="#C5D6EE"/>
<rect x="150" y="240" width="350" height="50" fill="#FFE2BD"/>
<rect x="506" y="255" width="144" height="75" fill="#FFE2BD"/>
<rect x="500" y="255" width="6" height="75" fill="#061F44"/>
</g>
<path d="M150,290H500" fill="none" stroke="#061F44" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="150" y="170" width="500" height="160" rx="60" class="s"/>
<line x1="186" y1="192" x2="202" y2="252" stroke="#061F44" stroke-width="4"/>

<!-- extracteur de brouillard et sortie gaz -->
<rect x="530" y="178" width="60" height="50" class="gr"/>
<path d="M538,184L582,222M538,200L574,222M550,184L582,208M538,216L552,228" class="ld"/>
<rect x="550" y="120" width="20" height="50" class="gr"/>
<line x1="560" y1="172" x2="560" y2="102" class="or" marker-end="url(#ao)"/>
<text x="582" y="116">Sortie gaz</text>
<line x1="240" y1="205" x2="522" y2="205" class="or" marker-end="url(#ao)"/>

<!-- sorties -->
<rect x="410" y="330" width="20" height="40" class="gr"/>
<line x1="420" y1="345" x2="420" y2="388" stroke="#061F44" stroke-width="3" marker-end="url(#ar)"/>
<text x="420" y="410" class="c">Sortie eau</text>
<rect x="550" y="330" width="20" height="40" class="gr"/>
<line x1="560" y1="345" x2="560" y2="388" stroke="#061F44" stroke-width="3" marker-end="url(#ar)"/>
<text x="560" y="410" class="c">Sortie huile</text>

<!-- étiquettes de phases -->
<text x="380" y="230" class="c b">Gaz</text>
<text x="320" y="271" class="c b">Huile</text>
<text x="320" y="316" class="c b">Eau</text>
<text x="578" y="300" class="c b">Huile</text>

<!-- étiquettes d'équipements -->
<text x="150" y="150">Déflecteur d'entrée</text>
<path d="M190,154L192,190" class="ld"/>
<text x="520" y="150" class="e">Extracteur de brouillard</text>
<path d="M526,154L538,180" class="ld"/>
<path d="M503,332L480,440" class="ld"/>
<text x="480" y="458" class="c">Déversoir (weir)</text>
<path d="M240,292V382" class="ld"/>
<text x="150" y="398">Interface huile / eau</text>
</svg>
