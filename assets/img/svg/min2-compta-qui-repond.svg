<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Qui répond de quoi : le comptable répond personnellement et pécuniairement, l'ordonnateur de ses actes, le régisseur et le gestionnaire des matières des fonds et des biens qu'ils détiennent.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
.or{fill:#FDEBD3;stroke:#F28C28;stroke-width:3}
.nv{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.ln{fill:none;stroke:#061F44;stroke-width:3}
.lo{fill:none;stroke:#F28C28;stroke-width:3}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Qui répond de quoi ?</text>
<rect x="24" y="62" width="190" height="34" rx="0" class="nv"/>
<text x="119" y="84" class="c w">Acteur</text>
<rect x="214" y="62" width="270" height="34" rx="0" class="nv"/>
<text x="349" y="84" class="c w">Ce dont il répond</text>
<rect x="484" y="62" width="270" height="34" rx="0" class="nv"/>
<text x="619" y="84" class="c w">Devant qui</text>
<rect x="24" y="96" width="190" height="50" rx="0" class="bl"/>
<text x="32" y="119" class="b">Comptable public</text>
<rect x="214" y="96" width="270" height="50" rx="0" class="bl"/>
<text x="349" y="119" class="c">Sa gestion, personnellement et</text>
<text x="349" y="137" class="c">pécuniairement</text>
<rect x="484" y="96" width="270" height="50" rx="0" class="bl"/>
<text x="619" y="119" class="c">Juge des comptes : mise en débet</text>
<text x="619" y="137" class="c">possible</text>
<rect x="24" y="146" width="190" height="50" rx="0" class="wh"/>
<text x="32" y="169" class="b">Ordonnateur</text>
<rect x="214" y="146" width="270" height="50" rx="0" class="wh"/>
<text x="349" y="169" class="c">Ses actes : crédits, liquidation,</text>
<text x="349" y="187" class="c">réquisition</text>
<rect x="484" y="146" width="270" height="50" rx="0" class="wh"/>
<text x="619" y="169" class="c">Juge des comptes ou discipline</text>
<text x="619" y="187" class="c">budgétaire et financière</text>
<rect x="24" y="196" width="190" height="32" rx="0" class="bl"/>
<text x="32" y="219" class="b">Régisseur</text>
<rect x="214" y="196" width="270" height="32" rx="0" class="bl"/>
<text x="349" y="219" class="c">Les fonds de sa régie</text>
<rect x="484" y="196" width="270" height="32" rx="0" class="bl"/>
<text x="619" y="219" class="c">Comme un comptable</text>
<rect x="24" y="228" width="190" height="50" rx="0" class="wh"/>
<text x="32" y="251" class="b">Gestionnaire des</text>
<text x="32" y="269" class="b">matières</text>
<rect x="214" y="228" width="270" height="50" rx="0" class="wh"/>
<text x="349" y="251" class="c">Les biens reçus et détenus</text>
<rect x="484" y="228" width="270" height="50" rx="0" class="wh"/>
<text x="619" y="251" class="c">Procès-verbal de passation de</text>
<text x="619" y="269" class="c">service</text>
<text x="400" y="312" class="c">Les responsabilités disciplinaire, pénale et civile peuvent s’y ajouter.</text>
</svg>
