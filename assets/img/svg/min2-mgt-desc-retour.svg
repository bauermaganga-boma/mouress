<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Méthode DESC pour un retour d'information en quatre temps : D, décrire les faits observés ; E, exprimer l'effet ressenti avec « je » ; S, spécifier le comportement attendu ; C, conséquences positives de ce changement. Exemple fictif : un agent dépose trois fois de suite son rapport après l'échéance, avec la formulation correspondante à chaque temps.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.w{fill:#FFFFFF;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Corriger avec la méthode DESC (exemple fictif)</text>
<rect x="30" y="55" width="70" height="82" rx="8" fill="#061F44"/>
<text x="65" y="110" class="w c" style="font-size:36px">D</text>
<rect x="110" y="55" width="660" height="82" rx="8" class="bl"/>
<text x="125" y="85" class="b">Décrire : les faits observés, sans jugement</text>
<text x="125" y="115" class="o">« Vos trois derniers rapports sont arrivés après la date convenue. »</text>
<rect x="30" y="153" width="70" height="82" rx="8" fill="#061F44"/>
<text x="65" y="208" class="w c" style="font-size:36px">E</text>
<rect x="110" y="153" width="660" height="82" rx="8" class="gr"/>
<text x="125" y="183" class="b">Exprimer : l'effet, avec « je »</text>
<text x="125" y="213" class="o">« Je dois alors reporter ma transmission à la direction. »</text>
<rect x="30" y="251" width="70" height="82" rx="8" fill="#061F44"/>
<text x="65" y="306" class="w c" style="font-size:36px">S</text>
<rect x="110" y="251" width="660" height="82" rx="8" class="bl"/>
<text x="125" y="281" class="b">Spécifier : le comportement attendu</text>
<text x="125" y="311" class="o">« Déposez le rapport le jeudi midi ; prévenez-moi dès qu'un retard se profile. »</text>
<rect x="30" y="349" width="70" height="82" rx="8" fill="#061F44"/>
<text x="65" y="404" class="w c" style="font-size:36px">C</text>
<rect x="110" y="349" width="660" height="82" rx="8" class="gr"/>
<text x="125" y="379" class="b">Conséquences : positives du changement</text>
<text x="125" y="409" class="o">« Le service tiendra ses délais et votre travail sera mieux reconnu. »</text>
<text x="400" y="470" class="c b">À froid, en privé, sur les faits : on corrige le comportement, jamais la personne.</text>
</svg>
