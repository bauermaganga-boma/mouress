<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Capture simplifiée d'un tableur avec valeurs fictives. Cellule sélectionnée C2, dont la barre de formule affiche =B2*$F$1. Colonnes : Désignation, Montant HT, Taxe, Montant TTC, Taux ; le taux 20 % est en F1. Lignes : Fournitures 120 000, Carburant 85 000, Entretien 40 000, Total 245 000 en montant HT.</title>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.s13{font-size:13px}.o{fill:#B85C0A;font-weight:bold}
.cell{fill:#FCFBF8;stroke:#9AA5B8;stroke-width:1.2}
.hd{fill:#E8EAEE;stroke:#9AA5B8;stroke-width:1.2}
.th{fill:#DCE6F5;stroke:#9AA5B8;stroke-width:1.2}
.wh{fill:#FCFBF8;stroke:#061F44;stroke-width:2.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Un tableur avec formule (capture simplifiée)</text>

<rect x="40" y="48" width="70" height="28" class="wh" rx="4"/><text x="75" y="67" class="c b">C2</text>
<text x="128" y="68" class="b" style="font-style:italic">fx</text>
<rect x="152" y="48" width="340" height="28" class="wh" rx="4"/><text x="164" y="67" class="b">=B2*$F$1</text>

<rect x="40" y="90" width="40" height="24" class="hd"/>
<rect x="80" y="90" width="150" height="24" class="hd"/><text x="155" y="107" class="c b">A</text>
<rect x="230" y="90" width="110" height="24" class="hd"/><text x="285" y="107" class="c b">B</text>
<rect x="340" y="90" width="110" height="24" class="hd"/><text x="395" y="107" class="c b">C</text>
<rect x="450" y="90" width="120" height="24" class="hd"/><text x="510" y="107" class="c b">D</text>
<rect x="570" y="90" width="70" height="24" class="hd"/><text x="605" y="107" class="c b">E</text>
<rect x="640" y="90" width="70" height="24" class="hd"/><text x="675" y="107" class="c b">F</text>

<g>
<rect x="40" y="114" width="40" height="30" class="hd"/><text x="60" y="134" class="c b">1</text>
<rect x="40" y="144" width="40" height="30" class="hd"/><text x="60" y="164" class="c b">2</text>
<rect x="40" y="174" width="40" height="30" class="hd"/><text x="60" y="194" class="c b">3</text>
<rect x="40" y="204" width="40" height="30" class="hd"/><text x="60" y="224" class="c b">4</text>
<rect x="40" y="234" width="40" height="30" class="hd"/><text x="60" y="254" class="c b">5</text>
</g>
<rect x="80" y="114" width="150" height="30" class="th"/><rect x="230" y="114" width="110" height="30" class="th"/><rect x="340" y="114" width="110" height="30" class="th"/><rect x="450" y="114" width="120" height="30" class="th"/><rect x="570" y="114" width="70" height="30" class="th"/><rect x="640" y="114" width="70" height="30" class="th"/>
<text x="88" y="134" class="b">Désignation</text><text x="332" y="134" class="b e">Montant HT</text><text x="442" y="134" class="b e">Taxe</text><text x="562" y="134" class="b e">Montant TTC</text><text x="578" y="134" class="b">Taux</text><text x="702" y="134" class="b e">20 %</text>

<g>
<rect x="80" y="144" width="150" height="30" class="cell"/><rect x="230" y="144" width="110" height="30" class="cell"/><rect x="340" y="144" width="110" height="30" class="cell"/><rect x="450" y="144" width="120" height="30" class="cell"/>
<rect x="80" y="174" width="150" height="30" class="cell"/><rect x="230" y="174" width="110" height="30" class="cell"/><rect x="340" y="174" width="110" height="30" class="cell"/><rect x="450" y="174" width="120" height="30" class="cell"/>
<rect x="80" y="204" width="150" height="30" class="cell"/><rect x="230" y="204" width="110" height="30" class="cell"/><rect x="340" y="204" width="110" height="30" class="cell"/><rect x="450" y="204" width="120" height="30" class="cell"/>
<rect x="80" y="234" width="150" height="30" class="th"/><rect x="230" y="234" width="110" height="30" class="th"/><rect x="340" y="234" width="110" height="30" class="th"/><rect x="450" y="234" width="120" height="30" class="th"/>
</g>
<text x="88" y="164">Fournitures</text><text x="332" y="164" class="e">120 000</text><text x="442" y="164" class="e">24 000</text><text x="562" y="164" class="e">144 000</text>
<text x="88" y="194">Carburant</text><text x="332" y="194" class="e">85 000</text><text x="442" y="194" class="e">17 000</text><text x="562" y="194" class="e">102 000</text>
<text x="88" y="224">Entretien</text><text x="332" y="224" class="e">40 000</text><text x="442" y="224" class="e">8 000</text><text x="562" y="224" class="e">48 000</text>
<text x="88" y="254" class="b">Total</text><text x="332" y="254" class="e b">245 000</text><text x="442" y="254" class="e b">49 000</text><text x="562" y="254" class="e b">294 000</text>

<rect x="340" y="144" width="110" height="30" fill="none" stroke="#F28C28" stroke-width="4"/>
<text x="400" y="288" class="c o s13">cellule sélectionnée : C2</text>

<rect x="40" y="304" width="172" height="98" rx="8" class="wh"/>
<text x="126" y="330" class="c b">Signe égal</text>
<text x="126" y="354" class="c s13">Toute formule commence</text><text x="126" y="372" class="c s13">par le signe =</text>
<rect x="224" y="304" width="172" height="98" rx="8" class="wh"/>
<text x="310" y="330" class="c b">B2 : relative</text>
<text x="310" y="354" class="c s13">devient B3, puis B4,</text><text x="310" y="372" class="c s13">à la recopie vers le bas</text>
<rect x="408" y="304" width="172" height="98" rx="8" class="wh"/>
<text x="494" y="330" class="c b">$F$1 : absolue</text>
<text x="494" y="354" class="c s13">le taux reste en F1</text><text x="494" y="372" class="c s13">à la recopie</text>
<rect x="592" y="304" width="172" height="98" rx="8" class="wh"/>
<text x="678" y="330" class="c b">Ligne 5 : total</text>
<text x="678" y="354" class="c s13">somme des trois lignes</text><text x="678" y="372" class="c s13">situées au-dessus</text>

<text x="400" y="440" class="c b">La barre de formule montre le calcul ; la cellule affiche seulement le résultat.</text>
<text x="400" y="464" class="c s13">Valeurs fictives, montants en FCFA, conçues pour la formation.</text>
</svg>
