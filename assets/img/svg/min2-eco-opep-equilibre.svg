<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Effet d'une coupe de production sur le prix</title>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="38" font-size="20" font-weight="bold" fill="#061F44" text-anchor="middle">Effet d'une coupe de production sur le prix</text>

<text x="40" y="80" font-size="16" fill="#061F44" font-weight="bold">Données de l'exemple (valeurs fictives)</text>
<rect x="40" y="95" width="330" height="300" rx="6" fill="#DCE6F5"/>
<text x="205" y="125" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Offre mondiale (Mb/j)</text>
<rect x="90" y="160" width="90" height="200" rx="6" fill="#061F44"/><rect x="220" y="162" width="90" height="198" rx="6" fill="#F28C28"/>
<text x="135" y="152" font-size="16" fill="#061F44" font-weight="bold" text-anchor="middle">100</text><text x="265" y="154" font-size="16" fill="#061F44" font-weight="bold" text-anchor="middle">99</text>
<text x="135" y="382" font-size="14" fill="#061F44" text-anchor="middle">avant</text><text x="265" y="382" font-size="14" fill="#061F44" text-anchor="middle">après coupe de 1</text>
<rect x="410" y="95" width="350" height="300" rx="6" fill="#E8EAEE"/>
<text x="585" y="125" font-size="14" fill="#061F44" font-weight="bold" text-anchor="middle">Réaction de la demande</text>
<text x="430" y="165" font-size="14" fill="#061F44">Élasticité-prix de court terme</text>
<text x="430" y="186" font-size="14" fill="#061F44">de la demande : −0,05</text>
<text x="430" y="207" font-size="14" fill="#061F44"></text>
<text x="430" y="228" font-size="14" fill="#061F44">Relation utilisée :</text>
<text x="430" y="249" font-size="14" fill="#061F44">variation de la demande (%)</text>
<text x="430" y="270" font-size="14" fill="#061F44">= élasticité × variation du prix (%)</text>
<text x="430" y="291" font-size="14" fill="#061F44"></text>
<text x="430" y="312" font-size="14" fill="#061F44">L'équilibre est rétabli quand la</text>
<text x="430" y="333" font-size="14" fill="#061F44">demande baisse autant que l'offre.</text>
<rect x="40" y="410" width="720" height="52" rx="6" fill="#fff" stroke="#B85C0A" stroke-width="2"/>
<text x="400" y="433" font-size="14" fill="#061F44" text-anchor="middle">Question à résoudre : de combien le prix doit-il monter (en %) pour que la demande</text>
<text x="400" y="453" font-size="14" fill="#061F44" text-anchor="middle">s'ajuste à l'offre réduite ?</text>
<text x="400" y="486" font-size="13" fill="#555" text-anchor="middle">Exemple pédagogique : chiffres fictifs, non prévisionnels.</text>
</svg>
