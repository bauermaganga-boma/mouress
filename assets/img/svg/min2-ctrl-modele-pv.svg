<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Modèle annoté d'un procès-verbal de contrôle : en-tête, agent assermenté, ordre de mission, faits constatés, texte visé, déclarations, annexes, signatures</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="28" class="h">Modèle annoté d'un procès-verbal (gabarit fictif)</text>
<rect x="20" y="42" width="390" height="440" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="215" y="66" class="c b">PROCÈS-VERBAL DE CONSTAT N° ……</text>
<rect x="32" y="78" width="366" height="52" fill="#DCE6F5" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="98" class="n">Je soussigné (nom), agent assermenté,</text><text x="42" y="116" class="n">porteur de l'ordre de mission n° …, ai constaté :</text>
<rect x="32" y="136" width="366" height="34" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="158" class="n">Le (date), à (heure), à (lieu précis du site)</text>
<rect x="32" y="176" width="366" height="76" fill="#F28C28" fill-opacity="0.25" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="196" class="n">1. Fait observé, décrit de façon objective,</text><text x="42" y="214" class="n">    précise et chronologique.</text><text x="42" y="236" class="n">2. Mesure ou relevé : valeur, unité, appareil.</text>
<rect x="32" y="258" width="366" height="34" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="280" class="n">Disposition méconnue : article … du texte …</text>
<rect x="32" y="298" width="366" height="46" fill="#DCE6F5" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="318" class="n">Déclarations du représentant de l'opérateur,</text><text x="42" y="336" class="n">recueillies et notées telles quelles.</text>
<rect x="32" y="350" width="366" height="34" fill="#E8EAEE" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="372" class="n">Annexes numérotées : photos, relevés, copies</text>
<rect x="32" y="390" width="366" height="80" fill="#DCE6F5" stroke="#061F44" stroke-width="1.5"/>
<text x="42" y="410" class="n">Signature de l'agent   |   Signature du représentant</text>
<text x="42" y="432" class="n">(ou mention du refus de signer et de ses motifs)</text>
<text x="42" y="456" class="n">Copie remise le (date), contre décharge</text>
<circle cx="440" cy="104" r="13" fill="#F28C28"/><text x="440" y="109" class="c b n">1</text>
<text x="465" y="100" class="n b">Qui constate</text><text x="465" y="118" class="n">Qualité d'agent assermenté et ordre de mission</text>
<circle cx="440" cy="153" r="13" fill="#F28C28"/><text x="440" y="158" class="c b n">2</text>
<text x="465" y="158" class="n b">Quand et où</text>
<circle cx="440" cy="214" r="13" fill="#F28C28"/><text x="440" y="219" class="c b n">3</text>
<text x="465" y="210" class="n b">Quoi : des faits</text><text x="465" y="228" class="n">Pas de jugement ni d'intention supposée</text>
<circle cx="440" cy="275" r="13" fill="#F28C28"/><text x="440" y="280" class="c b n">4</text>
<text x="465" y="272" class="n b">Quel texte</text><text x="465" y="290" class="n">Permet à l'autorité de qualifier le manquement</text>
<circle cx="440" cy="321" r="13" fill="#F28C28"/><text x="440" y="326" class="c b n">5</text>
<text x="465" y="317" class="n b">Ce que dit l'opérateur</text><text x="465" y="335" class="n">Contradictoire : sa version figure au dossier</text>
<circle cx="440" cy="367" r="13" fill="#F28C28"/><text x="440" y="372" class="c b n">6</text>
<text x="465" y="363" class="n b">Preuves</text><text x="465" y="381" class="n">Listées en annexe, citées dans le texte</text>
<circle cx="440" cy="430" r="13" fill="#F28C28"/><text x="440" y="435" class="c b n">7</text>
<text x="465" y="420" class="n b">Signatures et remise</text><text x="465" y="438" class="n">Le refus de signer est consigné ; copie</text><text x="465" y="456" class="n">remise contre décharge</text>
</svg>
