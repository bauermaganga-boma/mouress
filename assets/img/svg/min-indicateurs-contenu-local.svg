<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Tableau fictif d'indicateurs d'un plan de contenu local : effectif total 200 prévu et 200 réalisé ; Gabonais 170 prévus et 150 réalisés (88 %) ; remplacements d'expatriés 4 prévus et 3 réalisés (75 %) ; formation 6 000 heures prévues et 4 800 réalisées (80 %) ; achats auprès d'entreprises autochtones 600 millions de FCFA prévus et 420 réalisés (70 %) ; contrats confiés à des PME nationales 12 prévus et 6 réalisés (50 %)</title>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nvf{fill:#061F44;stroke:#061F44;stroke-width:2.5}
.orf{fill:#F28C28;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style></defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Indicateurs d'un plan de contenu local</text>
<text x="400" y="54" class="c o">Tableau fictif : exemple d'une société imaginaire, sans valeur réelle</text>
<rect x="30" y="72" width="740" height="40" class="nvf"/>
<text x="42" y="97" class="w">Indicateur</text>
<text x="470" y="97" class="w c">Prévu</text>
<text x="570" y="97" class="w c">Réalisé</text>
<text x="690" y="97" class="w c">Taux réalisé / prévu</text>
<g class="s">
<rect x="30" y="112" width="740" height="52" fill="#FCFBF8"/>
<rect x="30" y="164" width="740" height="52" fill="#DCE6F5"/>
<rect x="30" y="216" width="740" height="52" fill="#FCFBF8"/>
<rect x="30" y="268" width="740" height="52" fill="#DCE6F5"/>
<rect x="30" y="320" width="740" height="52" fill="#FCFBF8"/>
<rect x="30" y="372" width="740" height="52" fill="#DCE6F5"/>
</g>
<text x="42" y="144">Effectif total (personnes)</text>
<text x="470" y="144" class="c">200</text><text x="570" y="144" class="c">200</text><text x="690" y="144" class="c b">100 %</text>
<text x="42" y="196">Gabonais dans l'effectif (personnes)</text>
<text x="470" y="196" class="c">170</text><text x="570" y="196" class="c">150</text><text x="690" y="196" class="c b">88 %</text>
<text x="42" y="248">Expatriés remplacés par un Gabonais (postes)</text>
<text x="470" y="248" class="c">4</text><text x="570" y="248" class="c">3</text><text x="690" y="248" class="c b">75 %</text>
<text x="42" y="300">Formation dispensée (heures)</text>
<text x="470" y="300" class="c">6 000</text><text x="570" y="300" class="c">4 800</text><text x="690" y="300" class="c b">80 %</text>
<text x="42" y="352">Achats à des entreprises autochtones (M FCFA)</text>
<text x="470" y="352" class="c">600</text><text x="570" y="352" class="c">420</text><text x="690" y="352" class="c b">70 %</text>
<text x="42" y="404">Contrats confiés à des PME nationales (nombre)</text>
<text x="470" y="404" class="c">12</text><text x="570" y="404" class="c">6</text><text x="690" y="404" class="c b">50 %</text>
<text x="400" y="454" class="c" style="font-size:14px">Taux = valeur réalisée ÷ valeur prévue au plan, exprimé en pourcentage.</text>
<text x="400" y="476" class="c" style="font-size:13px">Les taux sont arrondis à l'unité. M FCFA = millions de francs CFA.</text>
</svg>
