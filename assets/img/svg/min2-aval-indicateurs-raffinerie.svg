<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Trois indicateurs fictifs d'une raffinerie : taux d'utilisation de 80 % (16 000 barils traités pour 20 000 de capacité), disponibilité de 90,4 % (330 jours de marche sur 365), écart de bilan matière de 2,4 % (5 000 t/j entrées, 4 880 t/j sorties)</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}.w{fill:#FCFBF8;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
.gd{fill:none;stroke:#D5D9E0;stroke-width:1.5}
.da{fill:none;stroke:#B85C0A;stroke-width:2.5;stroke-dasharray:8 6}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Trois indicateurs d'une raffinerie (exemple fictif)</text>
<text x="400" y="52" class="c o">VALEURS FICTIVES, pour s'exercer</text>
<rect x="20" y="70" width="245" height="360" rx="10" class="gr" fill="#FCFBF8"/>
<rect x="277" y="70" width="245" height="360" rx="10" class="gr" fill="#FCFBF8"/>
<rect x="534" y="70" width="245" height="360" rx="10" class="gr" fill="#FCFBF8"/>
<text x="142" y="98" class="c b">Taux d'utilisation</text>
<text x="142" y="120" class="c o">traité ÷ capacité</text>
<rect x="60" y="160" width="60" height="220" fill="#E8EAEE" stroke="#061F44" stroke-width="2"/>
<rect x="165" y="204" width="60" height="176" fill="#061F44"/>
<text x="90" y="150" class="c n b">Capacité</text><text x="90" y="400" class="c n">20 000</text>
<text x="195" y="194" class="c n b">Traité</text><text x="195" y="400" class="c n">16 000</text>
<text x="142" y="420" class="c n">barils par jour</text>
<text x="399" y="98" class="c b">Disponibilité</text>
<text x="399" y="120" class="c o">jours de marche ÷ jours</text>
<rect x="297" y="190" width="205" height="40" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<rect x="470" y="190" width="32" height="40" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="383" y="215" class="c b">330 jours de marche</text>
<text x="450" y="262" class="c n">35 jours d'arrêt</text>
<path d="M486,232V248" class="ld"/>
<text x="399" y="300" class="c n">Année de 365 jours</text>
<text x="399" y="345" class="c b">330 ÷ 365 = 90,4 %</text>
<text x="399" y="380" class="c n">Le reste (9,6 %) est le temps d'arrêt.</text>
<text x="656" y="98" class="c b">Bilan matière</text>
<text x="656" y="120" class="c o">(entrée − sorties) ÷ entrée</text>
<rect x="560" y="160" width="70" height="220" fill="#061F44"/>
<rect x="680" y="165.3" width="70" height="214.7" fill="#DCE6F5" stroke="#061F44" stroke-width="2"/>
<path d="M680,160H750" stroke="#F28C28" stroke-width="3"/>
<text x="595" y="150" class="c n b">Entrée</text><text x="715" y="150" class="c n b">Sorties</text>
<text x="595" y="400" class="c n">5 000 t/j</text><text x="715" y="400" class="c n">4 880 t/j</text>
<text x="656" y="420" class="c n b">Écart : 120 t/j, soit 2,4 %</text>
<text x="399" y="462" class="c b">Un taux élevé avec une disponibilité faible : unités souvent à l'arrêt.</text>
<text x="399" y="486" class="c n">Chaque indicateur se calcule sur la même période. Valeurs inventées pour s'exercer.</text>
</svg>
