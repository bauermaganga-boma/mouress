<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Mêmes données fictives, deux présentations : la production passe de 500 à 520 millions de barils (+4 %). À gauche, graphique trompeur dont l'axe vertical commence à 490 : la barre de 2023 paraît trois fois plus haute que celle de 2022. À droite, graphique correct dont l'axe commence à 0 : les deux barres sont presque de même hauteur</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.t{font-size:16px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.g{stroke:#D5D9E0;stroke-width:1.5}
</style>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="32" class="h">Mêmes données, deux présentations</text>
<!-- panneau gauche : axe tronqué -->
<text x="215" y="66" class="t" style="fill:#B85C0A">Trompeur : axe tronqué</text>
<text x="215" y="86" class="c n">L'axe vertical commence à 490</text>
<text x="215" y="132" class="c n b">Production (millions de barils)</text>
<line class="g" x1="90" y1="160" x2="350" y2="160"/><line class="g" x1="90" y1="210" x2="350" y2="210"/><line class="g" x1="90" y1="260" x2="350" y2="260"/><line class="g" x1="90" y1="310" x2="350" y2="310"/>
<text class="e" x="82" y="165">530</text><text class="e" x="82" y="215">520</text><text class="e" x="82" y="265">510</text><text class="e" x="82" y="315">500</text><text class="e" x="82" y="365">490</text>
<rect x="120" y="310" width="80" height="50" fill="#061F44"/>
<rect x="230" y="210" width="80" height="150" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="160" y="302" class="c b">500</text><text x="270" y="202" class="c b">520</text>
<line x1="90" y1="360" x2="350" y2="360" stroke="#061F44" stroke-width="3"/>
<line x1="90" y1="160" x2="90" y2="360" stroke="#061F44" stroke-width="3"/>
<text x="160" y="382" class="c b">2022</text><text x="270" y="382" class="c b">2023</text>
<!-- panneau droit : axe depuis zéro -->
<text x="600" y="66" class="t">Correct : axe depuis 0</text>
<text x="600" y="86" class="c n">L'axe vertical commence à zéro</text>
<text x="600" y="132" class="c n b">Production (millions de barils)</text>
<line class="g" x1="480" y1="160" x2="740" y2="160"/><line class="g" x1="480" y1="226.7" x2="740" y2="226.7"/><line class="g" x1="480" y1="293.3" x2="740" y2="293.3"/>
<text class="e" x="472" y="165">600</text><text class="e" x="472" y="232">400</text><text class="e" x="472" y="298">200</text><text class="e" x="472" y="365">0</text>
<rect x="510" y="193.3" width="80" height="166.7" fill="#061F44"/>
<rect x="620" y="186.7" width="80" height="173.3" fill="#F28C28" stroke="#061F44" stroke-width="2"/>
<text x="550" y="185" class="c b">500</text><text x="660" y="178" class="c b">520</text>
<line x1="480" y1="360" x2="740" y2="360" stroke="#061F44" stroke-width="3"/>
<line x1="480" y1="160" x2="480" y2="360" stroke="#061F44" stroke-width="3"/>
<text x="550" y="382" class="c b">2022</text><text x="660" y="382" class="c b">2023</text>
<!-- conclusion -->
<text x="400" y="428" class="c b">Valeurs fictives : 500 puis 520 millions de barils, soit +4 %.</text>
<text x="400" y="450" class="c n">À gauche, la hausse paraît multipliée par trois ; à droite, elle apparaît à sa vraie taille.</text>
<text x="400" y="470" class="c n">Un bon graphique indique le titre, l'unité, la période, la source et un axe lisible.</text>
</svg>
