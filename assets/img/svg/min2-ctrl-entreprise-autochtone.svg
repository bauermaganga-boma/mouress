<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Les trois conditions de l'entreprise autochtone : capital national d'au moins 60 %, direction assurée par des nationaux, au moins 80 % de nationaux parmi les employés, avec deux exemples fictifs</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}.n{font-size:13px}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.ld{fill:none;stroke:#061F44;stroke-width:1.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>

<text x="400" y="30" class="h">Entreprise autochtone : trois conditions cumulatives</text>
<text x="400" y="60" class="c n">Une société de droit gabonais n'est pas forcément autochtone : il faut remplir les trois conditions à la fois.</text>
<rect x="30" y="110" width="220" height="30" class="gr"/><rect x="30" y="110" width="132" height="30" fill="#F28C28" stroke="#061F44" stroke-width="2.5"/><text x="140" y="98" class="c b">1. Capital</text><text x="140" y="162" class="c n">au moins 60 % détenu par des nationaux</text>
<rect x="290" y="110" width="220" height="30" class="gr"/><rect x="290" y="110" width="220" height="30" fill="#F28C28" stroke="#061F44" stroke-width="2.5"/><text x="400" y="98" class="c b">2. Direction</text><text x="400" y="162" class="c n">assurée par des nationaux</text>
<rect x="550" y="110" width="220" height="30" class="gr"/><rect x="550" y="110" width="176" height="30" fill="#F28C28" stroke="#061F44" stroke-width="2.5"/><text x="660" y="98" class="c b">3. Emploi</text><text x="660" y="162" class="c n">au moins 80 % de nationaux</text>
<text x="140" y="200" class="c n o">seuil : 60 %</text><text x="400" y="200" class="c n o">direction effective</text><text x="660" y="200" class="c n o">seuil : 80 %</text>
<rect x="30" y="225" width="360" height="190" class="bl"/>
<text x="210" y="252" class="c b">Société X (exemple fictif)</text>
<text x="45" y="282" class="n">Capital national : 62 %  (≥ 60 %)</text>
<text x="45" y="308" class="n">Gérant gabonais, décisions prises par lui</text>
<text x="45" y="334" class="n">Employés nationaux : 85 %  (≥ 80 %)</text>
<text x="210" y="378" class="c b o">Trois conditions remplies : autochtone</text>
<rect x="410" y="225" width="360" height="190" class="gr"/>
<text x="590" y="252" class="c b">Société Y (exemple fictif)</text>
<text x="425" y="282" class="n">Capital national : 70 %  (≥ 60 %)</text>
<text x="425" y="308" class="n">Direction effective : cadre étranger</text>
<text x="425" y="334" class="n">Employés nationaux : 75 %  (&lt; 80 %)</text>
<text x="590" y="378" class="c b o">Deux conditions non remplies</text>
<text x="590" y="396" class="c b o">donc non autochtone</text>
<text x="400" y="448" class="c n">Si le capital national passe sous 60 % (cession de parts), le statut est à réexaminer.</text>
<text x="400" y="480" class="c n">Schéma d'illustration : sociétés et pourcentages fictifs.</text>
</svg>
