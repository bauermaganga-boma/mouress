<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ttl">
<title id="ttl">Pyramide inversée de la note à un décideur : en haut, l'essentiel, c'est-à-dire la demande ou la recommandation ; au milieu, les arguments et les chiffres clés sourcés ; en bas, les détails et pièces en annexe. À droite, trame d'une note d'une page : objet, message principal et décision demandée, faits chiffrés, options, recommandation, annexes. Test : avec dix lignes de temps, le lecteur doit avoir l'essentiel.</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#061F44"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#F28C28"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#061F44}
.h{font-size:20px;font-weight:bold;text-anchor:middle}
.b{font-weight:bold}.c{text-anchor:middle}.e{text-anchor:end}.o{fill:#B85C0A;font-weight:bold}
.w{fill:#FFFFFF;font-weight:bold}
.s{fill:none;stroke:#061F44;stroke-width:2.5}
.bl{fill:#DCE6F5;stroke:#061F44;stroke-width:2.5}
.gr{fill:#E8EAEE;stroke:#061F44;stroke-width:2.5}
.nv{fill:none;stroke:#061F44;stroke-width:3.5}
.or{fill:none;stroke:#F28C28;stroke-width:3.5}
</style>
</defs>
<rect width="800" height="500" fill="#FCFBF8"/>
<text x="400" y="30" class="h">Écrire pour un décideur : la conclusion d'abord</text>
<path d="M40,70 L420,70 L350,160 L110,160Z" fill="#F9DDBB" stroke="#061F44" stroke-width="2.5"/>
<path d="M110,160 L350,160 L305,250 L155,250Z" class="bl"/>
<path d="M155,250 L305,250 L270,340 L190,340Z" class="gr"/>
<text x="230" y="100" class="c b">1. L'essentiel</text>
<text x="230" y="122" class="c">Recommandation, décision demandée</text>
<text x="230" y="142" class="c">(en tête de note)</text>
<text x="230" y="196" class="c b">2. Les arguments</text>
<text x="230" y="218" class="c">Faits chiffrés et sourcés</text>
<text x="230" y="284" class="c b">3. Les détails</text>
<text x="230" y="304" class="c">En annexe</text>
<line x1="230" y1="350" x2="230" y2="392" stroke="#F28C28" stroke-width="4" marker-end="url(#ao)"/>
<text x="230" y="418" class="c b">Importance décroissante</text>
<text x="230" y="438" class="c b">pour le lecteur</text>
<rect x="460" y="52" width="310" height="388" rx="8" fill="#FFFFFF" stroke="#061F44" stroke-width="2.5"/>
<text x="615" y="78" class="c b">Trame d'une note d'une page</text>
<rect x="475" y="92" width="280" height="48" rx="6" class="bl"/>
<text x="487" y="113" class="b">Objet</text>
<text x="487" y="131">une ligne précise</text>
<rect x="475" y="149" width="280" height="48" rx="6" class="bl"/>
<text x="487" y="170" class="b">Message principal</text>
<text x="487" y="188">conclusion et décision demandée</text>
<rect x="475" y="206" width="280" height="48" rx="6" class="gr"/>
<text x="487" y="227" class="b">Faits clés</text>
<text x="487" y="245">chiffres, sources, dates</text>
<rect x="475" y="263" width="280" height="48" rx="6" class="gr"/>
<text x="487" y="284" class="b">Options</text>
<text x="487" y="302">2 ou 3 : avantages, risques, coût</text>
<rect x="475" y="320" width="280" height="48" rx="6" class="gr"/>
<text x="487" y="341" class="b">Recommandation</text>
<text x="487" y="359">laquelle et pourquoi</text>
<rect x="475" y="377" width="280" height="48" rx="6" class="gr"/>
<text x="487" y="398" class="b">Annexes</text>
<text x="487" y="416">détails, tableaux, pièces</text>
<text x="400" y="474" class="c o">Test : avec seulement dix lignes de temps, le lecteur a-t-il l'essentiel ?</text>
</svg>
